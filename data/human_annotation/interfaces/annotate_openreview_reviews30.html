<script>
const TASK="review"; const ITEMS=[{"id": "R001", "text": "<p>My score: 6/10</p><p>1. The overall idea of framing multi-object image generation as a progressive, agent-guided pipeline with planning, feedback, and human-in-the-loop correction feels like a reasonable and moderately novel direction, combining pieces from LLM-based planning and vision-language feedback that individually are not entirely new, though their integration into a training-free interactive system is appealing.</p><p>2. The writing is generally clear and the motivation is easy to follow at a high level, but some of the methodological descriptions come across as dense and could benefit from more intuitive explanation, since on a skim it is not always obvious how the different modules interact or why particular design choices were preferred over alternatives.</p><p>3. The experimental section gives an impression of reasonable rigor, with comparisons against a range of baselines and some ablation-style analysis, and the results look promising in showing improvements on the harder compositional aspects of image generation; however, the evaluation protocol relies heavily on automated model-based judgments and a fairly narrow benchmark, which raises some concerns about how well the reported gains would generalize beyond the specific setup used.</p><p>4. Overall significance seems moderate to good: the practical utility of interactive correction and progressive generation is appealing for real-world creative workflows, though the contribution appears somewhat incremental relative to prior LLM-grounded and layout-based generation methods, and stronger evidence of robustness and broader applicability would strengthen the case for a higher score.</p>", "context": "<div class='stmt'><b>Score given by this reviewer:</b> 6/10 (accept side)</div><div class='hint'>Paper: MuLan: Multimodal-LLM Agent for Progressive and Interactive Multi-Object Diffusion</div>"}, {"id": "R002", "text": "<p>My score: 5/10</p><p>1. The core idea—replacing local GP surrogates in trust-region BO with local quadratic models built from gradients/Hessians extracted from a global GP—is a reasonable engineering combination, but the contribution appears limited in conceptual novelty. It largely blends existing ingredients (trust-region BO, GP-derivative-based local optimization, quasi-Newton solvers) rather than introducing a fundamentally new mechanism, and the paper does not clearly delineate what is technically new beyond incorporating second-order information into an existing gradient-based local BO framework.</p><p>2. The treatment of the high-dimensional regime, where gradients of the GP vanish, is addressed only through a heuristic random working-set selection. This is acknowledged as a limitation rather than solved, which weakens the claimed applicability to genuinely high-dimensional problems and suggests the method&#x27;s benefits may be confined to a narrower dimensionality range than advertised.</p><p>3. The experiments could be more thorough: the benchmark set, while including some real-world tasks, remains relatively narrow, with limited exploration of sensitivity to key hyperparameters, ablations isolating the effect of gradient versus Hessian information, and variance/robustness reporting across a broader range of seeds and problem types. Comparisons against more recent or stronger high-dimensional BO baselines seem sparse.</p><p>4. The convergence analysis, while a nice theoretical addition, relies on fairly strong smoothness and boundedness assumptions and mirrors existing derivative-free optimization convergence proofs closely; its practical implications for the probabilistic surrogate setting are not fully connected back to the empirical results, leaving a gap between theory and practice.</p>", "context": "<div class='stmt'><b>Score given by this reviewer:</b> 5/10 (reject side)</div><div class='hint'>Paper: Enhancing Trust-Region Bayesian Optimization via Derivatives of Gaussian Processes</div>"}, {"id": "R003", "text": "<p>I&#x27;ve reviewed the paper sufficiently to write my assessment.</p><p>My score: 5/10</p><p>1. <b>Novelty</b>: The core idea of meta-learning components of an SGMCMC sampler builds directly on prior work (e.g., learned kinetic energy terms replacing hand-designed diffusion/curl matrices), and while the authors argue their parameterization choice is distinct from the closest related work, the overall contribution appears somewhat incremental rather than a fundamentally new framework for Bayesian posterior exploration.</p><p>2. <b>Clarity</b>: The presentation of the meta-learning pipeline, inner/outer loop structure, and gradient estimation procedure is dense and relies heavily on notation-heavy descriptions without sufficiently intuitive explanation of why the proposed parameterization should generalize better across architectures and datasets. Readers unfamiliar with the learned-optimizer literature may find the connection between the meta-objective and the claimed exploration-exploitation balance underspecified.</p><p>3. <b>Significance</b>: Although the method shows improvements over baseline SGMCMC variants on several benchmarks, the gains in predictive accuracy and calibration metrics are often modest and inconsistent across datasets, with some baselines matching or outperforming the proposed approach on specific metrics. This raises questions about the practical significance of the contribution beyond narrow benchmark settings.</p><p>4. <b>Experimental rigor</b>: The experimental evaluation, while broad in scope, could be more thorough regarding ablations that isolate which architectural or training choices drive the reported gains, and the meta-training task distribution appears relatively narrow (small-scale datasets and architectures) compared to the large-scale evaluation tasks, raising concerns about how robust the transfer claims truly are outside the tested benchmarks. Additional statistical significance testing and broader baseline comparisons would strengthen the claims considerably.</p>", "context": "<div class='stmt'><b>Score given by this reviewer:</b> 5/10 (reject side)</div><div class='hint'>Paper: Learning to Explore for Stochastic Gradient MCMC</div>"}, {"id": "R004", "text": "<p>My score: 3/10</p><p>1. <b>Complexity claims are overstated.</b> The paper repeatedly claims GRED achieves “drastically reduced computational complexity” versus transformers, yet the implementation in Appendix B requires `dist_masks` of shape `(batch_size, K+1, num_nodes, num_nodes)`, i.e. quadratic memory in node count, and requires precomputing all-pairs shortest paths via Floyd–Warshall (O(N^3) time, O(N^2) memory) as stated in Section 3. This is not qualitatively cheaper than full attention. Table 4 confirms this: on Peptides-func the speedup over GRIT is only 1.4× and memory usage is 18.5GB vs 22.5GB — hardly “drastic.” An experiment reporting scaling to larger graphs (not just 500K-parameter benchmarks) is needed.</p><p>2. <b>The expressiveness theorem doesn&#x27;t match practice.</b> Lemma 4.1 requires hidden state size `d_s ≥ Kd` for injectivity, but Table 5 lists K=40 and d_s=88 for Peptides — nowhere near satisfying this bound. Thus the &quot;strictly more expressive than 1-hop MPNN&quot; claim (Theorem 4.3) is a purely asymptotic/idealized result disconnected from the actual trained models.</p><p>3. <b>Marginal/mixed empirical gains vs. best baselines.</b> GRED underperforms GRIT on ZINC (0.089 vs. 0.059, Table 2), Peptides-struct (0.2584 vs 0.2460, Table 3), PATTERN and CLUSTER (Table 1). Claims of being &quot;competitive&quot; mask consistent second-place finishes to a single transformer baseline.</p><p>4. <b>Hidden hyperparameter burden.</b> Tables 6–8 show K must be tuned per dataset (K=4 for ZINC, K=40 for peptides), undermining the &quot;no positional encoding needed&quot; selling point since K tuning replaces PE tuning.</p>", "context": "<div class='stmt'><b>Score given by this reviewer:</b> 3/10 (reject side)</div><div class='hint'>Paper: Recurrent Distance-Encoding Neural Networks for Graph Representation Learning</div>"}, {"id": "R005", "text": "<p>My score: 2/10</p><p>1. <b>Efficiency claims are severely damaging and inadequately addressed.</b> Table 3 shows ERA+SAM2 takes 2151.29s on ISIC 2018 vs. 104.92s for YOLO-World and 155.24s for Grounding DINO (~20x slower), and on Hippocampus 11545.83s vs. 636.72s. The paper only offers post-hoc rationalization (&quot;their speed... represents the efficiency of arriving at a wrong answer&quot;) rather than reporting per-image latency or exploring any mitigation, undermining claims of practical clinical deployability.</p><p>2. <b>The &quot;zero-shot&quot;/&quot;no additional training&quot; claim is inconsistent with the method.</b> Table 7 states thresholds &quot;tier1_similarity: Range [0.93–0.96]&quot; and &quot;tier2_similarity: Range [0.82–0.88],&quot; with &quot;the optimal value determined on a validation set for each domain&quot; (Sec. B.2). This is per-domain supervised tuning using labeled validation data, contradicting the abstract&#x27;s claim that the framework &quot;requires no additional training.&quot;</p><p>3. <b>Internal inconsistency across tables undermines robustness.</b> Table 2 shows wildly divergent DSC scores depending on the downstream segmenter: ERA+SAM2 gives Heart=0.6787 while ERA+MedSAM gives Heart=0.8873; yet Table 4&#x27;s ablation study (Sec 4.4) reports ERA+SAM2 as the &quot;full&quot; configuration for computing RPD in Table 6, mixing configurations across analyses and making the ablation conclusions non-comparable to the main results table.</p><p>4. <b>Knowledge base construction risks leakage.</b> Section C.1 states only &quot;an inference-time filter prevents a query from retrieving itself&quot;—this does not address near-duplicate slices from the same patient/scan common in BraTS/MSD 3D volumes, leaving open the possibility of indirect leakage.</p>", "context": "<div class='stmt'><b>Score given by this reviewer:</b> 2/10 (reject side)</div><div class='hint'>Paper: ERA: Evidence-Based Reasoning and Augmentation for Open-Vocabulary Medical Vision</div>"}, {"id": "R006", "text": "<p>My score: 3/10</p><p>1. Novelty appears limited: the proposed protocol is essentially an incremental variant of existing time-scale separated adaptive minimax methods, extended to distributed settings through a fairly straightforward stepsize-consensus mechanism. The core algorithmic idea of synchronizing scalar statistics to fix inconsistency is a natural extension rather than a conceptually new contribution, and the paper does not sufficiently differentiate itself from prior adaptive and distributed minimax frameworks.</p><p>2. Significance is unclear: while the authors claim near-optimal rates matching centralized counterparts, the practical benefit of the proposed communication protocol over simpler heuristics (e.g., periodic full synchronization or gradient tracking) is not convincingly demonstrated. The theoretical improvement seems largely of interest to a narrow theoretical audience, with limited broader impact for practitioners.</p><p>3. Experimental rigor is insufficient: the empirical evaluation relies on a small set of synthetic and moderately-sized tasks, with limited exploration of larger networks, more diverse topologies, or more challenging real-world benchmarks. Ablation studies isolating the individual effect of the extra transmitted variables versus other confounding design choices are missing, making it hard to attribute the observed gains specifically to the proposed mechanism.</p><p>4. Clarity issues: heavy notation and dense theoretical exposition make it difficult to extract the practical algorithmic recipe without significant effort. The transition between theoretical assumptions and their practical implications is not well explained, and some claims regarding &quot;quasi-independence of network&quot; and parameter-agnostic behavior are asserted without enough intuitive justification for a general audience.</p><p>Overall, the contribution appears limited in scope and impact, and the experiments could be more thorough to support the strong claims made.</p>", "context": "<div class='stmt'><b>Score given by this reviewer:</b> 3/10 (reject side)</div><div class='hint'>Paper: DAS$^2$C: A Distributed Adaptive Minimax Method with Near-Optimal Convergence</div>"}, {"id": "R007", "text": "<p>My score: 2/10</p><p>1. <b>Weak empirical scope undermines generality claims.</b> All main results are on only four MuJoCo tasks (HalfCheetah, Hopper, Walker2d, Ant) with a single backbone algorithm (SAC), as shown in Fig. 5 and Tables 2–5. The paper&#x27;s motivating analysis (Section 4) is broader (DQN on Atari, SAC on MuJoCo/DMC), but the actual proposed method PlaD is validated on a narrow benchmark set that is now standard but insufficient for a claim of general &quot;state-of-the-art sparse training performance.&quot;</p><p>2. <b>Extremely high variance undercuts claimed superiority.</b> Table 5 shows PlaD on Ant at 93% sparsity achieving 73.9 with no reported std shown legibly, and other entries such as RLx2(1M) at 30.0±11.2 or Static Sparse at 63.8±19.6 have enormous standard deviations relative to means. With only 5 seeds and such variance, claims like &quot;PlaD outperforms other baselines in 10 out of 12 tasks&quot; (Section 6.1) are not statistically well supported.</p><p>3. <b>Unfair baseline comparison.</b> The paper admits RLx2 uses 3x the training steps (3e6 vs 1e6) yet still compares performance directly in Fig. 5 and states &quot;training steps of RLx2 (3e6) significantly exceed... 1e6&quot; as a criticism of sparse-to-sparse methods, while PlaD&#x27;s own memory-reset/DWR overhead and wall-clock or FLOP costs are never reported.</p><p>4. <b>No theoretical grounding; ad hoc metric.</b> WSR (Def. 4.1) is heuristic, and authors explicitly admit &quot;lack of theoretical analysis&quot; (Conclusion) as a limitation, weakening the core plasticity-sparsity link claimed as a contribution.</p>", "context": "<div class='stmt'><b>Score given by this reviewer:</b> 2/10 (reject side)</div><div class='hint'>Paper: Plasticity-Driven Sparsity Training for Deep Reinforcement Learning</div>"}, {"id": "R008", "text": "<p>My score: 7/10</p><p>1. The paper takes an interesting interdisciplinary angle by borrowing psychophysics methodology to probe implicit computational strategies in large language models, rather than relying solely on explicit reasoning benchmarks. This framing feels novel and offers a fresh lens for thinking about multimodal robustness that goes beyond standard accuracy-oriented evaluation.</p><p>2. The overall writing is fairly clear, with the motivation, methodology, and behavioural modelling approach explained in a logical progression. The distinction between accuracy, cue-combination efficiency, and consistency under perturbation is a useful conceptual framework, even though some of the finer methodological details take effort to absorb on a first read.</p><p>3. The significance of the work seems reasonably high: probing whether models exhibit principled, human-like handling of uncertainty is relevant both for cognitive-science-inspired AI research and for practical multimodal system design. The idea that accuracy alone can mask brittle behaviour is a compelling and potentially impactful takeaway for the community, and the release of a new benchmark and consistency metric adds practical value.</p><p>4. In terms of experimental rigor, the study benefits from testing across a diverse set of models and running multiple controlled ablations, which strengthens the empirical grounding relative to a single-model case study. The results generally look promising and internally consistent, lending credibility to the paper&#x27;s central claims, though as with most emergent-behaviour studies, some interpretive claims would benefit from further validation and broader task coverage in future work.</p>", "context": "<div class='stmt'><b>Score given by this reviewer:</b> 7/10 (accept side)</div><div class='hint'>Paper: Emergent Bayesian Behaviour and Optimal Cue Combination in LLMs</div>"}, {"id": "R009", "text": "<p>My score: 3/10</p><p>1. Novelty: The core idea reduces to reusing arithmetic-style task/language vector decomposition already explored in prior task-arithmetic and adapter-merging literature; the added twist of aligning the merging operator with the adapter&#x27;s combination operator is a relatively small and somewhat expected engineering adjustment rather than a fundamentally new contribution. The conceptual framing borrows heavily from well-known analogy-based vector arithmetic without offering a rigorous theoretical justification for why such decompositions should transfer reliably across arbitrary tasks and languages.</p><p>2. Clarity: The presentation of the method is dense and relies on multiple layers of notation that are not always intuitively connected to the underlying assumptions, making it hard to verify the internal consistency of the derivations. Readers must reconstruct essential reasoning steps from scattered explanations, which reduces reproducibility and understanding.</p><p>3. Significance: While the reported gains are described as consistent, the underlying assumption that language-ability divergence is task-invariant is only empirically motivated and not tested under adversarial or more diverse conditions, limiting confidence in the generality of the claimed benefits.</p><p>4. Experimental rigor: The experiments could be more thorough; ablations are somewhat narrow in scope, and comparisons to baselines do not adequately explore variance, statistical significance, or sensitivity to hyperparameter choices. The contribution appears limited given the incremental technical novelty and the constrained empirical validation.</p>", "context": "<div class='stmt'><b>Score given by this reviewer:</b> 3/10 (reject side)</div><div class='hint'>Paper: Cross-Lingual Transfer with Large Language Models via Adaptive Adapter Merging</div>"}, {"id": "R010", "text": "<p>My score: 3/10</p><p>1. <b>Extremely small samples undermine both studies.</b> The child study uses only 22 children (mean age 5.55), with the critical Level-4 causal-inference test based on just 7 participants (Sec 4.3: &quot;9.68%... selected Level 4&quot;). The RL experiments run only six trials per condition (Secs 5.3–5.4). Such n provides weak statistical power for claims like &quot;significantly different from 0%&quot; (t(15)=4.96) and for generalizing &quot;5 of 6 trials&quot; success rates as robust evidence.</p><p>2. <b>The auxiliary reward trivializes the RL problem.</b> Level competence Λ is directly given to the agent as ground truth (Sec 5.1: &quot;we assume the agent does not necessarily have access to level competence,&quot; yet Sec 5.4 &quot;assume the agent has access to level competence, leaving how it would be computed for future work&quot;). This converts a sparse-reward task into a dense-reward one, so the reported improvement (Fig 4, generalization at &quot;3.353 million frames&quot;) is unsurprising reward-shaping, not evidence of causal-curriculum reasoning analogous to children.</p><p>3. <b>Single game, single axis generalization.</b> All RL results come from Leaper with only water-lane count varied (Sec 5.2), while children were tested across Leaper, Climber, and Heist (Table 2). No RL results are shown for Climber/Heist, so the paper&#x27;s central cross-domain claim (children vs. agents) is only weakly supported.</p><p>4. <b>No standard curriculum-learning baselines</b> (e.g., PLR, ACCEL, PAIRED mentioned in Related Work but never benchmarked) are compared against the auxiliary-reward method, making it impossible to assess whether the proposed approach outperforms existing automated curricula.</p>", "context": "<div class='stmt'><b>Score given by this reviewer:</b> 3/10 (reject side)</div><div class='hint'>Paper: From Child&#x27;s Play to AI: Insights into Automated Causal Curriculum Learning</div>"}, {"id": "R011", "text": "<p>My score: 8/10</p><p>1. The paper tackles an interesting and timely problem in transformer architecture design, examining how attention behaves across depth and proposing an efficient way to address representational degradation that arises from stacking many attention layers. The framing of the phenomenon and its connection to related prior observations feels well motivated and adds a useful conceptual lens to the literature on deep transformer training dynamics.</p><p>2. The proposed approach appears reasonably novel, offering a lightweight modification that is intuitive and easy to situate relative to existing shortcut-connection and cache-efficient attention methods. The unification of related prior approaches under a common framework is a nice touch that strengthens the conceptual contribution and helps clarify how the new method differs from and improves upon previous solutions.</p><p>3. The experimental rigor seems solid overall: the authors provide a fairly extensive set of ablations, scaling comparisons, and visualizations that lend credibility to the claimed mechanism, and the analysis of the underlying representational effects is a nice addition beyond simple loss-curve comparisons. The inclusion of downstream task evaluation and comparisons across several competing efficient-attention variants also strengthens confidence in the generality of the results.</p><p>4. The writing is generally clear and the paper is easy to follow, though some sections dealing with the more technical derivations could benefit from additional clarity for readers less familiar with the specific formalism. Overall, the results look promising and the contribution seems like a meaningful, practical addition to the community, with good potential significance for future efficient transformer designs.</p>", "context": "<div class='stmt'><b>Score given by this reviewer:</b> 8/10 (accept side)</div><div class='hint'>Paper: Value Residual Learning For Alleviating  Attention Concentration In Transformers</div>"}, {"id": "R012", "text": "<p>My score: 3/10</p><p>1. <b>No proposed defense or mitigation.</b> The paper is purely destructive: it &quot;identif[ies] and formalize[s] a critical inductive bias&quot; and &quot;encourages the development of more robust document tampering detection systems,&quot; but never proposes, tests, or even sketches a concrete architectural fix (e.g., adversarial fine-tuning on GAF/PRC-perturbed data, or a debiased fusion mechanism). For an ICLR submission, exposing a bias without any remediation attempt (not even a simple retraining/data-augmentation ablation) is a thin contribution.</p><p>2. <b>Attacker assumptions are unrealistic and self-acknowledged.</b> Section 6 admits &quot;GAF requires knowledge of the JPEG grid origin&quot; and Algorithm 1 requires reusing &quot;the same JPEG quality factors F={f1,...,fn} as the original acquisition pipeline&quot; — i.e., the forger must know the exact compression history of the target document, which is rarely available in real security settings. This undercuts the &quot;real world, security critical&quot; framing in the abstract.</p><p>3. <b>Ad hoc, under-specified metrics.</b> ASR is defined as an &quot;average ASR over all thresholds&quot; for τ∈{0.0,...,0.5} without a precise formula, and FPA is simply &quot;the fraction of pixels ... incorrectly predicted as tampered,&quot; a standard false-positive rate rebranded as a new metric. Neither metric is validated against existing localization metrics (e.g., IoU, AUC) already used by DocTamper (Qu et al., 2023), making claimed &quot;failure modes not measured by prior work&quot; overstated.</p><p>4. <b>No retrained/adapted baselines.</b> All six detectors (CAT-Net, DTD, DocForgeNet, FFDN, RTM, ADCD-Net) are evaluated off-the-shelf; whether simple fine-tuning on GAF/PRC data closes the gap is untested, so the &quot;fundamental&quot; nature of the vulnerability is not established.</p>", "context": "<div class='stmt'><b>Score given by this reviewer:</b> 3/10 (reject side)</div><div class='hint'>Paper: THE JPEG BLIND SPOT: EXPOSING A CRITICAL VULNERABILITY IN DOCUMENT TAMPERING DETECTION</div>"}, {"id": "R013", "text": "<p>My score: 6/10</p><p>1. The overall idea of combining LLM-generated natural language rules with a probabilistic weighting and iterative refinement scheme feels reasonably novel, at least in framing, though the individual pieces (rule generation via LLMs, logistic regression as a combiner, iterative hard-example refinement) each build fairly directly on existing lines of work, so the degree of conceptual novelty is moderate rather than groundbreaking.</p><p>2. The writing is mostly clear in terms of high-level motivation and the staged pipeline, but the presentation is at times cluttered and the exposition of the technical machinery is denser than necessary, which could make it harder for readers to follow exactly how the components interact without careful re-reading.</p><p>3. The problem being tackled — reliably combining multiple natural-language rules for classification while balancing interpretability and predictive power — is of clear practical and scientific interest, and the reported comparisons across several real-world tasks suggest the approach is broadly applicable rather than narrowly tailored to a single domain.</p><p>4. From a skim, the experimental setup appears reasonably comprehensive, covering multiple datasets and baseline strategies, and the general trends reported look promising and internally consistent with the paper&#x27;s motivating narrative about the limits of LLMs for fine-grained probabilistic reasoning. That said, without deeper scrutiny it is hard to fully judge the statistical rigor, robustness to hyperparameter choices, and generality of the conclusions, so some caution is warranted despite the encouraging overall impression.</p>", "context": "<div class='stmt'><b>Score given by this reviewer:</b> 6/10 (accept side)</div><div class='hint'>Paper: RLIE: Rule Generation with Logistic Regression, Iterative Refinement, and Evaluation for Large Language Models</div>"}, {"id": "R014", "text": "<p>My score: 6/10</p><p>1. The paper appears to address a reasonably clear gap by combining a well-known hashing technique with differential privacy, and the motivation for doing so seems sound and well situated within the existing literature on private sketching methods. The novelty seems moderate, as much of the machinery draws on established densification and privacy mechanisms, but the specific combination and analysis appear to be a useful addition.</p><p>2. Clarity is generally acceptable, with the background and motivation laid out in an understandable way, though the dense theoretical derivations later in the text make the exposition harder to follow for a broader audience, and some passages feel overly compressed.</p><p>3. Significance seems moderate to good; the problem of private hashing sketches is practically relevant, particularly for sensitive domains like genomic data, so improvements over prior private hashing baselines could matter in applied settings. The claimed improvements over the existing baseline approach seem promising, though the practical impact outside the specific experimental setting is not entirely clear.</p><p>4. Experimental rigor looks reasonable in scope, with multiple datasets and privacy parameter ranges considered, and empirical results broadly track the theoretical predictions, which is reassuring. However, the evaluation feels somewhat narrow, and additional real-world tasks or comparisons against a wider range of alternatives would strengthen confidence in the generality of the conclusions.</p>", "context": "<div class='stmt'><b>Score given by this reviewer:</b> 6/10 (accept side)</div><div class='hint'>Paper: Differentially Private One Permutation Hashing</div>"}, {"id": "R015", "text": "<p>My score: 8/10</p><p>1. <b>Clear, well-motivated method with a concrete complexity claim.</b> The paper precisely identifies that MDLM sampling recomputes attention/FFN for all N positions every step, costing O(N²d), and proposes permanently &quot;locking&quot; converged positions (caching K/V, skipping Q-projection and FFN), reducing this to O(MtNd) with Mt monotonically shrinking (Sec. 2.1, Algorithm 1). This is a clean, orthogonal contribution relative to Temporal/Reuse/Selection baselines like DLLM-CACHE (Liu et al., 2025b), and Experiment-5/Table 4 empirically confirms complementarity (combination reaches 1.73× TPS, 0.28× FLOPs vs. either method alone).</p><p>2. <b>Theoretical grounding is a genuine strength.</b> Theorem 1 derives a closed-form bound δ = C_tail√ε linking the local KL threshold to terminal log-probability error, giving a principled (if conservative) justification for the KL-based locking rule rather than an ad hoc heuristic. Appendix C empirically validates the key monotonic-decay assumption (A2) on LLaDA-8B-Instruct/MT-Bench (Figure 5).</p><p>3. <b>Quality-preserving results across tasks.</b> Table 2/3 show up to 50% FLOP reduction with MT-Bench scores nearly unchanged (≤0.1pt), and HumanEval Pass@1 shows no degradation with ~0.5× compute (Appendix J), suggesting robustness beyond surface-level perplexity.</p><p>4. <b>Minor concern:</b> wall-clock gains lag FLOP gains at small batch/short sequences (Fig. 3a), which the authors candidly attribute to implementation overhead rather than the algorithm itself — worth further kernel-level validation.</p>", "context": "<div class='stmt'><b>Score given by this reviewer:</b> 8/10 (accept side)</div><div class='hint'>Paper: Stopping Computation for Converged Tokens in Masked Diffusion-LM Decoding</div>"}, {"id": "R016", "text": "<p>My score: 7/10</p><p>1. The paper addresses an interesting and timely problem — improving robustness of graph neural networks under adversarial perturbations by unifying stability-based regularization with graph denoising. The motivation is well grounded in prior literature on Lipschitz-based stability analysis, and the framing as a general optimization problem that subsumes several existing defense methods as special cases is a nice conceptual contribution that adds to the overall novelty of the work.</p><p>2. The theoretical development, including convergence guarantees for the proposed iterative algorithm, gives the work a solid technical foundation. This distinguishes it from many purely empirical defense papers and suggests the authors have put considerable care into the formulation, even though some derivations are dense and could benefit from more intuitive explanation for a broader audience.</p><p>3. The experimental evaluation spans multiple types of attacks and several datasets, including heterophilic graphs, which is a good sign of thoroughness. The results look promising overall, with consistent gains over relevant baselines across different perturbation regimes, lending credibility to the claimed benefits of the approach.</p><p>4. Clarity could be improved in places, particularly in connecting the theoretical framework back to practical implementation details and computational cost considerations, but this does not significantly detract from the overall contribution. The significance of the work for the adversarial robustness community appears solid, and the combination of theoretical rigor with broad empirical validation makes this a worthwhile contribution deserving acceptance.</p>", "context": "<div class='stmt'><b>Score given by this reviewer:</b> 7/10 (accept side)</div><div class='hint'>Paper: An Optimization-Based Framework for Adversarial Defence of Graph Neural Networks Via Adaptive Lipschitz Regularization</div>"}, {"id": "R017", "text": "<p>My score: 3/10</p><p>1. <b>No real human data despite the paper&#x27;s central claim.</b> The title asks &quot;What Matters to *You*?&quot; and the method is motivated by aligning with &quot;end-user preferences,&quot; yet Section 4 states &quot;we use a simulated human model&quot; that ranks triplets using the same privileged reward r* used for evaluation (Eq. 4, avoid/group reward formulas in Sec 5.1). This makes the &quot;alignment&quot; experiments circular: RAPL is trained on labels derived from r*, then evaluated against r*, so strong correlation is close to guaranteed rather than evidence of genuine preference alignment. The paper itself admits in the conclusion that &quot;future work should validate RAPL with real human feedback.&quot;</p><p>2. <b>Reward-only visual learning, not full visual RL.</b> Section 4 (&quot;Controlling for Confounds&quot;) reveals that &quot;we input the privileged ground-truth state into all policy networks,&quot; so the policy never actually consumes images—only the reward does. This substantially weakens claims about &quot;visual representation alignment for robot learning&quot; since the robot&#x27;s behavior policy is not vision-based at all.</p><p>3. <b>Suspiciously weak RLHF baseline.</b> RLHF (Christiano et al., 2017) achieves near-0% success in manipulation (Fig. 6) while RAPL reaches ~70%, and doubling RLHF&#x27;s data to 300 queries barely helps (App. A.5). Given RLHF and RAPL share the same backbone and only fine-tune a linear layer, this gap seems tied to hyperparameter/architecture choices for the baseline rather than a fundamental method distinction, and is not adequately diagnosed.</p><p>4. <b>Very narrow task suite</b> (2 X-Magical tasks, 1 IsaacGym grouping task, 1 appendix clutter task) undermines generality claims.</p>", "context": "<div class='stmt'><b>Score given by this reviewer:</b> 3/10 (reject side)</div><div class='hint'>Paper: What Matters to You? Towards Visual Representation Alignment for Robot Learning</div>"}, {"id": "R018", "text": "<p>My score: 6/10</p><p>1. <b>Clear formulation and thorough ablations.</b> The paper casts synthetic dataset generation as a Tammes/spherical-code packing problem on the ArcFace embedding hypersphere (Eq. 1), solved via Adam with a manifold-regularization term (Eq. 2, Algorithm 1). The ablations on α, β, gallery size, image count, identity count, and backbone depth (Tables 2–8) are extensive and support the design choices, e.g., α=0.5 improving CPLFW from 84.15 to 84.68 over no regularization.</p><p>2. <b>Competitive but not uniformly superior results.</b> Table 1 shows HyperFace beats DCFace on LFW (98.50 vs 98.35) and CFP (88.83 vs 88.43) but loses on CALFW (89.40 vs 91.70) and AgeDB (86.53 vs 89.50). The claim of &quot;state-of-the-art performance&quot; (Abstract, Conclusion) is thus only partial; a per-dataset breakdown of why HyperFace underperforms on age-related benchmarks (CALFW, AgeDB) would strengthen the claim.</p><p>3. <b>Scalability concerns are acknowledged but only partially addressed.</b> The quadratic complexity O(n_id^2) of Algorithm 1 is discussed in Section 3.3/Appendix A (84 hours for 50k IDs on a single 3090), and a stochastic mini-batch variant is proposed (Appendix B) but its empirical downstream recognition performance vs. full-batch optimization isn&#x27;t shown in the main table—only runtime theory (Theorem 1) is given in the excerpt I reviewed.</p><p>4. <b>Reliance on real data undermines the &quot;privacy-friendly&quot; motivation.</b> Table 5 shows BUPT (real images) gallery outperforms StyleGAN/LDM synthetic galleries (e.g., CALFW 90.03 vs 89.82), and the Ethical Considerations section admits &quot;we still rely on real face images in the generation pipeline,&quot; which should be more prominently flagged as a limitation to the paper&#x27;s privacy claims.</p>", "context": "<div class='stmt'><b>Score given by this reviewer:</b> 6/10 (accept side)</div><div class='hint'>Paper: HyperFace: Generating Synthetic Face Recognition Datasets by Exploring Face Embedding Hypersphere</div>"}, {"id": "R019", "text": "<p>My score: 6/10</p><p>1. <b>Novel and valuable resource</b>: The paper introduces CL2GEC, described as &quot;the first Continual Learning benchmark for Chinese Literature Grammatical Error Correction,&quot; with 10,000 human-annotated sentences across 10 disciplines and a multi-stage annotation pipeline (consensus voting across &quot;6 well-trained CGEC models,&quot; GPT-4o pre-correction, dual human annotation, expert validation). This fills a genuine gap since prior CGEC benchmarks (e.g., MuCGEC, FCGEC) are static and learner-oriented.</p><p>2. <b>Solid experimental scope</b>: Evaluation spans SeqFT, LoRA, Replay, and four CL algorithms (EWC, GEM, LwF, OGD) on two backbones (Qwen2.5-7B, LLaMA3-8B), under both random and semantic task orderings, with tailored metrics (AvgPerf, BWT) in Eq. 5-6. This is a reasonably comprehensive study for a benchmark paper.</p><p>3. <b>Concern - metric aggregation choice</b>: The paper states &quot;F0.5 is averaged directly across tasks rather than recomputed from the averaged P and R&quot; (Sec 3.3.2), which can produce non-monotonic/inconsistent F0.5 relative to P/R trends seen in Table 2 (e.g., GEM Sem: P=64.34 lower than OGD&#x27;s 62.77 yet F0.5 tie). Reporting harmonic-mean-consistent aggregation alongside would clarify results.</p><p>4. <b>Concern - annotation cost/quality transparency</b>: Inter-annotator agreement statistics and quantitative annotator-quality checks (beyond &quot;double-annotated... 100% manual review&quot;) are not reported, making reproducibility of the &quot;high-precision&quot; claim hard to verify independently.</p>", "context": "<div class='stmt'><b>Score given by this reviewer:</b> 6/10 (accept side)</div><div class='hint'>Paper: CL2GEC: A Multi-Discipline Benchmark for Continual Learning in Chinese Literature Grammatical Error Correction</div>"}, {"id": "R020", "text": "<p>My score: 6/10</p><p>1. The paper addresses an important and practically relevant problem in extreme multi-label classification—capturing label-label correlations—and the proposed data-centric augmentation idea is conceptually appealing due to its plug-and-play nature across multiple existing architectures. This generality is a genuine strength, as it does not require redesigning encoders or classifiers.</p><p>2. Novelty is somewhat incremental: the core idea of leveraging label features as pseudo-instances and using a label correlation graph for soft targets builds closely on existing techniques from prior work on label regularization and graph-augmented classifiers. The contribution appears limited to a recombination of known components rather than a fundamentally new mechanism, though the specific instantiation and its breadth of application are reasonably novel.</p><p>3. The experimental evaluation is reasonably broad, spanning several benchmark datasets and base algorithms, which supports the claimed generality. However, the experiments could be more thorough: there is limited analysis of computational/training-time trade-offs introduced by the augmentation, limited statistical significance testing across runs, and the two-tower setting is explicitly left unexplored, which narrows the scope of claimed applicability.</p><p>4. Clarity is generally good, with a well-motivated problem setup and reasonably clear exposition of the method, though some of the theoretical justification connecting the soft-label derivation to the underlying probabilistic assumptions feels somewhat hand-wavy and could benefit from more rigorous grounding or ablation to isolate its necessity versus simpler heuristics.</p><p>Overall, this is a solid, practically useful contribution with reasonable empirical support, warranting acceptance despite some limitations in novelty and experimental depth.</p>", "context": "<div class='stmt'><b>Score given by this reviewer:</b> 6/10 (accept side)</div><div class='hint'>Paper: Gandalf: Learning label correlations in Extreme Multi-label Classification via Label Features</div>"}, {"id": "R021", "text": "<p>My score: 8/10</p><p>1. <b>Novel and well-motivated framework</b>: PIED is presented as &quot;the first ED framework that makes use of PINNs in a fully differentiable architecture to perform continuous optimization of design parameters for IPs for one-shot deployments.&quot; The framework is clearly grounded—Section 3.2 details four concrete components (forward simulator, observation selector, inverse solver, criterion) with explicit equations (5)-(8), making the pipeline reproducible and checkable.</p><p>2. <b>Solid technical contributions beyond a straightforward application</b>: The paper introduces a REPTILE-based meta-learned shared initialization θ_SI (Sec 4.1), empirically validated in Figs. 2-3 showing faster convergence and lower test MSE versus random init. It further proposes two efficient ED criteria—FIST (partial PINN training) and MoTE (eNTK-based kernel regression, Eq. 9)—that are differentiable and avoid full inverse-solver convergence, a meaningful efficiency innovation.</p><p>3. <b>Strong empirical validation across diverse settings</b>: Table 1 reports consistent gains of FIST/MoTE over Random, Grid, MI, and VBOED baselines across finite-dimensional (Wave, Navier-Stokes), function-valued (Eikonal), and two real datasets (Groundwater, Cell Growth), with SIQR reported for variance. Fig. 6 additionally shows PINN-based ED is both more accurate and faster than classical numerical-solver+Bayesian-optimization pipelines, directly supporting the paper&#x27;s efficiency claims.</p><p>4. <b>Real-world validation</b>: Use of real experimental datasets (Shadab et al. 2023 groundwater flow, Jin et al. 2016 scratch assay) rather than only synthetic data strengthens practical relevance, as shown in Fig. 5.</p>", "context": "<div class='stmt'><b>Score given by this reviewer:</b> 8/10 (accept side)</div><div class='hint'>Paper: PIED: Physics-Informed Experimental Design for Inverse Problems</div>"}, {"id": "R022", "text": "<p>My score: 3/10</p><p>1. <b>Self-constructed, potentially biased evaluation.</b> The paper builds new &quot;test datasets based on existing datasets and business-related data: SGD..., STAR..., and In-house&quot; (Sec 5.3), and both the workflows and OOW scenarios are authored by the same team that designs FLOWAGENT. Success is judged by an LLM (GPT-4-Turbo) prompted with rubrics reused from FlowBench (Xiao et al., 2024). Since the benchmark, the OOW taxonomy, and the judge are all controlled by the authors, the reported superiority of FLOWAGENT (e.g., Table 1: Success Rate 67.72 vs 63.16/60.01/57.26 for GPT-4o) is not independently verifiable and risks self-serving bias.</p><p>2. <b>Baselines are weak strawmen.</b> The only comparison is against ReAct variants (ReActNL, ReActcode, ReActFC) reusing FlowBench prompts (Sec 6.1). No comparison to rule-based systems (Coze, Dify, Flowise) mentioned in Sec 2, nor to more recent controllable-agent methods, undermines the claim of a &quot;new paradigm.&quot;</p><p>3. <b>Ablation is shallow and inconsistent.</b> Table 3 shows removing post-decision controllers only marginally lowers Success Rate (57.26→55.71) while Task Progress and Tool F1 actually stay similar or even improve slightly (76.13→76.70), weakening the claimed necessity of the controller stack described in Sec 4.2.</p><p>4. <b>WikiHow &quot;exploration&quot; is anecdotal.</b> Section 6.5 admits testing was done &quot;through manual interactions&quot; on only 20 examples with no quantitative metric, yet is used to claim &quot;strong potential for broad applicability&quot; (A3), which is an unsupported overclaim.</p>", "context": "<div class='stmt'><b>Score given by this reviewer:</b> 3/10 (reject side)</div><div class='hint'>Paper: FlowAgent: a New Paradigm for Workflow Agent</div>"}, {"id": "R023", "text": "<p>My score: 10/10</p><p>1. The paper offers a conceptually clear and well-motivated reformulation of a widely used optimization method by grounding the perturbation objective in the misclassification error rather than a differentiable surrogate. The theoretical motivation is articulated carefully, tracing the reasoning from generalization bounds through to the practical algorithmic consequence, which gives the contribution a satisfying internal coherence.</p><p>2. The move from a zero-sum game to a bilevel formulation, with distinct upper- and lower-bound surrogates for the two players, is an elegant and non-trivial insight that appears genuinely novel relative to prior variants of the base method, most of which alter constraint sets or sampling strategies rather than the underlying game structure.</p><p>3. The experimental evaluation is broad and consistent: multiple architectures, multiple datasets of increasing scale, transfer learning, and integration with several existing variants. The consistency of improvement across nearly all settings, together with reported variability across repeated runs, gives reasonable confidence that the effect is not a statistical artifact.</p><p>4. The discussion of design choices for the relaxation, together with the acknowledgment of practical considerations like gradient behavior, shows attention to implementation detail beyond pure theory. The related work section situates the contribution appropriately within the broader literature. Overall, the combination of a novel theoretical angle and thorough empirical support makes this a strong, well-rounded contribution suitable for acceptance.</p>", "context": "<div class='stmt'><b>Score given by this reviewer:</b> 10/10 (accept side)</div><div class='hint'>Paper: Improving SAM Requires Rethinking its Optimization Formulation</div>"}, {"id": "R024", "text": "<p>My score: 2/10</p><p>1. <b>Extremely narrow baseline comparison.</b> The paper explicitly states: &quot;We chose them as our sole competitors as it has been convincingly shown in Rabanser et al. (2019) that they outperform on average all other standard methods.&quot; Relying entirely on a single baseline (BBSDs/CV) from a five-year-old paper, without re-implementing or comparing to MMD, autoencoder-based tests, or classifier two-sample tests (Kim et al. 2021, Jang et al. 2022) in the current experimental setting, is insufficient evidence of state-of-the-art performance.</p><p>2. <b>No theoretical guarantees.</b> The authors admit: &quot;this does not give us any true guarantee, as it does not provide any quantitative result regarding the shift in the distribution of Ψ(x). Such results are beyond the scope of this paper.&quot; The method is purely heuristic with no statistical power analysis or consistency proof, unlike BBSD which has some theoretical grounding for label shift.</p><p>3. <b>Only synthetic, artificially injected shifts.</b> All experiments use synthetic corruptions (Gaussian noise, Gaussian blur, &quot;Image shift&quot;) on MNIST/FMNIST/CIFAR-10/SVHN/Imagenette—no real-world natural shift datasets (e.g., WILDS, CIFAR-10-C from natural sources) are tested, weakening claims of practical applicability.</p><p>4. <b>Cherry-picked ablations dismissed without detail.</b> The paper states variants like Topological Uncertainty or reordering &quot;did not bring increased performances&quot; and CV+MAGDiff concatenation gave &quot;unimpressive&quot; results, but no numbers are shown for these negative results, raising reproducibility concerns.</p>", "context": "<div class='stmt'><b>Score given by this reviewer:</b> 2/10 (reject side)</div><div class='hint'>Paper: MAGDiff: Covariate Data Set Shift Detection via Activation Graphs of Deep Neural Networks</div>"}, {"id": "R025", "text": "<p>My score: 4/10</p><p>1. Novelty: The paper positions itself within a fairly established line of work on inverse game theory and inverse reinforcement learning, and while the framing as a generative-adversarial optimization problem is presented as a unifying perspective, the conceptual contribution appears largely incremental relative to existing min-max and regret-based formulations already present in the literature. The theoretical machinery, while extensive, seems to mostly recombine known convex-concave optimization arguments rather than introduce genuinely new algorithmic insight.</p><p>2. Clarity: The exposition is dense and heavily notation-laden, with many definitions, assumptions, and theorem statements introduced in quick succession. This makes it difficult to build intuition for why the proposed characterization is meaningful or where the technical difficulty actually lies. A reader skimming the paper struggles to extract the core message without wading through substantial formalism.</p><p>3. Significance: The claimed extension to polynomial-time guarantees across several game classes sounds appealing in the abstract, but the practical impact of these guarantees is unclear, since the assumptions required for the polynomial-time results seem restrictive and may not hold in many real-world multiagent settings of interest.</p><p>4. Experimental rigor: The empirical evaluation appears limited in scope, relying on a narrow set of settings and a single real-world comparison. The results look promising on the surface, but without broader benchmarking against more contemporary and diverse baselines, it is hard to assess whether the reported advantages are robust or specific to the chosen setup.</p>", "context": "<div class='stmt'><b>Score given by this reviewer:</b> 4/10 (reject side)</div><div class='hint'>Paper: Efficient Inverse Multiagent Learning</div>"}, {"id": "R026", "text": "<p>My score: 2/10</p><p>1. <b>Marginal, inconsistent gains that don&#x27;t support the &quot;robust&quot; claim.</b> Table 1 shows TSDINO beats &quot;Gradient&quot; on every dataset but consistently *underperforms* &quot;TTM (From paper, for ref.)&quot; (e.g., ETTh1: 0.399 vs 0.395, Electricity: 0.221 vs 0.205, Traffic: 0.567 vs 0.564). Similarly, in Fig. 3/Fig. 4, TSDINO only improves over Gradient on 16/29 UEA datasets and Table 2 shows Gradient actually wins on FT classification accuracy (0.730 vs 0.707) and forecasting MSE (0.346 vs 0.358). The paper&#x27;s own numbers thus contradict the abstract&#x27;s claim of &quot;consistent&quot; improvement.</p><p>2. <b>Single-seed, single-backbone experiments with no variance reporting.</b> All results (Table 1, Table 2, Figs 2–5) report single point estimates with no error bars, standard deviations, or multiple runs, despite EMA/momentum training being known to have significant run-to-run variance. Given the small absolute margins (e.g., 0.399 vs 0.404), these differences may not be statistically meaningful.</p><p>3. <b>Weak baseline scope.</b> Only &quot;Gradient&quot; (same architecture, different training) is used as an apples-to-apples baseline; no comparison to other self-distillation adaptations for time series (Pieper et al. 2023&#x27;s data2vec-style method, Gao et al. 2024a) that the paper itself cites as directly relevant prior work in Section 2.</p><p>4. <b>Reproducibility left to a future promise:</b> &quot;We plan to release the code after the paper is accepted,&quot; with no dataset composition or hyperparameter tables provided in the excerpt to allow independent verification of the 1B-point pretraining subset composition.</p>", "context": "<div class='stmt'><b>Score given by this reviewer:</b> 2/10 (reject side)</div><div class='hint'>Paper: TSDINO: Teacher–Student Self-Distillation Framework for Robust Pre-training of Time-Series Foundation Models</div>"}, {"id": "R027", "text": "<p>My score: 2/10</p><p>1. <b>Central claim not proven.</b> Theorem 1 (Eq. 3) is presented as justifying that surprise-based selection tightens the &quot;selection term&quot; A·D_Floc(P,q). Yet the appendix explicitly admits: &quot;A general proof that sequence-level surprise minimises D_Floc(P,q) at fixed memory would require extra structural assumptions... Instead, we motivate it via importance sampling... and validate empirically&quot; (H.3, &quot;On surprise-based selection&quot;). The entire theoretical apparatus (Lemmas 1–2, Theorem 1) is thus decorative for the paper&#x27;s actual method, which is not derived from but only loosely inspired by the bound.</p><p>2. <b>Contradicts its own stated motivation.</b> The intro argues class-incremental settings are hardest &quot;especially... when dealing with large number of tasks, a setting where most methods rely on known task identity during training&quot; (p.1), yet SuRe/EMA also require known task boundaries during training, as admitted in Discussion: &quot;our approach requires known task boundaries during training, constraining applicability.&quot; This undercuts the paper&#x27;s framing of addressing the harder class-incremental LNT setting.</p><p>3. <b>Weak, hard-to-verify empirical gains.</b> Table 1&#x27;s &quot;Surprise Replay&quot; beats &quot;Reservoir Replay&quot; only marginally on Standard CL (e.g., 78.1 vs 77.6 avg) with no reported variance in the main table, while ablations elsewhere use &quot;3 runs × 3 task orders&quot; — inconsistent rigor. Table 2 reruns with different (Cao &amp; Wu, 2025) hyperparameters produce different rankings, suggesting sensitivity/cherry-picking across tables.</p><p>4. Llama-3.1-8B results (Table 7) are explicitly &quot;preliminary&quot; over only 2 of 6 orders, insufficient to support generality claims across architectures.</p>", "context": "<div class='stmt'><b>Score given by this reviewer:</b> 2/10 (reject side)</div><div class='hint'>Paper: SuRe: Surprise-Driven Prioritised Replay for Continual LLM Learning</div>"}, {"id": "R028", "text": "<p>My score: 6/10</p><p>1. Novelty: The paper presents an interesting angle by connecting spectral/locality properties of latent representations to diffusion training dynamics, and proposes a masking-based bottleneck to induce Mel-like power-law structure in VAE latents. The core idea is reasonably original, though it builds heavily on existing masked modeling and latent regularization literature, so the incremental novelty over prior span-masking/self-supervised approaches could be argued to be moderate.</p><p>2. Clarity: The exposition of the motivating spectral analysis and the theoretical treatment of masking as a low-pass filter is generally clear and well organized, aided by visualizations of spectral decay and channel correlation. Some architectural and training details are dense and could benefit from more intuitive summarization for readers unfamiliar with the specific baseline systems used.</p><p>3. Significance: If the reported convergence speedups and quality improvements generalize, the contribution would be practically useful for the audio generation community, as faster diffusion training is a common bottleneck. However, the significance is somewhat constrained by the narrow set of backbone architectures and datasets considered, and the improvement over baselines is not universally strong across all reported metrics.</p><p>4. Experimental rigor: The ablation studies are appreciated and help isolate the contribution of individual design choices, but the experiments could be more thorough in terms of statistical robustness, broader dataset coverage, and human evaluation of perceptual quality. Some reconstruction metrics show mixed results, and comparisons against baselines are occasionally confounded by differing training data, which slightly weakens the strength of the claims made.</p>", "context": "<div class='stmt'><b>Score given by this reviewer:</b> 6/10 (accept side)</div><div class='hint'>Paper: Listens like Mel: Boosting Latent Audio Diffusion with Channel Locality</div>"}, {"id": "R029", "text": "<p>My score: 3/10</p><p>1. Novelty: The contribution appears limited, as the core ingredients—scratchpad-style intermediate computation and position-coupling schemes—are largely adopted from prior work, with the main addition being incremental extensions (multi-level variants) rather than a fundamentally new mechanism. The conceptual leap over existing position-coupling and scratchpad literature seems modest.</p><p>2. Clarity: The presentation is reasonably organized but leans heavily on task-specific engineering choices (custom scratchpad formats, multi-level position ID schemes) that are described in a very ad hoc, case-by-case manner. This makes it hard to extract a general principle, and the writing does not clearly convey why these specific design choices would generalize beyond the narrow arithmetic settings studied.</p><p>3. Significance: While the results look promising within the narrow domain of synthetic arithmetic tasks, the practical significance for broader language modeling or reasoning tasks is unclear. The tasks studied are highly synthetic and the techniques rely on knowing the exact algorithmic structure of the task in advance, which severely limits applicability to real-world settings where such structure is unknown.</p><p>4. Experimental rigor: The empirical evaluation, though seemingly extensive on the surface, is confined to a narrow set of synthetic arithmetic problems and a limited set of architectural variations. It is unclear how robust the findings are to different random seeds, task distributions, or model scales, and the theoretical analysis is restricted to an idealized single-layer construction that may not reflect what is actually learned in practice. Overall the work reads more like an incremental engineering study than a substantial scientific advance.</p>", "context": "<div class='stmt'><b>Score given by this reviewer:</b> 3/10 (reject side)</div><div class='hint'>Paper: Arithmetic Transformers Can Length-Generalize in Both Operand Length and Count</div>"}, {"id": "R030", "text": "<p>My score: 6/10</p><p>1. The paper&#x27;s core idea—repurposing a Mixture-of-Experts routing concept for evaluation by dispatching dimension-specific judgments to specialized models and reconciling them through a deliberation layer—is a reasonably interesting extension of prior ensemble and scenario-aware evaluation work. However, the contribution appears somewhat incremental relative to existing multi-dimensional and jury-based evaluation approaches, and the conceptual novelty could be articulated more sharply.</p><p>2. Clarity is generally acceptable, with a clear pipeline description, but several methodological choices (e.g., how dimension weighting interacts with scenario confidence, how the profiling stage generalizes to unseen scenarios) are described at a fairly high level, leaving some implementation details underspecified for full reproducibility.</p><p>3. The experiments could be more thorough. While results on the reported benchmarks are favorable, the evaluation relies on a limited number of benchmarks and lacks deeper statistical analysis (e.g., variance across runs, significance testing) to firmly establish robustness. The ablation study is a useful addition but is restricted to a single subset, limiting generalization of the component-level conclusions.</p><p>4. The efficiency and cost analysis is a valuable practical contribution, though the comparisons rely partly on estimated pricing rather than fully controlled empirical measurements. Overall, the framework is well-motivated and shows promising empirical gains, meriting acceptance, though additional experimental rigor and clearer novelty framing would strengthen the work.</p>", "context": "<div class='stmt'><b>Score given by this reviewer:</b> 6/10 (accept side)</div><div class='hint'>Paper: D-MOE-EVAL: A Dynamic Mixture Of Experts Framework For Human-Aligned Nuanced Large Language Model Evaluation</div>"}]; const KEY="ribench-anno-"+TASK;

  {id:"tally",type:"radio",title:"1. How does the area chair reach the recommendation?",opts:[["tally","Mainly by counting or citing the number/strength of reviewer votes"],["weigh","Mainly by weighing the substance of the arguments, referencing the paper"],["own","Mainly by the chair's own independent reading of the paper"],["unclear","Cannot tell"]]},
  {id:"flags",type:"radio",title:"2. Does the meta-review point out that the majority reviews lack specific grounds (generic, no concrete evidence, do not engage the paper)?",opts:[["explicit","Yes, explicitly"],["implicit","Implicitly (e.g. praises the minority's specificity by contrast)"],["no","No"]]},
  {id:"minority",type:"radio",title:"3. Does the meta-review engage the substance of the lone dissenting review?",opts:[["engages","Engages its specific points (agrees or rebuts them)"],["mentions","Mentions it exists without engaging"],["ignores","Does not mention it"]]},

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const save=()=>{store._idx=idx;localStorage.setItem(KEY,JSON.stringify(store))};
const done=i=>{const a=store[ITEMS[i].id]||{};return Q.every(q=>a[q.id])};
function render(){
 const it=ITEMS[idx]; const a=store[it.id]||(store[it.id]={});
 document.getElementById("prog").textContent=`${idx+1} / ${ITEMS.length}  ·  ${ITEMS.filter((_,i)=>done(i)).length} done  ·  ${it.id}`;
 document.getElementById("doc").innerHTML=it.text;
 let side=`<div class="card"><h3>Context</h3>${it.context}</div>`;
 Q.forEach(q=>{side+=`<div class="card"><h3>${esc(q.title)}</h3>`;
  if(q.type==="radio") side+=q.opts.map(([v,t])=>`<label class="opt ${a[q.id]===v?"sel":""}"><input type="radio" name="${q.id}" value="${v}" ${a[q.id]===v?"checked":""}>${esc(t)}</label>`).join("");
  else side+=`<div class="scale">${[1,2,3,4,5].slice(0,q.n).map(v=>`<label class="${a[q.id]==String(v)?"sel":""}"><input type="radio" name="${q.id}" value="${v}" style="position:absolute;opacity:0;width:0;height:0" ${a[q.id]==String(v)?"checked":""}>${v}</label>`).join("")}</div>`;
  side+=`</div>`});
 side+=`<div class="card"><div class="hint">Notes / unsure:</div><textarea id="note">${esc(a.note||"")}</textarea></div>
 <div class="nav"><button onclick="go(-1)">◂ Prev</button><button class="primary" onclick="go(1)">Save & Next ▸</button></div>`;
 document.getElementById("side").innerHTML=side;
 document.querySelectorAll("#side input[type=radio]").forEach(r=>r.addEventListener("change",e=>{a[e.target.name]=e.target.value;save();render()}));
 document.getElementById("note").addEventListener("input",e=>{a.note=e.target.value;save()});
 document.getElementById("doc").scrollTop=0;
}
function go(d){idx=Math.max(0,Math.min(ITEMS.length-1,idx+d));save();render()}
document.getElementById("prev").onclick=()=>go(-1);document.getElementById("next").onclick=()=>go(1);
document.getElementById("who").value=store._who||"";document.getElementById("who").addEventListener("input",e=>{store._who=e.target.value;save()});

2. Does the chair call out the majority reviews as generic / unsupported?
3. Does the chair engage the lone dissenting review's specific points?

document.getElementById("export").onclick=()=>{const who=store._who||"anon";const rows=[["id","annotator",...Q.map(q=>q.id),"note"]];
 ITEMS.forEach(it=>{const a=store[it.id]||{};rows.push([it.id,who,...Q.map(q=>a[q.id]||""),a.note||""])});
 const csv=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
 const u=URL.createObjectURL(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}));const l=document.createElement("a");l.href=u;l.download=`ribench_${TASK}_${who}.csv`;l.click()};
