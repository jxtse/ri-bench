that adjudication.</p><p>III. Application</p><p>The Georgia Superior Court issued a written decision addressing Wilson’s ineffective-assistance claim. The Supreme Court of Georgia later denied Wilson’s application in a one-sentence order. The record therefore contains a reasoned state-court decision directly addressing the claim and a later summary disposition that did not identify a different rationale.</p><p>Under *Ylst*, the federal court should presume that the Georgia Supreme Court adopted the reasoning of the superior court. That presumption does not disregard the later order or treat the superior court’s decision as the formal final judgment. Rather, it identifies the reasoning on which the final state-court adjudication is presumed to rest. The presumption may be rebutted if the record shows that the higher court relied on a different basis. But absent such evidence, the last reasoned decision is the appropriate focus of the § 2254(d) analysis.</p><p><mark class='err' data-n='3'>The Eleventh Circuit therefore erred in concluding that *Richter* silently displaced this approach merely because the Georgia Supreme Court’s order was the final state-court ruling.</mark> *Richter* requires deference when the state court gives no explanation; it does not prohibit a federal court from applying *Ylst* when a reasoned lower-court decision explains the basis for a later summary merits disposition. Nor does *Richter* require a federal court automatically to disregard the reasoning of the last state court to explain its decision.</p><p>The proper course is to review the superior court’s reasoned decision, treating it as the presumed basis for the Georgia Supreme Court’s summary denial, while applying § 2254(d)’s deferential standard. If the State can rebut that presumption on remand, the federal court may evaluate the final state-court decision under the framework applicable to unexplained decisions described in *Richter*. The question presented does not require us to decide whether Wilson ultimately is entitled to habeas relief on his ineffective-assistance claim.</p><p>IV. Disposition</p><p><mark class='err' data-n='4'>The judgment of the Eleventh Circuit is reversed, and the case is remanded for further proceedings consistent with this opinion.</mark></p><p>RULING: Petitioner</p>", "error": "The Eleventh Circuit panel reversed the district court’s decision.", "truth": "A panel of the Eleventh Circuit affirmed the district court’s decision.", "nmarks": 4}, {"id": "C044", "text": "<p>RULING</p><p>I. Procedural History</p><p>Petitioners Juan Bravo-Fernandez and Hector Martinez-Maldonado were tried in the District of Puerto Rico on three charges arising from a 2005 trip to Las Vegas to attend a boxing match: (1) federal-program bribery in violation of 18 U. S. C. § 666; (2) conspiracy to commit § 666 bribery; and (3) travel in interstate commerce with intent to commit bribery, in violation of the Travel Act, § 1952. The jury returned a mixed verdict: it convicted petitioners on the substantive § 666 bribery count, but acquitted them on the conspiracy and Travel Act counts, both of which had § 666 bribery as an essential predicate.</p><p><mark class='tru' data-n='1'>The First Circuit vacated the § 666 convictions because the jury instructions did not correctly state the government&#x27;s burden of proof.</mark><mark class='tru' data-n='2'> On remand, confusion ensued over whether the mandate required entry of a judgment of acquittal; the district court initially entered an acquittal, then vacated that order after the government clarified the scope of the appellate mandate, and entered an order clarifying that the bribery convictions had been vacated rather than extinguished for evidentiary insufficiency.</mark><mark class='tru' data-n='3'> Petitioners moved for reinstatement of the acquittal order on Double Jeopardy grounds and, alternatively, argued that the prior acquittals on the conspiracy and Travel Act counts collaterally estopped the government from retrying the bribery charge, because the acquittal on those predicate-based charges necessarily determined that the government failed to prove the existence of a bribe.</mark> The district court denied the motions, and the First Circuit affirmed. Petitioners sought and this Court granted certiorari to resolve whether the Double Jeopardy Clause bars retrial on the § 666 count in light of the prior acquittals on the predicate-based counts.</p><p>II. Governing Law</p><p>The Double Jeopardy Clause embodies three protections: protection against a second prosecution after acquittal, after conviction, and against multiple punishments for the same offense. Central here is the doctrine of collateral estoppel, which the Court long ago held is embodied in the Double Jeopardy Clause itself. *Ashe v. Swenson*, 397 U. S. 436 (1970). Under that doctrine, when an issue of ultimate fact has been determined by a valid and final judgment, that issue cannot be relitigated in a subsequent prosecution. In *Ashe*, the Court adopted a pragmatic approach: courts must examine the record of the prior proceeding, taking into account the pleadings, evidence, charge, and other relevant matter, and conclude whether a rational jury could have grounded its verdict upon an issue other than that which the defendant seeks to foreclose from consideration.</p><p>The Court&#x27;s more recent decision in *Yeager v. United States*, 557 U. S. 110 (2009), applied this framework to &quot;inconsistent verdicts&quot; of conviction and acquittal. *Yeager* held that a jury&#x27;s acquittal on some counts could not be disregarded merely because the jury hung on other counts: acquittals, unlike hung counts, represent the jury&#x27;s actual resolution of an issue in the defendant&#x27;s favor, and a hung count reveals nothing about what the jury decided. Accordingly, a court conducting the *Ashe* inquiry focuses exclusively on the acquittals; counts on which the jury reached no verdict are without evidentiary value.</p><p>At the same time, *United States v. Powell*, 469 U. S. 57 (1984), establishes that inconsistent verdicts — verdicts of conviction and acquittal on charges that cannot be reconciled — do not, standing alone, entitle a defendant to relief, because it is unclear in such circumstances which verdict the jury &quot;really&quot; intended. Verdicts may be the product of jury lenity, mistake, or compromise, and the law tolerates such inconsistency.</p><p>III. Application to the Record</p><p>Petitioners advance two principal arguments.<mark class='err' data-n='4'> First, they contend that a vacated conviction is a &quot;legal nullity,&quot; void *ab initio*, and that the Court should therefore pretend the § 666 convictions never existed when conducting the collateral estoppel analysis, leaving only the acquittals for consideration.</mark> Second, they argue that under *Yeager*, the acquittals on the conspiracy and Travel Act counts necessarily determined that no bribe was offered or accepted, since the only genuinely disputed issue at trial was whether the trip constituted a bribe, the fact of travel and of agreement being undisputed.</p><p>The government responds that the vacated conviction retains evidentiary significance as a historical fact of what actually occurred in the prior trial — not to establish guilt, but to demonstrate that the jury&#x27;s verdicts were irreconcilably inconsistent. Because the jury convicted petitioners of the very bribery offense that served as the predicate for the counts on which it acquitted, the verdicts cannot be reconciled, and under *Powell*, petitioners cannot show that the acquittals &quot;necessarily&quot; resolved any factual issue in their favor.</p><p>The Court concludes that the government has the better of the argument, though not for every reason it advances.</p><p>A. The vacated conviction. Petitioners&#x27; categorical &quot;legal nullity&quot; argument proves too much. It is true that a vacated conviction may not be used to establish the defendant&#x27;s guilt of the vacated offense, and it is true that, for purposes of finality, a vacated conviction lacks the preclusive force of a final judgment. But the government here does not rely on the § 666 conviction to establish guilt or to estop petitioners from doing anything. It relies on the conviction solely as evidence of a historical fact about the prior proceeding: that the jury returned a verdict of guilty on the very conduct that petitioners say the jury necessarily found did not occur.<mark class='err' data-n='5'> Courts have long permitted vacated convictions and judgments to be used as evidence of historical facts for limited, non-preclusive purposes.</mark> Petitioners&#x27; void-*ab initio* framing would forbid a court from even looking at the record of its own prior proceedings, a proposition no decision of this Court supports.</p><p>B. The *Ashe/Yeager* inquiry. The decisive question is whether the acquittals &quot;necessarily&quot; determined an issue of ultimate fact in petitioners&#x27; favor. *Yeager* instructs that a court conducting this inquiry looks to the acquittals alone, to the exclusion of counts on which the jury reached no verdict, because a hung count reflects no decision at all. But *Yeager*&#x27;s reasoning does not extend to counts on which the jury returned a verdict of guilty, even if that verdict was later vacated for instructional error.<mark class='tru' data-n='6'> The critical difference is this: a hung count is the absence of a decision, while a vacated guilty verdict was an actual decision — an affirmative determination by the jury that the government had proven bribery beyond a reasonable doubt, rendered after the jury had been fully instructed and had deliberated.</mark> That determination may no longer support punishment, but it remains what occurred.</p><p><mark class='tru' data-n='7'>It is undisputed that the verdicts here cannot be reconciled: a jury cannot rationally find beyond a reasonable doubt that a defendant committed § 666 bribery while simultaneously finding that the government failed to prove the same bribery as the predicate for conspiracy and Travel Act violations.</mark> Under *Powell*, such inconsistency is tolerated by the criminal law, but it carries a consequence for collateral estoppel: where the verdicts are indisputably inconsistent, the defendant cannot demonstrate that the acquittal &quot;necessarily&quot; resolved the contested issue in his favor. The acquittal may well reflect lenity, compromise, mistake, or a failure to follow instructions — possibilities the government identifies and that the record cannot exclude.<mark class='tru' data-n='8'> Petitioners&#x27; argument, accepted by the First Circuit below, requires the Court to hold that the acquittals necessarily determined the nonexistence of a bribe when the same jury simultaneously determined the opposite.</mark> *Ashe* demands a pragmatic examination of what a rational jury actually decided, and a pragmatic examination of this record compels the conclusion that we cannot know which determination the jury truly made.</p><p>Petitioners&#x27; fallback — that the vacated conviction tells us nothing about what the jury &quot;decided&quot; because instructional error infected the jury&#x27;s work — is unpersuasive. Instructional error bears on the legal validity of the verdict, not on the historical fact that the jury rendered it, and petitioners offer no principled basis for assigning greater epistemic reliability to the acquittals than to the conviction rendered by the same jury under the same instructions.</p><p>The Court notes one respect in which the government&#x27;s position overshoots: the government suggests that inconsistent verdicts furnish &quot;conclusive evidence&quot; of jury error. Nothing in this record establishes which verdict reflected error, compromise, or lenity, and *Powell* counsels against such speculation. But that overstatement does not alter the outcome, because petitioners bear the burden of demonstrating that the acquittals necessarily decided the issue they seek to foreclose, and the inconsistency — a matter of historical record properly before us — defeats that showing.</p><p>C. Disposition of the question presented. The question presented asks whether the fact that the vacated § 666 convictions prevent the prior acquittals from barring retrial. The answer is yes. The vacated convictions, while legally null for purposes of guilt and punishment, remain historical facts of the prior proceeding that reveal the jury&#x27;s verdicts to be irreconcilably inconsistent. Because an inconsistent acquittal cannot be said to have &quot;necessarily&quot; resolved the bribery issue in petitioners&#x27; favor, the Double Jeopardy Clause&#x27;s collateral estoppel component does not bar retrial on the § 666 count.</p><p>IV. Conclusion</p><p>The judgment of the Court of Appeals is affirmed. The Double Jeopardy Clause does not bar the government from retrying petitioners on the federal-program bribery charge.</p><p>RULING: Respondent</p>", "error": "The First Circuit vacated the federal bribery convictions for insufficient evidence.", "truth": "The First Circuit vacated the federal bribery convictions because the jury had been improperly instructed about what the government needed to prove, and it remanded the case.", "nmarks": 8}, {"id": "C045", "text": "<p>OPINION OF THE COURT</p><p>I. Procedural History</p><p>Petitioners — the National Institute of Family and Life Advocates and two affiliated pro-life, religiously-motivated entities that provide pregnancy-related services in California (collectively &quot;NIFLA&quot;) — brought suit to enjoin enforcement of the California Reproductive Freedom, Accountability, Comprehensive Care, and Transparency Act. The Act imposes two disclosure obligations relevant here. First, clinics that are *licensed* to provide pregnancy-related services must notify patients that California makes available free or low-cost publicly funded family planning services, including contraception and abortion. Second, *unlicensed* facilities offering pregnancy-related services must disclose to clients that they are not licensed to provide medical services. NIFLA contended that both requirements compel speech in violation of the Free Speech Clause of the First Amendment, made applicable to the States by the Fourteenth Amendment, and that they burden the free exercise of religion.</p><p>The United States District Court for the Southern District of California denied NIFLA&#x27;s motion for a preliminary injunction, holding that NIFLA had failed to carry its burden under *Winter v. Natural Resources Defense Council, Inc.*, 555 U.S. 7 (2008), of demonstrating a likelihood of success on the merits of either the free speech or free exercise claim.</p><p>The Court of Appeals for the Ninth Circuit affirmed, holding that the district court had not abused its discretion. The panel acknowledged that the licensed notice compels *content-based* speech — it requires NIFLA to disseminate a state-scripted message about publicly funded family planning services — but declined to apply strict scrutiny on the ground that the Act does not discriminate on the basis of viewpoint.<mark class='tru' data-n='1'> Acknowledging a conflict among the circuits over the standard of review governing abortion-related disclosure mandates, the panel followed its own precedent and held that the compelled message constituted &quot;professional speech,&quot; a category it deemed subject to intermediate scrutiny only.</mark> The licensed notice, the court concluded, survived that standard. The court likewise sustained the unlicensed-facility disclosure.</p><p>We granted certiorari to resolve the acknowledged circuit conflict, and now reverse.</p><p>II. Governing Law</p><p>A. The preliminary injunction standard. A plaintiff seeking a preliminary injunction must establish likelihood of success on the merits, likely irreparable harm, a favorable balance of equities, and that an injunction serves the public interest. *Winter*, 555 U.S. at 20. We review the denial of an injunction for abuse of discretion, but a district court necessarily abuses its discretion when it rests on an erroneous view of the law. The parties&#x27; dispute here is purely one of law — what standard of scrutiny governs — and that question we review de novo. Where a content-based speech restriction is at issue, the loss of First Amendment freedoms, &quot;for even minimal periods of time, unquestionably constitutes irreparable injury,&quot; and the remaining *Winter* factors ordinarily follow the merits. The case therefore turns on likelihood of success.</p><p>B. Compelled speech. The First Amendment, by its terms, prohibits laws &quot;abridging the freedom of speech.&quot; That guarantee includes &quot;both the right to speak freely and the right to refrain from speaking at all.&quot; *Wooley v. Maynard*; *West Virginia Bd. of Ed. v. Barnette*.<mark class='tru' data-n='2'> Laws compelling individuals to &quot;speak a particular message&quot; alter the content of their speech and are content-based regulations subject to strict scrutiny: they must be narrowly tailored to serve a compelling governmental interest.</mark> *Riley v. National Federation of the Blind*; *Reed v. Town of Gilbert*.</p><p>C.<mark class='tru' data-n='3'> The Ninth Circuit&#x27;s &quot;professional speech&quot; category.</mark> The court below sustained the licensed notice by inventing — or, more precisely, by adopting from its own prior cases — a category of &quot;professional speech&quot; entitled to diminished constitutional protection. We reject that approach. This Court has never recognized professional speech as a separate category to which the ordinary rules of the First Amendment do not apply. Speech is not unprotected merely because it is uttered by professionals, and content-based laws are not saved merely because the speakers hold state licenses. To hold otherwise would give the States a ready device for suppressing or conscripting disfavored speech: license an occupation, then dictate what its members must say. The Ninth Circuit&#x27;s rationale — that the Act is content-based but not *viewpoint*-based, and therefore escapes strict scrutiny — misstates the law. Content discrimination alone triggers heightened scrutiny; viewpoint discrimination is an aggravated form of the vice, not a precondition to finding one.</p><p>D. The two settled exceptions. Our cases have applied more deferential review in two limited circumstances, neither of which is a freestanding &quot;professional speech&quot; doctrine.</p><p>*First*, under *Zauderer v. Office of Disciplinary Counsel*, a State may require the disclosure of &quot;purely factual and uncontroversial information&quot; about &quot;the terms under which [the speaker&#x27;s] services will be available,&quot; so long as the requirement is not unjustified or unduly burdensome. The exception is bounded on every side: the information must be factual, it must be uncontroversial, and it must concern the speaker&#x27;s *own* services.</p><p>*Second*, under *Planned Parenthood of Southeastern Pa. v. Casey*, a State may regulate professional *conduct* in a manner that incidentally burdens speech. Casey&#x27;s informed-consent requirement was upheld because it attached to a medical procedure that the regulated physician himself proposed to perform. As counsel for NIFLA correctly framed it at argument, &quot;[i]nformed consent is triggered by a doctor proposing to perform a particular medical intervention.&quot; The doctrine is a rule about the practice of medicine; it is not a license to commandeer a speaker who performs no such procedure and to make him the State&#x27;s messenger on a subject of his choosing.</p><p>III. Application</p><p>A. The licensed notice is a content-based compulsion. The Act does not regulate what NIFLA&#x27;s clinics may say; it dictates what they must say. It requires a specific message — that California offers free or low-cost family planning services &quot;including&quot; abortion — delivered to every client. That the notice is accurate does not make it neutral. It requires petitioners, whose entire *raison d&#x27;être* is to persuade women to choose alternatives to abortion, to deliver to those very women a state-drafted notice pointing toward the procedure they exist to oppose, complete with the means of obtaining it. The Ninth Circuit itself conceded the requirement is content-based. That concession is dispositive of the standard of review; its viewpoint-neutrality rationale cannot carry the weight the panel placed on it.</p><p>B. Neither exception applies.</p><p>*Zauderer* does not. The compelled notice is not about &quot;the terms under which [petitioners&#x27;] services will be available.&quot; Petitioners do not provide, refer for, or fund abortion; the notice concerns services offered by the State and by others. And the message is not &quot;uncontroversial&quot; in any sense the law recognizes. Abortion is the paradigm of a controverted moral and political question in this country. A disclosure that is factually accurate may still be deeply controversial, and *Zauderer*&#x27;s safe harbor does not extend to a mandate that requires a speaker to advertise the very practice he condemns.</p><p>*Casey* does not apply either. Respondent&#x27;s lead submission is that &quot;[t]he interests served by the licensed disclosure is very much like that of the disclosure in Casey, promoting informed choice by a patient.&quot; But the analogy fails at its foundation. Casey&#x27;s disclosure was an incident of regulating a *procedure the physician was about to perform*. Petitioners&#x27; licensed centers offer pregnancy tests, ultrasounds, and counseling; they perform no abortion and propose none. There is no medical intervention to which informed consent could attach. Petitioners&#x27; counsel illustrated the point with force: a Planned Parenthood center that performed only pregnancy tests and ultrasounds while encouraging abortion could not constitutionally be compelled to recite a state-written notice about adoption services or childbirth assistance, because no procedure triggers the duty. The principle cuts both ways, and it decides this case. Untethered from an actual medical intervention, &quot;informed choice&quot; becomes a warrant for the State to script any conversation it finds insufficiently complete.</p><p>C. The Act fails even under the intermediate scrutiny the court below applied.<mark class='err' data-n='4'> We need not rest on the standard of review alone, because the Act cannot survive the lesser test the Ninth Circuit purported to apply — a point respondent&#x27;s own argument concedes more than it defends.</mark></p><p>The Act is wildly underinclusive with respect to its stated interest in informing low-income women about available services. It exempts, by respondent&#x27;s account, clinics enrolled in state family-planning programs, for-profit clinics, and individual physicians — that is, the great majority of providers who see pregnant women. Pressed on these gaps, counsel for respondent offered that &quot;as a category, for-profit clinics do not seem to treat primarily women who need free and sliding-cost scale ... care in the same way,&quot; and that &quot;individual doctors specialize as a category in treating people who have a way to pay for care.&quot; These are assertions about tendencies, not tailoring. Low-income women are not confined to free clinics, and nothing in the record establishes that they are. Counsel then conceded the decisive point: &quot;it&#x27;s always possible to imagine a new boundary for the law. But the Ninth Circuit correctly subjected the Act to rational-basis review; a law does not need to be perfect.&quot;</p><p>That concession reveals the error at the heart of the decision below. Rational-basis review is not the measure of a content-based compulsion of speech. Under any form of heightened scrutiny, a State may not &quot;concentrate its efforts where the need is most apparent&quot; by selecting one class of speakers — defined, as it happens, largely by the message they carry — and conscripting them alone. Underinclusiveness of this magnitude &quot;raises serious doubts about whether the government is in fact pursuing the interest it invokes, rather than disfavoring a particular speaker or viewpoint.&quot;</p><p>Nor is the mandate necessary. California possesses ample means to communicate the availability of publicly funded services: it can run a public information campaign, advertise, or post notices — indeed, it can speak in its own voice, on its own dime, without drafting unwilling speakers to carry its message. Respondent&#x27;s answer, that the notice is placed &quot;in the context in which it&#x27;s useful&quot; and reaches women &quot;where those women are going to be found,&quot; is an argument for convenience, not for necessity. The First Amendment does not yield to administrative convenience. The observation that &quot;legislatures should be encouraged to apply speech requirements more narrowly when they can&quot; is sound so far as it goes, but narrowing a compelled-speech mandate to the speakers most likely to disagree with it aggravates rather than cures the constitutional defect.</p><p>D. The unlicensed notice. The requirement that unlicensed facilities disclose their unlicensed status presents a closer question, and a State&#x27;s interest in ensuring that consumers know whether they are receiving licensed medical care is a substantial one. But on this record California has identified only a hypothetical harm — no evidence of women misled into believing that petitioners&#x27; unlicensed centers are medical providers — and the mandate is unduly burdensome as applied. It governs not merely in-clinic communications but the facilities&#x27; advertising, and in covered counties must appear in as many as thirteen languages, in prescribed type, in every printed and digital advertisement. A requirement that a speaker devote the bulk of a small advertisement to a government-scripted disclaimer, repeated in more than a dozen languages, drowns out the speaker&#x27;s own message. Such a mandate is &quot;unjustified [and] unduly burdensome&quot; even under *Zauderer*&#x27;s deferential standard, and it cannot stand.</p><p>E. The *Winter* factors. Because petitioners have shown a likelihood of success on the merits of their free speech claim, the remaining factors follow. The ongoing abridgment of First Amendment rights constitutes irreparable harm; the State has no legitimate interest in enforcing a likely unconstitutional statute; and the public interest lies in vindicating constitutional guarantees. Having resolved the case on free speech grounds, we do not reach the free exercise claim.</p><p>IV. Disposition</p><p><mark class='tru' data-n='5'>The court below erred in treating the compelled licensed notice as &quot;professional speech&quot; subject to relaxed review, and compounded that error by measuring the Act&#x27;s fit against a rational-basis standard that has no application to content-based compulsions of speech.</mark> Petitioners are likely to succeed on the merits of their claim that both notices violate the First Amendment. The judgment of the Court of Appeals is reversed, and the case is remanded for further proceedings consistent with this opinion.</p><p>RULING: Petitioner</p>", "error": "The Ninth Circuit subjected the Act to rational-basis review.", "truth": "The Ninth Circuit treated the speech regulated by the Act as professional speech subject to intermediate scrutiny.", "nmarks": 5}, {"id": "C046", "text": "<p>IN THIS COURT</p><p>Halima Tariffa Culley, et al., class plaintiffs below<br>v.<br>Steven T. Marshall, Attorney General of Alabama, et al.</p><p>OPINION OF THE COURT</p><p>---</p><p>I. Procedural History</p><p>On February 17, 2019, police stopped a vehicle registered to Halima Tariffa Culley and driven by her son. The son was arrested and charged with possession of marijuana and drug paraphernalia; the vehicle was seized. Culley&#x27;s efforts to retrieve the car were unsuccessful, and on February 27, 2019 — ten days after the seizure — the State of Alabama filed a civil forfeiture action in state court. Approximately twenty months later, the state court granted Culley summary judgment under Alabama&#x27;s statutory innocent-owner defense and ordered the vehicle returned.</p><p>Culley then filed a putative class action in federal district court under 42 U.S.C. § 1983, alleging that state and local officials&#x27; failure to afford a prompt post-seizure retention hearing violated the Eighth and Fourteenth Amendments.<mark class='err' data-n='1'> The district court entered judgment for the defendants.</mark><mark class='tru' data-n='2'> The United States Court of Appeals for the Eleventh Circuit affirmed as to the claims it found not moot, the return of the vehicle having mooted certain requests for relief.</mark> The matter reaches this Court on review of that judgment.</p><p>Two preliminary observations about the record are necessary.</p><p>First, counsel for the respondent asserts in briefing that &quot;[t]he Eleventh Circuit reversed the district court&#x27;s judgment for the defendants on the nonmoot claims.<mark class='tru' data-n='3'>&quot; That statement is contrary to the stipulated facts, which recite that the court of appeals *affirmed* as to the non-moot claims.</mark> Counsel is reminded that misdescription of the posture below — whether inadvertent or otherwise — is a serious matter, because it inverts the burden of persuasion and the identity of the party seeking disturbance of the judgment.<mark class='tru' data-n='4'> We proceed on the record as stipulated: the courts below ruled for the state defendants, and the party defending that judgment asks us to affirm.</mark></p><p>Second, the party captioned as &quot;Petitioner&quot; in this record submits argument urging affirmance and adopting the position of the forfeiting sovereign, while the party captioned as &quot;Respondent&quot; urges reversal and remand. That alignment is unusual, but the parties&#x27; substantive positions are unambiguous and were fully joined: the Petitioner-designated party contends that the timeliness framework of *United States v. $8,850* and *United States v. Von Neumann* — imported from *Barker v. Wingo* — supplies the governing test; the Respondent-designated party contends that *Mathews v. Eldridge* supplies the governing test and that the cause must be remanded for its application. We decide the question as joined and refer to the parties by their record designations.</p><p>Third, the Eighth Amendment claim pleaded below is not encompassed within the question presented and we express no view on it.</p><p>II. The Question Presented</p><p>&gt; *What test must a district court apply when determining whether and when a post-deprivation hearing is required under the Due Process Clause?*</p><p>The question is methodological. We are asked to choose between two frameworks for assessing the adequacy of post-seizure process in civil forfeiture: (a) the multi-factor timeliness inquiry of *Barker v. Wingo* as adapted to forfeiture in *$8,850* and *Von Neumann*; or (b) the three-factor balancing of *Mathews v. Eldridge*. We do not undertake, and need not undertake, an application of the chosen test to the merits of any individual class member&#x27;s claim beyond what is necessary to dispose of the judgment before us.</p><p>III. Governing Law</p><p>A. The precedents speak to this problem directly.</p><p>Due process requires &quot;the opportunity to be heard at a meaningful time and in a meaningful manner.&quot; The question is what that guarantee demands when the government has seized personal property pending a forfeiture adjudication.</p><p>This Court has twice addressed the temporal dimension of that guarantee in the forfeiture setting. In *$8,850*, the Court held that the four-factor *Barker* inquiry — length of delay, reason for delay, the claimant&#x27;s assertion of rights, and prejudice — governs whether the interval between seizure and forfeiture proceeding offends due process. In *Von Neumann*, the Court stated that &quot;the forfeiture proceeding, without more, provides the post-seizure hearing required by due process.&quot;</p><p>B. *Mathews* is a default, not a universal solvent.</p><p>*Mathews* balancing is the ordinary framework for determining what procedures attend a civil deprivation. But this Court has never held that *Mathews* displaces a more specific rule where history and precedent have already settled the process due. Where a particular procedural question is governed by settled historical practice and by holdings of this Court addressed to that very context, *Mathews* does not operate to reopen the question. The Respondent&#x27;s own framing concedes as much by acknowledging that *Mathews* is a &quot;default.&quot;</p><p>C. The distinct-interests argument.</p><p>The Respondent&#x27;s strongest submission — and it is a serious one — is that *$8,850* and *Von Neumann* answered only *when the final hearing must occur*, not *whether an interim retention hearing is separately required*. The analogy is to the criminal context: *Barker* governs the interval to final adjudication, while *Gerstein v. Pugh* and *County of Riverside v. McLaughlin* impose a separate, prompt probable-cause determination. The two rights, Respondent says, are conceptually independent; a hypothetically instantaneous trial would moot the *Gerstein* interest without collapsing the two rights into one.</p><p>The argument is logically coherent. It fails for two reasons.</p><p>*First*, it is difficult to reconcile with *Von Neumann*&#x27;s text. Respondent parses that opinion to confine the controlling sentence to Part II, where no protected interest was found. But the Court in Part III *assumed* a protected interest in the remission petition and nonetheless analyzed the claim in timeliness terms, concluding that the separate interest was &quot;in no way prejudiced&quot; by the 36-day interval. That is precisely the structure of the claim pressed here: a claimed interest distinct from the property itself, alleged to require earlier adjudication. *Von Neumann* addressed and rejected that structure on an assumed-interest basis. Respondent&#x27;s reading would render Part III&#x27;s analysis superfluous.</p><p>*Second*, the *Gerstein* analogy proves less than it promises. The prompt probable-cause determination rests on the Fourth Amendment&#x27;s specific command governing seizures of *persons*, not on *Mathews* balancing. *McLaughlin*&#x27;s 48-hour rule was announced as a Fourth Amendment accommodation, not as the output of a three-factor balance. Invoking *Gerstein* therefore does not supply authority for importing *Mathews* into forfeiture; if anything, it illustrates that where a specific constitutional tradition governs, this Court does not resort to *Mathews*. And it exposes an anomaly the Respondent does not answer: a rule requiring an adversarial retention hearing with witnesses and argument for a seized automobile would afford more process for the interim deprivation of a *car* than the Constitution requires for the interim detention of a *person*, for whom a non-adversarial probable-cause determination suffices.</p><p>D. History.</p><p>The founding-era Collection Acts required no interim hearing; seized property was ordinarily held until final adjudication. Respondent counters, citing the Institute for Justice&#x27;s submission, that courts were required to rule within fourteen days of filing. Petitioner disputes the premise. We note that Petitioner&#x27;s rebuttal — that the government had up to three years to *initiate* an action — addresses the filing interval rather than the post-filing interval, and is therefore only partially responsive. But even crediting the fourteen-day figure, it supports a requirement of a *prompt final proceeding*, which is exactly what the *$8,850* framework enforces. It does not establish an independent founding-era right to a preliminary retention hearing. The historical record thus tends to confirm, not undercut, the timeliness framework.</p><p>Respondent&#x27;s observation that the modern innocent-owner defense was unknown at common law is accurate and not trivial. But a statutory defense to forfeiture is a substantive entitlement; it does not by its own force dictate the *timing* of its adjudication. Affirmative defenses in both civil and criminal litigation are routinely reserved to final adjudication without constitutional difficulty, and Respondent offers no principle distinguishing this one.</p><p>IV. Application</p><p>A. The framework. We hold that where the government has seized personal property subject to civil forfeiture and has instituted forfeiture proceedings, the Due Process Clause requires a *timely* forfeiture hearing, and the adequacy of the process afforded is assessed under the flexible, fact-bound timeliness inquiry of *$8,850* and *Von Neumann*, drawing on the *Barker* factors. The Due Process Clause does not independently mandate a separate preliminary retention hearing, and *Mathews v. Eldridge* is not the governing framework for that question.</p><p>B. Respondent&#x27;s objections to *Barker*. Respondent argues that *Barker* is ill-suited because (i) a delay of roughly a year is required before the inquiry is triggered; (ii) it does not weigh private interests; and (iii) its only remedy is dismissal.</p><p>These objections are overstated. The one-year benchmark is a presumption of prejudice drawn from the speedy-trial line; it is not a jurisdictional floor barring relief for shorter delays, and *Von Neumann* itself scrutinized a 36-day interval. The claim that the inquiry ignores private interests is inaccurate: the prejudice factor is where a claimant&#x27;s particular hardship — loss of transportation to employment or medical care — is weighed, and the reason-for-delay factor polices governmental foot-dragging of the sort Respondent describes. As to remedy, the framework in the forfeiture context is not confined to dismissal; a court finding unconstitutional delay may order return of the property or such other relief as the circumstances require. Respondent&#x27;s objections describe a rigid caricature of the test rather than the test itself.</p><p>C. Respondent&#x27;s affirmative case. Respondent&#x27;s remaining submissions are largely prudential: that twenty states provide some form of retention hearing; that New York&#x27;s practice has functioned for two decades; that Alabama itself now affords prompter process; and that *Mathews* would leave room for state experimentation. These points establish that retention hearings are *workable and desirable policy*. They do not establish that they are *constitutionally compelled*. That numerous legislatures have chosen to provide more process than the Constitution requires is evidence of a healthy federalism, not of a constitutional floor. The *Fuentes* quotation, addressed to *pre*-deprivation process in the replevin context, does not carry the weight placed upon it here, where the government seized the vehicle incident to a lawful arrest and a pre-seizure hearing is concededly not required.</p><p>D. The record. Applying the governing framework to this record: the vehicle was seized on February 17, 2019, and the forfeiture action was filed on February 27, 2019 — ten days later. Culley was thus before a court promptly. She ultimately prevailed on the innocent-owner defense at summary judgment. Petitioner represents, without contradiction in the stipulated facts, that a bond was available to secure interim return of the vehicle.</p><p>We acknowledge Respondent&#x27;s contention that the twenty-month interval to final judgment was attributable in part to the State&#x27;s dilatory discovery conduct — five months to respond, and then non-responsively. If established, such conduct is precisely what the reason-for-delay factor condemns, and nothing in today&#x27;s holding immunizes it. But that is a merits question under the correct framework, and the courts below entered judgment for the defendants on the record before them; the stipulated facts do not establish that any class member was denied a timely adjudication under the applicable standard. We further note that the hardship facts recited as to class member Sutton appear in advocacy rather than in the stipulated record before us, and we do not treat them as established.</p><p>E. Matters outside the record. Petitioner&#x27;s submissions include predictive assertions that a retention-hearing requirement will cause &quot;more property released to criminals,&quot; &quot;crime will pay more,&quot; and &quot;you will have more crime.&quot; These are unsupported policy forecasts, not record evidence, and they form no part of our reasoning. The rhetorical framing on both sides — &quot;don&#x27;t trust judges to be judges,&quot; and the suggestion that the opposing view accuses the sovereign of &quot;violating fundamental rights for centuries&quot; — is argument, not analysis, and is disregarded. We find no personal attacks warranting sanction.</p><p>F. A caution. Our holding is narrow. We hold only that *Mathews* is not the governing framework and that no separate preliminary retention hearing is constitutionally compelled as a categorical matter. We do not hold that the government may seize property and sit on it indefinitely. Timeliness is a real constraint with real teeth: unexplained or strategic delay, refusal to accommodate demonstrated hardship, or failure to institute proceedings promptly may each render the process afforded constitutionally deficient in a given case. The Respondent&#x27;s most compelling contribution to this case is the reminder that a &quot;timely hearing&quot; requirement is worth nothing if courts apply it without rigor.</p><p>V. Disposition</p><p>The Eleventh Circuit correctly identified the timeliness framework of *$8,850* and *Von Neumann* as controlling and correctly declined to import *Mathews v. Eldridge*. The judgment is affirmed, and the request for remand for *Mathews* balancing is denied.</p><p>RULING: Petitioner</p>", "error": "The Eleventh Circuit reversed the district court’s judgment for the defendants on the nonmoot claims.", "truth": "The district court ruled for the defendants, and the Eleventh Circuit affirmed that judgment as to the claims that were not moot.", "nmarks": 4}, {"id": "C047", "text": "<p>Procedural History</p><p>Manachem Zivotofsky was born in Jerusalem in 2002 to United States-citizen parents. Invoking § 214(d) of the Foreign Relations Authorization Act of 2003, his parents asked the State Department to list his place of birth on his United States passport as “Israel.” Section 214(d) directs the Secretary, upon request, to record “Israel” as the place of birth for a United States citizen born in Jerusalem. The Department declined, adhering to its policy of listing “Jerusalem” without assigning the city to any sovereign.</p><p>Zivotofsky, through his parents, brought this action against the Secretary of State to compel implementation of § 214(d). The District Court first dismissed on the ground that the dispute posed a nonjusticiable political question. The Supreme Court reversed that determination and remanded, holding that the Court could decide whether the statute could constitutionally be enforced without deciding the ultimate sovereignty of Jerusalem.</p><p><mark class='tru' data-n='1'>On remand, the District Court held § 214(d) unconstitutional because it impermissibly interferes with the President’s exclusive recognition power.</mark><mark class='err' data-n='2'> The Court of Appeals for the District of Columbia Circuit affirmed.</mark> This appeal followed.</p><p>Governing Law</p><p>The Constitution assigns the President substantial authority over the Nation’s external relations. Among other provisions, the President receives ambassadors, appoints ambassadors with the Senate’s advice and consent, negotiates treaties, and serves as Commander in Chief.<mark class='tru' data-n='3'> Although the Constitution does not expressly use the word “recognition,” these provisions, longstanding historical practice, and the structural need for the Nation to speak with one authoritative voice to foreign sovereigns establish that the President possesses the exclusive power to recognize foreign states and governments and to determine the territorial bounds of a recognition.</mark></p><p>Congress retains extensive powers touching foreign affairs, including authority over naturalization, foreign commerce, appropriations, and the issuance and regulation of passports. It may legislate in ways that affect foreign relations. But it may not use those powers to compel the Executive to communicate a recognition position contrary to the President’s determination. Where Congress directs the Executive to issue an official statement that contradicts the Nation’s recognition policy, the statute intrudes upon the President’s exclusive constitutional authority.</p><p>The relevant inquiry is thus not whether § 214(d) itself formally purports to recognize Israeli sovereignty over Jerusalem, nor whether Congress may generally regulate passport contents. The question is whether the statute requires the Executive, through an official governmental document, to make a representation inconsistent with the President’s recognition determination.</p><p>Application to the Record</p><p>The Executive’s stated recognition position is that the United States does not recognize any nation’s sovereignty over Jerusalem pending resolution of that issue by the relevant parties. A passport is not a private document or merely a biographical record. It is an official communication of the United States, issued in the name and under the authority of the Executive Branch, and presented to foreign governments and officials in international travel.</p><p>Section 214(d) requires the Secretary, at an individual’s request, to designate “Israel” as the birthplace of a citizen born in Jerusalem. In the context of official United States passports, that designation communicates that Jerusalem is located in Israel. It therefore contradicts the Executive’s determination that the United States will not recognize sovereignty over Jerusalem. The statute does not merely permit an individual to express a personal political view; it requires an Executive officer to place the requested designation on a document that conveys the authority of the United States.</p><p>Petitioner’s narrower characterization—that the designation is only a place-of-birth notation and does not amount to recognition—does not overcome the constitutional defect. The designation’s diplomatic significance follows from the setting in which it is made: an official passport, issued repeatedly and relied on abroad. Nor does the statute’s optional character cure the intrusion. Even if only some eligible citizens request the designation, the Executive is compelled to make an official representation inconsistent with the President’s recognition policy.</p><p>Petitioner is correct that Congress has important authority concerning passports and foreign affairs and that the Executive’s foreign-affairs expertise does not itself displace judicial review. Those propositions do not decide this case. Judicial review has occurred, but the constitutional allocation of the recognition power remains controlling. Congress may express disagreement with the President’s policy, exercise its own enumerated powers, and seek to influence diplomatic policy through constitutionally permissible means. It may not direct the President’s subordinates to issue official documents repudiating the recognition position the President has adopted.</p><p>The Government’s evidence and arguments regarding diplomatic consequences reinforce, but are not necessary to, this conclusion. The constitutional violation lies in Congress’s compelled contradiction of the Executive’s recognition determination, not in the degree of political controversy or the intensity of foreign reaction. Conversely, the parties’ competing predictions about whether foreign governments would understand the passport notation as a change in policy are not dispositive. The official character and territorial implication of the required designation are sufficient.</p><p>Disposition</p><p><mark class='tru' data-n='4'>Section 214(d), insofar as it requires the Secretary of State to record “Israel” as the birthplace of a United States citizen born in Jerusalem upon request, impermissibly infringes the President’s exclusive power to recognize foreign sovereigns and their territorial status.</mark> The judgment of the Court of Appeals is affirmed.</p><p>RULING: Respondent</p>", "error": "The D.C. Circuit reversed the district court and held Section 214(d) constitutional.", "truth": "The D.C. Circuit affirmed the district court's judgment that Section 214(d) impermissibly interfered with the President's exclusive recognition power.", "nmarks": 4}, {"id": "C048", "text": "<p>Opinion of the Court</p><p>I. Procedural History</p><p>Jack Davis, a candidate for the United States House of Representatives from New York’s 26th Congressional District, challenged § 319 of the Bipartisan Campaign Reform Act of 2002, commonly called the “Millionaire’s Amendment.” The provision retained the ordinary contribution limits for a substantially self-financed candidate while permitting that candidate’s opponent, upon satisfaction of statutory conditions, to accept contributions at increased limits. It also imposed special notification and disclosure obligations on candidates whose personal expenditures exceeded specified thresholds.</p><p>Davis alleged that this asymmetric regime violated the Free Speech Clause of the First Amendment and the equal-protection principle embodied in the Fifth Amendment.<mark class='err' data-n='1'> The District Court concluded that Davis lacked standing to pursue his First Amendment challenge and, alternatively, reasoned that § 319 did not burden his speech because it did not limit how much he could spend and could increase the overall amount of political speech in the election.</mark><mark class='tru' data-n='2'> The court rejected the Fifth Amendment claim on the ground that a self-financed candidate and an opponent dependent upon contributions were not similarly situated.</mark> It accordingly entered judgment against Davis.</p><p>The campaign-finance statute authorizes direct review in this Court. Before reaching the merits, we consider Davis’s standing.</p><p>II. Governing Law</p><p>Article III standing requires a concrete and particularized injury that is actual or imminent, fairly traceable to the challenged law, and likely to be redressed by a favorable judgment. A person does not forfeit standing merely because the legal burden arises when he chooses to engage in constitutionally protected conduct. Nor must a regulated party await the ultimate exploitation of a statutory disadvantage when the law already subjects him to unequal rules and associated reporting obligations.</p><p>The First Amendment affords its highest protection to political expression. A candidate’s expenditure of personal funds to advocate his own election is direct political speech. Under *Buckley v. Valeo*, the Government may not cap such expenditures merely to equalize candidates’ financial resources or to prevent supposedly excessive political advocacy. Preventing actual or apparent quid pro quo corruption may justify certain contribution limits, but a candidate’s use of his own money presents no comparable risk that an outside contributor will obtain improper influence.</p><p>The Constitution also does not permit Congress to accomplish indirectly what it may not accomplish directly. A law may burden protected speech without imposing an express prohibition or numerical ceiling.<mark class='tru' data-n='3'> A statutory consequence designed to make protected expression materially less advantageous can implicate the First Amendment.</mark></p><p>Campaign-finance disclosure requirements may serve legitimate informational and enforcement interests. But they remain subject to constitutional review and cannot be sustained merely because the Government labels them “disclosure.” The nature and justification of the particular requirement control.</p><p>Finally, the Fifth Amendment’s Due Process Clause incorporates an equal-protection principle applicable to the Federal Government. Because constitutional adjudication ordinarily proceeds no further than necessary, however, a court need not decide an independent equal-protection claim when another constitutional ground fully disposes of the challenged statutory scheme.</p><p>III. Application</p><p>#### A. Standing</p><p>Davis has standing. Section 319 required him, as a candidate contemplating substantial personal expenditures, to make special declarations and continuing disclosures. It also provided that his spending could trigger increased contribution limits for his opponent while leaving Davis subject to the ordinary limits for contributions made to his own campaign.</p><p>Those consequences constitute a concrete legal disadvantage. The injury is not eliminated merely because Davis remained free to spend his own money or because an opponent might ultimately decline to take full advantage of the increased limits. The statutory scheme made Davis’s exercise of a protected right the trigger for unequal fundraising rules and immediate reporting duties.</p><p>Nor is the injury improperly self-inflicted. Davis was not required to surrender constitutionally protected political expression to preserve his ability to challenge the law burdening that expression. His injury is traceable to § 319 and would be redressed by invalidation of its asymmetric provisions.<mark class='err' data-n='4'> The District Court therefore erred insofar as it dismissed the First Amendment claim for lack of standing.</mark></p><p>#### B. First Amendment</p><p><mark class='tru' data-n='5'>On the merits, § 319 cannot be reconciled with the First Amendment.</mark></p><p>The provision does not formally cap Davis’s personal campaign expenditures. That is not dispositive. Once a candidate spends beyond the statutory threshold, the law confers a fundraising advantage upon his opponent: the opponent may accept contributions at limits unavailable to the self-financing candidate. The predictable operation of this arrangement is to burden the candidate’s decision to finance additional political speech. Every additional expenditure may increase the adversary’s capacity to raise funds under preferential rules.</p><p>The Government’s argument that the law increases total speech in the race is insufficient. The First Amendment does not allow Congress to burden one candidate’s speech because Congress would prefer a different distribution of electoral resources or believes the opponent should receive assistance in answering that speech. As *Buckley* establishes, equalizing candidates’ financial positions is not a legitimate basis for restricting or penalizing political expression.</p><p>The asserted analogy to voluntary public financing is unpersuasive. A voluntary public-financing system offers a candidate public funds in exchange for accepting specified conditions. Section 319 instead attaches an electoral disadvantage to a candidate’s use of personal funds by altering the rules governing the opponent. The candidate receives no corresponding public benefit and cannot avoid the disadvantage without reducing protected expenditures.</p><p>Neither does the anti-corruption interest sustain the law. Personal expenditures do not create the quid pro quo danger associated with large contributions from third parties. Indeed, § 319 responds to self-financing by allowing the opponent to accept larger contributions, thereby increasing rather than decreasing the potential influence of outside donors. The respondent’s contention that Congress was merely identifying unusually expensive races does not establish why the constitutionality of contribution limits should turn on an opposing candidate’s exercise of his own speech rights.</p><p>The reporting provisions at issue are likewise constitutionally infirm to the extent they serve as the mechanism implementing the asymmetric fundraising regime. Ordinary disclosure of campaign receipts and expenditures can inform voters and facilitate enforcement. Davis does not possess a constitutional right to conceal actual campaign spending. But the special advance declaration of intended personal spending and the continuing threshold reports are tied to the unconstitutional scheme and operate principally to notify the opponent when enhanced contribution limits become available. They cannot survive independently on this record merely by being characterized as informational measures.</p><p>The Court does not adopt every aspect of Davis’s argument. Candidates may constitutionally be required to disclose actual campaign expenditures, including expenditures of personal funds, through generally applicable reporting rules. Nor does the Constitution guarantee that candidates will possess equal electoral resources. The defect here is narrower: Congress may not make one candidate’s exercise of the right to spend personal funds the statutory trigger for preferential contribution limits benefiting that candidate’s opponent.</p><p>#### C. Fifth Amendment</p><p>Because § 319’s asymmetric contribution regime and its implementing disclosure provisions violate the First Amendment, it is unnecessary to decide whether they independently violate the equal-protection principle of the Fifth Amendment. We therefore express no view on the District Court’s conclusion that the candidates were not similarly situated for equal-protection purposes.</p><p>IV. Disposition</p><p>The judgment of the District Court is reversed. The case is remanded for entry of appropriate declaratory and injunctive relief consistent with this opinion. The challenged asymmetric contribution-limit provisions, together with the special reporting requirements necessary to implement them, may not be enforced.</p><p>RULING: Petitioner</p>", "error": "The district court dismissed Davis's First Amendment claim for lack of standing.", "truth": "The district court rejected Davis's First Amendment claim on the merits, reasoning that the law did not implicate the First Amendment because it did not impede his ability to spend money in support of his message.", "nmarks": 5}, {"id": "C049", "text": "<p>Opinion</p><p>I. Procedural History</p><p>California voters enacted Proposition 12 in 2018, amending the California Health and Safety Code to prohibit the in-state sale of pork derived from animals confined in a manner inconsistent with California&#x27;s animal-welfare standards.<mark class='tru' data-n='1'> Trade associations representing the pork industry and individual farmers (respondents here) challenged the law in federal district court, asserting that it violates the dormant Commerce Clause both because it allegedly imposes an undue burden on interstate commerce and because it purportedly regulates extraterritorially — forcing producers nationwide to comply with California standards even though roughly 87% of American pork is consumed outside California.</mark></p><p><mark class='tru' data-n='2'>The district court dismissed the complaint for failure to state a claim.</mark><mark class='tru' data-n='3'> A unanimous panel of the United States Court of Appeals for the Ninth Circuit affirmed, holding that the complaint failed to plausibly plead a dormant Commerce Clause violation under either the undue-burden theory or the extraterritoriality theory.</mark><mark class='tru' data-n='4'> The case now reaches this Court on the question whether Proposition 12, an in-state sales regulation, violates the dormant Commerce Clause.</mark> Because the case arises at the motion-to-dismiss stage, all well-pleaded factual allegations in the complaint are taken as true, and dismissal is proper only if no plausible claim for relief is stated.</p><p><mark class='err' data-n='5'>We note, in passing, that respondents&#x27; brief mischaracterizes the judgment below at one point — describing the Ninth Circuit as having &quot;reversed the district court&#x27;s dismissal&quot; — when the record establishes that the court of appeals *affirmed*.</mark> We attribute this to inattention rather than misrepresentation, but counsel is cautioned that accuracy in describing the record is a professional obligation, not a stylistic preference.</p><p>II. Governing Law</p><p>The Commerce Clause affirmatively grants Congress power to regulate commerce among the states. Its &quot;dormant&quot; implication limits state laws that interfere with that power. Our cases identify two principal categories of invalid state regulation: (1) laws that discriminate against interstate commerce in favor of in-state economic interests, and (2) laws that impose an undue burden on interstate commerce that clearly outweighs local benefits under the balancing framework of *Pike v. Bruce Church, Inc.*, 397 U.S. 137 (1970). Separately, our cases in *Baldwin v. G.A.F. Seelig, Inc.*, 294 U.S. 511 (1935), *Brown-Forman Distillers Corp. v. New York State Liquor Authority*, 476 U.S. 573 (1986), and *Healy v. Beer Institute*, 491 U.S. 324 (1989), prohibit states from projecting their legislation into other states — for example, by controlling the price of goods in out-of-state transactions.</p><p>Several settled principles frame the analysis:</p><p><mark class='tru' data-n='6'>First, a state law does not violate the dormant Commerce Clause merely because it is motivated by moral or policy judgments, or because it conditions in-state sales on how a product was produced.</mark> States have long exercised their traditional police power to set standards for goods sold within their borders, including production-method conditions serving local moral, health, or safety interests. At least two dozen states have enacted laws of this general character.</p><p>Second, a nondiscriminatory law that regulates evenhandedly — applying identically to in-state and out-of-state producers — does not become invalid simply because it imposes upstream costs on out-of-state actors. As we held in *Exxon Corp. v. Governor of Maryland*, 437 U.S. 117 (1978), the Commerce Clause protects interstate commerce, not particular methods of production or the competitive position of particular out-of-state firms. That a law&#x27;s economic burden falls predominantly on out-of-state actors because of the geography of an industry does not convert it into discrimination.</p><p>Third, the antiprice-control and extraterritoriality cases (*Baldwin*, *Brown-Forman*, *Healy*) address laws that directly control commercial terms of out-of-state transactions. They have not been understood to prohibit a state from conditioning in-state sales on the manner in which the goods sold in that state were produced.</p><p>Fourth, *Pike* balancing requires a substantial burden on interstate commerce that is clearly excessive in relation to putative local benefits. Under *Maine v. Taylor*, 477 U.S. 131 (1986), a challenger must overcome a heavy presumption of validity for laws resting on legitimate local concerns, and at the pleading stage must plausibly allege that the law lacks even an arguable local basis.</p><p>III. Application</p><p>Discrimination. Proposition 12 is not protectionist. It regulates the sale of pork *within* California and applies identically to California producers and out-of-state producers. It neither taxes nor excludes out-of-state goods in favor of domestic ones. Respondents do not seriously contend otherwise; their theory is one of burden, not discrimination.</p><p>Extraterritoriality. Respondents contend that because California imports nearly all of its pork and most pork is consumed elsewhere, Proposition 12 effectively regulates farming in other states. We disagree. The statute controls only what may be sold in California. It does not fix prices for out-of-state transactions, as in *Baldwin* and *Healy*, and it does not condition in-state sales on out-of-state conduct unrelated to the goods sold, as in *Brown-Forman*. The condition it imposes — sow housing standards — is tied to the production process for the pork that enters the California market, a distinction the market itself recognizes (crate-free and similar labels). Respondents&#x27; parade of hypotheticals (minimum-wage conditions, immigration conditions, company-wide-policy conditions) involves restrictions untethered from the production of the goods actually sold in the regulating state; those hypotheticals do not describe Proposition 12. The fact that upstream compliance costs may propagate through a national supply chain in which producers cannot trace the ultimate destination of each pork cut is an &quot;affecting commerce&quot; problem, not an impermissible direct regulation of out-of-state commerce. Respondents&#x27; reliance on *Legato Vapors* is unpersuasive: that decision struck down a condition dictating the out-of-state *operation* of companies generally, not a production standard for the specific goods entering the regulating state&#x27;s market.</p><p>Pike balancing. Assuming *Pike* balancing is even appropriate at this stage, respondents have not plausibly alleged the requisites.<mark class='tru' data-n='7'> The alleged burdens — capital costs, supply-chain restructuring, and price effects — are the familiar incidents of any state production-standard regulation, and under *Exxon* the Commerce Clause does not protect particular methods of production.</mark> Respondents&#x27; own complaint acknowledges a correlation between intensive confinement and elevated salmonella rates in growing pigs, and it is at minimum *arguable* that sow confinement bears on animal welfare and food safety; under *Maine v. Taylor*, that suffices at this stage, particularly where California asserts a moral interest in refusing to provide a market to products of extreme confinement — a historically recognized basis for food regulation. Respondents&#x27; contention that the burdens will overwhelm any local benefit is an empirical prediction about market adaptation (&quot;some producers serving California, others serving the other 87%&quot;) that cannot be resolved on a motion to dismiss, and which, if it is a problem at all, is one for Congress under its express Commerce Clause authority.</p><p>Respondents&#x27; strongest argument is the structural one: that if every state may condition in-state sales on its moral and policy views, the national market risks balkanization. The concern is not frivolous.<mark class='tru' data-n='8'> But the remedy the Framers supplied for interstate commercial friction is congressional legislation under the affirmative Commerce Clause, not judicial expansion of the dormant implication to displace the historic police power of the states over goods sold within their borders.</mark> A contrary rule would invite exactly the freewheeling economic judicial review this Court has long declined to perform.</p><p>We note, finally, that respondents&#x27; counsel repeatedly invoked farmers in the gallery and promises of trial testimony. Such appeals carry no evidentiary weight on a motion to dismiss, and we disregard them.</p><p>IV. Disposition</p><p><mark class='tru' data-n='9'>The judgment of the Ninth Circuit is affirmed.</mark> Proposition 12 does not violate the dormant Commerce Clause as pleaded.</p><p>RULING: Petitioner</p>", "error": "The Ninth Circuit reversed the district court’s dismissal and remanded the case for trial.", "truth": "The district court dismissed the complaint for failure to state a claim, and the U.S. Court of Appeals for the Ninth Circuit affirmed, finding that the complaint did not plausibly plead a dormant Commerce Clause violation under either theory.", "nmarks": 9}, {"id": "C050", "text": "<p>Opinion of the Court</p><p>Robert Mallory brought this action against Norfolk Southern Railway Co. in the Philadelphia County Court of Common Pleas under the Federal Employers’ Liability Act. Mallory alleged that, while working for Norfolk Southern in Ohio and Virginia from 1988 through 2005, he was exposed to carcinogens. He did not allege any relevant exposure or injury in Pennsylvania.</p><p>Norfolk Southern is a Virginia corporation. It nevertheless registered to do business in Pennsylvania, as Pennsylvania law requires of foreign corporations wishing to conduct business in the Commonwealth.<mark class='err' data-n='1'> Pennsylvania’s statutory scheme expressly provides that such registration supplies a sufficient basis for Pennsylvania courts to exercise general personal jurisdiction over the registrant.</mark></p><p>Norfolk Southern objected to personal jurisdiction, contending that subjecting it to suit over claims unrelated to Pennsylvania violated the Due Process Clause of the Fourteenth Amendment.<mark class='tru' data-n='2'> The trial court agreed and held the statutory scheme unconstitutional.</mark><mark class='tru' data-n='3'> The Supreme Court of Pennsylvania affirmed.</mark> Mallory then sought review in this Court.<mark class='tru' data-n='4'> Although one excerpt in petitioner’s submission describes the decision below differently, the stipulated procedural history establishes that the Pennsylvania Supreme Court affirmed the trial court’s judgment against Mallory.</mark></p><p>The question is whether Pennsylvania’s consent-by-registration statute violates the Fourteenth Amendment’s Due Process Clause. We hold that it does not.</p><p>I. Governing law</p><p>The Due Process Clause limits a state court’s authority to bind a defendant through the exercise of personal jurisdiction. Under *International Shoe Co. v. Washington* and its progeny, a State may ordinarily exercise specific jurisdiction when the litigation arises out of or relates to the defendant’s contacts with the forum. It may exercise contacts-based general jurisdiction over a corporation where the corporation is “at home,” paradigmatically its place of incorporation or principal place of business. *Goodyear Dunlop Tires Operations, S. A. v. Brown*; *Daimler AG v. Bauman*.</p><p>Those doctrines, however, govern jurisdiction based upon a defendant’s relationship with the forum absent consent. Personal jurisdiction is an individual, waivable right. A defendant may consent to jurisdiction through a contractual forum-selection clause, an appearance, the appointment of an agent for service under an applicable legal regime, or other conduct carrying established jurisdictional consequences. *Insurance Corp. of Ireland v. Compagnie des Bauxites de Guinée*. Accordingly, *International Shoe* did not eliminate jurisdiction founded upon consent; it addressed the constitutional sufficiency of contacts where consent was absent.</p><p>The Court’s precedent also recognizes that a State may require a foreign corporation, as a condition of doing business within the State, to appoint an in-state agent for service and accept the jurisdictional consequences attached by state law to that appointment. Most directly, *Pennsylvania Fire Insurance Co. v. Gold Issue Mining &amp; Milling Co.* sustained jurisdiction over an out-of-state corporation, on an out-of-state claim, where the corporation had complied with a registration statute construed to constitute consent to such jurisdiction. The modern contacts cases did not purport to overrule that consent-based rule.</p><p>History reinforces that distinction. The materials before us show that States used corporate-registration and appointed-agent statutes before and around the ratification of the Fourteenth Amendment. The precise language and reach of those enactments varied, and petitioner overstates matters when treating every historical service-of-process provision as indisputable authorization of all-purpose jurisdiction. Nevertheless, the historical record refutes respondent’s broader contention that consent-by-registration is merely a recent invention categorically incompatible with due process.</p><p>II. Application</p><p>Pennsylvania’s law gives registration a stated jurisdictional consequence: a foreign corporation that registers to conduct business in the Commonwealth becomes subject to general personal jurisdiction there. Norfolk Southern registered under that statutory scheme. Its amenability to suit therefore rests not merely on the volume of its Pennsylvania business, nor on a judicial fiction that any business activity makes a corporation present everywhere it operates. It rests on the legal consequence Pennsylvania attached to the corporation’s formal registration.</p><p>That distinction answers Norfolk Southern’s reliance on *Goodyear* and *Daimler*. If Pennsylvania asserted general jurisdiction solely because Norfolk Southern conducted substantial business in the Commonwealth, those cases would present a serious—indeed controlling—obstacle. A corporation is not “at home” in every State in which it conducts substantial operations. But those decisions concerned contacts-based jurisdiction, not jurisdiction founded upon consent. Applying Pennsylvania’s registration statute therefore does not enlarge the *Daimler* “at home” test; it invokes an independent basis for personal jurisdiction.</p><p>Norfolk Southern argues that its registration was coerced because Pennsylvania prohibited it from doing business unless it registered. That argument has force as a matter of policy and may bear upon other constitutional doctrines. But it does not establish a violation of the Due Process Clause under the precedent and historical practice governing personal jurisdiction. The statutory consequence was prescribed in advance, and Norfolk Southern took the formal act to which Pennsylvania law attached that consequence. This is not a case in which a court inferred unlimited consent from silence, from isolated commercial conduct, or from a registration statute that addressed service alone without specifying its jurisdictional effect.</p><p>Nor are interstate-federalism concerns sufficient to alter that conclusion. It is true that Mallory is not a Pennsylvania resident, Norfolk Southern is not incorporated there, and the alleged exposure occurred elsewhere. Virginia and Ohio may consequently have stronger substantive connections to the dispute. Those circumstances would defeat general jurisdiction based only on ordinary forum contacts. They do not negate a valid jurisdictional submission. Because personal jurisdiction can be waived, consent supplies authority that minimum contacts alone might not.</p><p>We do not decide whether Pennsylvania’s requirement imposes an impermissible burden on interstate commerce or violates some constitutional provision other than the Due Process Clause. Nor do we assess the wisdom of allowing Pennsylvania courts to hear claims having no connection to the Commonwealth. Those issues are outside the question presented. The parties’ rhetoric about “big businesses,” “the little guy,” and purported judicial “hell holes” has no bearing on the constitutional issue and receives no weight.</p><p>III. Disposition</p><p>Pennsylvania’s exercise of personal jurisdiction over Norfolk Southern, based on the company’s registration under a statute expressly providing for general jurisdiction, does not violate the Due Process Clause of the Fourteenth Amendment.<mark class='err' data-n='5'> The judgment of the Supreme Court of Pennsylvania is reversed, and the case is remanded for further proceedings consistent with this opinion.</mark></p><p>RULING: Petitioner</p>", "error": "The Pennsylvania Supreme Court reversed the trial court and upheld Pennsylvania’s statutory scheme.", "truth": "The trial court held Pennsylvania’s statutory scheme unconstitutional, and the Pennsylvania Supreme Court affirmed.", "nmarks": 5}, {"id": "C051", "text": "<p>IN THE SUPREME COURT OF THE UNITED STATES</p><p>KANSAS v. CARR and KANSAS v. GLEASON — RULING OF THE COURT</p><p>---</p><p>I. Procedural History</p><p>In December 2000, brothers Jonathan and Reginald Carr committed a series of crimes in Wichita, Kansas — including robbery, rape, and the murder of five people — that became known as &quot;The Wichita Massacre.&quot; The Carrs were tried jointly. Before trial, they moved to sever their cases, arguing that they intended to mount antagonistic defenses and to introduce evidence admissible only in separate proceedings. The trial judge denied the motion without detailed findings, and the brothers were jointly convicted on numerous counts and sentenced to death. At the joint penalty phase, the jury was instructed to consider each defendant individually and returned separate verdict forms, but it was not affirmatively instructed that mitigating circumstances need not be proven beyond a reasonable doubt.</p><p>In the consolidated companion case, Gleason was convicted of capital murder, premeditated murder, aggravated kidnapping, aggravated robbery, and criminal possession of a firearm, and was sentenced to death for the capital murder.</p><p><mark class='err' data-n='1'>The Kansas Supreme Court reversed the Carrs&#x27; death sentences on two Eighth Amendment grounds: (1) the trial judge failed to conduct the necessary analysis in ruling on the severance motion, and (2) the jury may have been prevented from giving meaningful effect to mitigating evidence because it was not affirmatively instructed that mitigating circumstances need not be proven beyond a reasonable doubt.</mark> The court likewise vacated Gleason&#x27;s death sentence on the mitigation-instruction ground. The State of Kansas sought certiorari, and this Court granted review on two questions: whether the Eighth Amendment requires a capital-sentencing jury to be affirmatively instructed that mitigating circumstances need not be proven beyond a reasonable doubt, and whether a trial court&#x27;s refusal to sever the penalty phase of a joint trial violates the Eighth Amendment&#x27;s guarantee of individualized sentencing.</p><p>II. Governing Law</p><p>The Eighth Amendment requires that the sentencer in a capital case be able to give &quot;full consideration and full effect to mitigating circumstances.&quot; *Lockett v. Ohio*, 438 U. S. 586 (1978); *Eddings v. Oklahoma*, 455 U. S. 104 (1982). But the Constitution does not mandate any particular form of instruction; it requires only that the jury not be *prevented* from considering mitigating evidence. States remain free to structure capital sentencing as they choose, and may adopt procedural rules beyond the constitutional minimum — such as Kansas&#x27;s rule requiring the mitigating-circumstance instruction — but the federal Constitution does not compel those rules. Where a state court&#x27;s decision rests on federal constitutional grounds, this Court reviews the state court&#x27;s application of federal law; the requirements of *state* law are not cognizable here as federal error.</p><p>On joinder, the Constitution permits joint proceedings — including joint capital sentencing — provided the jury is instructed to consider each defendant individually, and any risk of prejudice is mitigated by careful instruction. A defendant must show that the joint proceeding prevented the jury from making a reliable sentencing determination about the individual defendant. Review of a severance ruling is deferential; a federal Eighth Amendment
