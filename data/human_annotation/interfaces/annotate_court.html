d, and it has been described as the kind of case that is &quot;unlikely&quot; to be repeated. *Beard v. Banks*, 542 U.S. 406, 417 (2004).</p><p>Two precedents bear directly here. In *DeStefano v. Woods*, 392 U.S. 631 (1968), the Court declined to apply *Duncan v. Louisiana*&#x27;s incorporation of the jury-trial right itself retroactively, reasoning that &quot;the values implemented by the right to jury trial would not measurably be served by requiring retrial of all persons convicted in the past by procedures not consistent with the Sixth Amendment right to jury trial.&quot; *Id.* at 633. And in *Whorton*, the Court held that *Crawford v. Washington*—which restored an original-meaning understanding of a bedrock Sixth Amendment guarantee and displaced a long-settled contrary regime—was not watershed, because it was not &quot;necessary to prevent an impermissibly large risk of an inaccurate conviction&quot; and in some cases might exclude reliable evidence. 549 U.S. at 418–20.</p><p>III. Application</p><p>A. Preliminary matters of decorum and relevance</p><p>Both sides have advanced material that the Court disregards.</p><p>Respondent&#x27;s closing assertion that &quot;the state has no legitimate interest in avoiding retroactivity but for its desire to let Mr. Edwards languish in Angola for the rest of his life&quot; imputes bad faith to opposing counsel and to the sovereign. A State&#x27;s interest in the finality of lawfully obtained judgments is a legitimate interest that this Court has recognized for decades; characterizing it as malice is argument by insinuation, and it is stricken from consideration. The rhetorical question &quot;On what grounds can we let this happen when we know his conviction is unconstitutional?&quot; also begs the question presented, which is not whether the verdicts would be unconstitutional today but whether a rule announced after finality reaches back.</p><p>Petitioner is not blameless. Its invocation of Edwards&#x27;s confession and identification by a victim is irrelevant. *Teague* retroactivity is a threshold, categorical inquiry into the character of a rule; it is not a case-specific assessment of guilt or harmlessness. *See Beard*, 542 U.S. at 411. Likewise, Petitioner&#x27;s repeated appeal to the trauma that retrials would inflict on victims, and its warning of &quot;thousands of cases,&quot; is an argument about consequences, not about whether a rule was dictated by precedent. Finality and reliance interests are genuinely part of *Teague*&#x27;s underlying rationale, but they enter through the doctrine&#x27;s structure, not as a freestanding equitable override. The Court considers them only in that structural sense.</p><p>B. *Ramos* announced a new rule</p><p>Respondent advances the &quot;old rule&quot; theory: because the Sixth Amendment has always required unanimity, *see Thompson v. Utah*, 170 U.S. 343 (1898), and because *Malloy v. Hogan*, 378 U.S. 1 (1964), forbids a &quot;watered-down&quot; incorporation, the only logically available conclusion was that Louisiana had to require unanimity. Justice Powell&#x27;s controlling fifth vote in *Apodaca*, the argument runs, rested on a dual-track incorporation theory already foreclosed by *Malloy*, so *Apodaca* was &quot;dead on arrival&quot; and carried no precedential force.</p><p>The argument is intellectually serious, and the Court credits its premise: Justice Powell&#x27;s rationale was indeed in tension with the Court&#x27;s incorporation jurisprudence, and *Ramos* said as much. But the premise does not carry the conclusion, for three reasons.</p><p>First, *Teague*&#x27;s newness inquiry is objective and empirical, not idealized. The question is not whether the correct answer was available to a sufficiently rigorous reasoner, but whether the result was &quot;apparent to all reasonable jurists&quot; in 2010. *Lambrix*, 520 U.S. at 527–28. It plainly was not. For nearly fifty years, every federal court of appeals and state court of last resort to confront the question treated *Apodaca* as controlling. Respondent offers no contrary authority. A proposition rejected with that degree of unanimity by the judiciary cannot be said to have been dictated. *Butler* is directly on point: a rule may follow closely from prior cases and still be new where the outcome was &quot;susceptible to debate among reasonable minds.&quot; 494 U.S. at 415.</p><p>Second, *Ramos* itself refutes the theory. The *Ramos* Court did not hold that *Apodaca* was a nullity requiring no disturbance; it conducted a full *stare decisis* analysis and expressly overruled it. Six Justices in *Ramos* treated *Apodaca* as binding precedent that had to be overcome. The *Ramos* Court further observed that the court of appeals had been correct to follow *Apodaca*. A decision that must overrule a precedent to reach its result announces a new rule almost by definition. *Whorton*, 549 U.S. at 416.</p><p>Third, Respondent&#x27;s own framing concedes the point. Counsel argued that *Ramos* &quot;checks the boxes as being both an old rule and a new rule,&quot; and that &quot;for members of this Court who viewed *Apodaca* as precedent, *Ramos* announced a watershed rule.&quot; Pleading in the alternative is permitted, but here the alternatives are mutually destructive on the newness question: the watershed argument is available only on the premise that *Ramos* broke new ground. The Court holds that it did. *Ramos* announced a new rule.</p><p>C. The substantive exception does not apply</p><p>Neither party seriously contends otherwise, and correctly so. *Ramos* does not place any conduct beyond the State&#x27;s power to punish or exempt any class of defendants from a penalty. It regulates the manner in which culpability is determined. It is procedural. *Summerlin*, 542 U.S. at 353. Petitioner&#x27;s observation that the substantive exception &quot;is alive and well&quot; is accurate but beside the point.</p><p>D. *Ramos* is not a watershed rule</p><p>This is the heart of the case, and Respondent&#x27;s best ground. The Court has weighed it carefully and finds it insufficient under both prongs of *Whorton*.</p><p>1. Accuracy. Respondent must show that unanimity is &quot;necessary to prevent an impermissibly large risk of an inaccurate conviction.&quot; 549 U.S. at 418. The evidentiary showing offered is thin. Counsel points to amici statistics that of roughly 65 Louisiana exonerations, about half arose from cases eligible for nonunanimous verdicts and about a quarter involved actual nonunanimous verdicts. That figure establishes, at most, that some wrongful convictions occurred under a nonunanimous regime. It does not establish causation—that unanimity would have prevented them—nor does it supply a baseline against which to measure whether the residual risk is &quot;impermissibly large.&quot; Roughly one-quarter of exonerations arising from a rule that governed a large share of the State&#x27;s felony docket is not, without more, evidence of a systemic accuracy deficit of constitutional magnitude.</p><p>Respondent&#x27;s own comparison confirms the difficulty. Counsel invited the Court to contrast the Krash data from post-*Gideon* Florida, where some 4,500 of roughly 8,000 prisoners had been convicted without counsel, and then candidly acknowledged those numbers are &quot;radically different from what we have here.&quot; The Court agrees, and the concession is telling. *Gideon* addressed a defect that infected the entire adversarial process—a defendant facing the machinery of the State alone. Nonunanimity leaves counsel, confrontation, compulsory process, the presumption of innocence, the reasonable-doubt standard, and appellate review fully intact, and still requires ten or eleven citizens to be convinced beyond a reasonable doubt.</p><p>Respondent&#x27;s deliberation-quality argument—that permitting a 10-2 verdict truncates deliberation and dilutes the force of dissenting jurors—has genuine force as a matter of policy and was among the reasons unanimity is constitutionally required. But *Whorton* teaches that a rule may improve the quality of a proceeding without being *necessary* to prevent an impermissibly large risk of inaccuracy. And Petitioner fairly observes that unanimity&#x27;s effect on accuracy is not unidirectional: a unanimity requirement both prevents some convictions of the innocent and prevents some convictions of the guilty, producing mistrials rather than acquittals in the latter case. This Court said in *Johnson v. Louisiana*, 406 U.S. 356 (1972), that a nonunanimous verdict does not itself impugn the reasonable-doubt finding. *Ramos* overruled *Apodaca*&#x27;s holding on the Sixth Amendment; it did not rest on a finding that nonunanimous verdicts are systematically unreliable. Indeed, as Petitioner notes, the *Ramos* Court grounded its holding in text, history, and original meaning, observing that unanimity may serve purposes that &quot;evade our current notice&quot;—reasoning conspicuously untethered from functional accuracy.</p><p>2. Bedrock fairness. The second prong fares no better, and here *DeStefano* is nearly dispositive. If the incorporation of the jury-trial right itself did not warrant retroactive application, it is difficult to see how a rule governing the required margin of that jury&#x27;s verdict could. Petitioner&#x27;s formulation—that a subsidiary right cannot be watershed where the parent right is not—is stated too categorically to be accepted as a logical rule; one can imagine a component more essential than some applications of the whole. But as applied here the intuition holds, and it is confirmed by the pattern of this Court&#x27;s decisions: *Crawford* (not watershed), *Ring* (not watershed), *Mills* (not watershed), *Duncan* (not retroactive). Each of those rules, like *Ramos*, restored or clarified an important constitutional guarantee. None &quot;altered our understanding of the bedrock procedural elements essential to the fairness of a proceeding,&quot; because in each the proceeding retained its essential structure.</p><p>Respondent&#x27;s *Gideon* parallel—both decisions restored Sixth Amendment principles and compelled outlier States to honor rights they had refused to recognize—identifies a real similarity. But that similarity describes the *posture* of the decisions, not the *magnitude* of the procedural change. *Whorton* shares that posture exactly and was held not watershed.</p><p>3. The racial origins of the rule. Respondent&#x27;s most morally weighty submission is that Louisiana&#x27;s nonunanimity rule was adopted for the express purpose of diluting the votes of Black jurors, that its discriminatory effect persists, and that a regime designed to be inaccurate and unfair forfeits any claim to finality and repose. The Court does not minimize this. The historical record recited in *Ramos* is disgraceful, and it was properly central to the *stare decisis* analysis that justified overruling *Apodaca*.</p><p>But the racist pedigree of the practice *Ramos* abolished is a distinct question from the *character of the rule Ramos announced* for purposes of *Teague*. The watershed inquiry asks what the new rule does to the reliability and basic fairness of criminal proceedings going forward, not how odious the superseded practice was in its origins. Were it otherwise, the moral gravity of a constitutional violation would itself supply the retroactivity answer, and *Teague* would collapse. The Court also notes that Petitioner&#x27;s response on this point—that Louisiana&#x27;s 1974 constitutional convention re-adopted a supermajority rule in reliance on *Apodaca*, generating reliance interests—is a weaker argument than Petitioner supposes. *Ramos* itself addressed and discounted the cleansing effect of re-ratification. The Court therefore rejects Respondent&#x27;s racial-origins argument on doctrinal grounds, not because Petitioner&#x27;s reliance-interest rejoinder is persuasive.</p><p>4. Respondent&#x27;s administrability argument. Respondent&#x27;s distinction from *Batson* claims is well taken as far as it goes: a *Batson* violation requires speculation about what a properly selected jury would have done, whereas the nonunanimity of a verdict is a matter of record, and the burden would rest on the petitioner to establish it. This is the strongest practical answer to Petitioner&#x27;s floodgates rhetoric, and the Court credits it to that extent. But it answers an objection the Court has already set aside as extrinsic to the *Teague* analysis. Ease of administration is not a criterion of the watershed exception; a rule easily applied on collateral review is not thereby made bedrock.</p><p>E. Summary</p><p>*Ramos* announced a new rule of criminal procedure. It is not substantive. It does not satisfy either prong of the watershed exception, and it must satisfy both. Under *Teague*, it therefore does not apply to convictions that became final before April 20, 2020, on federal collateral review.</p><p>The Court observes, finally, what this holding does not say. It does not say that Edwards&#x27;s juries were properly constituted under the Sixth Amendment as the Constitution is now correctly understood; they were not. It does not say that the rule Edwards was tried under was anything but a constitutional error with an ignoble history. It says only that the writ of habeas corpus, as this Court has construed it, is not an instrument for retrying final judgments under law announced after they became final, save in the two narrow circumstances the Court has identified, neither of which obtains here. Whether Louisiana, by legislation or executive clemency, should afford relief to those convicted under its former regime is a question committed to that State, and nothing in this ruling forecloses it.</p><p>IV. Disposition</p><p>The judgment of the Court of Appeals for the Fifth Circuit denying a certificate of appealability is AFFIRMED. *Ramos v. Louisiana* does not apply retroactively to cases on federal collateral review.</p><p>RULING: Petitioner</p>", "error": "At the time of Edwards’s trial, Louisiana permitted conviction by a 9-3 jury vote.", "truth": "At the time of Edwards’s trial, Louisiana permitted conviction by a 10-2 jury vote.", "nmarks": 2}, {"id": "C036", "text": "<p>Procedural History</p><p>Benjamin Robers pleaded guilty in federal district court to one count of conspiracy to commit wire fraud arising from a mortgage-fraud scheme. Robers obtained two mortgage loans through material misrepresentations, made no payments on the loans, and allowed the properties to enter foreclosure. The lenders later sold the foreclosed homes.</p><p><mark class='err' data-n='1'>The District Court ordered restitution under the Mandatory Victims Restitution Act (MVRA), calculating the lenders’ losses as the unpaid loan amounts less the amounts the lenders realized when the homes were resold.</mark><mark class='tru' data-n='2'> The court included certain attorney fees and other expenses in its initial calculation.</mark><mark class='tru' data-n='3'> On appeal, the Court of Appeals for the Seventh Circuit affirmed the use of the resale proceeds as the pertinent offset, vacated the inclusion of attorney fees and other expenses, and remanded for entry of a corrected restitution order.</mark> Robers now seeks review of the offset question, contending that restitution instead should be reduced by the homes’ fair-market values when the lenders obtained title through foreclosure.</p><p>Governing Law</p><p>The MVRA requires restitution to victims of specified offenses, including offenses against property committed by fraud. 18 U.S.C. § 3663A. Where an offense results in the loss of property, the statute directs the defendant either to return the property or, if return is impossible, impracticable, or inadequate, to pay an amount equal to the value of the property on the date of damage, loss, or destruction, less “the value (as of the date the property is returned) of any part of the property that is returned.” § 3663A(b)(1).</p><p>Restitution under the MVRA is compensatory, not punitive. It must be tied to the victim’s actual loss caused by the offense and may not create a windfall. But the statute’s return-of-property offset concerns return of the property that the victim lost through the offense. The relevant question is therefore what property the lenders lost as a result of Robers’s fraud.</p><p>Application</p><p>The lenders’ property lost through Robers’s fraud was money: the loan proceeds disbursed on the basis of his fraudulent applications and promises to repay. Robers did not obtain the lenders’ homes. He obtained loan funds used to acquire homes that secured those loans. Thus, when foreclosure transferred title to the lenders, the lenders received real property, not a return of any portion of the money they had lost.</p><p>The lenders recovered a portion of their lost money only when they sold the homes and received sale proceeds. Those proceeds directly reduce the lenders’ uncompensated loss and therefore properly offset restitution. The District Court’s calculation—loan amount less the amount recovered from resale—accordingly implements the statutory command to restore the victims without overcompensating them.</p><p>Robers’s contrary position relies on the lenders’ security interests and their contractual right to foreclose. Those interests are relevant to the parties’ lending arrangement, but they do not alter the nature of the property lost through the fraud. A security interest gives the lender recourse to collateral; it does not transform the collateral itself into the loan proceeds that the lender lost. Nor does foreclosure itself establish the amount of money the lender recovered. The actual monetary recovery is ordinarily established when the collateral is converted to money through sale.</p><p>This rule also reasonably places the ordinary risk of post-foreclosure market fluctuations on the defendant whose fraud caused the default, foreclosure, and resulting liquidation process. The record does not establish that the lenders engaged in improper or bad-faith disposition of the properties. If a lender’s conduct independently caused avoidable loss, or if the disposition were not arm’s length, a district court could address that evidentiary issue in determining actual loss. But no such basis appears here.</p><p><mark class='tru' data-n='4'>The respondent’s assertion that the court of appeals required valuation at foreclosure is inconsistent with the stated procedural record, which provides that the Seventh Circuit affirmed the use of the homes’ resale amounts as the offset while vacating unrelated attorney fees and other expenses.</mark> In any event, foreclosure-title valuation is not the measure prescribed by § 3663A for the return of loan money.</p><p>Disposition</p><p>The judgment of the Court of Appeals is affirmed insofar as it approves calculating restitution by subtracting the amounts the lenders received from the resale of the foreclosed properties from the fraudulent loan amounts.<mark class='tru' data-n='5'> The remand for recalculation excluding attorney fees and other expenses remains undisturbed.</mark></p><p>RULING: Petitioner</p>", "error": "The Seventh Circuit reversed the district court’s restitution ruling and remanded with instructions to value the houses at foreclosure.", "truth": "The Seventh Circuit affirmed the district court's holding in part, vacated attorney fees and other expenses from the restitution award, and remanded for entry of a corrected restitution sum.", "nmarks": 5}, {"id": "C037", "text": "<p>IN THE SUPREME COURT OF THE UNITED STATES</p><p>*No. 07-463 — Summers, et al., Petitioners, v. Earth Island Institute, et al., Respondents*</p><p>---</p><p>I. Procedural History</p><p><mark class='tru' data-n='1'>Respondent Earth Island Institute and other environmental organizations brought suit in the United States District Court for the Eastern District of California, challenging Forest Service regulations issued in 2003 that limited notice, comment, and administrative appeal opportunities for certain categorically excluded site-specific activities in national forests.</mark> Respondents claimed the regulations violated the Forest Service Decision Making and Appeals Reform Act (ARA), Pub. L. 102-381, which directs the Forest Service to establish an administrative appeals process. Respondents&#x27; suit originally included a challenge to a specific project — the Burnt Ridge timber sale in the Sequoia National Forest — but that claim was dismissed when the parties settled and the sale was withdrawn. What remained was a free-standing, facial challenge to the regulations themselves.</p><p><mark class='tru' data-n='2'>The district court entered judgment for respondents on the merits, and the Court of Appeals for the Ninth Circuit affirmed, reasoning that if Congress had intended to permit the Forest Service to dispense with notice, comment, and appeal for categorically excluded activities, it would not have enacted the ARA at all.</mark><mark class='err' data-n='3'> The Ninth Circuit went further and imposed a nationwide injunction against application of the regulations.</mark></p><p><mark class='tru' data-n='4'>Petitioner, the Forest Service, sought certiorari, arguing that the Ninth Circuit had overstepped the limits of judicial power under Article III and the Administrative Procedure Act, and that respondents lacked standing to maintain a facial challenge to the regulations absent a live dispute over a concrete application of them.</mark> We granted certiorari.</p><p>II. Governing Law</p><p>Article III of the Constitution confines the federal judiciary to deciding genuine cases and controversies. That restriction requires, at the irreducible minimum, that a plaintiff demonstrate: (1) an injury in fact that is concrete and particularized and actual or imminent, not conjectural or hypothetical; (2) a causal connection between that injury and the challenged conduct; and (3) likelihood that a favorable decision will redress the injury. *Lujan v. Defenders of Wildlife*, 504 U.S. 555, 560–561 (1992). These requirements are not mere pleading formalities; they must be supported at each stage of the litigation with the manner and degree of proof commensurate with that stage. Id. at 561.</p><p>It is well established that a plaintiff who alleges a procedural injury — the deprivation of a procedural right that protects his concrete interests — still cannot proceed on that basis alone. The procedural injury must be tethered to a concrete interest that is, or imminently will be, adversely affected by the agency action taken without the prescribed procedure. A party cannot manufacture standing merely by asserting the existence of a procedure to which he is entitled; some day he may suffer an injury from the absence of that procedure, but &quot;some day&quot; is not &quot;imminent.&quot; Past exposure to unlawful conduct does not, standing alone, establish a live controversy for prospective relief; the plaintiff must show a real and immediate threat of future violation. *City of Los Angeles v. Lyons*, 461 U.S. 95 (1983).</p><p>This Court has long recognized that abstract, generalized grievances — the interest of every citizen in having the government obey the law — do not suffice. And where a party challenges agency action, the APA authorizes review at the behest of a person &quot;adversely affected or aggrieved by agency action,&quot; 5 U.S.C. § 702, which the Court has construed to mean final agency action applied to the challenger. A broadly framed regulation, standing alone, is ordinarily not a fit subject for judicial invalidation until it has been &quot;reduced to manageable proportions&quot; by concrete application to the challenger&#x27;s particular circumstances. *Lujan v. National Wildlife Federation*, 497 U.S. 871, 891 (1990).</p><p>With respect to remedies, a court&#x27;s equitable power is exercised in accordance with traditional principles: relief is tailored to the injury of the plaintiff before the court, not extended wholesale to persons, places, and projects not before it. *Elliott v. Arcenesaux*; *Mendoza v. Tide Water Ticket Service* principles of preclusion and the familiar rule that a judgment binds only parties and privies reflect the same limitation.</p><p>III. Application to the Record</p><p>The dispositive question is whether respondents possess standing to maintain a free-standing challenge to the regulations after the settlement of their only concrete, site-specific dispute — the Burnt Ridge timber sale — removed that dispute from the case. We hold they do not.</p><p>First, respondents&#x27; standing with respect to the Burnt Ridge project expired with the settlement. At the time the complaint was filed, the declarants alleged concrete injuries flowing from the application of the regulations to that timber sale: they were denied notice, comment, and appeal with respect to a project in a forest they used and enjoyed. Those allegations would have supported standing to challenge the regulations as applied to that project. But the sale was withdrawn and the challenge to it dismissed. Past injury cannot sustain a claim for prospective relief. Whatever injury the declarants suffered from the Burnt Ridge process has been remedied, and respondents may not rest a live controversy on the ghost of a settled one.</p><p>Second, the remaining declarations are insufficient to establish an injury in fact that is actual or imminent with respect to any application of the regulations. The principal declaration relied upon by the courts below speaks in generalities: that the declarant is interested in national forests, that he monitors Forest Service activity, and that he has commented on or been affected by timber projects in particular forests. The only specific projects identified are timber projects, while the relief granted sweeps in ten categories of activities in every national forest nationwide — including categories and forests as to which the declarant claims no concrete interest whatsoever. A desire to have the government act lawfully in the abstract, unaccompanied by a specific and imminent plan to use a particular site that will be affected by the challenged procedures, is precisely the generalized grievance that Article III forecloses. That respondents&#x27; declarants are professional or dedicated amateur monitors of Forest Service activity does not convert their professional interest in the legality of agency procedures into a personal injury; nor does the availability of a Schedule of Proposed Actions or the asserted refusal of an organization to subscribe to local newspapers.</p><p>Third, the asserted &quot;procedural injury&quot; cannot carry the case standing alone. Respondents argue, in effect, that the ARA itself confers a judicially enforceable right to notice, comment, and appeal, and that deprivation of that right is injury enough. But the procedural right must be connected to a concrete, threatened injury — a project in a place the plaintiff uses, at a time the plaintiff will be there or will be deprived of the procedural opportunity with respect to that project. No declarant identifies any specific categorically excluded project, beyond the now-settled Burnt Ridge sale, that will imminently affect his interests. Without that nexus, the injury remains conjectural.</p><p>Fourth, even were we to assume some concrete interest, the remedy awarded cannot stand.<mark class='err' data-n='5'> The nationwide injunction entered by the Court of Appeals extends to every national forest and every project within ten categories, on the strength of declarations that at most support the interests of individual declarants in particular forests.</mark> Equitable relief is not a blank check; it must correspond to the injury of the plaintiff actually before the court. A court of equity does not &quot;reach out&quot; and extend its ruling to people, forests, and projects that are not before it. To the extent the APA requires a court to &quot;set aside&quot; an unlawful regulation, that command presupposes a plaintiff with standing to challenge it, and a proper challenge ordinarily arises — and is properly framed — when the regulation is applied to the challenger&#x27;s circumstances.</p><p>Finally, we address respondents&#x27; reliance on the proposition that this Court has never rejected a facial challenge to a published regulation that is applied on an ongoing basis. That observation proves too much: the APA&#x27;s allowance of facial challenges to promulgated regulations has never displaced Article III&#x27;s independent requirement of a concrete and imminent injury, and the cases respondents cite either involved plaintiffs suffering present deprivation of benefits or rights as to themselves, or are otherwise inapposite. The stipulated fact that the regulations are applied nationally on an ongoing basis establishes only that unlawful applications may occur; it does not establish that any declarant will imminently suffer one.</p><p>We do not today hold that the regulations are valid, nor that they may never be challenged. A person who is denied notice, comment, or appeal with respect to a specific project that affects his concrete interests may challenge the application of the regulations to that project in a proper forum, and the validity of the regulations can be tested in that concrete setting, where the dispute is narrowed to manageable proportions.</p><p>IV. Disposition</p><p><mark class='tru' data-n='6'>Because respondents lack Article III standing to maintain a free-standing challenge to the Forest Service regulations in the absence of a live dispute over the application of those regulations to their concrete interests, the judgment of the Court of Appeals for the Ninth Circuit is reversed, and the case is remanded with instructions to dismiss the claim for want of jurisdiction.</mark></p><p>It is so ordered.</p><p>RULING: Petitioner</p>", "error": "The district court denied injunctive relief and entered only a declaratory judgment, while the Ninth Circuit imposed the nationwide injunction in the first instance.", "truth": "The district court found for Earth Island and issued a nationwide injunction against the Forest Service; the Ninth Circuit affirmed that ruling.", "nmarks": 6}, {"id": "C038", "text": "<p>OPINION OF THE COURT</p><p>I. Procedural History</p><p>Respondent Adaucto Chavez-Meza pleaded guilty in 2013 to conspiracy to distribute and possession with intent to distribute methamphetamine. His advisory Guidelines range was 135 to 168 months. The Government recommended a sentence at the bottom of that range, and the district court imposed the recommended 135-month term, stating that it had considered the applicable sentencing factors.</p><p>In 2014 the Sentencing Commission retroactively lowered the offense levels applicable to Chavez-Meza&#x27;s drug quantities, producing an amended range of 108 to 135 months. Chavez-Meza moved for a reduction under 18 U.S.C. § 3582(c)(2), asking the court to impose 108 months — the bottom of the amended range — on the theory that the court had placed him at the bottom of the original range and should do the same again. The same judge who had presided at the original sentencing granted the motion in part, reducing the sentence to 114 months. The court memorialized its decision on the standard Administrative Office form, which recited that the court had acted &quot;after considering the motion&quot; and had &quot;tak[en] into account the policy statement set forth at USSG § 1B1.10 and the sentencing factors set forth in 18 U.S.C. § 3553(a).&quot;</p><p>Chavez-Meza appealed, contending that the district court was obliged to explain how it weighed the § 3553(a) factors in arriving at 114 rather than 108 months. The Court of Appeals for the Tenth Circuit affirmed, holding that the form order was a sufficient statement of reasons in a § 3582(c)(2) proceeding.[^1]</p><p>[^1]: We note that counsel for the respondent, in the excerpts submitted to this Court, twice describes the Tenth Circuit as having &quot;reversed the district court&#x27;s sentence-reduction order.<mark class='tru' data-n='1'>&quot; That characterization is irreconcilable with the record before us, which establishes that the Tenth Circuit affirmed.</mark> We take the record as we find it.</p><p>We granted review to resolve an acknowledged conflict among the Courts of Appeals.<mark class='err' data-n='2'> The Sixth, Eighth, Ninth, and Eleventh Circuits require a district court to supply some explanation for a non-proportional reduction when the reasons are not otherwise apparent from the record; the Fourth, Fifth, and Tenth Circuits hold the form recitation sufficient.</mark><mark class='err' data-n='3'> The parties before us have taken the two sides of that conflict: Petitioner defends the sufficiency of the form order, and Respondent urges that a district court must articulate not merely that it considered the statutory factors but how those factors produced the chosen number.</mark></p><p>II. Governing Law</p><p>Three bodies of law converge here.</p><p>First, the statutory text. Section 3553(c) provides that &quot;[t]he court, at the time of sentencing, shall state in open court the reasons for its imposition of the particular sentence,&quot; with additional specificity required for sentences outside the range or for ranges exceeding 24 months. Congress imposed no comparable command in § 3582(c)(2). That provision authorizes a court to reduce a term of imprisonment for a defendant sentenced under a subsequently lowered range &quot;after considering the factors set forth in section 3553(a) to the extent that they are applicable, if such a reduction is consistent with applicable policy statements issued by the Sentencing Commission.&quot; Congress thus directed *consideration*; it did not direct *articulation*. The contrast with § 3553(c) — a neighboring provision in the same sentencing architecture — is a deliberate one that we are not free to erase.</p><p>Second, the nature of the proceeding. In *Dillon v. United States*, 560 U.S. 817 (2010), this Court held that § 3582(c)(2) does not authorize a plenary resentencing; it establishes a narrow, congressionally circumscribed exception to the finality of judgments, in which the court&#x27;s discretion is confined to a range fixed by the Commission&#x27;s retroactive amendment and the § 1B1.10 policy statement. Because the proceeding is not a sentencing, the procedural apparatus Congress built around original sentencings — including § 3553(c) and the Sixth Amendment analysis of *Booker* — does not transfer wholesale. It would be anomalous to demand *more* explanatory rigor in this abbreviated, second-look proceeding than the law demands when a defendant&#x27;s liberty is first adjudicated.</p><p>Third, the standard governing explanation generally. *Rita v. United States*, 551 U.S. 338 (2007), supplies the governing rule: &quot;The sentencing judge should set forth enough to satisfy the appellate court that he has considered the parties&#x27; arguments and has a reasoned basis for exercising his own legal decision-making authority.&quot; But *Rita* immediately adds the qualification that defeats any categorical rule: &quot;when a judge decides simply to apply the Guidelines to a particular case, doing so will not necessarily require lengthy explanation.&quot; The amount of explanation required is *context-dependent*. Where a judge acts within the range and in the ordinary run of cases, a brief statement suffices; where the judge does something unusual, or where a party presents substantial, non-frivolous arguments for a particular disposition that the record leaves unaddressed, more is required.</p><p>Respondent leans heavily on *United States v. Taylor*, 487 U.S. 326 (1988). *Taylor* does not carry the weight placed on it. It involved a binary choice — dismissal with or without prejudice under the Speedy Trial Act — as to which the statute enumerated specific factors and as to which no range of equally lawful outcomes existed. And, as this Court&#x27;s concluding analysis in *Taylor* makes plain, the decision turned on the district court&#x27;s reliance on assertions unsupported by the record. *Taylor* stands for the proposition that appellate review must be meaningful, not for the proposition that every discretionary selection from a lawful range must be accompanied by a factor-by-factor exegesis.</p><p>We therefore reject both of the absolutes the parties press at the margins. A district court is not categorically required to explain *how* it applied the § 3553(a) factors in every § 3582(c)(2) proceeding. Nor is the form order a talisman that forecloses review in every case. The question is whether the record as a whole — the form order read together with the original sentencing proceeding, the parties&#x27; submissions, and the presentence materials — permits a reviewing court to satisfy itself that the judge considered the relevant factors and had a reasoned basis for the sentence chosen.</p><p>III. Application</p><p>Measured against that standard, the district court&#x27;s explanation was adequate.</p><p>The judge who ruled on the § 3582(c)(2) motion was the same judge who imposed the original sentence. He was familiar with the offense conduct, the presentence report, the drug type and quantity that drove the range, and the parties&#x27; positions. He had before him Chavez-Meza&#x27;s motion asking for 108 months and the Government&#x27;s response. He granted a substantial reduction — 21 months — and landed at 114 months, within the bottom quartile of the amended 108-to-135-month range. The form order certifies consideration of both § 1B1.10 and § 3553(a), and we presume, as we must absent contrary indication, that a federal judge who says he considered the statutory factors did so.</p><p>Nothing in this record suggests otherwise. This was, as Petitioner fairly describes it, a routine case. No new information was presented; no contested factual assertion drove the outcome; the court relied on nothing unsupported by the record (the vice condemned in *Taylor*); and the court did not go outside the amended range in either direction. The sole disparity Respondent identifies is that the judge had selected the bottom of the original range but not the bottom of the amended range. But § 3582(c)(2) confers discretion over where within the amended range to land, and a judge may reasonably conclude that the new floor understates the seriousness of the offense even while concluding that a substantial reduction is warranted. A six-month divergence from the defendant&#x27;s preferred figure, within a range every point of which is lawful, is not the sort of unexplained anomaly that renders appellate review impossible.</p><p>Respondent&#x27;s own position concedes as much in principle. He disclaims any entitlement to a proportional reduction and acknowledges that in the &quot;mine-run&quot; case a silent order tracking the original sentence&#x27;s relative position would be sufficient, with more required only where a party has advanced non-frivolous arguments for a different result. That is essentially the *Rita* standard, and it is satisfied here: Respondent&#x27;s argument was simply that he should receive the same relative position in the new range. The district court, with full knowledge of the case, declined. The reason is apparent from the record — the judge thought 114 months, not 108, sufficient but not greater than necessary — and we need no further recitation to review that judgment.</p><p>Respondent&#x27;s remaining concern is systemic: that Petitioner&#x27;s rule would immunize an entire class of orders from appellate review. It would not.<mark class='err' data-n='4'> A form order does not insulate a district court that exceeds the amended range, relies on impermissible or unsupported considerations, ignores substantial arguments pressed by a party, or arrives at a figure inexplicable on the record before it.</mark> In those cases the reviewing court may remand for an explanation. Abuse-of-discretion review retains its content. What it does not require is that a judge, having been told by Congress to *consider* certain factors in an abbreviated proceeding, enumerate each of them — fifteen in § 3553(a), plus those in the policy statement — and assign each a weight.</p><p>The question presented is answered as follows: a district court need not, as a categorical matter, explain how it applied the § 3553(a) factors in declining to grant a proportional reduction under § 3582(c)(2). The adequacy of the court&#x27;s explanation depends on the circumstances, and a form order reciting consideration of § 1B1.10 and § 3553(a) may suffice where, as here, the record supplies the context necessary for meaningful review.</p><p>IV. Disposition</p><p><mark class='tru' data-n='5'>The judgment of the Court of Appeals for the Tenth Circuit is affirmed.</mark></p><p>RULING: Petitioner</p>", "error": "The Tenth Circuit reversed the district court’s sentence-reduction order.", "truth": "The Tenth Circuit affirmed the district court’s sentence-reduction order.", "nmarks": 5}, {"id": "C039", "text": "<p>Kahler v. Kansas — Opinion of the Court</p><p>I. Procedural History</p><p>Petitioner Kraig Kahler was convicted of capital murder for the 2009 killings of his wife, two daughters, and his wife&#x27;s grandmother and was sentenced to death. At trial, defense and prosecution experts agreed that Kahler suffered from major depressive disorder and exhibited obsessive-compulsive, borderline, paranoid, and narcissistic personality tendencies; the defense expert testified that Kahler had &quot;completely lost control&quot; and did not make a rational choice to kill. Kansas law, however, bars a jury from considering mental disease or defect except insofar as it negates the mental state required as an element of the offense charged; it renders irrelevant whether the defendant could know the nature and quality of his acts or distinguish right from wrong.<mark class='err' data-n='1'> On direct appeal, the Kansas Supreme Court affirmed the conviction.</mark> Petitioner sought review in this Court on the question whether a state may abolish the insanity defense without violating the Eighth and Fourteenth Amendments. We granted certiorari.</p><p>II. Governing Law</p><p>Two bodies of law frame the question.</p><p>Due Process. The Fourteenth Amendment forbids a state to criminalize conduct without satisfying &quot;principles of justice so rooted in the traditions and conscience of our people as to be ranked as fundamental.&quot; *Montana v. Egelhoff*, 518 U.S. 37 (1996); *Clark v. Arizona*, 548 U.S. 735 (2006). A rule is fundamental only if it is deeply rooted in history and tradition. States, by contrast, have historically enjoyed broad discretion to define the elements of crimes and the defenses available in their criminal codes, and this Court has repeatedly declined to constitutionalize any particular formulation of the criminal law. In *Powell v. Texas*, 392 U.S. 514 (1968), this Court warned that &quot;nothing would be less fruitful&quot; than prescribing a rigid constitutional rule on matters where the States have historically exercised judgment. In *Leland v. Oregon*, 343 U.S. 790 (1952), the Court upheld a state rule requiring the defendant to prove insanity beyond a reasonable doubt under a right-from-wrong test, recognizing the States&#x27; latitude in calibrating insanity doctrine. And *Clark v. Arizona* confirmed that a state may restrict, though perhaps not abolish, the consideration of mental-health evidence.</p><p>Eighth Amendment. Punishment may be cruel and unusual if it is disproportionate to the defendant&#x27;s culpability. But this Court has never held that capital punishment of one whose mental illness did not negate the statutory mental state is categorically disproportionate; the Amendment requires individualized consideration of relevant mitigating evidence, which mental illness is, and Kansas permits such consideration at sentencing.</p><p>III. Application</p><p>A. Due Process. Petitioner argues that the common-law tradition of exempting the insane from criminal liability is deeply rooted, tracing the right-from-wrong inquiry from the sixteenth century through *M&#x27;Naghten&#x27;s Case* (1843), and that Kansas&#x27;s mens rea-only approach eliminates any mechanism for a jury to assess moral capacity. Petitioner&#x27;s historical account is not without force. There is a genuine and longstanding common-law tradition of treating severe mental illness as a basis for exculpation, and Kansas does not contest that some consideration of mental illness is required. Petitioner&#x27;s strongest point is that the Fourteenth Amendment, at minimum, prevents a state from making mental illness categorically irrelevant to criminal responsibility.</p><p>But petitioner&#x27;s argument proves too much. The historical record does not establish a single, settled test of insanity so rooted in tradition as to be constitutionally required. The right-from-wrong formulation that petitioner champions was contested from its inception: English authorities and American courts used divergent formulations, including wild-beast and &quot;vicious will&quot; formulations, and the Model Penal Code later adopted still others (cognitive, volitional, and product tests). The test petitioner would constitutionalize was, in its canonical form, articulated only in the 1840s, and jurisdictions have long disagreed about its content and scope. What is deeply rooted is the general principle that mental condition may bear on criminal responsibility; the specific mechanism by which a state accounts for that principle is a matter of historical state discretion. Kansas has not disregarded mental illness altogether. Its approach retains the traditional concern in the form most tightly connected to criminal culpability in a mens rea system: a defendant who, because of mental disease, cannot form the intent the statute requires is not guilty of that crime. That regime differs from the one most states use, and it may be harsher in application, but difference from the majority rule is not the constitutional test. Forty-eight states do it one way; that establishes a consensus about policy, not a rule of fundamental law. The Court&#x27;s precedents—*Egelhoff*, *Leland*, *Powell*—consistently defer to state legislative judgment on the definition of crimes and defenses absent a clear constitutional command, and petitioner identifies no precedent requiring a particular insanity defense.</p><p>B. Eighth Amendment. Petitioner&#x27;s Eighth Amendment argument reduces to the same substantive claim—unshakable culpability for the mentally ill—which fails for the reasons above. Kansas&#x27;s statute does not bar consideration of mental illness at sentencing; the sentencer may weigh Kahler&#x27;s documented mental illness as mitigating evidence, and the record reflects that this evidence was presented. Culpability for Eighth Amendment purposes was assessed with that mitigation available. Petitioner&#x27;s suggestion that any conviction of an insane person is per se disproportionate would constitutionalize precisely the moral-capacity rule rejected above.</p><p>C. Evaluation of the briefs. Petitioner&#x27;s counsel argued with skill from history and tradition, and correctly identified the general common-law commitment to excusing the insane. However, counsel overstates the historical consensus: the record here shows competing tests, contested pedigree, and long-standing state discretion—features inconsistent with a rule &quot;deeply rooted&quot; enough to displace legislative choice. Counsel&#x27;s concession that a &quot;guilty but insane&quot; regime with equivalent protections would be acceptable undermines the claim that a particular verdict mechanism, as opposed to humane treatment, is constitutionally compelled. Respondent&#x27;s counsel likewise argued capably, invoking *Powell*, *Leland*, and state discretion. Respondent&#x27;s weaker points—which should not be mistaken for holdings—include the suggestion that Kansas&#x27;s rule is simply &quot;consistent with the cognitive test&quot; and that negating mens rea is fully equivalent to an insanity defense. It is not: a defendant who forms intent but cannot distinguish right from wrong is convicted under Kansas law while he would be acquitted in most states. The Court&#x27;s ruling rests not on the equivalence of the two regimes, but on the absence of a constitutional requirement that a state adopt the majority&#x27;s regime.</p><p>IV. Disposition</p><p>The question presented is answered in the affirmative: a state may abolish the insanity defense, so long as mental illness remains relevant to the mens rea the state&#x27;s criminal law requires, without violating the Eighth and Fourteenth Amendments.<mark class='err' data-n='2'> The judgment of the Kansas Supreme Court affirming petitioner&#x27;s conviction is affirmed in relevant part, and the case is remanded for further proceedings consistent with this opinion.</mark></p><p>RULING: Respondent</p>", "error": "The Kansas Supreme Court affirmed Kahler’s conviction but vacated his death sentence.", "truth": "The Kansas Supreme Court affirmed Kahler’s conviction and death sentence.", "nmarks": 2}, {"id": "C040", "text": "<p>The question is whether a private nonprofit corporation that operates public-access cable channels is a state actor subject to constitutional liability when it restricts an individual’s access to those channels. We hold that, on the facts presented, it is not.</p><p>I. Procedural History</p><p>New York regulations require cable systems with at least 36 channels to provide at least one full-time channel for public-access use. The channel must be available to the public on a first-come, first-served, nondiscriminatory basis. In granting cable franchises for Manhattan, New York City required the cable operator to provide four public-access channels. Those channels are overseen by the Manhattan Community Access Corporation, commonly known as the Manhattan Neighborhood Network (MNN).</p><p>Petitioners DeeDee Halleck and Jesus Papoleto Melendez had a contentious relationship with MNN. In August 2013, MNN suspended both individuals from all MNN services and facilities.<mark class='err' data-n='1'> They then sued MNN, several MNN employees, and the City of New York, alleging that the suspensions violated their First Amendment rights.</mark></p><p><mark class='err' data-n='2'>The District Court dismissed the First Amendment claims for lack of state action.</mark> It reasoned that MNN was a private entity and that the City retained authority to appoint only two of MNN’s thirteen directors. The court therefore concluded that MNN had not created a government-controlled public forum and was not acting on behalf of the State.</p><p><mark class='tru' data-n='3'>A divided panel of the United States Court of Appeals for the Second Circuit affirmed the dismissal as to the City but reversed as to MNN and its employees.</mark> The Court of Appeals concluded that the City had delegated to MNN the traditionally public function of administering and regulating speech in the public-access forum. MNN sought review in this Court.</p><p>II. Governing Law</p><p>The First Amendment restricts governmental conduct. It generally does not regulate conduct by private individuals or organizations. Accordingly, a plaintiff alleging a constitutional violation must show that the challenged conduct is fairly attributable to the government.</p><p>The Court has recognized several circumstances in which private conduct may constitute state action. Those circumstances include when the government compels or significantly encourages the challenged conduct, when the government and the private party act jointly, when the government is entwined with the private entity’s management or control, and when the private entity performs a function that is traditionally and exclusively reserved to the government.</p><p>The public-function doctrine is narrow. The fact that a private entity performs a function that serves the public, is subject to government regulation, or is undertaken pursuant to government authorization does not make the entity a state actor. Nor does the mere fact that the entity operates a forum that is open to the public. The relevant inquiry is whether the private entity has exercised a function that has traditionally and exclusively been performed by the government.</p><p>The public-forum doctrine does not alter that threshold inquiry. A forum may be public for purposes of determining the government’s obligations under the First Amendment without the private operator of that forum becoming the government. Likewise, government regulation requiring nondiscriminatory access does not itself convert the regulated private party’s decisions into state action.</p><p>III. Application</p><p>MNN’s operation of public-access channels does not satisfy any recognized state-action test.</p><p>First, the City did not compel or coerce the suspensions challenged here. New York law and the City’s franchise arrangements required the availability of public-access channels. They did not require MNN to suspend Halleck or Melendez, nor did they direct MNN how to resolve the dispute. The record contains no allegation that the City instructed MNN to take the challenged action.</p><p>Second, there is no allegation that the City and MNN acted jointly in suspending petitioners. MNN is a private nonprofit corporation. The City is not a party to the grant agreement under which MNN operates, and the City does not control MNN’s day-to-day decisions concerning its services and facilities.</p><p>Third, the structure of MNN confirms that it is not a government-controlled entity. The City has authority to appoint only two of MNN’s thirteen directors. That limited appointment power does not establish governmental control over MNN or its challenged conduct.</p><p>Finally, operating a public-access cable channel is not a function traditionally and exclusively performed by the government. Governments have long regulated communications and have sometimes made property available for public expression. But regulation of speech and provision of a venue for speech are not functions exclusively reserved to government. Private entities routinely operate communications platforms and make decisions about access to them. The fact that New York required cable systems to provide public-access channels does not transform MNN into the government.</p><p>Petitioners contend that the first-come, first-served and nondiscrimination requirements make MNN’s channels a public forum and therefore subject MNN to the First Amendment. That argument conflates two distinct questions. The requirements may limit the manner in which the public-access channels must be administered, and a government entity operating such a forum would be bound by the First Amendment. But those requirements do not answer the antecedent question whether MNN is a state actor. A private entity does not become the government merely because it opens property or a communications platform to the public, or because its access rules are imposed or approved by law.</p><p>Nor does *Denver Area Educational Telecommunications Consortium v. FCC* compel a different result. That decision addressed the constitutionality of federal regulation concerning sexually explicit programming on leased and public-access cable channels. It did not hold that every private operator of a public-access channel is a state actor. Whatever significance *Denver Area* gives to the character of public-access channels, it does not displace the settled rule that a private party’s operation of a publicly accessible forum is not, without more, governmental action.</p><p>Because MNN was not acting under color of state law, its suspension of Halleck and Melendez did not violate the First Amendment. The same conclusion applies to the MNN employees sued in connection with that decision.<mark class='err' data-n='4'> The Court of Appeals correctly left undisturbed the dismissal of the claims against the City, and it should likewise have affirmed the dismissal of the claims against MNN and its employees.</mark></p><p>IV. Disposition</p><p><mark class='err' data-n='5'>The judgment of the Court of Appeals is reversed insofar as it allowed the First Amendment claims against MNN and its employees to proceed.</mark><mark class='tru' data-n='6'> The judgment is affirmed insofar as it dismissed the claims against the City of New York.</mark> The case is remanded for further proceedings consistent with this opinion.</p><p>RULING: Petitioner</p>", "error": "The Second Circuit affirmed the district court’s dismissal of the First Amendment claim as to MCAC (MNN) and its employees.", "truth": "The Second Circuit affirmed the dismissal as to the City of New York but reversed as to MCAC (MNN) and its employees.", "nmarks": 6}, {"id": "C041", "text": "<p>RULING</p><p>I. Procedural History</p><p><mark class='tru' data-n='1'>Lanell Williams-Yulee was a candidate for County Court Judge in Hillsborough County, Florida.</mark> During her campaign, she personally solicited campaign contributions through a mass mailing and a website posting.<mark class='tru' data-n='2'> The Florida Bar filed a complaint alleging that this personal solicitation violated Canon 7C(1) of the Florida Code of Judicial Conduct, as incorporated into the rules regulating The Florida Bar.</mark> A referee was appointed and recommended a public reprimand.<mark class='err' data-n='3'> Williams-Yulee contested the constitutional sufficiency of the canon before the Supreme Court of Florida, which rejected her First Amendment challenge, sustained the finding of a violation, and approved the referee&#x27;s recommended discipline.</mark><mark class='err' data-n='4'> Williams-Yulee now brings the case to this Court, arguing that the personal-solicitation ban violates her right to free speech under the First Amendment.</mark> The Bar, as petitioner in support of the judgment below, defends the canon&#x27;s constitutionality.</p><p>We note at the outset one procedural inaccuracy in the respondent&#x27;s submission: counsel asserts that the Supreme Court of Florida &quot;reversed the referee and held Canon 7C(1)&#x27;s personal-solicitation ban unconstitutional.&quot; That statement is contrary to the record before us. The court below upheld the canon and found a violation; it is the respondent, Williams-Yulee, who lost below and presses the constitutional claim here. We evaluate the merits notwithstanding counsel&#x27;s mischaracterization.</p><p>II. Governing Law</p><p>The First Amendment commands that government shall make no law abridging the freedom of speech. Judicial candidates retain First Amendment rights, and states may not impose speech restrictions on candidates for judicial office without satisfying the appropriate standard of review. *Republican Party of Minnesota v. White*, 536 U.S. 765 (2002). At the same time, the Court has long recognized that the judicial office differs in kind from the legislative and executive offices: the judiciary&#x27;s legitimacy depends on both the reality and the appearance of impartiality and independence from influence.</p><p>In the campaign-finance context, the Court has distinguished between contributions and expenditures. *Buckley v. Valeo*, 424 U.S. 1 (1976); *McConnell v. FEC*, 540 U.S. 93 (2003). Contribution limits implicate speech indirectly — the solicitation or making of a contribution has communicative value principally in enabling the candidate to disseminate a message — and therefore are reviewed under a less exacting, closely drawn standard, provided the state demonstrates a sufficiently important interest. *Buckley* identified the prevention of quid pro quo corruption, and its appearance, as interests of the highest order in this domain. And in the charitable-solicitation cases, *Schaumburg v. Citizens for a Better Environment*, 444 U.S. 620 (1980), and *Riley v. National Federation of the Blind*, 487 U.S. 781 (1988), the Court recognized that requests for money are intertwined with protected advocacy and cannot be suppressed absent a showing of real harm.</p><p>The question here is how these lines of authority apply to a rule that does not limit the amount a contributor may give, but instead prohibits the *candidate for judicial office personally* from asking for the money.</p><p>III. Application</p><p>A. Nature of the restriction. The canon is a content-based restriction on speech: it singles out the personal request for a campaign contribution. It does not, however, restrict the content of any other campaign communication. As the petitioner concedes, and as the record confirms, the candidate remains free to discuss her qualifications, positions, and the campaign itself, and a campaign committee remains free to solicit contributions in any amount from any lawful source. The speech burden is therefore narrow: it severs only the direct, personal request for money by the candidate herself.</p><p>B. The state&#x27;s interest. Florida&#x27;s interest is not the generic interest in a &quot;fair fight&quot; among candidates, and we do not credit the petitioner&#x27;s occasional drift toward equalizing the electoral playing field; this Court does not license restrictions on speech for the purpose of equalizing campaign advantage, and the petitioner&#x27;s own concession that there is &quot;no evidence in this record or in the literature or in the case law&quot; that incumbency dynamics bear on the question disposes of that rationale.</p><p>Nor does the respondent&#x27;s coercion argument, standing alone, carry the day. Her strongest point — that Florida permits judges to know who contributed and to write thank-you notes, thereby undermining the claim that any judicial knowledge of contributors is intolerable — is a fair observation of the scheme&#x27;s coherence. If mere knowledge of contributors were corrupting, the thank-you note would be equally objectionable. The state&#x27;s interest must therefore rest on something narrower than the mere fact of contact between judge and contributor.</p><p>That narrower interest is the one the petitioner identifies with force: the prevention of the reality and appearance of quid pro quo corruption arising from the direct, personal request for money by a person who holds, or seeks to hold, office whose defining duty is disinterested judgment. The respondent errs in suggesting that because this interest applies to legislators as well, it cannot distinguish the judicial context. The opposite is true. As the petitioner persuasively argues, the Court has recognized that responsiveness to supporters is a normal, even desirable, feature of the political branches; a legislator who keeps faith with those who financed her campaign is, in that respect, doing her job. For a judge, there is no such thing as legitimate responsiveness to a contributor. A contribution to a judicial candidate therefore carries a distinctive risk of obligation — and, critically, a distinctive public perception of obligation — that a contribution to a legislative candidate does not. A state that chooses judicial elections, as Florida&#x27;s constitution does and as its voters have declined to change, may take reasonable measures to protect the integrity of those elections from that distinctive risk. This is not an interest in avoiding mere &quot;error&quot; by judges, which *White* rejected; it is the classic anti-corruption interest identified in *Buckley* and *McConnell*, applied in the setting where that interest is at its apex.</p><p>C. The fit. The canon is narrowly tailored to that interest. It does not ban solicitation by anyone other than the candidate personally; it does not cap contributions; it does not restrict the candidate&#x27;s speech on any subject other than the direct request for money; and it leaves the candidate able, through her committee, to raise the funds necessary to broadcast her message. The burden on expressive capacity, as the petitioner argues and the record supports, is minimal — nothing suggests a candidate cannot raise enough money to remain viable. Measured against the communicative value of the personal solicitation itself — which, under *Buckley* and *McConnell*, lies chiefly in enabling the dissemination of the campaign message — the restriction is a proportionate means of preventing the distinctive quid pro quo dynamics, real and perceived, that arise when the officeholder-to-be personally asks for money from those who will appear before her.</p><p>We are unpersuaded by the respondent&#x27;s alternative suggestion that judicial-candidate speech should be analyzed under the government-employee speech rubric in a manner that dilutes constitutional protection. A candidate for office is not yet a government actor delivering a governmental message; the campaign is core political speech in an election the state itself chose to hold.<mark class='err' data-n='5'> But recognizing full First Amendment protection for that speech does not entitle the respondent to prevail, because the canon satisfies the demanding review the content-based character of the restriction triggers: Florida&#x27;s compelling interest in preserving public confidence in the integrity of its judiciary is directly and narrowly served by removing only the candidate&#x27;s personal ask.</mark></p><p>D. The discipline. The misstatements in the record — the inflated &quot;community Public Defender&quot; title and the inaccurate claim that there was no incumbent — were not the conduct on which the constitutional question turns and do not alter our analysis of the canon. The violation found below rests on the personal solicitation, and it is that solicitation alone which we sustain.</p><p>IV. Disposition</p><p><mark class='err' data-n='6'>The judgment of the Supreme Court of Florida sustaining Canon 7C(1) against Williams-Yulee&#x27;s First Amendment challenge is affirmed.</mark><mark class='err' data-n='7'> The personal-solicitation ban does not violate the First Amendment: it burdens only the candidate&#x27;s direct personal request for money, leaves all other campaign speech and committee-based fundraising untouched, and serves the compelling interest of a state that elects its judges in preserving both the reality and the appearance of judicial impartiality free of quid pro quo influence.</mark></p><p>RULING: Petitioner</p>", "error": "The Supreme Court of Florida reversed the referee and held Canon 7C(1)'s personal-solicitation ban unconstitutional under the First Amendment.", "truth": "The Supreme Court of Florida held that Williams-Yulee violated the bar rules by directly soliciting funds for her judicial campaign.", "nmarks": 7}, {"id": "C042", "text": "<p>Opinion of the Court</p><p>I. Procedural History</p><p><mark class='tru' data-n='1'>Earth Island Institute and other environmental organizations sued the United States Forest Service in the United States District Court for the Eastern District of California.</mark> They challenged Forest Service regulations governing notice, public comment, and administrative appeals for activities categorically excluded from more extensive environmental review. According to the complaint, the regulations were inconsistent with the Forest Service Decision Making and Appeals Reform Act (ARA), which requires the Forest Service to establish an administrative appeals process that includes an opportunity for notice and comment.</p><p>The challenge arose in connection with the Burnt Ridge timber sale and other Forest Service activities. While the litigation proceeded, the Burnt Ridge sale was withdrawn, and the challenge to that sale was dismissed after the parties reached a settlement.<mark class='tru' data-n='2'> Earth Island nevertheless continued to challenge the regulations themselves, asserting that they were being applied to other Forest Service projects.</mark></p><p><mark class='err' data-n='3'>The District Court ruled for Earth Island and entered relief against the regulations.</mark><mark class='tru' data-n='4'> The Court of Appeals for the Ninth Circuit affirmed.</mark> It reasoned that Congress would not have enacted the ARA if the Forest Service could categorically eliminate notice, comment, and administrative appeals for the activities covered by the regulations.</p><p><mark class='tru' data-n='5'>The Forest Service petitioned for review, arguing principally that Earth Island lacked Article III standing and that the challenge was not ripe after the Burnt Ridge sale had been withdrawn.</mark> We granted review to resolve those threshold issues.</p><p>II. Governing Law</p><p>Article III limits the jurisdiction of federal courts to actual “Cases” and “Controversies.” A plaintiff invoking federal jurisdiction must establish an injury in fact that is concrete, particularized, and actual or imminent; that injury must be fairly traceable to the challenged conduct; and it must be likely that the requested relief will redress it.</p><p>A plaintiff may establish standing by showing that the government denied a procedural right, but the denial of a procedural right does not eliminate the requirement of a concrete interest affected by the challenged action. A plaintiff must show that the government’s failure to follow the required procedure threatens or has affected the plaintiff’s own concrete interests. A generalized interest in having the government follow the law is insufficient.</p><p>An organization may sue on behalf of its members when at least one member would have standing in his or her own right. The organization may also have standing in its own capacity when the challenged conduct causes it a concrete injury, such as a diversion of resources that is not merely the ordinary consequence of litigation. In either event, standing must exist throughout the litigation.</p><p>The ripeness doctrine prevents courts from adjudicating disputes that depend on uncertain future events or that have not yet been reduced to a concrete application. A facial challenge to a regulation is not automatically ripe merely because the regulation has been promulgated or has been applied somewhere. The plaintiff must still demonstrate a concrete injury caused by the regulation. Conversely, when the specific agency action that allegedly caused the injury is withdrawn, the controversy concerning that action ordinarily becomes moot unless a live controversy remains independently.</p><p>III. Application</p><p>Earth Island has not demonstrated the concrete and imminent injury required for standing to challenge the regulations in the abstract.</p><p>The record shows that members of the environmental organizations closely monitor Forest Service activity. They review the Forest Service’s Schedule of Proposed Actions, follow projects in national forests, and sometimes submit comments. The Forest Service also uses scoping procedures and maintains mailing lists for persons who request notice of particular projects. Some declarants submitted comments concerning the Burnt Ridge sale and referred generally to other Forest Service activities.</p><p>That evidence establishes an interest in Forest Service decisionmaking. It does not, however, establish that any identified member faced a concrete and imminent loss of a legally protected environmental or recreational interest because of the challenged regulations. The declarations do not identify a particular ongoing or imminent project in which a member plans to participate, intends to visit an affected area, or will otherwise suffer a concrete injury from the denial of notice, comment, or appeal rights. Nor do they show that any member was imminently threatened with harm to a forest in which the member had a particularized interest.</p><p><mark class='tru' data-n='6'>Earth Island contends that the regulations are applied throughout the national forests and that its members have historically monitored and commented on Forest Service projects.</mark> But past participation, without a concrete showing of likely future exposure to the challenged regulations, does not establish imminent injury. A plaintiff cannot manufacture standing by identifying a broad and recurring governmental practice while leaving the connection to the plaintiff’s own interests unspecified.</p><p>Nor does the alleged procedural injury itself suffice. The ARA may require the Forest Service to maintain an appeals process with notice and comment, but that requirement does not give every person a freestanding right to challenge the agency’s procedures without showing that the procedures affect a concrete interest of that person. Earth Island’s theory would permit judicial review based solely on an asserted interest in lawful administration, which Article III does not allow.</p><p>The withdrawal of the Burnt Ridge sale further confirms the absence of a live controversy on this record. The sale was withdrawn, and the challenge to it was dismissed pursuant to settlement.<mark class='tru' data-n='7'> There is therefore no remaining agency decision concerning that sale for the Court to review and no continuing injury arising from the Forest Service’s application of the regulations to that particular project.</mark> Earth Island argues that the regulations continue to govern other projects, but the record does not identify a concrete, imminent dispute involving any member and any such project. The possibility that the regulations may be applied to some future project is insufficient to make this challenge ripe.</p><p>Earth Island relies on cases recognizing standing for procedural or informational injuries and on decisions allowing facial challenges to regulations. Those authorities do not dispense with Article III’s injury-in-fact requirement. They recognize standing where the plaintiff was denied information or procedure connected to a concrete statutory interest, or where the plaintiff faced a demonstrated and imminent likelihood of being subjected to the challenged rule. The record here does not establish either circumstance.</p><p><mark class='tru' data-n='8'>Because Earth Island lacks standing, the courts below lacked authority to reach the merits of the ARA challenge or to impose relief extending across forests and projects not tied to a concrete injury suffered by a party before the Court.</mark><mark class='err' data-n='9'> The Ninth Circuit’s merits analysis therefore cannot sustain the judgment.</mark></p><p>IV. Disposition</p><p>The judgment of the Court of Appeals is reversed. The case is remanded with instructions to dismiss for lack of Article III jurisdiction. This disposition rests on the absence of a concrete, imminent injury and the lack of a live, ripe controversy after the Burnt Ridge sale was withdrawn; it does not resolve whether the challenged regulations comply with the ARA on the merits.</p><p>RULING: Petitioner</p>", "error": "The district court denied injunctive relief and entered only a declaratory judgment, while the Ninth Circuit imposed the nationwide injunction in the first instance.", "truth": "The district court found for Earth Island and issued a nationwide injunction against the Forest Service; the Ninth Circuit affirmed that ruling.", "nmarks": 9}, {"id": "C043", "text": "<p>The question presented is whether *Harrington v. Richter* silently abrogated the presumption that a federal habeas court should “look through” a later summary state-court ruling to the last reasoned state-court decision. We hold that it did not.</p><p>I. Procedural History</p><p>A Georgia jury convicted Marion Wilson of malice murder and several other felonies and sentenced him to death. At sentencing, Wilson’s counsel argued that Wilson was not the triggerman and presented evidence concerning his difficult childhood. The Supreme Court of Georgia affirmed the convictions and sentence on direct appeal.</p><p>Wilson then sought state habeas relief in the Superior Court of Butts County. He alleged that trial counsel had been ineffective during the sentencing phase. In support of that claim, Wilson relied on lay testimony concerning his childhood and expert testimony that could have explained his impaired judgment skills. The superior court denied relief in a written opinion.</p><p>Wilson applied to the Supreme Court of Georgia for a certificate of probable cause to appeal. That court denied the application in a one-sentence order without explanation. Wilson then filed a federal habeas petition under 28 U.S.C. § 2254. The District Court denied relief, concluding that the state court had reasonably applied clearly established federal law. The District Court nevertheless granted a certificate of appealability on Wilson’s ineffective-assistance claim.</p><p><mark class='tru' data-n='1'>A panel of the Court of Appeals for the Eleventh Circuit affirmed.</mark> It reasoned that the Georgia Supreme Court’s one-line order was the relevant state-court decision because it was the final decision on the merits. Wilson sought rehearing en banc and argued that the federal court should instead have examined the last reasoned state-court decision—the written decision of the Superior Court of Butts County.<mark class='err' data-n='2'> The Eleventh Circuit granted rehearing en banc and appointed an amicus to defend Georgia’s initial position that a federal court should not look through the summary order.</mark></p><p>Wilson now asks whether *Richter* eliminated the established look-through presumption.</p><p>II. Governing Law</p><p>The Antiterrorism and Effective Death Penalty Act limits federal habeas relief on a claim adjudicated on the merits in state court. Under § 2254(d), a federal court may grant relief only if the state-court decision was contrary to, or involved an unreasonable application of, clearly established federal law, or was based on an unreasonable determination of the facts.</p><p>The statute directs the federal court’s inquiry to the state-court “decision” adjudicating the claim. But state courts sometimes issue a reasoned decision at one level of review and then deny further review in a summary order. In that circumstance, this Court has instructed federal courts to presume that the unexplained higher-court decision rests on the same grounds as the last reasoned decision. *Ylst v. Nunnemaker*, 501 U.S. 797 (1991). The presumption is rebuttable. It is not a rigid rule that forecloses consideration of evidence showing that the later court relied on a different ground.</p><p>*Richter* addressed a different situation. There, the state court adjudicated the federal claim without providing an explanation. The Court held that § 2254(d) still applied and that the federal court could not treat the absence of reasons as an invitation to conduct de novo review. Where no state-court reasoning is available, the federal court must determine whether there was any reasonable basis for the state court’s decision.</p><p>Nothing in *Richter* purported to overrule *Ylst*. A decision that is unexplained at the final stage of state review is not necessarily a case in which the state courts gave no explanation at all. When a lower state court has issued a reasoned decision and a higher court later enters a summary merits disposition, the look-through presumption supplies a practical method for identifying the reasoning attributable to the state court’s judgment. Section 2254(d) then governs the federal court’s review of
