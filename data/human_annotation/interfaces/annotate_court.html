 as a whole. That provision is principally directed to indivisible equitable relief. It does not ordinarily permit certification of individualized claims for monetary relief, particularly in a mandatory class whose members receive neither notice nor an opportunity to opt out.</p><p>Title VII also preserves the employer’s right, after a classwide pattern or practice is established, to show that a particular employment decision was made for a lawful reason. Under the framework described in *Teamsters*, a finding of general discrimination may create a presumption at the remedial stage, but it does not automatically establish that every class member was a victim entitled to backpay. Section 706(g) permits relief for actual victims of discrimination. Rule 23 cannot, consistently with the Rules Enabling Act and due process, abridge the parties’ substantive rights by replacing necessary individualized determinations with an irrebuttable statistical assumption.</p><p>III. Application to the Record</p><p>#### A. Rule 23(a)</p><p>The proposed class does not satisfy commonality.</p><p>The named plaintiffs challenge Wal-Mart’s delegation of pay and promotion discretion to local managers. Yet such delegation, without more, points away from a single classwide answer. The challenged decisions were made by numerous managers, in different stores and departments, regarding employees with different qualifications, disciplinary records, supervisors, and employment histories. The named plaintiffs’ own circumstances varied: the record describes promotions, discipline, demotion, and termination arising from distinct events. An adjudication of one plaintiff’s claim therefore would not necessarily resolve why another employee elsewhere received a particular pay rate or promotion decision.</p><p>Respondents identify evidence that deserves serious consideration. Wal-Mart allegedly gave managers a similar degree of discretion nationwide, fostered a strong corporate culture, and provided centralized training. Respondents also point to training material suggesting that women were underrepresented in management because men were more aggressive in seeking advancement. Such evidence may support an individual claim or a more narrowly defined class tied to a particular decisionmaking unit or practice. An anti-discrimination policy, moreover, does not itself establish that discrimination did not occur.</p><p>But the question at certification is whether respondents produced significant proof connecting nationwide discretion to a common discriminatory mode of decisionmaking. On this record, they did not. Their sociological evidence could not determine whether stereotyping affected one-half of one percent, 95 percent, or any ascertainable proportion of the challenged decisions. That uncertainty is critical. It leaves the court unable to infer that managers throughout the country exercised their discretion in the same discriminatory way.</p><p>Respondents’ statistical theory likewise does not bridge this gap. Wal-Mart’s evidence asserted that approximately 90 percent of stores showed no pay disparity. Whatever weight that evidence may ultimately deserve, the variation among stores reinforces the absence of a single answer capable of resolving classwide liability. Aggregate disparities may justify further inquiry, but they do not by themselves demonstrate that every local decision resulted from one nationwide discriminatory practice.</p><p>Respondents argue that these matters should be reserved for trial because they have identified common “questions.” Rule 23, however, requires more than questions stated at a broad level. The proposed proceeding must be capable of generating common answers. A trial determining that some managers allowed stereotypes to affect some decisions would not establish that all class members suffered the same injury or even that each store followed the same discriminatory practice.</p><p>We do not accept Wal-Mart’s broader suggestion that a class of this size is inherently impermissible. Rule 23 imposes no categorical numerical ceiling, and administrative cost alone cannot defeat an otherwise proper class. Nor does Wal-Mart’s written anti-discrimination policy insulate it from class treatment if contrary common practices can be proved. The defect here is evidentiary and structural, not simply numerical: respondents have not identified the necessary glue holding together millions of distinct employment decisions.</p><p>#### B. Rule 23(b)(2) and Backpay</p><p>Certification was independently improper under Rule 23(b)(2).</p><p>Respondents seek not merely an injunction or declaration but backpay for a very large number of employees. Entitlement to that relief depends on individualized questions, including whether a particular employee was denied pay or promotion because of sex and whether Wal-Mart had a lawful, nondiscriminatory reason for the particular decision.</p><p>The District Court’s proposed use of statistical sampling or a formula does not cure that problem. Respondents reasonably observe that Wal-Mart’s asserted lack of detailed records may make individual reconstruction difficult, and statistical evidence may be relevant in proving a pattern or estimating some forms of relief. But difficulty of proof does not authorize a court to eliminate Wal-Mart’s right to present individual defenses or an employee’s right to establish a valid claim that a formula overlooks. A procedure relying on aggregate data cannot conclusively presume that every claimant was discriminated against and then distribute damages without the individualized determinations required by Title VII.</p><p>Because backpay here is not merely incidental to indivisible injunctive or declaratory relief, these claims cannot be placed in a mandatory Rule 23(b)(2) class. Doing so would also deny absent class members the procedural protections ordinarily associated with substantial individualized monetary claims.</p><p>IV. Disposition</p><p>The named plaintiffs have not established a common contention capable of resolving the nationwide class members’ claims in one stroke, as Rule 23(a) requires. Their claims for individualized backpay also may not be certified as part of this mandatory class under Rule 23(b)(2). This holding does not foreclose individual actions or appropriately defined, narrower classes supported by proof of a common discriminatory practice within a particular decisionmaking unit.</p><p><mark class='err' data-n='2'>The judgment of the Court of Appeals affirming certification of the nationwide class is reversed, and the case is remanded for proceedings consistent with this opinion.</mark></p><p>RULING: Petitioner</p>", "error": "The U.S. Court of Appeals for the Ninth Circuit reversed the class certification three times.", "truth": "The U.S. Court of Appeals for the Ninth Circuit upheld the class certification three times.", "nmarks": 2}, {"id": "C029", "text": "<p>OPINION OF THE COURT</p><p>---</p><p>I. Procedural History</p><p>Petitioner-in-this-Court is the Government; respondent is Jorge Luna Torres, a citizen of the Dominican Republic and a lawful permanent resident of the United States. In 1999, Luna Torres was convicted of third-degree arson under New York law. In 2007, immigration authorities charged him as removable as an alien convicted of a crime involving moral turpitude, and Luna Torres applied for cancellation of removal under 8 U.S.C. § 1229b(a).</p><p>The Immigration Judge held Luna Torres removable as charged and further held him statutorily ineligible for cancellation because he had been convicted of an &quot;aggravated felony,&quot; relying on the Board of Immigration Appeals&#x27; prior holding that a conviction under the New York arson statute qualifies. On appeal, Luna Torres asked the Board to reexamine that precedent. The Board declined and dismissed the appeal.</p><p><mark class='tru' data-n='1'>Luna Torres petitioned for review in the United States Court of Appeals for the Second Circuit.</mark> Before argument, the Third Circuit vacated a Board ruling on the same question, holding that a conviction under the New York arson statute is not an aggravated felony because the state statute lacks the interstate-commerce element contained in the federal arson statute, 18 U.S.C. § 844(i).<mark class='tru' data-n='2'> The Second Circuit, in accord with the majority of circuits to address the issue and in conflict with the Third Circuit, upheld the denial of relief and denied the petition for review.</mark></p><p>We pause on one point. Counsel for the Government stated at argument that &quot;[t]he Second Circuit reversed the BIA&#x27;s dismissal and remanded for cancellation proceedings.<mark class='tru' data-n='3'>&quot; That statement is inconsistent with the record before us, which establishes that the court of appeals sustained the Board&#x27;s determination and denied Luna Torres&#x27;s petition.</mark> We decide the case on the record, not on counsel&#x27;s misdescription of it; the error is immaterial to the legal question, and counsel himself disclaimed any significance for it.</p><p>The case comes to this Court to resolve the acknowledged conflict among the courts of appeals.</p><p>II. The Question Presented</p><p>Does a state offense constitute an &quot;aggravated felony&quot; for purposes of removal and ineligibility for cancellation of removal where the referenced federal statute describes the same substantive offense but also contains an interstate-commerce element that the state offense lacks?</p><p>III. Governing Law</p><p>The Immigration and Nationality Act defines &quot;aggravated felony&quot; through a catalogue of some eighty crimes in 8 U.S.C. § 1101(a)(43). Subparagraph (E)(i) sweeps in &quot;an offense described in ... section 844(i) of title 18.&quot; Section 844(i), in turn, makes it a crime maliciously to damage or destroy by fire or explosive &quot;any building, vehicle, or other real or personal property used in interstate or foreign commerce or in any activity affecting interstate or foreign commerce.&quot;</p><p>Two textual features govern the analysis.</p><p>First, the penultimate sentence. Immediately following the catalogue, § 1101(a)(43) provides that the enumerated terms apply &quot;to an offense described in this paragraph whether in violation of Federal or State law&quot; and to &quot;such an offense in violation of the law of a foreign country&quot; for which the term of imprisonment was completed within the previous fifteen years. Congress thus expressly contemplated that offenses &quot;described in&quot; federal criminal statutes would be committed under state and foreign law.</p><p>Second, the verb Congress chose. Congress wrote &quot;described in,&quot; not &quot;defined in&quot; and not &quot;in violation of.&quot; Both of the latter formulations appear elsewhere in the very same paragraph — for example, subparagraph (P) reaches offenses &quot;in violation of&quot; specified federal provisions. Where Congress employs different language within a single provision, we ordinarily presume the difference is deliberate.</p><p>Third, the categorical approach. Removability turns on the elements of the offense of conviction, not the alien&#x27;s actual conduct. *Taylor*; *Moncrieffe*. But the categorical approach tells us only *how* to compare; it does not tell us *what* to compare the state elements against. Identifying the federal comparator is an antecedent question of statutory interpretation.</p><p>Fourth, the long-settled substantive/jurisdictional distinction. Federal criminal statutes routinely contain a jurisdictional &quot;hook&quot; — a commerce element — whose office is to establish Congress&#x27;s constitutional authority to legislate, not to define the harm or evil the statute condemns. See Model Penal Code § 1.13(10) (distinguishing elements that &quot;negative an excuse or justification&quot; or define the harm from those that relate solely to jurisdiction). This Court and the lower courts have long treated such elements as extrinsic to the substance of an offense when comparing federal crimes with their state and foreign counterparts.</p><p>IV. Application</p><p>A. The penultimate sentence is dispositive.</p><p>Respondent&#x27;s reading cannot be reconciled with Congress&#x27;s express instruction that the listed offenses may be committed &quot;in violation of Federal or State law&quot; and in violation of &quot;the law of a foreign country.&quot; No State legislates by reference to Congress&#x27;s commerce power; no foreign sovereign does either. If the interstate-commerce element must be matched element-for-element, then for every listed federal offense containing a jurisdictional hook — and they are legion — the state and foreign-law clauses of the penultimate sentence become dead letters. Only an actual federal prosecution could ever qualify.</p><p>That is not a marginal consequence; it is a wholesale nullification. Respondent&#x27;s answer — that the penultimate sentence simply &quot;requires all the elements to be met&quot; — assumes the conclusion. The sentence exists precisely to tell us that non-federal convictions count. A construction that makes the sentence inoperative across a broad swath of the paragraph is the one to be rejected.</p><p>B. Structure confirms the reading.</p><p>Two structural arguments advanced by the Government are persuasive and went unanswered.</p><p>Subparagraph (J) reaches offenses &quot;described in&quot; the RICO statute and 18 U.S.C. § 1084, and then adds the qualification that the offense be &quot;punishable by imprisonment for one year or more.&quot; Federal RICO convictions are always punishable by up to twenty years; a federal § 1084 conviction carries two years. On respondent&#x27;s reading — under which only federal convictions could ever qualify because both statutes contain commerce elements — that limiting clause would be pure surplusage. It has work to do only if state and foreign analogues, which may carry lesser penalties, are within the provision&#x27;s reach.</p><p>Congress&#x27;s word choice points the same way. Congress used &quot;in violation of&quot; in subparagraph (P) when it meant to confine a provision to violations of the referenced federal statute. It used &quot;defined in&quot; elsewhere. It used the looser &quot;described in&quot; here. Respondent&#x27;s rejoinder — that congressional drafting manuals associate &quot;defined in&quot; with definitional provisions — does not explain why Congress declined to use the available and unmistakable phrase &quot;in violation of,&quot; which would have achieved respondent&#x27;s result directly.</p><p>C. Which element drops out is not an open question.</p><p>Respondent&#x27;s most forceful point is a demand for a limiting principle: if &quot;described in&quot; permits eliminating an element, &quot;why does it have to be the jurisdictional element that gets eliminated? It could just as easily be the arson element.&quot;</p><p>It could not. The distinction between substantive elements — those defining the harm or evil Congress sought to prevent — and jurisdictional elements — those establishing only Congress&#x27;s power to reach that harm — is ancient, administrable, and codified in the Model Penal Code. The commerce element of § 844(i) does not describe wrongdoing; it identifies the sovereign entitled to punish it. Burning a building is the evil; its connection to interstate commerce is the warrant for federal, rather than exclusively state, prosecution. A State that criminalizes the identical malicious burning has criminalized the same offense; it simply has no need of a jurisdictional hook, because it possesses a general police power. Nothing in this holding licenses courts to disregard genuinely substantive elements — including, as the Government properly conceded, elements limiting an offense to federal property, which may reflect a congressional judgment about the gravity of the conduct itself.</p><p>D. Respondent&#x27;s alternatives are underinclusive.</p><p>Respondent urges that Congress could have written generic arson into the statute, and that minor state arsons are adequately captured by the &quot;crime of violence&quot; provision with its one-year sentence threshold. Both propositions fail on their own terms.</p><p>Congress had good reason not to draft a generic arson offense: it would have excluded the explosives offenses covered by § 844(i), and would have required this Court to distill a generic definition from state codes that have wandered far from the common-law burning of a dwelling. More importantly, the interpretive principle respondent urges is not confined to arson. It would excise from the aggravated-felony definition a range of serious state and foreign offenses — possession, transport, and advertisement of child pornography; felon-in-possession and fugitive-in-possession firearms offenses — that no other subparagraph captures, as respondent does not meaningfully contest. And the crime-of-violence route is itself incomplete: that provision requires force against &quot;the person or property of another,&quot; while many state arson statutes reach the burning of one&#x27;s own property. Respondent&#x27;s citation to *Matter of Palacios* is an appeal to Board precedent — precedent respondent elsewhere urges us to disregard — and cannot supply the comprehensive coverage the statutory scheme contemplates.</p><p>Respondent&#x27;s remaining argument — that Congress would not have wanted to strip discretionary relief from those convicted of lesser offenses — is a policy preference. It cannot displace the text. Congress fixed the line at the offenses &quot;described in&quot; the enumerated federal statutes; the wisdom of that line is not ours to revisit.</p><p>E. Ambiguity and deference.</p><p>Because the statute&#x27;s meaning is clear once the penultimate sentence and the structure of § 1101(a)(43) are given effect, we have no occasion to consider Chevron deference, the rule of lenity, or the canon favoring construction of ambiguities in deportation statutes in favor of the alien. Those tools resolve genuine ambiguity; they do not create it. We resolve this case at the first step.</p><p>V. Disposition</p><p>A state offense constitutes an aggravated felony under 8 U.S.C. § 1101(a)(43) when it contains all the substantive elements of the referenced federal offense, notwithstanding the absence of the federal statute&#x27;s interstate-commerce jurisdictional element. The judgment of the Court of Appeals denying the petition for review is affirmed.</p><p>RULING: Petitioner</p>", "error": "The Second Circuit reversed the BIA's dismissal and remanded for cancellation proceedings.", "truth": "The Second Circuit upheld the denial of Luna Torres' petition for cancellation of removal.", "nmarks": 3}, {"id": "C030", "text": "<p>IN THE SUPREME COURT OF THE UNITED STATES</p><p>HENRY MONTGOMERY, Petitioner, v. LOUISIANA, Respondent</p><p><mark class='err' data-n='1'>On Writ of Certiorari to the Supreme Court of Louisiana<br></mark><br>---</p><p>OPINION OF THE COURT</p><p>I. Procedural History</p><p>In 1963, petitioner Henry Montgomery was convicted of the murder of Charles Hunt, an offense he committed less than two weeks after his seventeenth birthday, and was sentenced to death.<mark class='err' data-n='2'> The Louisiana Supreme Court set aside that conviction because of community prejudice.</mark> On retrial Montgomery was again convicted and was sentenced to life imprisonment without the possibility of parole. That sentence became final decades ago.</p><p>In 2012, this Court decided *Miller v. Alabama*, holding that the Eighth Amendment forbids a sentencing scheme that *mandates* life without parole for offenders who were under 18 when they committed homicide.<mark class='tru' data-n='3'> Invoking *Miller*, Montgomery moved in Louisiana district court to correct what he contended had become an illegal sentence.</mark> The district court denied the motion.<mark class='tru' data-n='4'> The Louisiana Supreme Court denied Montgomery&#x27;s application for supervisory writs, holding — as the record before us reflects — that *Miller* does not apply retroactively to cases on collateral review.</mark> In so holding, the Louisiana courts applied the framework of *Teague v. Lane*, which that State had previously elected to follow.</p><p><mark class='err' data-n='5'>We granted certiorari on two questions: whether *Miller* announced a rule that applies retroactively to convictions final before it was decided, and whether this Court has jurisdiction to review the Louisiana Supreme Court&#x27;s retroactivity determination.</mark> Because the second question conditions our authority to reach the first, we address it first.</p><p>At the outset we note a procedural irregularity. Counsel for respondent opened by stating that the State does not contest jurisdiction — &quot;Why then do we not contest jurisdiction? We believe and still believe that this is a straightforward case&quot; — and conceded that the Louisiana courts took &quot;*Teague* lock, stock, and barrel,&quot; rendering this an &quot;interwoven&quot; case. Yet later excerpts from the same submission argue the opposite, asserting that &quot;the Louisiana Supreme Court dismissed Montgomery&#x27;s application for lack of jurisdiction without reaching the retroactivity question, so there is no embedded Federal issue to resolve.<mark class='tru' data-n='6'>&quot; That assertion is contradicted by the record before us, which shows the Louisiana Supreme Court denied relief precisely *by* holding that *Miller* is not retroactive.</mark> We disregard the assertion as unsupported by the record, and we note that a party&#x27;s shifting of position on a jurisdictional premise mid-argument does not assist the Court.<mark class='err' data-n='7'> We add that jurisdiction is in any event not a matter of party concession: this Court has an independent obligation to satisfy itself of its authority, and we would examine the question even had respondent said nothing.</mark></p><p>II. Governing Law</p><p>A. Jurisdiction. This Court may review a judgment of a state court of last resort that rests on federal law. Where a state judgment rests on an adequate and independent state ground, we lack authority to disturb it. Under *Michigan v. Long*, when a state decision &quot;fairly appears to rest primarily on federal law, or to be interwoven with the federal law,&quot; and the adequacy and independence of any state ground is not clear from the face of the opinion, we presume the state court decided as it did because it believed federal law required that result, absent a plain statement to the contrary.</p><p>But *Long* is not the only, nor here the strongest, basis of jurisdiction. The antecedent question is whether the retroactivity of a new substantive constitutional rule is itself a question of federal law. *Teague* and its successors distinguish two categories. New *substantive* rules — those that place particular conduct or a class of persons beyond the State&#x27;s power to punish at all, or beyond its power to punish in a given manner — apply retroactively. New *procedural* rules generally do not, because they merely &quot;allocate decisionmaking authority&quot; and raise only a speculative possibility of an altered outcome; they apply retroactively only if &quot;watershed.&quot; *Penry v. Lynaugh*; *Schriro v. Summerlin*.</p><p>The substantive category is not a matter of grace or of prudential comity. A substantive rule declares that the Constitution deprives the State of *power* to impose a given punishment on a given class. A sentence imposed without such power is not merely erroneous; it is unauthorized. Under the Supremacy Clause, a state court that has opened its doors to collateral review of a final conviction may not leave in place a punishment the Constitution forbids the State to inflict. It follows that where a state postconviction court adjudicates a claim that a new substantive federal rule invalidates a sentence, and denies relief on the ground of non-retroactivity, its judgment rests on federal law and is reviewable here.</p><p>B. Merits. The Eighth Amendment&#x27;s proportionality principle, as applied to juveniles, rests on the recognition that children are constitutionally different from adults for purposes of sentencing: they possess diminished culpability and heightened capacity for change. *Roper v. Simmons*; *Graham v. Florida*. *Miller* applied that principle to mandatory life without parole for juvenile homicide offenders.</p><p>III. Application</p><p>A. Jurisdiction is proper.</p><p>Respondent&#x27;s most serious jurisdictional argument — the one properly framed at the start of its submission — is that Louisiana adopted *Teague* voluntarily, as a matter of state law, and that a state court&#x27;s application of a rule it freely chose to import is a state-law decision insulated from our review. That argument has real force, and we do not dismiss it. Louisiana&#x27;s earlier decisions did say, as respondent candidly acknowledged, &quot;we are voluntarily adopting *Teague*.&quot; A State&#x27;s choice of the *architecture* of its collateral-review system is ordinarily its own business. Respondent&#x27;s *Standard Oil* analogy captures the point fairly: a State need not make its tax exemptions turn on a federal question, and when it does so gratuitously, the case for our review weakens.</p><p>Petitioner&#x27;s answer, resting chiefly on *Michigan v. Long*, is partly overstated. Counsel asserted that &quot;the State must say, we are following State law.&quot; That inverts the rule only loosely: *Long* requires a plain statement that the judgment rests on adequate and independent state grounds, and it operates only where the decision fairly appears to rest primarily on, or be interwoven with, federal law. Petitioner&#x27;s flat formulation would sweep in cases plainly resolved on state law without incantation.<mark class='err' data-n='8'> Nonetheless, petitioner&#x27;s underlying observation is accurate on this record: the Louisiana Supreme Court stated that it was &quot;dictated by the *Teague* analysis&quot; and identified no independent state ground.</mark> Respondent agrees the court took *Teague* &quot;lock, stock, and barrel.&quot; On these facts the judgment is interwoven with federal law, and no plain statement of an independent state basis appears.</p><p>More fundamentally, the voluntary-adoption argument proves too much. Whatever latitude a State enjoys in designing collateral review, it enjoys none in deciding whether it may continue to enforce a sentence the Constitution forbids it to impose. If *Miller* announced a substantive rule, then Montgomery&#x27;s sentence exceeds the State&#x27;s power, and Louisiana&#x27;s characterization of its retroactivity doctrine as home-grown cannot immunize the continued enforcement of an unconstitutional penalty. The federal question is thus embedded in the judgment — precisely the discrete, outcome-determinative federal issue this Court reached in *Ohio v. Reiner*, the very case respondent&#x27;s own submission invokes.<mark class='err' data-n='9'> Nor is there any risk of an advisory opinion: our answer to the retroactivity question determines whether Montgomery remains lawfully confined for life without parole.</mark></p><p>We therefore hold that we have jurisdiction.</p><p>B. *Miller* announced a substantive rule that applies retroactively.</p><p>The strongest argument available to respondent — one its submission gestured at but never developed — is that *Miller* is procedural. *Miller* did not categorically forbid life without parole for juveniles; it forbade *mandatory* imposition of that sentence and required an individualized hearing at which youth and its attendant characteristics are considered. On that reading, *Miller* merely regulates the manner of determining culpability and &quot;allocates decisionmaking authority,&quot; which under *Summerlin* is the hallmark of a procedural rule. We take that argument seriously, and we acknowledge that *Miller*&#x27;s remedial command has an unmistakably procedural surface.</p><p>The argument nonetheless fails, for a rule may carry procedural requirements and still be substantive in substance. The question is whether the rule alters the *range of permissible outcomes*, or only the process by which an outcome within an unchanged range is reached. *Miller* did the former. It rested on the substantive conclusion that, because of children&#x27;s diminished culpability and capacity for reform, life without parole is a disproportionate punishment for &quot;the vast majority of juvenile offenders&quot; — all but the rare child whose crime reflects irreparable corruption rather than transient immaturity. *Miller* described the occasions for that sentence as &quot;uncommon&quot; and &quot;rare.&quot; A rule that renders a penalty unconstitutionally disproportionate for an entire class of offenders necessarily narrows the outcomes the State may lawfully impose. The hearing *Miller* requires is the mechanism for identifying who falls within the protected class; it is the rule&#x27;s implementation, not its substance.</p><p>The consequence of the contrary view confirms the point. Were *Miller* purely procedural, a prisoner whose crime in fact reflected nothing but the transient immaturity of youth — a person the Eighth Amendment forbids the State to imprison for life without parole — would remain so imprisoned forever, not because he is constitutionally punishable, but because of the calendar date on which his conviction became final. That is not the risk of an inaccurate outcome that *Summerlin* tolerates; it is the certainty of an unauthorized punishment. Substantive rules apply retroactively precisely to avoid that result.</p><p>We note, however, that petitioner&#x27;s own framing was imprecise in places. Counsel stated that &quot;*Miller* held that mandatory life in prison was unconstitutional&quot; and that &quot;life in prison would be an uncommon, rare sentence.&quot; *Miller* addressed life *without parole*, not life imprisonment as such — a distinction that matters considerably, and that bears on remedy. Giving *Miller* retroactive effect does not require Louisiana to relitigate every decades-old sentencing proceeding. A State may remedy a *Miller* violation by extending parole eligibility to affected offenders rather than by resentencing them. Those who are found, after consideration, to be irreparably corrupt may still be denied release; those whose crimes reflected transient immaturity will have an opportunity to demonstrate rehabilitation. Nothing in this opinion entitles any prisoner to release, only to consideration.</p><p>Finally, we note that the Fifth Circuit&#x27;s contrary conclusion on federal habeas, invoked by respondent, does not bind this Court and does not alter our analysis of *Miller*&#x27;s character.</p><p>IV. Disposition</p><p><mark class='err' data-n='10'>We hold that this Court has jurisdiction to review the Louisiana Supreme Court&#x27;s determination, and that *Miller v.</mark> Alabama* announced a substantive rule of constitutional law that applies retroactively to cases on collateral review.<mark class='err' data-n='11'> The judgment of the Supreme Court of Louisiana is reversed, and the case is remanded for further proceedings not inconsistent with this opinion.</mark></p><p>*It is so ordered.*</p><p>RULING: Petitioner</p>", "error": "The Louisiana Supreme Court dismissed Montgomery’s application for lack of jurisdiction without reaching the retroactivity question.", "truth": "The Louisiana Supreme Court denied Montgomery’s application, holding that Miller v. Alabama does not apply retroactively.", "nmarks": 11}, {"id": "C031", "text": "<p>Opinion of the Court</p><p>I. Procedural History</p><p>Brian and Karen Wynne are Maryland residents and shareholders of Maxim Healthcare Services, Inc., a pass-through entity conducting business throughout the United States. For tax year 2006, Maxim allocated to the Wynnes income earned—and taxes paid—in numerous States.<mark class='tru' data-n='1'> The Wynnes claimed a credit for those taxes against both components of their Maryland individual income tax: the state tax and the Howard County tax.</mark></p><p><mark class='tru' data-n='2'>The Comptroller concluded that Maryland law permitted the credit against the state component but not against the county component and assessed the resulting deficiency.</mark><mark class='tru' data-n='3'> The Comptroller’s Hearings and Appeals Section corrected the county tax rate initially used but otherwise affirmed the assessment.</mark></p><p><mark class='tru' data-n='4'>The Maryland Tax Court rejected the Wynnes’ dormant Commerce Clause challenge and upheld the revised assessment.</mark><mark class='tru' data-n='5'> The Circuit Court for Howard County reversed, holding that imposing the county tax without a credit for taxes paid to other States violated the dormant Commerce Clause.</mark><mark class='tru' data-n='6'> The Maryland Court of Appeals affirmed.</mark> It reasoned that the tax burdened the interstate market for capital and business investment, was not fairly apportioned, and discriminated against interstate commerce by subjecting interstate income to a greater aggregate tax burden than intrastate income.</p><p>The question is now before this Court on review of that judgment.</p><p>II. Governing Law</p><p>The Commerce Clause grants Congress authority to regulate commerce among the States. Although phrased as an affirmative grant of power, it also restricts state taxation that discriminates against or unduly burdens interstate commerce.</p><p>Under the framework associated with *Complete Auto Transit, Inc. v. Brady*, a state tax affecting interstate commerce is valid only if it: (1) applies to an activity with a substantial nexus to the taxing State; (2) is fairly apportioned; (3) does not discriminate against interstate commerce; and (4) is fairly related to services provided by the State.</p><p>Fair apportionment includes the requirement of internal consistency. A tax is internally consistent if the adoption of the same tax structure by every State would not place interstate commerce at a disadvantage compared with commerce conducted entirely within one State. The inquiry isolates the structure of the challenged tax rather than variations among actual state tax rates.</p><p>A State ordinarily may tax all income of its residents, including income earned elsewhere. That sovereign authority, however, remains subject to the Commerce Clause. Residence therefore supplies a jurisdictional basis for taxation, but it does not authorize a State to structure its taxes so that interstate activity bears a systematically greater burden than equivalent intrastate activity.</p><p>The Constitution does not invariably require a credit as the exclusive remedy. A State may avoid unconstitutional multiple taxation through credits, apportionment, exemptions, or another constitutionally adequate mechanism. But where a State taxes all of a resident’s income while also taxing nonresidents on income earned within the State, it must structure the combined system so that interstate income is not disadvantaged merely because it crosses a state boundary.</p><p>III. Application</p><p>Maryland taxes residents on all their income, wherever earned. It also taxes nonresidents on income earned in Maryland. Although Maryland grants residents a credit against the state portion of the income tax for income taxes paid elsewhere, it denies an equivalent credit against the county portion.</p><p>That system fails the internal-consistency test. Assume every State adopted Maryland’s structure. A taxpayer earning income exclusively in the taxpayer’s home State would pay only that State’s resident income tax, including its local component. A taxpayer earning income in another State would pay the source State’s tax on that income and would also remain liable for the home State’s county tax without a corresponding credit. Interstate income would thus bear two relevant tax burdens where otherwise identical intrastate income would bear only one.</p><p>The disadvantage does not depend merely on the independent policy choices or rates of other States. It follows from Maryland’s own decision to combine a source-based tax on nonresidents with an unapportioned residence-based county tax for which no interstate credit is allowed. The resulting additional burden arises precisely when income crosses state lines.</p><p>The Comptroller emphasizes that the county tax applies at the same nominal rate to every county resident, regardless of where income is earned. Facial equality among residents is not dispositive. A tax may apply uniformly in form while discriminating in practical operation. Here, residents engaged solely in Maryland commerce encounter only Maryland’s tax system, while residents engaged in interstate commerce encounter Maryland’s uncredited county tax in addition to a constitutionally permissible source tax imposed elsewhere.</p><p>Nor does the distinction between residence-based and source-based jurisdiction defeat the internal-consistency analysis. Both residence and source may furnish legitimate bases for taxation, but the existence of two valid jurisdictional bases does not establish that cumulative taxation is immune from Commerce Clause review. The relevant question is whether Maryland’s chosen structure exposes interstate income to a burden that intrastate income avoids. It does.</p><p>Maryland’s reliance on the public services supplied to residents is likewise insufficient. Residents receive schools, fire protection, legal institutions, and other services regardless of where they earn income. That consideration supports Maryland’s authority to tax its residents, but it does not justify a tax structure that penalizes interstate economic activity. Maryland remains free to finance those services through a generally applicable and constitutionally structured tax.</p><p>The Court also rejects the proposition that political accountability supplies an adequate constitutional safeguard. Residents’ ability to influence Maryland law does not cure discrimination against interstate commerce. The dormant Commerce Clause protects the national market against economic barriers that individual States may have political incentives to impose.</p><p>The Wynnes’ observation that most other States provide a full credit is not itself controlling; widespread legislative practice cannot substitute for constitutional analysis. Nor must the Court accept the characterization of every instance of overlapping taxation as a forbidden “tariff.” Multiple taxation may be permissible where it reflects distinct taxable events or does not disadvantage interstate commerce. Here, however, the internal-consistency analysis demonstrates the constitutionally relevant discrimination.</p><p>The appropriate conclusion is correspondingly narrow.<mark class='tru' data-n='7'> The dormant Commerce Clause does not categorically prevent a State from taxing all income of its residents, nor does it make a credit the only permissible legislative device.</mark> It does prohibit Maryland’s present combination of taxes from imposing an unapportioned additional burden on interstate income. Maryland must provide an adequate credit or adopt another mechanism that removes that discriminatory burden.</p><p>IV. Disposition</p><p><mark class='tru' data-n='8'>The Maryland Court of Appeals correctly held that the denial of a credit against the county component of Maryland’s income tax violates the dormant Commerce Clause as applied to the Wynnes’ interstate pass-through income.</mark> Its judgment is affirmed.</p><p>RULING: Petitioner</p>", "error": "The Maryland Court of Appeals vacated the Circuit Court's judgment and reinstated the Tax Court's affirmance of the revised assessment.", "truth": "The Maryland Court of Appeals affirmed the Circuit Court's reversal of the Tax Court and held that the county tax without a credit violated the dormant Commerce Clause.", "nmarks": 8}, {"id": "C032", "text": "<p>IN THE SUPREME COURT</p><p>City of Arlington et al. v. Federal Communications Commission</p><p>OPINION OF THE COURT</p><p>---</p><p>I. Procedural History</p><p>Congress amended the Communications Act of 1934 to require state and local governments to act on wireless facility siting applications &quot;within a reasonable period of time after the request is duly filed.&quot; 47 U.S.C. § 332(c)(7)(B)(ii). Because that command proved, in practice, to be honored slowly if at all, the Wireless Association petitioned the Federal Communications Commission in 2008 for a declaratory ruling giving content to the phrase &quot;reasonable period of time.&quot; In November 2009 the Commission issued a declaratory ruling adopting presumptive outer limits of 90 days for applications to attach wireless equipment to existing structures and 150 days for applications to construct new towers.</p><p>Local governments sought review, contending that the Commission lacked authority to construe § 332(c)(7)(B)(ii) with the force of law at all. They pointed to § 332(c)(7)(A), which preserves local zoning authority &quot;[e]xcept as provided in this paragraph,&quot; and to § 332(c)(7)(B)(v), which channels enforcement of the substantive limitations in subparagraph (B) to the courts. The Commission relied on its general rulemaking authority under 47 U.S.C. § 201(b) to &quot;prescribe such rules and regulations as may be necessary in the public interest to carry out the provisions of this chapter.&quot;</p><p><mark class='tru' data-n='1'>The United States Court of Appeals for the Fifth Circuit rejected the local governments&#x27; threshold argument that no deference was owed to the Commission&#x27;s view of its own authority.</mark> The court applied the framework of *Chevron U.S.A. Inc. v. Natural Resources Defense Council, Inc.*, 467 U.S.<mark class='tru' data-n='2'> 837 (1984), found the relationship between § 332(c)(7)(A) and § 201(b) ambiguous, deferred to the Commission&#x27;s resolution of that ambiguity, and affirmed the declaratory ruling.</mark></p><p>We granted certiorari. The grant was expressly limited. We took this case *exclusively* to decide the antecedent question of administrative law — whether a court owes *Chevron* deference to an agency&#x27;s interpretation of a statutory ambiguity that bears on the scope of the agency&#x27;s own authority. We did not grant review of the merits question whether § 332(c)(7) in fact withdraws § 201(b) authority over subparagraph (B)(ii), and we do not decide it today.</p><p>Before turning to the law, we pause to correct the record. Counsel for the respondent local governments told this Court that &quot;[t]he Fifth Circuit reviewed the jurisdictional ambiguity de novo and reversed the FCC&#x27;s declaratory ruling,&quot; and offered that supposed disposition as an example of a lower court &quot;gett[ing] it right.&quot; That is not what happened.<mark class='tru' data-n='3'> The Fifth Circuit deferred to the Commission and *affirmed* the declaratory ruling; that affirmance is the very reason the local governments are here as petitioners for certiorari.</mark> A characterization of the judgment below that is squarely contradicted by the judgment below is entitled to no weight, and we disregard it.</p><p>II. Governing Law</p><p>*Chevron* is not a free-floating policy of judicial modesty. It is a doctrine about congressional intent. When Congress confers on an agency general authority to administer a statute through action carrying the force of law, and the agency exercises that authority to resolve an ambiguity in the statute it administers, the ambiguity is understood as an implicit delegation to the agency rather than to the courts. *Chevron*, 467 U.S. at 843–44; *United States v. Mead Corp.*, 533 U.S. 218, 226–27 (2001); *Smiley v. Citibank (South Dakota), N.A.*, 517 U.S. 735, 740–41 (1996).</p><p>Two features of that framework are decisive here.</p><p>First, *Chevron* has never been a rule of unconditional surrender. Step one is itself *de novo* review. A court &quot;employing traditional tools of statutory construction,&quot; 467 U.S. at 843 n.9, asks whether Congress has directly spoken to the precise question at issue. If it has, that is the end of the matter — for the agency as well as the court. Deference operates only in the interstices Congress left open.</p><p>Second, there is a genuinely independent threshold inquiry, and it is conducted without deference: whether Congress delegated to *this* agency authority to act with the force of law, and whether the interpretation claiming deference is an exercise of that authority. *Mead*, 533 U.S. at 226–27. Counsel for the Commission conceded precisely this at argument, framing the question as one of &quot;de novo review of the question of whether Congress has delegated authority to the agency generally to act with the force of law and whether the interpretation claiming deference is an exercise of that delegated authority.&quot; That concession is correct, and it is the answer to the fear that agencies might bootstrap themselves into powers Congress withheld.</p><p>The question we must resolve is whether, *in addition* to these two safeguards, courts must carve out a third category — &quot;jurisdictional&quot; interpretations — and review them without deference even where the agency indisputably administers the statute and the statute is indisputably ambiguous.</p><p>We hold that no such category exists, because it cannot be defined.</p><p>The word &quot;jurisdiction&quot; is a term &quot;of many, too many, meanings.&quot; When applied to courts it carries a determinate sense: a tribunal either possesses adjudicatory power over a class of cases or it does not, and its rulings are void if it does not. Administrative agencies are differently situated. An agency&#x27;s power is not divided into a &quot;jurisdictional&quot; sphere and a &quot;substantive&quot; sphere. *Every* exercise of agency authority is a claim that a statute confers power to do X, in circumstance Y, with respect to persons Z. Any assertion that the agency got X, Y, or Z wrong is, at the same moment, an assertion that the agency exceeded its authority — that it acted where Congress gave it no power to act. An agency that misreads a substantive term has regulated conduct Congress did not authorize it to regulate. On the logic pressed against deference here, that is &quot;jurisdictional&quot; too.</p><p>The instability of the proposed line is not theoretical; it is on display in this very case. Respondent defines the excluded category as questions of &quot;underlying jurisdiction&quot; — whether Congress gave the agency &quot;the power to interpret this statutory provision with the force of law.&quot; The IMLA, arguing on the same side, defines it far more broadly to embrace any question going to &quot;the who, what, when or where&quot; of an agency&#x27;s assertion of authority. Both definitions rest on *identical* reasoning — that the agency is alleged to have acted &quot;in excess of the scope of its delegated authority.&quot; Two allied advocates, invoking the same rationale, draw the line in materially different places. That is strong evidence that the line is not there to be drawn. And if the premise is that an allegation of ultra vires action defeats deference, the premise proves far too much: such an allegation can be, and would be, made in every case. *Chevron* would survive in name while being litigated out of existence in fact, with the further consequence that every judicial resolution of a supposedly &quot;jurisdictional&quot; ambiguity would ossify the statute against later agency reconsideration. *Cf. Nat&#x27;l Cable &amp; Telecomms. Ass&#x27;n v. Brand X Internet Servs.*, 545 U.S. 967 (2005).</p><p>The authorities respondent marshals do not establish the contrary rule.</p><p>*Louisiana Public Service Commission v. FCC*, 476 U.S. 355 (1986), construed a provision declaring that &quot;nothing in this chapter shall be construed to apply or to give the Commission jurisdiction with respect to&quot; intrastate service. That is an express statutory carve-out — a paradigmatic step-one holding that Congress had spoken clearly. It says nothing about ambiguous statutes. It is also worth noting that §§ 251 and 252 of the Communications Act, on which respondent leans, were enacted a decade after that 1986 decision.</p><p>*Adams Fruit Co. v. Barrett*, 494 U.S. 638 (1990), likewise held that the statute&#x27;s plain terms foreclosed the agency&#x27;s position, *id.* at 646 — again, step one. Its further observation concerned a distinct matter: the Department of Labor had authority to implement the statute&#x27;s substantive motor-vehicle-safety provisions, but not to circumscribe the *judicial remedies* Congress created in a private right of action. Mapped onto this case, the comparison favors the Commission. The Commission has supplied a rule of decision for a substantive obligation Congress imposed — what counts as a &quot;reasonable period of time&quot; — while leaving to the courts what remedy, if any, follows from a violation.</p><p>*Mead* is a step-zero case. Customs ruling letters failed to qualify for deference because Congress had not delegated authority to issue them with the force of law, not because the question was &quot;jurisdictional.&quot; *Mead* thus confirms the threshold inquiry we have already described; it does not add a fourth step.</p><p>Against these, the affirmative pattern of our cases is clear. In *American Hospital Association v. NLRB*, 499 U.S. 606 (1991), the argument was that a provision requiring bargaining-unit determinations &quot;in each case&quot; carved the subject out of the Board&#x27;s general rulemaking authority; the Court resolved the ambiguity under *Chevron* in the agency&#x27;s favor. *Commodity Futures Trading Comm&#x27;n v. Schor*, 478 U.S. 833 (1986), is comparable. And in *AT&amp;T Corp. v. Iowa Utilities Board*, 525 U.S. 366 (1999), the Court, confronting a genuine dispute over whether the Commission or the state commissions held implementing authority, reasoned that &quot;Congress is well aware that the ambiguities it chooses to produce in a statute will be resolved by the implementing agency,&quot; and that the judicial task was to &quot;enforce the clear limits&quot; the Act contains. *Id.* at 397. That is *Chevron*&#x27;s logic applied to a question of allocated authority, whatever label one attaches.</p><p>III. Application</p><p>Applying this framework to the record, the judgment below was correct.</p><p>The threshold, non-deferential inquiry is satisfied. Section 201(b) confers on the Commission general authority to prescribe rules &quot;necessary in the public interest to carry out the provisions of this chapter,&quot; and § 332(c)(7) is a provision of that chapter. No party disputes that the Commission possesses general authority to administer the Communications Act through action carrying the force of law, or that the declaratory ruling was an exercise of that general authority rather than an informal aside of the *Mead* variety. What respondent disputes is narrower: whether that concededly general authority was *carved out* as to one subparagraph. That is a question about the reach of a delegation the agency undeniably holds — the classic occasion for *Chevron*, not an escape from it.</p><p>Respondent&#x27;s substantive arguments confirm rather than undermine the point. Respondent argues from the text of § 332(c)(7)(A) (&quot;Except as provided in this paragraph, nothing in this Act shall limit or affect...&quot;), from the placement of enforcement in the courts under § 332(c)(7)(B)(v), from the contrast between the treatment of &quot;reasonable period of time&quot; and of radio-frequency-emissions questions, and from conference history said to reflect rejection of a House version that would have granted the Commission this very power. Those are arguments that Congress spoke clearly. They are *Chevron* step-one arguments, presented in step-one form, using the ordinary tools of construction. Respondent&#x27;s own framing thus demonstrates that the existing framework has ample room to vindicate statutory limits on agencies; what it does not demonstrate is the need for a separate, categorically deference-free track. Whether those arguments ultimately prevail at step one is the merits question the Fifth Circuit resolved against respondent and on which we did not grant certiorari. We express no view on it.</p><p>Respondent also urges that the excluded category should cover &quot;lawyer&#x27;s questions&quot; — &quot;does this statute read this far?&quot; — as distinct from technical questions of communications engineering. That distinction cannot bear the weight placed on it. *Chevron* itself involved a &quot;lawyer&#x27;s question&quot;: the meaning of &quot;stationary source.&quot; Ambiguity in a statute an agency administers is a delegation regardless of whether resolving it requires technical expertise or ordinary legal judgment; the delegation rationale turns on who Congress entrusted with the gap, not on the subject matter of the gap.</p><p>Finally, respondent invokes federalism, urging a clear-statement rule because the ruling constrains local zoning authority. But the constraints on state and local governments in § 332(c)(7)(B) were imposed by *Congress*, not by the Commission. Congress itself decided that localities must act within a reasonable period of time; the Commission has done no more than give operational content to a limitation Congress enacted. An agency implementing a preemptive standard Congress wrote is in the position of the agency in *Smiley*, 517 U.S. 735, which received deference for construing the preemptive scope of &quot;interest&quot; in the National Bank Act. No clear-statement rule displaces *Chevron* where the federal intrusion is Congress&#x27;s own handiwork.</p><p>We therefore hold: where a court determines, without deference, that Congress has delegated to an agency general authority to administer a statute through action carrying the force of law, and that the agency&#x27;s interpretation is an exercise of that authority, *Chevron* governs the agency&#x27;s construction of ambiguous provisions of that statute — including provisions that bear on the scope of the agency&#x27;s authority. Courts must still, at step one, enforce every limit Congress has clearly imposed. But there is no third category of &quot;jurisdictional&quot; questions exempt from deference, because no principled and administrable line separates such questions from the ordinary business of statutory interpretation.</p><p>IV. Disposition</p><p><mark class='tru' data-n='4'>The judgment of the United States Court of Appeals for the Fifth Circuit, which applied *Chevron* to the Commission&#x27;s construction of its authority under § 332(c)(7) and affirmed the declaratory ruling, is affirmed.</mark> The question presented is answered in the affirmative. The merits question — whether § 332(c)(7) withdraws the Commission&#x27;s § 201(b) authority over subparagraph (B)(ii) — was not within the grant of certiorari and remains resolved as the court below resolved it.</p><p>It is so ordered.</p><p>RULING: Petitioner</p>", "error": "The Fifth Circuit reviewed the jurisdictional ambiguity de novo and reversed the FCC's declaratory ruling.", "truth": "The U.S. Court of Appeals for the Fifth Circuit deferred to the FCC and affirmed the FCC's declaratory ruling.", "nmarks": 4}, {"id": "C033", "text": "<p>Dada v. Mukasey — Opinion of the Court</p><p>I. Procedural History</p><p>Petitioner Samson Dada, a Nigerian citizen, entered the United States in 1998 on a temporary visa and remained after its expiration. He later married a United States citizen, a marriage that would render him eligible to adjust his status to that of a lawful permanent resident if properly documented. In 2004, the Department of Homeland Security placed him in removal proceedings.</p><p>Before the Immigration Judge, Dada conceded removability, sought a continuance pending the documentation of his marriage (which was denied for failure to prosecute), and ultimately requested voluntary departure. The Immigration Judge granted that request. Dada appealed to the Board of Immigration Appeals, which affirmed the denial of the continuance, reinstated a 30-day voluntary departure period, and entered a final administrative order of removal. Before the departure window closed, Dada filed a motion to reopen, supported by approximately eighty pages of exhibits, including an application for adjustment of status and evidence of his bona fide marriage. Critically, in that same filing, Dada asked the Board to withdraw his voluntary departure grant, so that his inability to depart within the allotted period would not trigger the ten-year bar on re-entry prescribed by 8 U. S. C. § 1229c(d). The Board denied the request to withdraw, treating the voluntary departure grant as irrevocable once entered.</p><p><mark class='err' data-n='1'>Dada petitioned the United States Court of Appeals for the Fifth Circuit for review.</mark><mark class='err' data-n='2'> That court dismissed the petition for lack of jurisdiction and upheld the denial, reasoning that nothing in the governing regulation or the Board&#x27;s order permits an alien unilaterally to avoid the consequences of a voluntary departure grant, and that the filing of a motion to reopen does not suspend the departure period.</mark><mark class='tru' data-n='3'> Because Dada&#x27;s departure period had run while his motion to reopen was pending, the court held him subject to § 1229c(d)&#x27;s ten-year re-entry bar.</mark> We granted certiorari to resolve the question presented.</p><p>II. Governing Law</p><p>Two statutory provisions frame the dispute. First, 8 U. S. C. § 1229c(b), added by the Illegal Immigration Reform and Immigrant Responsibility Act of 1996 (IIRIRA), permits an alien conceded removable to depart the United States voluntarily within a fixed period—60 days at most—if he waives appeal, thereby avoiding the impediments that attach to a removal order. Section 1229c(d) then imposes a steep price for noncompliance: an alien who fails to depart within the allotted period faces a civil penalty and a ten-year bar on re-entry, as well as ineligibility for voluntary departure, adjustment of status, and cancellation of removal for a decade.</p><p>Second, § 1229a(c)(7)(A) provides that &quot;[a]n alien may file one motion to reopen&quot; removal proceedings to present new facts. The regulation, 8 C. F. R. § 1003.2(d) (2008), adds that &quot;[a] motion to reopen . . . shall not be made by, or on behalf of, an alien who is subject to . . . a voluntary departure period that has not expired.&quot; The Government reads § 1003.2(d) to render an untimely-filed motion invalid and, per its position below, to bar an alien from withdrawing his voluntary departure request once the Board has entered its order.</p><p>We construe these provisions with two settled principles in mind. First, &quot;a party cannot waive, in the sense of estop, the Government&#x27;s enjoyment of the sovereign&#x27;s statutory prerogatives&quot; — but nor may the Executive, by regulation, strip aliens of statutory rights Congress has conferred. Statutory entitlements to seek relief in removal proceedings, including the motion to reopen, are &quot;subject to the discretion of the Attorney General and the Secretary of Homeland Security,&quot; not to regulatory nullification. Second, interpretations of the agency&#x27;s own regulation warrant respect where they are reasonable, see *Auer v. Robbins*, 519 U. S. 452 (1997), but no deference is owing to a construction that Congress could not have countenanced or that renders the statutory scheme incoherent.</p><p>III. Application</p><p>A. Automatic tolling. The question presented asks whether the filing of a motion to reopen suspends the voluntary departure period. Petitioner answers yes; the Government, no. On this much, we agree with the Government. Congress, in 1996, deliberately constricted the voluntary departure regime: it shortened the departure window to 60 days and repealed the prior regulatory exception excusing noncompliance caused by &quot;exceptional circumstances.&quot; The Board&#x27;s en banc decision in *Matter of Shaar*, 21 I. &amp; N. Dec. 311 (BIA 1996), contemporaneously rejected both the argument that filing a motion to reopen is itself an &quot;exceptional circumstance&quot; and the argument that filing automatically tolls the period. It would defy common sense to read Congress&#x27;s compression of the deadline as silently reversing that settled administrative practice. Voluntary departure is, moreover, a quid pro quo: the alien receives leniency in exchange for prompt departure. A rule under which a unilateral procedural filing, wholly outside the agency&#x27;s control, extends the substantive deadline as a matter of law would invite the very abuse — motions filed on the eve of the deadline, followed by motions to reconsider, followed by protracted agency inaction given the Board&#x27;s acknowledged backlog — that Congress acted to curtail. We therefore hold that the filing of a motion to reopen does not itself toll or suspend the voluntary departure period.</p><p>B. The right to withdraw. But the Government&#x27;s position cannot rest there, for its reading collides with the statutory motion to reopen in the circumstances of this very case. The statute affords every alien one motion to reopen to present new facts; the Government concedes the statute &quot;can be read&quot; to preserve that right for voluntary departure recipients, and concedes such an alien may file the motion — but insists that if the agency does not act within the truncated window, the alien forfeits any ruling on the merits. That reading is untenable. As applied here, where the Board itself reinstated a 30-day departure period and the alien, through new counsel, filed a substantial motion with an application for adjustment of status and evidence of a bona fide marriage, the Government&#x27;s rule would make the statutory right to move to reopen illusory for precisely the class of aliens — those with strong, newly available claims to lawful status — for whom Congress most plausibly preserved it. See *INS v. St. Cyr*, 533 U. S. 289 (2001) (declining to read statutes to repeal remedies absent a clear statement).</p><p>The coherent reconciliation is the one Dada sought and the Government now embraces in its own proposed rulemaking: an alien who files a motion to reopen within the voluntary departure period must be afforded the opportunity to withdraw his request for voluntary departure before the period expires, thereby forfeiting the leniency but avoiding the ten-year bar and preserving eligibility for other relief. Withdrawal keeps the alien &quot;on the same level playing field&quot; as aliens who never sought voluntary departure. The regulation, 8 C. F. R. § 1003.2(d), merely conditions the validity of a motion on filing before expiration of the departure period; it nowhere says that an alien may not withdraw the voluntary departure request, and it cannot fairly be read to extinguish the statutory motion to reopen. The Board&#x27;s contrary practice — treating the order as final and unamendable absent a pre-order request, and denying Dada&#x27;s express request for withdrawal — was an unreasonable construction of the agency&#x27;s own rule and an unacceptable encroachment on the statutory right to seek reopening.</p><p>Dada did everything the situation allowed: he filed a colorable motion to reopen within the window, and he simultaneously asked the Board to withdraw the voluntary departure grant so that the ten-year bar would not attach. The Board&#x27;s denial of that request, and the Fifth Circuit&#x27;s affirmance of it, cannot stand.</p><p>IV. Disposition</p><p>We hold that the filing of a motion to reopen does not automatically toll the voluntary departure period, but that an alien who timely files such a motion must be permitted to withdraw his request for voluntary departure before the period expires. The withdrawal remedy is a necessary qualification of § 1003.2(d) as it now reads; the Attorney General remains free to address these matters by regulation, as the Government&#x27;s current rulemaking contemplates. The judgment of the Court of Appeals is vacated, and the case is remanded to that court with instructions to return the matter to the agency so that Dada may withdraw his voluntary departure request, without prejudice to the adjudication of his motion to reopen on its merits.</p><p>RULING: Petitioner</p>", "error": "The Fifth Circuit dismissed Dada's petition for review for lack of jurisdiction.", "truth": "The Fifth Circuit upheld the BIA's denial and held that, because Dada's voluntary-departure period had expired, he was subject to the 10-year re-entry bar.", "nmarks": 3}, {"id": "C034", "text": "<p>Opinion of the Court</p><p>I. Procedural History</p><p>In 1996, four employees of the Tardy Furniture Store in Winona, Mississippi, were killed during an armed robbery. Curtis Giovanni Flowers was prosecuted six times for offenses arising from those killings.</p><p><mark class='err' data-n='1'>Flowers’s first conviction was reversed by the Mississippi Supreme Court because evidence concerning the other victims had deprived him of a fair trial.</mark> His second conviction was reversed on the same ground.<mark class='err' data-n='2'> At the third trial, Flowers was convicted of all four murders and sentenced to death, but the Mississippi Supreme Court reversed after finding racial discrimination in the prosecution’s exercise of peremptory challenges.</mark> The fourth and fifth trials ended in mistrials when the juries could not reach unanimous verdicts.</p><p><mark class='tru' data-n='3'>At the sixth trial, the State again prosecuted Flowers for all four murders.</mark> The prosecution exercised six peremptory challenges, five of them against African American prospective jurors. Flowers raised an objection under *Batson v. Kentucky*, contending that the strikes were racially motivated.<mark class='tru' data-n='4'> The trial court rejected the objection, and Flowers was convicted and sentenced to death.</mark></p><p><mark class='err' data-n='5'>The Mississippi Supreme Court affirmed.</mark> This Court then directed that court to reconsider the jury-selection issue in light of *Foster v. Chatman*.<mark class='tru' data-n='6'> On remand, the Mississippi Supreme Court again upheld Flowers’s conviction and rejected his *Batson* claim.</mark> We granted certiorari to determine whether that court erred in its application of *Batson*.</p><p><mark class='tru' data-n='7'>The State argues that Flowers’s claim was procedurally defaulted.</mark><mark class='tru' data-n='8'> But the state courts adjudicated the jury-selection question, and the Mississippi Supreme Court reaffirmed its ruling on the merits after this Court’s remand.</mark> The question properly before us is whether that merits determination can stand.</p><p>II. Governing Law</p><p>The Equal Protection Clause forbids a prosecutor from exercising a peremptory challenge to exclude a prospective juror because of race. *Batson v. Kentucky* establishes a three-step process for evaluating such a claim.</p><p>First, the defendant must make a prima facie showing that the strike was exercised on the basis of race. Second, the prosecutor must offer a facially race-neutral reason for the strike. Third, the trial court must determine whether, considering all relevant circumstances, the defendant has proved purposeful discrimination.</p><p>The third step is not satisfied merely because the prosecutor can articulate a reason that does not expressly refer to race. The court must decide whether the stated reason was the prosecutor’s genuine reason or instead a pretext for discrimination. That inquiry may include the prosecutor’s pattern of strikes, disparate questioning of prospective jurors, comparisons between struck minority jurors and similarly situated jurors who were accepted, the plausibility and evidentiary support for the stated explanations, and the prosecutor’s history of jury selection in the same or related proceedings. See *Miller-El v. Dretke*; *Snyder v. Louisiana*; *Foster v. Chatman*.</p><p>A trial court’s determination regarding discriminatory intent ordinarily receives substantial deference because it may depend on credibility and demeanor. But deference is not abdication. A finding is clearly erroneous when, upon review of the entire record, the evidence leaves the Court with a firm conviction that an error occurred. Moreover, *Batson* requires assessment of the evidence cumulatively, rather than consideration of each fact in isolation.</p><p>III. Application</p><p>The relevant evidence, considered as a whole, establishes that race was a substantial factor in the prosecution’s exercise of peremptory challenges at Flowers’s sixth trial.</p><p>First, the numerical pattern is stark. In the first four trials, the prosecutor exercised 36 peremptory challenges against African American prospective jurors and none against white prospective jurors. At the sixth trial, five of the State’s six peremptory challenges were directed at African American prospective jurors. Numbers alone do not necessarily prove discriminatory intent, particularly in a small community where repeated trials may produce unusual patterns of familiarity among jurors, witnesses, and the accused. But this record presents much more than numbers alone.</p><p>Second, the history is unusually probative.<mark class='err' data-n='9'> The same prosecutor repeatedly tried the same defendant for the same underlying events, and the Mississippi Supreme Court had previously reversed one of Flowers’s convictions because of the prosecutor’s racially discriminatory jury selection.</mark> The State acknowledges that history is relevant but urges that it is confined to this unusual case. That limitation diminishes rather than increases the force of the State’s position. Conduct involving the same prosecutor, the same defendant, and substantially the same prosecution is especially informative as to the prosecutor’s purpose.</p><p>Third, the prosecution subjected African American prospective jurors to markedly more extensive questioning. The struck African American jurors were asked an average of approximately 29 questions each, while seated white jurors were asked an average of about 1.1 questions each. Follow-up questions may be appropriate when a prospective juror has a connection to the parties or witnesses. The repeated trials in a town of approximately 5,000 people also provide some legitimate explanation for heightened attention to such relationships. Those considerations prevent the disparity from being conclusive by itself.</p><p>They do not, however, adequately explain its magnitude or its racial concentration. The prosecutor pursued possible disqualifying information aggressively when questioning African American jurors but did not employ a comparable approach with white jurors. Selective questioning may create the very record later invoked to justify selective strikes. It therefore bears directly on whether the asserted reasons were genuine.</p><p>Fourth, the prosecution conducted out-of-court investigation concerning three African American prospective jurors. Investigation is not inherently improper, and a prosecutor may investigate when there is reason to doubt a juror’s answers. But the selective nature of the investigation is relevant. In at least one instance, the prosecution challenged a prospective juror’s account of a workplace relationship and represented that supporting records could be produced, yet the cited documentation was not supplied. This weakens the asserted factual basis for the resulting concern.</p><p>The State responds that each challenged juror had an individualized, race-neutral basis for exclusion: some worked with or were related to persons connected to Flowers or his family, and one allegedly gave a false answer on her questionnaire before acknowledging it during questioning. These are legitimate subjects of inquiry and could, in an appropriate record, support peremptory challenges. Flowers has not shown that every reason offered by the prosecutor was implausible or that every challenged juror was indistinguishable from every accepted white juror.</p><p>But that is not the governing test. The question is whether the State’s explanations, evaluated against all the circumstances, overcome the evidence of discriminatory purpose. They do not. Facially neutral explanations cannot be separated from the extraordinary strike history, the prior adjudicated violation in the same prosecution, the five-of-six pattern at the sixth trial, the pronounced disparity in questioning, and the selective investigations.<mark class='tru' data-n='10'> The Mississippi Supreme Court treated the State’s stated reasons too discretely and failed to give appropriate cumulative weight to the surrounding evidence.</mark></p><p>We do not hold that a prosecutor’s past violation automatically invalidates every later peremptory challenge, nor that disparate questioning invariably establishes discrimination. We hold only that, on this exceptional record, all relevant circumstances together compel the conclusion that the trial court’s acceptance of the State’s explanations was clearly erroneous.</p><p>IV. Disposition</p><p><mark class='err' data-n='11'>The Mississippi Supreme Court erred in upholding the rejection of Flowers’s *Batson* claim.</mark> Its judgment is reversed, and the case is remanded for further proceedings not inconsistent with this opinion.</p><p>RULING: Petitioner</p>", "error": "The Mississippi Supreme Court dismissed Flowers’s Batson claim as procedurally defaulted.", "truth": "The Mississippi Supreme Court rejected Flowers’s jury-selection arguments and, on remand, again upheld the ruling for the State; it did not dismiss his Batson claim as procedurally defaulted.", "nmarks": 11}, {"id": "C035", "text": "<p>RULING</p><p>In the Matter of the Retroactive Application of *Ramos v. Louisiana* on Federal Collateral Review</p><p>---</p><p>Preliminary Note on the Parties and the Record</p><p>Before turning to the merits, the Court clarifies the designations. The briefs are captioned &quot;petitioner&quot; and &quot;respondent,&quot; but the arguments within them use those labels as they were used in the courts below, where Edwards was the petitioning habeas applicant. In this Court, the party designated Petitioner is the party urging that *Teague v. Lane*, 489 U.S. 288 (1989), bars retroactive application of *Ramos v. Louisiana*, 590 U.S. 83 (2020), on federal collateral review. The party designated Respondent is Edwards, who urges retroactivity. The Court decides the question presented on its merits and enters judgment for the party whose position on that question prevails.</p><p>The Court also notes two immaterial discrepancies in the record: the facts state that Edwards&#x27;s conviction became final in 2010, while Petitioner&#x27;s submission refers to 2011. Nothing turns on the difference. Both dates precede *Ramos* by a decade, and both postdate *Teague* by two decades.</p><p>I. Procedural History</p><p>Thedrick Edwards was tried in Louisiana state court in 2006 on several counts of armed robbery, kidnapping, and rape. The State exercised its peremptory challenges to remove all but one African-American venireperson. Edwards, who is Black, was convicted by divided juries; at least one juror voted to acquit on every count, and on some counts two did.<mark class='err' data-n='1'> Louisiana law then permitted conviction by a 10-2 vote.</mark> He was sentenced to life imprisonment without parole.</p><p>Edwards pursued direct review unsuccessfully, and his conviction became final in 2010. State postconviction relief was denied. He then sought a writ of habeas corpus in federal district court under 28 U.S.C. § 2254, raising, among other claims, a challenge to the nonunanimous verdicts. The district court denied relief, bound by *Apodaca v. Oregon*, 406 U.S. 404 (1972), which had permitted nonunanimous state jury verdicts. The Court of Appeals for the Fifth Circuit denied a certificate of appealability, concluding that no reasonable jurist could debate the district court&#x27;s resolution.</p><p>On April 20, 2020, while Edwards&#x27;s petition for certiorari was pending, this Court decided *Ramos v.<mark class='err' data-n='2'> Louisiana*, holding that the Sixth Amendment right to a jury trial, as incorporated against the States by the Fourteenth Amendment, requires a unanimous verdict to convict of a serious offense, and expressly overruling *Apodaca*.</mark> Certiorari was granted to decide whether *Ramos* applies retroactively to convictions already final when it was decided.</p><p>II. Governing Law</p><p>Under *Teague v. Lane* and its progeny, a federal court may not announce or apply a &quot;new rule&quot; of constitutional criminal procedure on collateral review of a final conviction, subject to two narrow exceptions.</p><p>A. Newness. A rule is &quot;new&quot; unless it &quot;was dictated by precedent existing at the time the defendant&#x27;s conviction became final.&quot; *Teague*, 489 U.S. at 301. The inquiry is objective: a result is dictated by precedent only if it would have been &quot;apparent to all reasonable jurists.&quot; *Lambrix v. Singletary*, 520 U.S. 518, 527–28 (1997); *accord Butler v. McKellar*, 494 U.S. 407, 415 (1990) (rule was new though it was &quot;controlled&quot; by an earlier decision, because the outcome was &quot;susceptible to debate among reasonable minds&quot;); *Saffle v. Parks*, 494 U.S. 484, 488 (1990). That a decision is a &quot;logical extension&quot; or even a plausible corollary of prior holdings does not make it old. *Sawyer v. Smith*, 497 U.S. 227, 236 (1990). Conversely, &quot;[t]he explicit overruling of an earlier holding no doubt creates a new rule.&quot; *Whorton v. Bockting*, 549 U.S. 406, 416 (2007).</p><p>B. The substantive exception. A rule is substantive, and applies retroactively, if it places certain conduct or classes of persons beyond the State&#x27;s power to punish or prohibits a category of punishment for a class of defendants. *Schriro v. Summerlin*, 542 U.S. 348, 351–52 (2004); *Montgomery v. Louisiana*, 577 U.S. 190 (2016). Rules that &quot;regulate only the manner of determining the defendant&#x27;s culpability&quot; are procedural. *Summerlin*, 542 U.S. at 353.</p><p>C. The watershed exception. A new procedural rule applies retroactively only if it is a &quot;watershed rule[] of criminal procedure implicating the fundamental fairness and accuracy of the criminal proceeding.&quot; *Saffle*, 494 U.S. at 495. Two requirements must both be met: (1) the rule must be &quot;necessary to prevent an impermissibly large risk of an inaccurate conviction,&quot; and (2) it must &quot;alter our understanding of the *bedrock procedural elements* essential to the fairness of a proceeding.&quot; *Whorton*, 549 U.S. at 418 (emphasis in original). The class is &quot;extremely narrow,&quot; *Summerlin*, 542 U.S. at 352, and this Court has never once found a rule to qualify since *Teague* was decided. *Gideon v. Wainwright*, 372 U.S. 335 (1963), remains the sole illustration the Court has offere
