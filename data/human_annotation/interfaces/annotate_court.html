<script>
const SCEN="court"; const ITEMS=[{"id": "C001", "text": "<p>Opinion of the Court</p><p>I. Procedural History</p><p>The National Institute of Family and Life Advocates and two other religiously affiliated organizations providing pregnancy-related services in California (collectively, “NIFLA”) brought this action to enjoin enforcement of the California Reproductive Freedom, Accountability, Comprehensive Care, and Transparency Act.</p><p>The Act requires licensed clinics to notify patients that California provides free or low-cost publicly funded family-planning services, including contraception and abortion. It separately requires unlicensed facilities to disclose that they are not licensed medical providers. NIFLA alleged that these requirements compel speech contrary to its beliefs, in violation of the First Amendment as applied to the States through the Fourteenth Amendment.</p><p>The United States District Court for the Southern District of California denied NIFLA’s motion for a preliminary injunction. Applying *Winter v. Natural Resources Defense Council, Inc.*, 555 U.S. 7 (2008), it concluded that NIFLA had not shown a likelihood of success on either its free-speech or free-exercise claim.</p><p>The Court of Appeals for the Ninth Circuit affirmed. It recognized that the licensed notice compelled content-based speech, but held that the notice was not viewpoint discriminatory and classified it as regulation of “professional speech.” The court therefore applied intermediate scrutiny and concluded that the requirement survived. It also upheld the unlicensed-facility disclosure. NIFLA sought further review, and the question before this Court is whether the Act’s compelled disclosures violate the Free Speech Clause.</p><p>II. Governing Law</p><p>The First Amendment generally prohibits government from restricting speech because of its content. It likewise protects the right to refrain from speaking. A law that requires a person to convey a government-selected message is ordinarily content based because enforcement depends upon the subject matter of the mandated communication. Such laws are presumptively unconstitutional and must ordinarily withstand strict scrutiny: the government must demonstrate that the regulation is narrowly tailored to serve a compelling governmental interest.</p><p>The absence of viewpoint discrimination does not eliminate this constitutional concern. A law may be content based—and therefore subject to heightened scrutiny—even if it does not favor one side of a debate over another.</p><p>This Court has recognized limited contexts in which compelled disclosures receive less demanding review. Under *Zauderer v. Office of Disciplinary Counsel*, the government may require certain purely factual and uncontroversial disclosures in commercial advertising, provided the requirement is reasonably related to a legitimate governmental interest and is neither unjustified nor unduly burdensome. Similarly, *Planned Parenthood of Southeastern Pennsylvania v. Casey* permitted the regulation of speech occurring as part of the informed-consent process for a medical procedure. That rule reflects the State’s authority to regulate professional conduct even when the regulation incidentally requires speech.</p><p>But speech does not receive diminished First Amendment protection merely because it is uttered by a professional. “Professional speech” is not a freestanding category of lesser-protected expression.<mark class='tru' data-n='1'> Outside established doctrines governing commercial disclosures and speech incidental to professional conduct, content-based regulation remains subject to the ordinary First Amendment rules.</mark></p><p>At the preliminary-injunction stage, a plaintiff must establish, among other things, a likelihood of success on the merits. When an appellate court’s assessment of that factor rests on an erroneous legal standard, its judgment cannot stand.</p><p>III. Application</p><p>#### A. The licensed-clinic notice</p><p>The licensed notice is content based. It requires covered clinics to convey a prescribed message concerning the availability of publicly funded reproductive services, expressly including contraception and abortion. NIFLA’s clinics must communicate that message even though it conflicts with the purposes for which they engage in pregnancy counseling.</p><p><mark class='tru' data-n='2'>The Ninth Circuit erred by treating this requirement as subject to intermediate scrutiny merely because it regulates speech by licensed professionals.</mark> The government may regulate medical conduct and may impose appropriate informed-consent requirements, but the licensed notice does not fit that rule. Unlike the disclosure upheld in *Casey*, it is not triggered by a provider’s proposal to perform a particular medical intervention, nor is it confined to communicating the risks, benefits, and alternatives relevant to a procedure for which the patient’s informed consent is required. Instead, it directs clinics to inform patients about government programs and services—including abortion—that the clinics do not provide.</p><p>Respondent’s asserted interest is substantial. Ensuring that low-income women receive timely information about available medical and financial assistance can promote informed choice and access to care. Respondent also reasonably observes that pregnancy-related care is time sensitive and that facilities serving women seeking free or low-cost services are places where the information may be useful.</p><p>Those considerations do not, however, establish the required tailoring. The Act makes selected private speakers deliver the State’s message while exempting other providers serving pregnant women. Even accepting that a legislature may address a problem incrementally, the selective scope of the mandate weakens the claim that compelling these particular speakers is necessary. California has not shown why it could not communicate information about its programs through its own advertising, public-information campaigns, or other means that do not conscript private organizations to promote services contrary to their message.</p><p>Petitioner characterizes the Act as deliberately targeting disfavored viewpoints. The present disposition does not require a conclusive finding of viewpoint discrimination. The notice is expressly content based, and California has not demonstrated that it is narrowly tailored even under that characterization. NIFLA therefore has shown a likelihood of success on its challenge to the licensed notice.</p><p>#### B. The unlicensed-facility notice</p><p>The unlicensed notice presents a somewhat different issue. A disclosure that a facility lacks a medical license is factual, and the State has a legitimate interest in preventing patients from mistakenly believing that an unlicensed facility offers licensed medical care. Such a disclosure is not unconstitutional simply because the covered entity would prefer not to make it.</p><p>But a legitimate interest does not give the State unrestricted authority to dictate speech. Even assuming that the more deferential *Zauderer* standard applies, a compelled factual disclosure may not be unjustified or unduly burdensome. The government must show a sufficient relationship between the identified harm and the scope of the disclosure obligation.</p><p>On this record, California has not supplied an adequate justification for imposing the challenged advertising and disclosure requirements in their full breadth. The State’s generalized interest in informing patients does not itself establish that covered facilities were misleading the public about their licensing status or that the particular mandate and its application to advertising were reasonably tailored to address demonstrated confusion. A disclosure regime whose practical demands overwhelm or materially displace the speaker’s own message cannot be sustained merely by labeling the compelled words factual.</p><p>The Court need not decide whether every narrowly drawn requirement to disclose unlicensed status would violate the First Amendment. It holds only that NIFLA has demonstrated a likelihood of success against the requirement presented here, including its burdensome application to the facilities’ communications and advertising.</p><p>IV. Disposition</p><p><mark class='tru' data-n='3'>The Ninth Circuit applied an impermissibly deferential standard to the licensed notice by recognizing “professional speech” as a distinct category subject to reduced First Amendment protection.</mark> The licensed notice compels content-based speech and has not been shown to survive the scrutiny that such regulation requires. The unlicensed notice, even considered under the more deferential standard applicable to certain factual disclosures, has not been adequately justified in relation to its burdens.</p><p>Accordingly, the judgment of the Court of Appeals is reversed, and the case is remanded for further proceedings consistent with this opinion, including consideration of the remaining preliminary-injunction factors under the correct First Amendment standards.</p><p>RULING: Petitioner</p>", "error": "The Ninth Circuit subjected the Act to rational-basis review.", "truth": "The Ninth Circuit treated the speech regulated by the Act as professional speech subject to intermediate scrutiny.", "nmarks": 3}, {"id": "C002", "text": "<p>RULING</p><p>I. Procedural History</p><p>Wireless service providers seeking to build towers or attach equipment to existing structures must obtain state and local zoning approvals. In 2008, the Wireless Association petitioned the Federal Communications Commission (&quot;FCC&quot;), contending that local zoning authorities were unreasonably delaying decisions on wireless siting applications, notwithstanding Congress&#x27;s mandate—added by amendment to the Communications Act of 1934—that local governments act on such requests &quot;within a reasonable period of time.&quot; In November 2009, the FCC issued a declaratory ruling holding that, as a matter of federal law, a reasonable period is presumptively 90 days for collocation applications and 150 days for new tower applications.</p><p>Petitioner local governments (the City of Arlington and the intervenor municipalities) challenged the ruling in the U.S.<mark class='tru' data-n='1'> Court of Appeals for the Fifth Circuit, arguing that the FCC lacked authority to issue it.</mark><mark class='tru' data-n='2'> The Fifth Circuit deferred to the FCC&#x27;s construction of its statutory authority under the Chevron framework, treating the interpretation as a permissible construction of the Communications Act, and affirmed the declaratory ruling.</mark></p><p>Petitioners sought certiorari, and this Court granted review on a single question: whether a court should apply Chevron deference to an agency&#x27;s interpretation of its own statutory authority when that interpretation is called into question.<mark class='err' data-n='3'> The merits of the FCC&#x27;s interpretation—whether the declaratory ruling is in fact a permissible construction of § 332(c)(7)—are not before us.</mark></p><p>II. Governing Law</p><p>Under the Chevron doctrine, where a statute administered by an agency is ambiguous, and the agency&#x27;s construction is a permissible reading, the court must defer to the agency&#x27;s interpretation rather than adopt its own preferred reading. Petitioners urge a carve-out: that questions going to the *scope of the agency&#x27;s own authority*—its &quot;jurisdiction&quot;—must be resolved by courts de novo, without deference, because an agency cannot be permitted to determine the extent of its own power.</p><p>Petitioners&#x27; proposed rule cannot be sustained. The distinction it draws is illusory. The question in every such case is the same: has the agency acted within the scope of its delegated statutory authority? Petitioners themselves cannot agree on where the line falls—one party would confine the no-deference rule to questions of &quot;interpretive authority,&quot; while another would extend it to any question touching &quot;the who, what, when or where&quot; of an agency&#x27;s assertion of authority. A rule that turns on such an unstable distinction would invite an attack on deference in every case, since any substantive challenge can be reframed as an argument that the agency &quot;exceeded the scope of its delegated authority.&quot; Adopting such a rule would unravel the stabilizing work that Chevron performs, producing repeated de novo judicial determinations that ossify the administrative process and shift interpretive primacy from the accountable agency to the courts.</p><p>The proper analysis proceeds in two stages. First, a court asks whether Congress delegated authority to the agency generally to act with the force of law, and whether the interpretation at issue is an exercise of that delegated authority. This threshold inquiry is conducted by the court de novo. Second, once delegation is established, ordinary Chevron analysis applies: at Step One, the court uses the traditional tools of statutory construction to ask whether Congress has spoken clearly to the precise question at issue; if Congress has, that answer controls. If the statute is silent or ambiguous, the court proceeds to Step Two and asks whether the agency&#x27;s construction—whether labeled &quot;jurisdictional&quot; or &quot;substantive&quot;—is a permissible one, i.e., within the bounds of what the statutory language can reasonably accommodate. If it is, the agency&#x27;s interpretation stands.</p><p>This Court&#x27;s precedent is consistent with that approach. In *American Hospital Ass&#x27;n v. NLRB*, the Court rejected an argument that a specific provision carved case-by-case decisionmaking out of the Board&#x27;s general rulemaking authority, holding the resulting ambiguity was resolved in the agency&#x27;s favor under Chevron. *CFTC v. Schor* and *Iowa Utilities Board* reflect the same pattern: once general authority was established, the Court looked for clear evidence that Congress intended to carve the particular provision out of that authority, and absent such clarity, deferred. Petitioners&#x27; contrary authorities do not compel a different result: *Louisiana Public Service Commission* construed an express statutory carveout—nothing &quot;shall be construed to give&quot; the Commission jurisdiction over intrastate communications—and so would have been resolved at Chevron Step One; *Adams Fruit* turned on the plain meaning of the statutory provision, which foreclosed the agency&#x27;s reading. Those cases apply Chevron&#x27;s first step, not a freestanding jurisdictional exception.</p><p>III. Application</p><p>The Fifth Circuit&#x27;s approach was correct in structure, whatever the ultimate merits. The threshold question—whether the FCC possesses authority to act with the force of law under the Communications Act generally, through § 201(b)—is one for the courts de novo. Once that delegation is satisfied, the question whether § 332(c)(7)(B)(ii)&#x27;s &quot;reasonable period of time&quot; provision is within that delegated authority is answered under ordinary Chevron analysis. There is no separate, deference-free category of &quot;jurisdictional&quot; interpretation.</p><p>Petitioners&#x27; strongest merits argument—that § 332(c)(7)(A)&#x27;s preservation of local zoning authority (&quot;Except as provided in this paragraph, nothing in this Act shall limit or affect the authority of a State or local government&quot;), § 332(c)(7)(B)(v)&#x27;s location of enforcement power in the courts, and the conference history of the 1996 Act demonstrate that Congress reserved the interpretation of &quot;reasonable period of time&quot; to the courts—is an argument that Congress has spoken clearly to the precise question at issue, and therefore that the FCC loses at Chevron Step One. But that is simply the ordinary operation of Chevron, not a reason to withhold deference altogether. And petitioners&#x27; structural objection loses much of its force here, because the limitations at issue were imposed by Congress itself in subsection (B); the FCC is implementing Congress&#x27;s judgments, not weighing in on its own to displace state authority—much as the agency implemented the preemptive scope of &quot;interest&quot; in *Smiley*.</p><p>We do not decide today whether the FCC&#x27;s 90-day and 150-day presumptions are in fact a permissible construction of the Act. That question was not within the question presented on which certiorari was granted. The Fifth Circuit applied the correct framework, and its judgment in that respect is undisturbed; the merits determination remains for remand under the analysis described above.</p><p>IV. Disposition</p><p>The judgment of the U.S.<mark class='tru' data-n='4'> Court of Appeals for the Fifth Circuit is affirmed insofar as it applied Chevron deference to the FCC&#x27;s interpretation of its statutory authority, and the case is remanded for further proceedings consistent with this opinion.</mark> Chevron deference applies to an agency&#x27;s interpretation of its own statutory authority; the proper safeguard is Chevron Step One, under which courts retain the de novo task of enforcing the clear limits that Congress has enacted, not a freestanding exception to deference for &quot;jurisdictional&quot; questions.</p><p>RULING: Petitioner</p>", "error": "The Fifth Circuit reviewed the jurisdictional ambiguity de novo and reversed the FCC's declaratory ruling.", "truth": "The U.S. Court of Appeals for the Fifth Circuit deferred to the FCC and affirmed the FCC's declaratory ruling.", "nmarks": 4}, {"id": "C003", "text": "<p>Lozman v. City of Riviera Beach</p><p>I. Procedural History</p><p>Petitioner Fane Lozman, a resident of the City of Riviera Beach, was a persistent critic of the City&#x27;s plan to use its eminent domain power to redevelop the Riviera Beach Marina. After he filed suit under the Florida Sunshine Law challenging the approval of the redevelopment plan, the city council met in closed session, where the transcript suggests councilmembers discussed using intimidation tactics against him. At a subsequent open council meeting, Lozman was granted time to speak during the public-comment period. When he turned to the subject of corruption in local government, a councilmember directed him to stop; he persisted, and she instructed a City police officer to arrest him. He was charged with, inter alia, disturbing a lawful assembly. The prosecutor found probable cause for the arrest but declined to pursue the charges as unlikely to succeed.</p><p>Lozman sued the City under 42 U.S.C. § 1983, alleging (1) First Amendment retaliatory arrest, (2) unreasonable seizure under the Fourth Amendment, and (3) common-law false arrest. The case was tried to a jury in November 2014, with Lozman appearing pro se.<mark class='tru' data-n='1'> The jury returned a verdict for the City on all claims, and the district court denied Lozman&#x27;s motion for a new trial.</mark><mark class='err' data-n='2'> On appeal, Lozman argued that the district court erred in instructing the jury that the existence of probable cause defeated his First Amendment retaliatory-arrest claim as a matter of law.</mark> The Court of Appeals for the Eleventh Circuit affirmed, reading this Court&#x27;s decision in *Hartman v. Moore*, 547 U.S. 250 (2006), to establish a flat rule that probable cause bars a First Amendment retaliatory-arrest claim. We granted certiorari to resolve a circuit split on the question whether the establishment of probable cause defeats a claim of retaliatory arrest under the First Amendment as a matter of law.</p><p>II. Governing Law</p><p>The First Amendment protects the right &quot;to petition the Government for a redress of grievances,&quot; and government retaliation against a person because he has exercised that right — or because of his other protected speech — is itself a constitutional violation. To prevail on a First Amendment retaliation claim, a plaintiff must show (1) that he engaged in protected activity, (2) that the government took adverse action against him, and (3) that there was a causal connection between the two. Where, as in the arrest context, the adverse action is something the government would have had authority to take absent the retaliatory motive, the causation element requires the plaintiff to bear his burden under *Mt. Healthy City School District Board of Education v. Doyle*, 429 U.S. 274 (1977): once a plaintiff demonstrates that retaliation was a &quot;but-for&quot; cause of the challenged action, the government can defeat the claim by showing that it would have taken the same action even in the absence of the protected conduct.</p><p>In *Hartman v. Moore*, the Court held that a retaliatory-prosecution plaintiff must plead and prove the absence of probable cause for the underlying charge. That holding rested on features distinctive to the prosecutorial context: the Court emphasized the difficulty of proving the causation chain where an independent prosecutor — cloaked in absolute immunity and presumed to act on the basis of lawful, professional judgment — intervenes between the defendant&#x27;s animus and the injury. Requiring proof of the absence of probable cause was, in that setting, a practical proxy for the plaintiff&#x27;s burden of showing that the protected conduct caused the prosecution, and it served to protect the prosecutor&#x27;s independent decisionmaking from judicial second-guessing.</p><p>Nothing in *Hartman* compels extension of its no-probable-cause pleading requirement to retaliatory-arrest claims. The concerns that drove that decision — absolute prosecutorial immunity, the presumption of prosecutorial independence, and the consequent evidentiary obscurity of the causal chain — are largely absent when a police officer, acting at the direction of or in concert with a local official, makes the arrest himself. The arresting officer is the defendant or the agent of the defendant; the causal nexus between retaliatory animus and the deprivation is comparatively direct; and § 1983 supplies a damages remedy &quot;[e]very person&quot; who, under color of law, deprives another of rights secured by the Constitution — a remedial statute that should not be read to carve out an exception the common law never recognized.</p><p>At the same time, probable cause is not irrelevant. Although it does not operate as an automatic, categorical bar, the presence of probable cause bears directly on the *Mt. Healthy* causation inquiry. If the government establishes that the arresting officer would have made the same arrest even without the protected speech — for example, because the arrestee genuinely violated a neutral ordinance that the officer had independent grounds to enforce — there is no constitutional injury attributable to the retaliation. And in the ordinary case, an officer&#x27;s testimony that he was unaware of the plaintiff&#x27;s protected activity will establish a lack of retaliatory animus at all. The objective existence of probable cause thus functions as evidence on causation, not as a per se defense.</p><p>III. Application</p><p>Applying these principles to this record, we conclude that the Eleventh Circuit erred in treating probable cause as an absolute bar to Lozman&#x27;s First Amendment retaliatory-arrest claim.</p><p>Lozman engaged in activity at the core of the First Amendment: he filed a lawsuit — an invocation of the right to petition — and he criticized local officials and alleged government corruption in a public forum. The closed-session transcript, in which councilmembers discussed intimidation tactics for fighting his lawsuit, was evidence from which a reasonable jury could infer that the instruction to arrest him at the meeting was motivated by his protected activity. The City disputes this characterization, pointing out that only one councilmember expressed frustration and that Officer Aguirre testified he made an independent decision to arrest Lozman and had never heard of him before the incident. Those are legitimate factual arguments — but that is precisely the point. They go to the existence of retaliatory animus and to causation, questions for the jury under the *Mt. Healthy* framework, not questions of law for the court.</p><p>The City&#x27;s principal policy argument — that officers must be able to consider speech in the field (as when breaking up a disturbance) and need an objective standard for their conduct — is fully answered by the structure we adopt. Qualified immunity continues to protect officers who act reasonably in ambiguous circumstances; the pleading standards continue to screen out speculative claims; and the *Mt. Healthy* framework itself requires the plaintiff to prove that retaliation was a but-for cause of the arrest and gives the government the decisive rebuttal of showing it would have arrested the plaintiff anyway. The long-standing common-law rule that probable cause defeats a claim for malicious prosecution or false arrest has never been understood to immunize retaliation as such; § 1983 was enacted to provide a federal remedy for deprivations of federal rights, and the First Amendment right to be free of retaliatory arrest is such a right.</p><p><mark class='err' data-n='3'>Because the jury was instructed, in substance, that the existence of probable cause defeated the retaliatory-arrest claim as a matter of law, Lozman was deprived of the opportunity to have the jury decide whether his protected speech was a but-for cause of his arrest, and whether the City would have arrested him anyway.</mark> That error infected the verdict on his First Amendment claim.<mark class='err' data-n='4'> The Fourth Amendment and common-law false-arrest claims stand on different footing — probable cause does defeat those claims as a matter of law — but the First Amendment claim must be evaluated under the causation framework described above.</mark></p><p>We express no view on the ultimate merits of Lozman&#x27;s claim. On the facts, the City retains substantial defenses, including Officer Aguirre&#x27;s testimony of independent decisionmaking and the *Mt. Healthy* showing that the arrest would have occurred regardless of Lozman&#x27;s speech. Our holding is confined to the legal question presented: probable cause does not, without more, defeat a First Amendment retaliatory-arrest claim as a matter of law.</p><p>IV. Disposition</p><p>The judgment of the Court of Appeals is vacated, and the case is remanded for further proceedings consistent with this opinion, including consideration whether the retaliatory-arrest claim satisfies the *Mt. Healthy* causation standard on the evidence presented.</p><p>RULING: Petitioner</p>", "error": "The jury found in favor of Lozman on his common-law false-arrest claim, while finding for the City on his constitutional claims.", "truth": "The jury found in favor of the City on all of Lozman's claims, including his common-law false-arrest claim.", "nmarks": 4}, {"id": "C004", "text": "<p>Opinion of the Court</p><p>I. Procedural History</p><p>Michael N. Currier was indicted by a single grand jury on charges of burglary, grand larceny, and possession of a firearm by a convicted felon. With the agreement of both the prosecution and the defense, the trial court severed the firearm charge from the burglary and grand larceny charges, and the case first proceeded to trial on the latter two. The jury acquitted Currier of both burglary and grand larceny. When the Commonwealth then moved to try him on the remaining firearm charge, Currier objected that principles of collateral estoppel embodied in the Double Jeopardy Clause barred the second prosecution, contending the jury&#x27;s acquittal necessarily determined that he was not the person who committed the burglary and larceny that supplied the occasion for possessing the firearm. The trial court overruled the objection; Currier was tried, convicted, and sentenced. He moved to set aside the verdict, and the trial court denied the motion.</p><p><mark class='err' data-n='1'>Currier&#x27;s counsel asserted below, and urges before this Court, that the intermediate appellate court reversed his firearm conviction on issue-preclusion grounds.</mark><mark class='tru' data-n='2'> The record before this Court, however, establishes the opposite course: the Virginia Court of Appeals affirmed the conviction, as did the Supreme Court of Virginia.</mark> We resolve the discrepancy in favor of the record. Currier then petitioned this Court for a writ of certiorari, which was granted on the question whether a defendant who consents to severance of multiple charges into sequential trials forfeits the issue-preclusive effect of an acquittal under the Double Jeopardy Clause.</p><p>II. Governing Law</p><p>Two lines of decision govern. First, the Double Jeopardy Clause embodies an issue-preclusion component, commonly called collateral estoppel: when an issue of ultimate fact has been determined by a valid and final judgment, that fact cannot be relitigated in a subsequent prosecution. *Ashe v. Swenson*, 397 U. S. 436 (1970); *Turner v. Arkansas*, 407 U. S. 251 (1972). This protection follows the defendant&#x27;s acquittal regardless of the order in which charges are tried: an acquittal entered first bars relitigation of facts necessarily resolved by it in a later trial, just as an acquittal entered second would.</p><p>Second, and decisively here, the protections of the Double Jeopardy Clause are not absolute but may be waived or forfeited by the voluntary and deliberate choices of the defendant. *United States v. Scott*, 437 U. S. 82 (1978); *Ricketts v. Adamson*, 483 U. S. 1 (1987). A defendant may consent to proceed before a judge rather than a jury, to a successive prosecution that would otherwise be barred, or to other procedural arrangements that surrender a double jeopardy protection. A defendant who seeks and obtains a benefit from the court—a benefit that would otherwise be unavailable to him—cannot then insist upon a protection that his chosen procedure eliminates. Waiver and forfeiture doctrines apply with particular force where the defendant, advised by counsel, strategically selects the procedural path that he believes serves his interest. Consent is assessed against the record as a whole, including the defendant&#x27;s own representations to the trial court.</p><p>III. Application</p><p>Petitioner&#x27;s central argument is that severance was compelled by Virginia law rather than genuinely consensual, and that therefore the acquittal in the first trial must carry its preclusive effect into the second under *Turner v. Arkansas*. This argument fails on the record.</p><p>First, as to the record: the defense and prosecution jointly agreed to severance before trial. The Commonwealth has pointed to the November 20, 2013 brief filed in support of the motion in limine, authored by the defendant himself through counsel, representing that the case needed to be severed. Petitioner&#x27;s assertion at oral argument that Virginia law required severance &quot;without respect to what the parties&quot; wished is unsupported by the record and is contradicted by the fact that the severance proceeded by agreement. Whatever the precise scope of Virginia&#x27;s joinder and severance rules, the operative fact is that the defendant, through counsel, represented to the trial court that severance was appropriate and joined in obtaining it. Virginia&#x27;s conferral of the choice upon defendants in circumstances like these is a benefit, not a burden imposed irrespective of consent.</p><p>Second, as to the law: even assuming the acquittal in the first trial would have resolved an ultimate fact of identity in a way that would otherwise preclude relitigation, petitioner&#x27;s consent to the sequential-trial structure deprived him of the ability to invoke that protection in the second trial. A defendant who elects to split a single prosecution into two trials—and thereby obtains the tactical advantage of keeping evidence of his prior conviction away from the jury in the first trial—cannot, upon acquittal, turn around and claim that the second trial is barred. The Double Jeopardy Clause protects defendants against successive prosecutions imposed upon them, not against the consequences of the procedural choices they deliberately make. To hold otherwise would convert a rule protecting the accused into a sword by which a defendant could manipulate the sequence of trials to obtain an acquittal and then extinguish the remaining charges, while a defendant who happened to be convicted in the first trial would face both verdicts. The asymmetry is intolerable, and the doctrine of consent prevents it.</p><p>We acknowledge the force of petitioner&#x27;s argument that *Ashe* and *Turner* apply collateral estoppel to acquittals without regard to the order of trials. But those cases involved defendants who had not consented to the successive proceedings. Where consent intervenes, the preclusive protection is surrendered along with the broader double jeopardy objection to the sequential structure itself. There is no principled basis for allowing a defendant to consent to two trials yet retain the interlocking issue-preclusion effect that would exist only if the charges had been tried together or over his objection.</p><p><mark class='tru' data-n='3'>Petitioner&#x27;s reliance on the asserted holding of the intermediate appellate court is unpersuasive for the additional reason that the record contradicts it: both Virginia courts below affirmed the conviction.</mark> The question presented—whether consent to severance forfeits the issue-preclusive effect of an acquittal—does not depend on Virginia&#x27;s specific severance rules, and we need not resolve any dispute about them beyond noting that the severance here was joined in by the defense.</p><p>Finally, we note that counsel for petitioner&#x27;s assertion that Virginia law compelled the result he seeks, standing alone and unsupported by the record, is not a substitute for evidence. Rhetorical insistence is not merit, and we do not credit it.</p><p>IV. Disposition</p><p>Because petitioner, through counsel, consented to the severance of the firearm charge from the burglary and larceny charges, he waived his right under the Double Jeopardy Clause to claim the issue-preclusive effect of his acquittal in the first trial as a bar to the second.<mark class='tru' data-n='4'> The judgment of the Supreme Court of Virginia is affirmed.</mark></p><p>RULING: Respondent</p>", "error": "The Virginia Court of Appeals reversed Currier's firearm conviction on issue-preclusion grounds.", "truth": "The Virginia Court of Appeals affirmed Currier's conviction, and the Supreme Court of Virginia also affirmed.", "nmarks": 4}, {"id": "C005", "text": "<p>OPINION OF THE COURT</p><p>I. Procedural History</p><p>Appellant Jack Davis, a candidate for the United States House of Representatives from New York&#x27;s 26th Congressional District, financed the great bulk of his campaign from his own pocket. In doing so he crossed the $350,000 threshold set by § 319 of the Bipartisan Campaign Reform Act of 2002 — the provision commonly called the &quot;Millionaire&#x27;s Amendment.&quot; Crossing that threshold obliged him to file a declaration of intent at the outset of his candidacy and to file successive notices as his personal spending accumulated in $10,000 increments; and it relaxed, for his opponent alone, the otherwise applicable limits on individual contributions and coordinated party expenditures.</p><p>Davis sued the Federal Election Commission, contending that § 319(a) and its companion disclosure provision, § 319(b), abridge the freedom of speech guaranteed by the First Amendment and deny him the equal protection of the laws guaranteed by the Due Process Clause of the Fifth Amendment.</p><p>The three-judge district court ruled for the Commission on both counts.<mark class='err' data-n='1'> As to the First Amendment, it concluded that Davis had suffered no cognizable injury — and hence lacked standing — because § 319 places no ceiling whatever on what he may spend of his own funds; on the contrary, the court reasoned, the provision&#x27;s practical effect is to *increase* the total quantum of speech in the race by loosening the constraints on his opponent.</mark><mark class='err' data-n='2'> As to the Fifth Amendment, the court reasoned that Davis and his opponent, differently situated by reason of Davis&#x27;s disproportionate personal wealth, were not similarly situated for equal protection purposes, so that the asymmetry of which Davis complains raises no equal protection question at all.</mark></p><p>BCRA provides for direct appeal to this Court, and the case comes to us in that posture. We address standing first, then the merits.</p><p>II. Standing and Justiciability</p><p>The district court&#x27;s disposition of the standing question conflates injury with the ultimate merits. Davis does not allege that he was prevented from spending; he alleges that the act of spending — an act the First Amendment protects — was made the trigger for a legal regime that disadvantages him relative to his rival. That is an injury in fact: it is concrete (his opponent became eligible to receive contributions at triple the ordinary individual ceiling and to benefit from unlimited coordinated party expenditures), particularized to Davis, traceable to § 319, and redressable by an injunction against the provision&#x27;s enforcement. Whether that asymmetry is constitutionally *permissible* is the merits question; it is not an answer to whether Davis was hurt.</p><p>The § 319(b) reporting obligations supply an independent basis for standing. Davis was compelled, on pain of civil enforcement, to declare at the threshold of his candidacy his intention to spend more than $350,000 of his own money, and thereafter to report in $10,000 increments. Compelled disclosure is itself a cognizable burden, whatever its ultimate justification.</p><p>Nor is the controversy stale. The electoral cycle in which the injury arose has passed, but Davis remains a candidate for the same open seat — the incumbent having announced retirement — and the harm he complains of is one that recurs each cycle and expires before appellate review can be completed. The controversy is therefore capable of repetition yet evading review, and it remains live.</p><p>We hold that Davis has standing, and we turn to the merits.</p><p>III. Governing Law</p><p>The starting point is *Buckley v. Valeo*. Three of its holdings control here.</p><p><mark class='tru' data-n='3'>First, a candidate&#x27;s use of his own money to advance his own candidacy is not a &quot;contribution&quot; analogue subject to relaxed review; it is expenditure — pure political expression at the very core of the First Amendment.</mark> *Buckley* struck down § 608(a)&#x27;s cap on personal expenditures precisely because a restriction on a candidate&#x27;s spending of his own funds &quot;imposes a substantial restraint on the ability of persons to engage in protected First Amendment expression.&quot;</p><p>Second, the anticorruption rationale, which sustains limits on what others may give a candidate, has no purchase on what a candidate gives himself. A candidate cannot corrupt himself; indeed *Buckley* observed that reliance on personal resources *reduces* the candidate&#x27;s dependence on outside contributors and thus diminishes, rather than heightens, the danger the contribution limits were designed to address.</p><p>Third, and decisively, the interest in equalizing the relative financial strength of competing candidates is not a legitimate ground for burdening speech. The concept that government may restrict the speech of some elements of our society in order to enhance the relative voice of others is &quot;wholly foreign to the First Amendment.&quot; That principle does not evaporate when the government pursues equalization by handicapping rather than by silencing.</p><p>Against this background, the question is not whether § 319 imposes a *ceiling* — concededly it does not — but whether it imposes a *burden* on protected expression, and if so whether that burden is justified by a legitimate and sufficiently weighty governmental interest. A statute that attaches a detriment to the exercise of a constitutional right burdens that right as surely as one that forbids its exercise. The government may not do indirectly, by penalty, what it may not do directly, by prohibition.</p><p>IV. Application</p><p>A. Section 319(a) burdens protected expression.</p><p>Section 319(a) presents Davis with a choice the Constitution does not permit the government to impose. He may speak freely with his own resources, and thereby arm his opponent with contribution limits triple his own and with unlimited coordinated party spending; or he may curtail his own political expression to keep the ordinary, symmetrical rules in place. Either way, the price of speaking is set by statute, and it is paid in the currency of competitive disadvantage. That is a burden on speech.</p><p>The Commission answers that § 319 does not limit anything — it only expands.<mark class='tru' data-n='4'> The district court accepted this, reasoning that the provision increases the aggregate volume of campaign speech.</mark> But the First Amendment is not an aggregate-output statute. Its concern is with governmental interference with particular speakers, and a scheme that responds to one candidate&#x27;s protected expression by conferring a legal advantage on his rival interferes with that candidate no less than a direct restriction would. The Commission&#x27;s logic would validate a statute that doubled an opponent&#x27;s resources whenever a candidate published a pamphlet.</p><p>B. The asserted justifications fail.</p><p>The anticorruption interest is unavailable. The triggering conduct — self-financing — is the paradigm of non-corrupting expenditure. Worse, the statutory *response* to that non-corrupting conduct is to increase the flow of large private contributions to the opposing candidate. Section 319 thus operates not to reduce the influence of large contributors upon federal candidates, but to enlarge it, and to do so precisely in the races Congress singled out. A provision that combats corruption by tripling contribution limits is a curious remedy indeed.</p><p>What remains is the interest in leveling electoral opportunity. Counsel for the Commission candidly framed it that way: Congress judged that the problem was &quot;the combination of unlimited self-financing and relatively low hard money contribution caps,&quot; and legislated to offset the self-funder&#x27;s advantage. However sympathetically described — as identifying &quot;particularly costly races,&quot; or as an extension of the plurality&#x27;s observation in *Randall v. Sorrell* that caps set too low may entrench incumbents — that is an equalization rationale, and *Buckley* forecloses it. We add that the rationale carries a structural hazard the Commission does not dispel: the players whose relative advantage Congress calibrates include the incumbents who write the rules, and § 319 makes no accounting whatever for the formidable non-financial advantages of incumbency. As Appellant put it, the statute asks the players to call their own out-of-bounds.</p><p>C. The public-financing analogy does not hold.</p><p>The Commission&#x27;s strongest argument is that *Buckley* sustained voluntary public financing, under which a candidate forgoes private contributions in exchange for a public grant; if that conditional scheme survives, so must this one. The analogy fails on the decisive point. Public financing offers the candidate a benefit he may accept or decline, and it is available on the same terms to all. Section 319 offers Davis nothing. It confers the benefit on his adversary, and it does so *because* Davis exercised a constitutional right. A regime of voluntary choice is not the same thing as a regime of automatic penalty.</p><p>The Commission concedes that a sufficiently aggressive version of the same idea — matching an opponent two dollars for every dollar of self-financing — would operate as an effective cap and would be unconstitutional. We agree, and the concession is instructive: it acknowledges that this genre of legislation works by making self-financing costly. The difference between that hypothetical and § 319 is one of degree, not of kind, and the constitutional defect is present in both.</p><p>D. The disclosure provision.</p><p>Section 319(b) requires a declaration of intent at the outset of a candidacy and incremental reports thereafter. The Commission is right that a candidate&#x27;s disclosure of his own spending implicates weaker associational interests than ordinary contributor disclosure. But that observation, while it lightens the burden, does not supply a justification. The candidate&#x27;s personal expenditures are already reported through the ordinary quarterly and pre-election filings; the electorate learns nothing from § 319(b) that it would not otherwise learn. The Commission&#x27;s own explanation confirms the point: the incremental notices are &quot;necessary in order for the substantive provisions of the statute to operate,&quot; so that the opponent may keep raising funds at the elevated limits as the election nears. Section 319(b) exists to operate § 319(a). Having found the latter invalid, we find that the former serves no surviving governmental interest and must fall with it.</p><p>E. The Fifth Amendment claim.</p><p>Because § 319 cannot stand under the First Amendment, we need not resolve the equal protection question, and we intimate no view on it. We note only that the district court&#x27;s rationale — that unequal wealth renders the two candidates not similarly situated — proves too much. The relevant classification drawn by § 319 is not between rich and poor but between a candidate who has exercised the right to spend his own funds and one who has not. Differential treatment defined by the exercise of a constitutional right is not immunized from review by the observation that those who exercise the right differ from those who do not. The Commission&#x27;s own submission recognizes as much: it concedes that a statute relaxing the caps for *both* candidates would raise the identical First Amendment question — which is to say that the vice here lies in the trigger, not merely in the asymmetry.</p><p>V. Disposition</p><p><mark class='err' data-n='5'>Davis has standing to press his First Amendment challenge.</mark> Section 319(a) of the Bipartisan Campaign Reform Act imposes a substantial and impermissible burden on a candidate&#x27;s exercise of the core First Amendment right to advocate his own election with his own resources, and it is not supported by any legitimate governmental interest: the anticorruption rationale is inapplicable and indeed inverted, and the equalization rationale is foreclosed by *Buckley*. Section 319(b), which exists solely to implement § 319(a), cannot survive independently. We do not reach the Fifth Amendment claim.</p><p>The judgment of the district court is reversed, and the case is remanded with instructions to enter judgment for Appellant and to enjoin enforcement of § 319.</p><p>RULING: Petitioner</p>", "error": "The district court dismissed Davis's First Amendment claim for lack of standing.", "truth": "The district court rejected Davis's First Amendment claim on the merits, reasoning that the law did not implicate the First Amendment because it did not impede his ability to spend money in support of his message.", "nmarks": 5}, {"id": "C006", "text": "<p>Opinion of the Court</p><p>I. Procedural History</p><p>Cougar Den, Inc.<mark class='tru' data-n='1'>, a fuel distributor owned by a member of the Yakama Nation, imports fuel into Washington for sale.</mark> In December 2013, the Washington State Licensing Department assessed Cougar Den approximately $3.6 million in unpaid fuel taxes, penalties, and licensing fees arising from its importation of fuel across state lines without the required state license.</p><p>Cougar Den protested the assessment.<mark class='err' data-n='2'> An administrative law judge concluded that Article III of the Yakama Nation Treaty of 1855 prohibited the assessment.</mark> The Department’s director reversed that decision and sustained the assessment.<mark class='err' data-n='3'> Cougar Den then sought review in Yakima County Superior Court, which reversed the Department and held that the assessment violated the Yakama Nation’s treaty-protected right to travel.</mark></p><p><mark class='tru' data-n='4'>The Washington Supreme Court affirmed the judgment in Cougar Den’s favor.</mark><mark class='tru' data-n='5'> It interpreted Article III as protecting Yakama members’ travel on public highways for purposes of trade and importation and held that the State could not impose its wholesale fuel tax upon Cougar Den’s exercise of that right.</mark> The Department sought review in this Court.</p><p><mark class='tru' data-n='6'>The question is whether the Treaty creates a right for Yakama members to avoid state taxes on off-reservation commercial activities involving the use of public highways.</mark><mark class='err' data-n='7'> We hold that the Treaty does not confer a general immunity from taxation of off-reservation commerce, but it does preempt the particular assessment before us because the taxable conduct, as applied here, is Cougar Den’s importation of fuel by public highway—conduct protected by Article III.</mark></p><p>II. Governing Law</p><p>Under the Supremacy Clause, treaties are the supreme law of the land and preempt conflicting state law. States ordinarily may tax tribal members’ off-reservation transactions unless federal law expressly or necessarily provides otherwise. *Mescalero Apache Tribe v. Jones* establishes that tribal status alone does not confer immunity from generally applicable state law outside reservation boundaries. Likewise, determining the legal incidence and taxable event of a state tax ordinarily turns on the State’s authoritative construction of its own law. See *Wagnon v. Prairie Band Potawatomi Nation*.</p><p>Those principles do not end the inquiry, however. An applicable treaty may protect particular off-reservation conduct. Indian treaties must be interpreted as the tribal signatories would reasonably have understood them, with ambiguities resolved in their favor. The analysis therefore considers the treaty’s text, its historical context, and the understanding communicated during negotiations rather than limiting the treaty to technical meanings that its tribal signatories likely did not share.</p><p>Article III provides Yakama members “the right, in common with citizens of the United States, to travel upon all public highways.” The phrase “in common with” does not necessarily reduce the promise to a right merely to be treated no worse than non-Indians. Treaty provisions using comparable language have secured substantive rights that generally applicable state laws may not defeat.</p><p>At the same time, Article III is not a general exemption for every commercial transaction having some attenuated relationship to highway travel. A state may tax an independently taxable off-reservation sale, possession, or other transaction merely because goods associated with that transaction were transported at some point. The controlling question is whether the State has imposed the tax upon the exercise of the protected treaty right itself.</p><p>III. Application</p><p>The historical record supports reading Article III to protect more than the bare physical act of moving along a highway. At the time of the Treaty, travel was closely connected to the Yakamas’ transportation of goods for trade. The negotiating history reflects assurances that tribal members could continue taking their goods to market across lands they ceded. The Yakamas thus would reasonably have understood the promised highway right to include travel with goods for commercial purposes, not merely passenger travel detached from trade.</p><p>The State correctly argues that this understanding cannot establish a blanket exemption from the economic framework governing all off-reservation commerce. Cougar Den would not, merely because of Article III, be immune from a tax imposed upon an off-reservation refinery purchase, a retail transaction, or possession of goods having an independent taxable situs. Nor does the Treaty categorically exempt Yakama businesses from every nondiscriminatory tax.</p><p>But the State’s characterization of this assessment as merely a tax on fuel possession does not control on this record.<mark class='tru' data-n='8'> The assessment arose because Cougar Den imported fuel into Washington, and the taxable event identified in the proceedings below was the fuel’s entry into the State in the importer’s possession.</mark><mark class='tru' data-n='9'> Cougar Den’s relevant connection to Washington outside the reservation was its transportation of the fuel over public highways.</mark> The State may direct collection from the fuel’s owner and measure the assessment by the quantity of fuel without changing the conduct that triggered liability.</p><p>The State’s hypotheticals involving fuel purchased within Washington or deposited immediately after crossing the state line do not alter the case before us.<mark class='tru' data-n='10'> We decide the validity of the assessment imposed on Cougar Den for importing fuel by highway, not every possible application of Washington’s fuel-tax regime.</mark> Likewise, the Ninth Circuit decisions cited in the record do not compel a contrary result. To the extent they reject a general exemption from taxes on off-reservation commercial activity, they are consistent with today’s holding. They do not establish that a State may tax the exercise of the specific highway right reserved by Article III.</p><p>The State also emphasizes that the tax is generally applicable and does not facially discriminate against Yakama members. That fact is relevant but not dispositive. A generally applicable law remains preempted when, as applied, it burdens conduct affirmatively secured by a federal treaty. The fishing-right cases illustrate that equal application to Indians and non-Indians does not itself resolve whether a law conflicts with a reserved treaty right.</p><p>We do not adopt the broad proposition that Article III bars taxation of “any trade, traveling, and importation” having some connection to a public road. Such a rule would extend beyond the Treaty’s language and historical foundation. Nor do we accept the suggestion that the Treaty necessarily immunizes all highway-related activity throughout the country. It is enough to conclude that the assessment here rests directly upon Cougar Den’s transportation of goods by public highway into Washington and therefore burdens the particular conduct the Yakamas reserved the right to undertake.</p><p>Counsel’s characterization of the opposing position as a “misrepresentation” adds nothing to the legal analysis, and we disregard it.<mark class='err' data-n='11'> We likewise rely on the procedural history and holdings stated in the record rather than an isolated excerpt incorrectly suggesting that the Washington Supreme Court upheld the assessment.</mark></p><p>IV. Disposition</p><p>Article III does not create a general right for Yakama members to avoid state taxation of all off-reservation commercial activity. It does, however, preempt a tax whose application rests upon a Yakama member’s exercise of the treaty-protected right to transport goods over public highways.<mark class='tru' data-n='12'> Because Washington imposed the challenged assessment on Cougar Den’s importation of fuel by highway, the assessment cannot stand.</mark></p><p><mark class='err' data-n='13'>The judgment of the Washington Supreme Court is affirmed.</mark></p><p>RULING: Respondent</p>", "error": "The Washington Supreme Court upheld the assessment and held that the Yakama Treaty does not preempt the tax.", "truth": "The Washington Supreme Court held that the Yakama Treaty preempts Washington from requiring Cougar Den to pay wholesale fuel taxes.", "nmarks": 13}, {"id": "C007", "text": "<p>The petitioner, Curtis Giovanni Flowers, was convicted and sentenced to death for the murders of four employees of Tardy Furniture Store in Winona, Mississippi.<mark class='err' data-n='1'> His first two convictions were reversed by the Mississippi Supreme Court because evidence concerning the other victims had been improperly admitted.</mark><mark class='err' data-n='2'> His third conviction, obtained after a trial for all four murders, was also reversed when the Mississippi Supreme Court found that prosecutor Doug Evans had discriminated on the basis of race in jury selection.</mark> The fourth and fifth trials ended in mistrials when the juries could not reach unanimous verdicts.</p><p><mark class='tru' data-n='3'>At the sixth trial, the State again prosecuted Flowers for all four murders.</mark> The prosecution exercised five of its six peremptory challenges against African American prospective jurors. Flowers objected under the Sixth and Fourteenth Amendments and *Batson v. Kentucky*, asserting that the strikes were racially motivated.<mark class='tru' data-n='4'> The Mississippi Supreme Court rejected the claim and affirmed the convictions.</mark> This Court directed that court to reconsider its decision in light of *Foster v. Chatman*.<mark class='tru' data-n='5'> On remand, the Mississippi Supreme Court again upheld the State’s use of its strikes, treating the claim as procedurally barred and, in any event, concluding that the prosecutor had offered race-neutral explanations.</mark><mark class='err' data-n='6'> Flowers then sought review in this Court, and we granted certiorari to determine whether the Mississippi Supreme Court properly applied *Batson*.</mark></p><p>Governing Law</p><p>The Equal Protection Clause prohibits a prosecutor from exercising peremptory challenges to exclude prospective jurors because of their race. *Batson* establishes a three-step inquiry.</p><p>First, the defendant must make a prima facie showing that the strike was based on race. Second, if that showing is made, the burden shifts to the prosecutor to provide a race-neutral explanation for the strike. The prosecutor’s explanation need not be persuasive or plausible at that stage; it must merely be facially race neutral. Third, the trial court must determine whether the defendant has proved purposeful discrimination. At that stage, the court must evaluate the prosecutor’s stated reasons in light of all the circumstances, including comparative treatment of similarly situated jurors, the prosecutor’s questions and demeanor, and any relevant history of discriminatory strikes.</p><p>The ultimate question is whether the prosecutor intentionally discriminated in exercising the strikes. A court may not evaluate each strike in isolation while disregarding the broader record. As this Court explained in *Miller-El v. Cockrell* and *Miller-El v. Dretke*, historical evidence, disparate questioning, comparative juror analysis, and patterns in the use of peremptory challenges may together establish discriminatory intent even where the prosecutor has offered facially race-neutral reasons.</p><p>Appellate review of a trial court’s factual finding concerning discriminatory intent is deferential. But deference does not permit a reviewing court to avoid the required “sensitive inquiry” into all relevant circumstances. A state court must meaningfully consider the totality of the evidence.</p><p>Application</p><p><mark class='err' data-n='7'>The Mississippi Supreme Court erred because it did not adequately evaluate the cumulative force of the evidence bearing on the prosecutor’s intent.</mark></p><p>The history of the prosecution is highly relevant. In the first four trials of Flowers, prosecutor Evans exercised 36 peremptory challenges, and every one was used against an African American prospective juror. In the sixth trial, Evans exercised five of his six challenges against African American jurors. The numbers alone do not establish a constitutional violation, particularly in a small community with a limited jury pool. But they are powerful evidence when considered together with the rest of the record.</p><p>The questioning also displayed a stark racial disparity. Evans asked the struck African American prospective jurors an average of approximately 29 questions, while asking the seated white jurors an average of approximately 1.1 questions. The questioning of at least one African American juror was unusually aggressive. Evans pursued her after she initially stated that serving on the jury would not trouble her, continuing until she acknowledged that it was possible the experience might trouble her. The record does not show comparable questioning of white jurors. A prosecutor may certainly question jurors thoroughly, but disparate questioning is probative when it is directed at jurors of one race and not at otherwise comparable jurors of another.</p><p>The prosecutor also conducted out-of-court investigations of three African American prospective jurors. Such investigation is not inherently improper. A prosecutor may reasonably investigate a juror’s answers when there is a legitimate reason to doubt them. But the investigations here must be considered alongside the prosecutor’s prior history, the disproportionate pattern of strikes, and the disparate questioning. The record included disputed assertions concerning the jurors’ relationships with Flowers or his family, including assertions that were not fully supported by the evidence the prosecutor said he could produce.</p><p>The State emphasizes that each challenged strike had an ostensibly race-neutral explanation. According to the State, the jurors had worked with relatives of Flowers, were related to or closely acquainted with members of his family, or had been untruthful on a questionnaire. Those explanations may have supported the strikes if viewed separately. But *Batson* does not end with the identification of facially neutral reasons. The decisive question is whether those reasons were genuine or instead were pretexts for racial discrimination. That question requires examining the reasons in context and comparing the prosecutor’s treatment of similarly situated white jurors.</p><p><mark class='err' data-n='8'>The Mississippi Supreme Court did not conduct that examination with the required care.</mark> It treated the prosecutor’s explanations as sufficient without adequately accounting for the prosecution’s extraordinary history in the case, the repeated pattern of striking African American jurors, the disparity in questioning, and the investigations directed at African American prospective jurors. Nor could the court properly dispose of the claim through procedural default while failing to address the substantial evidence bearing on purposeful discrimination. The relevant evidence was cumulative, and the court’s analysis did not meaningfully assess it cumulatively.</p><p>This conclusion does not rest on the history alone. Nor does it imply that every strike was independently shown to be discriminatory. The point is that the record must be considered as a whole. When the evidence is viewed in that manner, the State’s race-neutral explanations cannot be accepted without a careful determination whether they were credible in light of the prosecutor’s conduct throughout the case.<mark class='err' data-n='9'> The Mississippi Supreme Court’s abbreviated analysis failed to perform that constitutional task.</mark></p><p>Disposition</p><p><mark class='err' data-n='10'>The judgment of the Mississippi Supreme Court is reversed.</mark><mark class='err' data-n='11'> The case is remanded for further proceedings consistent with this opinion, including a proper evaluation of Flowers’s *Batson* claim in light of the totality of the circumstances.</mark></p><p>RULING: Petitioner</p>", "error": "The Mississippi Supreme Court dismissed Flowers’s Batson claim as procedurally defaulted.", "truth": "The Mississippi Supreme Court rejected Flowers’s jury-selection arguments and, on remand, again upheld the ruling for the State; it did not dismiss his Batson claim as procedurally defaulted.", "nmarks": 11}, {"id": "C008", "text": "<p>Procedural History</p><p>Following Wisconsin’s 2011 enactment of a state-assembly redistricting plan, plaintiffs brought this federal action alleging that the plan constituted an unconstitutional partisan gerrymander by systematically diluting Democratic voting strength statewide. The district court entertained the claim on a statewide basis and held the plan unconstitutional under its adopted partisan-gerrymandering test. Defendants sought review, challenging both the statewide nature of the claim and the merits standard applied below. The case is now before this Court on those challenges.</p><p>Governing Law</p><p>Article III confines federal judicial power to concrete cases and controversies. A plaintiff must establish a personal, particularized injury fairly traceable to the challenged conduct and likely redressable by judicial relief. The injury required for vote-dilution claims ordinarily concerns the effectiveness of the plaintiff’s own vote in the district in which that plaintiff votes. A generalized interest in a party’s statewide electoral success, or in the composition of a legislative body as a whole, does not by itself establish an individualized judicial injury.</p><p>Partisan-gerrymandering claims raise separate and difficult questions concerning justiciability and the availability of judicially manageable constitutional standards. But a court may not reach those questions unless plaintiffs first establish standing. Moreover, an appellate court should not affirm liability under a test where the defendants were denied a fair opportunity to present evidence responsive to that test.</p><p>Application to the Record</p><p>The record establishes that Wisconsin’s 2011 plan was enacted after Republicans obtained unified control of the State’s elected branches, and that its drafters sought to preserve a Republican legislative majority under likely electoral conditions. Those facts may be probative of partisan purpose. They do not, however, independently establish that every voter aligned with the opposing party suffered a cognizable, personal injury.</p><p>The plaintiffs’ theory, as presented here, is statewide: that Democratic voters as a whole received fewer seats than their statewide vote share would predict. But Wisconsin conducts assembly elections by districts. A voter casts a ballot for a district representative, not for statewide allocation of legislative seats. Thus, an injury based on dilution must be tied to the district in which the voter resides—such as through alleged packing, cracking, or another district-specific impairment of that voter’s ability to elect a preferred representative.</p><p>Respondent correctly observes that partisan affiliation may involve collective political activity. That point may bear on the merits of a properly framed First Amendment or equal-protection claim. It cannot displace the Article III requirement that each plaintiff identify a concrete injury to that plaintiff. Nor does the asserted statewide imbalance itself provide a workable basis to distinguish a constitutional injury from electoral outcomes attributable to political geography, incumbency, voter preference, or other lawful districting considerations. Petitioners’ observation that even neutral, court-drawn, commission-drawn, and bipartisan plans can produce substantial partisan asymmetry reinforces the inadequacy of statewide partisan symmetry alone as a constitutional rule.</p><p>Accordingly, the district court erred by treating the asserted statewide partisan imbalance as sufficient to support a statewide claim. Because standing is absent on the statewide theory, we do not resolve definitively whether a properly pleaded, district-specific partisan-gerrymandering claim is justiciable, nor do we decide the ultimate validity of the test employed below. Those matters must await a case in which plaintiffs establish a concrete and particularized injury and in which both parties have a fair opportunity to develop the relevant evidentiary record.</p><p>The district court’s judgment is vacated, and the matter is remanded for further proceedings consistent with this opinion, including consideration of whether any individual plaintiff can establish a district-specific injury.</p><p>RULING: Petitioner</p>", "error": "A federal court struck down the plan for violating the “one person one vote” principle.", "truth": "A federal court upheld the plan as not violating the “one person one vote” principle nor violating the Equal Protection Clause.", "nmarks": 0}, {"id": "C009", "text": "<p>Opinion of the Court</p><p>I. Procedural History</p><p>Respondents are Muslim men born outside the United States who reside lawfully in this country. They allege that federal agents placed them on the No Fly List after they declined requests to serve as informants against fellow Muslims. According to respondents, that conduct violated their religious beliefs and substantially burdened their exercise of religion.</p><p>Respondents sued the agents in both their official and individual capacities. Their complaint asserted claims under the First and Fifth Amendments, the Administrative Procedure Act, and the Religious Freedom Restoration Act of 1993 (RFRA), 42 U.S.C. § 2000bb et seq. They sought, among other relief, money damages for the injuries allegedly caused by their placement on the No Fly List.</p><p>The District Court dismissed the claims against the agents.<mark class='tru' data-n='1'> A panel of the United States Court of Appeals for the Second Circuit reversed.</mark> The court of appeals denied rehearing en banc, over the dissent of several judges. The case then came to this Court to resolve whether RFRA authorizes suits seeking money damages against federal employees in their individual capacities.</p><p>II. Governing Law</p><p>RFRA provides that the Federal Government may not substantially burden a person’s exercise of religion unless it demonstrates that application of the burden is the least restrictive means of furthering a compelling governmental interest. 42 U.S.C. § 2000bb-1(a), (b).</p><p>The statute further provides:</p><p>&gt; A person whose religious exercise has been burdened in violation of this section may assert that violation as a claim or defense in a judicial proceeding and obtain appropriate relief against a government.</p><p>§ 2000bb-1(c).</p><p>RFRA defines “government” to include a branch, department, agency, instrumentality, or official of the United States, as well as “any other person acting under color of law of the United States.” § 2000bb-2(1).</p><p>The question is therefore one of statutory interpretation. We must determine whether “appropriate relief against a government” includes money damages against a federal official sued in the official’s individual capacity.</p><p>The statutory text supplies the answer. RFRA creates an express cause of action and authorizes “appropriate relief.” Nothing in that phrase limits relief to injunctions or other equitable remedies. Nor does the statute restrict the capacity in which an official or other person acting under color of federal law may be sued.</p><p>The phrase “against a government” does not compel a different conclusion. RFRA’s definition of “government” includes an “official” and “any other person acting under color of law.” An individual-capacity suit seeks relief from the defendant personally, not from the sovereign treasury. Thus, an individual federal employee may fall within the class of defendants identified by RFRA even though the United States itself may be protected by sovereign immunity.</p><p>That conclusion is also consistent with the ordinary remedial principle that, when Congress creates a right and authorizes “appropriate relief,” courts ordinarily presume that all appropriate remedies are available unless Congress has clearly indicated otherwise. Congress knew how to limit relief to equitable remedies or to suits against officials in their official capacities. RFRA contains no such limitation.</p><p>The existence of qualified immunity does not alter the scope of the remedy authorized by the statute. Qualified immunity may protect an official from liability where the official’s conduct did not violate clearly established law. But that defense concerns whether a particular defendant is liable; it does not eliminate the cause of action or categorically bar damages in every RFRA suit.</p><p>III. Application</p><p>Respondents allege that the federal agents used the No Fly List to retaliate against them for refusing to act as informants in a manner inconsistent with their religious beliefs. Taking those allegations as true at this stage, the alleged conduct falls within RFRA’s prohibition on substantial burdens imposed by the Government on religious exercise.</p><p>The agents are alleged to have acted under color of federal law. They therefore fall within RFRA’s definition of “government” as officials or other persons acting under color of federal law. Respondents’ individual-capacity claims seek damages from the agents personally for the injuries allegedly caused by their own conduct. Such relief is not automatically transformed into an action against the United States merely because the defendants were federal employees.</p><p>The Government argues that damages are unavailable because RFRA speaks of relief “against a government,” and because Congress ordinarily speaks expressly when authorizing damages against federal employees. That argument has force as a policy matter, particularly given concerns about litigation burdens and the effect of personal liability on federal decisionmaking. But policy concerns cannot overcome statutory text. RFRA expressly identifies federal officials and other persons acting under color of federal law, and it authorizes “appropriate relief” without limiting that relief to injunctions or official-capacity remedies.</p><p>The Government also contends that damages are poorly suited to RFRA because the statute requires the Government to establish a compelling interest and the least restrictive means. That consideration may affect the merits of a particular claim, the availability of qualified immunity, or the proof required at later stages. It does not establish a categorical bar to damages where Congress has authorized appropriate relief.</p><p>Accordingly, RFRA permits an individual-capacity suit against a federal employee and permits the recovery of money damages where such relief is otherwise appropriate. Whether respondents can ultimately prove a RFRA violation, and whether the agents are entitled to qualified immunity, remain matters for further proceedings.</p><p>IV. Disposition</p><p><mark class='err' data-n='2'>The judgment of the Court of Appeals is affirmed, and the case is remanded for further proceedings consistent with this opinion, including consideration of any applicable defenses such as qualified immunity.</mark></p><p>RULING: Petitioner</p>", "error": "A panel of the U.S. Court of Appeals for the Second Circuit affirmed the District Court's dismissal.", "truth": "A panel of the U.S. Court of Appeals for the Second Circuit reversed the District Court's dismissal.", "nmarks": 2}, {"id": "C010", "text": "<p>SUPREME COURT OF THE UNITED STATES</p><p>Dart Cherokee Basin Operating Co., LLC, et al., Petitioners, v. Brandon W. Owens, Respondent</p><p>*On Writ of Certiorari*</p><p>---</p><p>I. PROCEDURAL HISTORY</p><p>On October 30, 2012, respondent Brandon W. Owens filed a putative class action in state court alleging that petitioners Dart Cherokee Basin Operating Company and Cherokee Basin Pipeline had underpaid royalties owed to class members on wells, in breach of contract. The petition sought damages but pleaded no specific sum.</p><p>On December 5, 2012, petitioners filed a notice of removal invoking federal jurisdiction under the Class Action Fairness Act of 2005 (CAFA), 28 U.S.C. §§ 1332(d), 1453. The notice alleged minimal diversity, a class exceeding 100 members, and an amount in controversy exceeding $8.2 million — more than four times CAFA&#x27;s $5 million threshold. It did not attach affidavits, declarations, or other evidentiary material substantiating the amount.</p><p>Respondent moved to remand on the sole ground that the notice of removal contained no evidence of the amount in controversy. In opposition, petitioners submitted a declaration setting out the calculations underlying the $8.2 million figure.<mark class='tru' data-n='1'> The District Court refused to consider that material, holding itself bound by Circuit precedent (principally *Laughlin*) to require that evidence of the jurisdictional amount be contained in the notice of removal itself.</mark> It remanded on that basis, adding that the bare $8.2 million figure was &quot;conclusory.&quot;</p><p>Petitioners sought permission to appeal under 28 U.S.C. § 1453(c)(1).<mark class='tru' data-n='2'> The Court of Appeals declined to disturb the remand, leaving the Circuit&#x27;s evidence-in-the-notice rule in place, and did so without giving reasons; rehearing en banc was denied over the dissent of judges who would have rejected that rule.</mark> We gra
