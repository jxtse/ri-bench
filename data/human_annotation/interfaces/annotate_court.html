nted certiorari.</p><p>A word about the record summary before us. The summary of facts states that the Court of Appeals &quot;held that the district court should not have remanded the case&quot; and that a removing party &quot;need only allege that the grounds for removal exist and need only prove those allegations if they are contested.&quot; That characterization cannot be reconciled with the posture of this appeal. Petitioners — the removing defendants — are the parties seeking relief here, and their submissions are devoted throughout to attacking a &quot;so-called Tenth Circuit rule, which came into effect in about 1995,&quot; by which &quot;the district court here felt that she was constrained.&quot; Respondent, for his part, states that the court below &quot;left the Tenth Circuit rule in place and approved the district court&#x27;s treatment of both the missing evidence and the conclusory allegation.&quot; Both parties thus agree that the remand order stands and that the evidence-in-the-notice rule survives below. We resolve the case on that understanding. We note, however, that the resolution is the same on either reading: if the court below in fact announced the rule attributed to it in the summary — allegation suffices, proof only upon contest — then that court stated the governing standard correctly, and petitioners are entitled to prevail on the merits of the question presented in any event.</p><p>II. JURISDICTION</p><p>Respondent presses a threshold objection, urging that § 1447(d) insulates remand orders from review and that *Hohn v. United States* and *Nixon v. Fitzgerald* are inapposite because &quot;neither of those cases are remand cases.&quot;</p><p>The objection fails. Section 1447(d)&#x27;s bar is expressly subject to exception, and § 1453(c) supplies one, authorizing courts of appeals to accept appeals from CAFA remand orders. Congress thereby made these orders reviewable in the courts of appeals; and once a case is &quot;in&quot; a court of appeals, 28 U.S.C. § 1254(1) confers on this Court jurisdiction to review it &quot;before or after rendition of judgment.&quot; A case in which a court of appeals has entertained and acted upon an application for permission to appeal is a case &quot;in&quot; that court. *Hohn* so holds with respect to applications for certificates of appealability, and the principle does not turn on the subject matter of the underlying order. As petitioners observe, Congress knows how to withdraw this Court&#x27;s review when it wishes to — it did so in AEDPA — and it did not do so in § 1453. Our certiorari power extends to the case &quot;irrespective of any ruling or determination therein.&quot; We have jurisdiction.</p><p>III. GOVERNING LAW</p><p>The question presented is a narrow one of statutory text. Section 1446(a) provides that a defendant seeking removal shall file &quot;a notice of removal... containing a short and plain statement of the grounds for removal.&quot; That phrase is borrowed deliberately from Rule 8(a) of the Federal Rules of Civil Procedure, and Congress&#x27;s borrowing was intended to import Rule 8&#x27;s simplicity. A pleading standard is not an evidentiary standard. Nothing in § 1446(a) requires a removing defendant to attach evidence; to read such a requirement into &quot;short and plain statement&quot; is to rewrite the provision.</p><p>Section 1446(c)(2) confirms the point. Where, as here, the state-court pleading demands no specific sum, subparagraph (A)(ii) provides that &quot;the notice of removal may assert the amount in controversy.&quot; Subparagraph (B) then provides that removal is proper &quot;if the district court finds, by the preponderance of the evidence, that the amount in controversy exceeds&quot; the threshold — a finding called for only &quot;if the plaintiff contests&quot; the defendant&#x27;s assertion or the court questions it. The statute thus sets out a two-step sequence: assertion in the notice, proof if and when the assertion is challenged. Evidence-submitting procedure is triggered by contest, not by removal.</p><p>Respondent&#x27;s textual riposte — that an evidentiary requirement located in § 1446 rather than § 1447 shows evidence must accompany the notice — proves the opposite. Section 1446(c)(2)(B) is indeed located in the removal provision, and it is precisely there that Congress specified *when* evidence is required: upon contest, and before &quot;the district court,&quot; which is where a remand motion is litigated. Had Congress meant the notice itself to carry evidentiary freight, it would not have written a provision keyed to judicial fact-finding upon challenge.</p><p>Two further principles bear on the analysis. First, CAFA carries no anti-removal presumption; its provisions should not be construed to frustrate Congress&#x27;s purpose of opening federal courts to interstate class actions. Second, the amount in controversy is measured by the sum claimed in good faith at the time of removal. Defenses that may ultimately reduce or defeat recovery do not retroactively divest jurisdiction unless it appears to a legal certainty that the claim is for less than the threshold.</p><p>IV. APPLICATION</p><p>Applying these principles, the remand order rested on legal error.</p><p>A. Petitioners&#x27; notice alleged an amount in controversy of $8.2 million. Under § 1446(a) and § 1446(c)(2)(A)(ii), that assertion was all that was required to effect removal.<mark class='err' data-n='3'> The District Court&#x27;s contrary view — that evidence had to appear within the four corners of the notice — has no footing in the text and, as petitioners note, is enforced in no other circuit.</mark> Its practical consequences confirm its error: a defendant served with a pleading that demands no sum would be obliged, within a compressed thirty-day window and often before counsel is even retained, to assemble affidavits to support a jurisdictional fact that no one has yet disputed. Congress imposed no such burden.</p><p>B. The error was compounded when the District Court, presented with a declaration setting out the basis for the $8.2 million figure in opposition to the remand motion, refused to consider it. That was the precise moment at which § 1446(c)(2)(B) called for a finding by a preponderance of the evidence. Respondent says petitioners &quot;should have waited... for another paper&quot; and &quot;jump[ed] the gun.&quot; But the statute permits removal on assertion, and a defendant who removes promptly and then substantiates its assertion when it is contested has done exactly what Congress prescribed. On this record the parties do not dispute that the proffered material established a figure well above $5 million.</p><p>C. Respondent&#x27;s fallback — that even if evidence is unnecessary, a bare figure is &quot;conclusory&quot; and should fail a *Twombly*-style plausibility test — does not change the outcome. We may assume that a notice of removal must allege the jurisdictional amount plausibly rather than fancifully. The allegation here, in the amount of $8.2 million, was tied to the royalty underpayments claimed across the defined class and was supported, once challenged, by a calculation respondent does not contend was fabricated. Nothing more was needed at the pleading stage.</p><p>D. Respondent&#x27;s merits arguments — that roughly sixty-two percent of the leases were express-deduction leases and that petitioners hold only about half the working interest, so that true damages are &quot;20 to 25 percent of the total&quot; — are arguments about the likelihood of recovery, not about the amount placed in controversy at removal. They are the very sort of contest § 1446(c)(2)(B) directs the district court to resolve on evidence; they do not establish to a legal certainty that less than $5 million was at stake, and they cannot be used to validate a remand that was ordered without considering the evidence at all.</p><p>E. Because the decision below rested on and left undisturbed a rule that contradicts § 1446, it cannot stand. A discretionary refusal to hear a CAFA appeal that is premised on a clear error of law is an abuse of discretion, and unexplained dispositions do not immunize the underlying legal rule from this Court&#x27;s review.</p><p>V. DISPOSITION</p><p>A defendant seeking removal need not submit evidentiary proof of the jurisdictional facts in the notice of removal. A short and plain statement plausibly alleging the grounds for removal, including the amount in controversy, suffices; evidence is required only if the plaintiff contests the allegation or the court questions it, in which event the district court must decide the issue by a preponderance of the evidence, considering the proof submitted by both sides. The judgment below is reversed, and the case is remanded for further proceedings consistent with this opinion.</p><p>RULING: Petitioner</p>", "error": "The Tenth Circuit affirmed the district court's remand.", "truth": "The Tenth Circuit held that the district court should not have remanded the case.", "nmarks": 3}, {"id": "C011", "text": "<p>RULING</p><p>I. Procedural History</p><p>This case arises from civil forfeiture actions brought by the State of Alabama against vehicles registered to Halima Tariffa Culley and to similarly situated class members. Culley&#x27;s vehicle was seized on February 17, 2019, upon her son&#x27;s arrest; she unsuccessfully sought its return, and the State filed a civil forfeiture action ten days later. Culley ultimately prevailed on Alabama&#x27;s innocent-owner defense after roughly twenty months of litigation, but only after being deprived of the vehicle in the interim. Culley then filed a class action under 42 U.S.C. § 1983, alleging that state and local officials violated the Eighth and Fourteenth Amendments by failing to provide a prompt post-deprivation hearing.</p><p><mark class='err' data-n='1'>The district court entered judgment for the defendants.</mark><mark class='tru' data-n='2'> On appeal, the Court of Appeals for the Eleventh Circuit, addressing the claims that were not moot, held that the sufficiency of post-seizure process must be assessed under the framework of *Mathews v.</mark> Eldridge*, 424 U.S. 319 (1976), rather than the speedy-trial test of *Barker v. Wingo*, 407 U.S. 514 (1972), and remanded for application of that framework. The state officials petitioned this Court for review, and we granted certiorari limited to the methodological question: what test must a district court apply when determining whether and when a post-deprivation hearing is required under the Due Process Clause?</p><p>II. Governing Law</p><p>The Due Process Clause provides that a person deprived of property by the State is entitled to &quot;some kind of a hearing&quot; at a meaningful time and in a meaningful manner. *Fuentes v. Shevin*, 407 U.S. 67 (1972). The question of *what process is due* — that is, whether existing procedures are adequate or whether additional safeguards are constitutionally required — has for half a century been governed by *Mathews v. Eldridge*, which balances (1) the private interest affected; (2) the risk of erroneous deprivation under existing procedures and the probable value of additional safeguards; and (3) the government&#x27;s interest, including fiscal and administrative burdens.</p><p>*Barker v. Wingo* answers a different question. It asks whether the *delay* before a criminal trial is so extended as to violate the Sixth Amendment&#x27;s Speedy Trial Clause. *United States v. $8,850*, 461 U.S. 555 (1983), and *United States v. Von Neumann*, 474 U.S. 246 (1986), are the Court&#x27;s principal forfeiture decisions, and both concerned precisely the *Barker*-type inquiry: whether the Government had acted with reasonable diligence and whether the claimant&#x27;s delay in pursuing the final forfeiture proceeding undermined a due process challenge to that delay.</p><p>III. Application</p><p>The question presented is a *Mathews* question, not a *Barker* question. The claims here do not challenge the timeliness of the final forfeiture proceedings. Culley does not contend that the State dawdled in moving toward final adjudication. Her claim is that due process required a separate, interim hearing at which an innocent owner could contest retention of her property *pending* the final proceeding. Whether the Constitution requires that additional procedural safeguard — and if so, in what form and when — is the paradigmatic inquiry that *Mathews* was designed to answer.</p><p>Petitioners&#x27; principal contention is that *$8,850* and *Von Neumann* already resolved this question by holding that a timely final forfeiture proceeding supplies all the post-seizure process due. We disagree. Both cases addressed challenges to the *length of time* preceding a final disposition. In *$8,850*, the claimant herself caused delay; in *Von Neumann*, the claimant sought the return of currency in a remission proceeding. Neither case involved a claimant asserting an innocent-owner defense and seeking an interim retention hearing. Petitioners&#x27; reliance on isolated sentences of broad language from those opinions — for example, that &quot;the forfeiture proceeding without more provides the post-seizure hearing that due process requires&quot; — overreads dicta that addressed timeliness, not the existence vel non of a separate interim interest. *Von Neumann*&#x27;s own structure confirms as much: the opinion assumed the existence of a separate interest for purposes of its third part while analyzing it under a timeliness lens. The decisions are best understood as applying *Barker*-type timeliness analysis *within* a framework that presumes, rather than decides, the content of the underlying due process right.</p><p>Barker is structurally unfit for the question presented, as the Second and Sixth Circuits have recognized. Its first prong does not even engage until approximately a year of delay has elapsed, leaving the innocent owner whose car is essential to her livelihood wholly unprotected in the interim. It takes no account of the competing private and governmental interests at stake, cannot calibrate the form of the remedy, and offers only one remedy — dismissal of the proceeding — which bears no relation to the interest in interim retention of property. *Mathews*, by contrast, is this Court&#x27;s default due process framework for civil deprivations and was expressly applied in the civil forfeiture context in *United States v. James Daniel Good Real Property*, 510 U.S. 43 (1993).</p><p>Petitioners&#x27; strongest contentions nonetheless fail. First, Petitioners invoke history and tradition: founding-era Collection Acts required no interim hearing, and property was held until final forfeiture. But historical forfeiture was confined to a narrow domain — customs and piracy — and operated without any innocent-owner defense, which Alabama law now provides. A state-law entitlement that innocent owners retain their property unless the State proves otherwise gives rise to procedural protection that founding-era practice simply did not address. History cannot answer a question it never faced. Second, Petitioners warn that a retention hearing would be a rushed &quot;mini-trial&quot; that sacrifices accuracy for speed and would require more process for property than for pretrial detention of persons. This argument is better directed at how *Mathews* balances the government interests — including those identified in *Calero-Toledo v. Pearson Yacht Co.*, 416 U.S. 663 (1974), and *Kaley v. United States*, 571 U.S. 233 (2014) — and indeed the United States, as amicus, conceded that *Mathews* is a permissible framework. The workability objection is also substantially answered by the record: roughly twenty states already provide retention hearings, as does federal law in the form of the substantial-hardship release provision, 18 U.S.C. § 983(f), and Alabama itself now provides a prompter process than it afforded these claimants.</p><p>Third, Petitioners argue that the class members received all the process due because they were before the state court within two weeks of seizure but did not press their rights for over a year. That is an application argument, and it may well carry weight in the ultimate *Mathews* balancing. But it does not change the framework the district court must apply. We decline Petitioners&#x27; invitation to hold categorically that a timely final forfeiture proceeding always satisfies due process with respect to innocent owners; such a holding would exceed anything decided in *$8,850* or *Von Neumann* and would strip the district courts of the tools needed to assess whether, in a given case, more process is due.</p><p>We do not today decide that a particular hearing is constitutionally required within a particular timeframe. States retain flexibility to structure interim process — including paper-based hardship determinations, expedited proceedings, or an immediate-return bond mechanism — as the balancing requires. Nor do we assess whether petitioners&#x27; remedy arguments succeed on the merits of the individual claims; that question, along with the fact-bound balancing of the *Mathews* factors on this record — including the six-month wait the district attorney&#x27;s office forecast, the hardship Culley and the class suffered, and the State&#x27;s interests in retention — is for the lower courts in the first instance.</p><p>IV. Disposition</p><p>The Court holds that when a claimant challenges the absence of a separate post-deprivation hearing — as distinct from the timeliness of the final forfeiture proceeding — the district court must apply the *Mathews v. Eldridge* framework.<mark class='tru' data-n='3'> The judgment of the Court of Appeals is affirmed in relevant part, and the case is remanded for further proceedings consistent with this opinion.</mark></p><p>RULING: Respondent</p>", "error": "The Eleventh Circuit reversed the district court’s judgment for the defendants on the nonmoot claims.", "truth": "The district court ruled for the defendants, and the Eleventh Circuit affirmed that judgment as to the claims that were not moot.", "nmarks": 3}, {"id": "C012", "text": "<p>RULING</p><p>Supreme Court of the United States — No. 21-984</p><p>*Michael J. Hewitt, Petitioner, v. Helix Energy Solutions Group, Inc., Respondent.*</p><p><mark class='err' data-n='1'>On Writ of Certiorari to the United States Court of Appeals for the Fifth Circuit<br></mark><br>---</p><p>I. Procedural History</p><p>Petitioner Michael J. Hewitt worked as a toolpusher supervising other employees on an offshore oil rig operated by respondent Helix Energy Solutions Group, Inc. Helix compensated Hewitt solely on the basis of a daily rate, and he frequently worked well more than forty hours per week. Hewitt sued Helix for unpaid overtime under the Fair Labor Standards Act of 1938 (FLSA), 29 U.S.C. § 207. Helix defended on the ground that Hewitt was a &quot;highly compensated employee&quot; and therefore exempt from the FLSA&#x27;s overtime requirement; Hewitt countered that, because his pay was calculated on a daily basis, he was not paid &quot;on a salary basis&quot; and could not claim the exemption regardless of his earnings.</p><p><mark class='err' data-n='2'>The United States District Court for the Southern District of Texas entered judgment for Helix on the exempt status of Hewitt&#x27;s compensation.</mark><mark class='tru' data-n='3'> The United States Court of Appeals for the Fifth Circuit ruled for Helix as well.</mark> In this Court&#x27;s review of that judgment (and of the question on which certiorari was granted), Hewitt presses a single contention: a pure daily-rate payment plan cannot satisfy the salary-basis requirement that the highly compensated employee regulation imposes. We agree, and therefore reverse.</p><p>II. Governing Law</p><p>The FLSA requires overtime compensation unless the employee falls within an exemption, 29 U.S.C. § 213(a)(1), which covers &quot;any employee employed in a bona fide executive, administrative, or professional capacity.&quot; The Department of Labor has long interpreted &quot;bona fide&quot; capacity to include a requirement that the employee be compensated on a salary basis. 29 C.F.R. § 541.600(a). The parties do not ask us to disturb that interpretation, and we assume without deciding that it is a permissible construction of the statute.</p><p>Three regulations frame this dispute:</p><p>1. § 541.601 — the &quot;highly compensated employee&quot; (HCE) exemption. It applies to an employee whose total annual compensation is at least $100,000, who customarily and regularly performs one or more exempt duties, and — critically — whose compensation &quot;must include at least $455 per week paid on a salary or fee basis.&quot; § 541.601(b)(1). The HCE provision thus relaxes the *duties* test; it does not eliminate the salary-basis floor.</p><p>2. § 541.602(a) — the general salary-basis rule. An employee is paid on a salary basis only if he &quot;regularly receives each pay period . . . a predetermined amount&quot; of compensation &quot;which is not subject to reduction because of variations in the quality or quantity of the work performed,&quot; and, &quot;subject to the exceptions provided in paragraph (b),&quot; must &quot;receive the full salary for any week in which the employee performs any work without regard to the number of days or hours worked.&quot; § 541.602(a) also requires payment &quot;on a weekly, or less frequent basis.&quot;</p><p>3. § 541.604 — the alternative rule for non-salaried pay. Section 541.604(a) permits &quot;extra compensation&quot; (commissions, bonuses, premium pay) in addition to the guaranteed salary. Section 541.604(b) provides a special rule for employees &quot;paid on an hourly, daily or a shift basis&quot;: the exemption may still apply if the employer guarantees the required minimum weekly amount *and* the guaranteed amount bears &quot;a reasonable relationship&quot; to the amount the employee usually earns for the customary weekly schedule.</p><p>III. Application</p><p>A. Section 541.602(a) is not satisfied. Helix concedes — indeed, its own counsel has insisted — that Hewitt was paid on a daily basis. A daily basis is a *more* frequent basis than a weekly one, so the compensation fails § 541.602(a)&#x27;s timing requirement at the threshold. More fundamentally, the regulation demands that an employee &quot;receive the full salary for any week . . . without regard to the number of days or hours worked.&quot; Daily-rate compensation is, by definition, paid *with* regard to the number of days worked: an employee who works one day receives one day&#x27;s pay; an employee who works seven receives seven days&#x27; pay. The weekly figure Helix touts — at least $963 in any week in which Hewitt performed work — is not a predetermined weekly amount constituting &quot;the full salary&quot; for the week; it is simply the arithmetic product of the daily rate multiplied by the days actually worked. What an employee happens to &quot;receive&quot; in a given week does not answer the question § 541.602(a) poses, which is how the predetermined amount of compensation is computed.</p><p>Helix&#x27;s principal rejoinder — that it &quot;defies reality and common sense&quot; to say a man earning more than $200,000 a year &quot;receives no salary at all&quot; — is rhetoric, not construction. The regulation does not ask whether an employee is well paid; it asks whether he is paid *on a salary basis*. A highly compensated hourly or piecework employee is no more salaried than a lowly compensated one.</p><p>B. Section 541.604(b) is the provision designed for daily-rate employees, and Helix concedes it cannot satisfy it. The Department of Labor promulgated § 541.604(b) precisely because employees paid on an hourly, daily, or shift basis do not meet § 541.602(a). That provision permits such employees to qualify for the exemption only through a guaranteed weekly amount bearing a reasonable relationship to usual weekly earnings. Helix concedes it does not — and does not claim that it can — satisfy § 541.604(b). That concession is fatal under Helix&#x27;s own view of the regulatory scheme, and it is telling: § 541.604(b) exists to police sham salaries, and Helix cannot clear it.</p><p>C. Helix&#x27;s contrary construction would render § 541.604(b) superfluous. Helix argues that § 541.601 incorporates only § 541.602 and not § 541.604, and that any daily rate exceeding the $455 weekly minimum automatically yields a &quot;salary&quot; of that amount or more. But if a daily rate above the weekly floor satisfies § 541.602, then § 541.604(b)&#x27;s reasonable-relationship test would never apply to any daily-rate employee paid above the floor — the provision would be dead letter. We must read the regulations, so far as possible, to give effect to every clause, and Helix&#x27;s reading cannot accomplish that. Likewise, Helix&#x27;s construction would read the phrase &quot;without regard to the number of days or hours worked&quot; out of § 541.602(a) entirely.</p><p>D. The remaining arguments do not carry the day. Helix urges that § 541.601 is a &quot;streamlined, stand-alone&quot; exemption in which high compensation alone screens in exempt status. But the streamlining Congress and the Department built into § 541.601 concerns the *duties* test; the regulation&#x27;s own text preserves the requirement of &quot;$455 per week paid on a salary or fee basis,&quot; § 541.601(b)(1) — language added after the proposed rule, confirming that the salary floor is a genuine prerequisite, not an afterthought. Helix&#x27;s appeal to the statutory standard (&quot;bona fide executive&quot;) cannot substitute for the regulation it invoked below; having claimed the exemption through the regulation, it must satisfy the regulation&#x27;s terms. Nor do we find Helix&#x27;s fair-notice argument persuasive: the text of §§ 541.602 and 541.604 gave employers clear warning that daily-rate compensation requires the § 541.604(b) route. Helix, which concedes it could have structured its pay plans to comply in multiple ways, chose not to do so. Finally, we are unmoved by Helix&#x27;s suggestion that a contrary rule would harm lower-income workers; to the extent that concern has force, it cuts against Helix, for collapsing § 541.602&#x27;s salary-basis protection would erode it for daily- and hourly-paid workers generally, who retain the protections of § 541.604(b).</p><p>We note, for completeness, that counsel on both sides argued with vigor; several of Helix&#x27;s submissions — appeals to &quot;common sense&quot; and to what a well-paid worker &quot;would prefer&quot; — address the equities rather than the text, and we have not rested any part of our decision on them.</p><p>IV. Disposition</p><p>Because Hewitt was paid solely on a daily basis, he was not paid &quot;on a salary basis&quot; within the meaning of 29 C.F.R. § 541.602(a); because Helix concedes it cannot satisfy the alternative route of § 541.604(b), the highly compensated employee exemption of § 541.601 is unavailable. A supervisor earning over $200,000 per year on a daily rate is nonetheless entitled to overtime under the FLSA.</p><p><mark class='tru' data-n='4'>The judgment of the court of appeals is reversed, and the case is remanded for further proceedings consistent with this opinion.</mark></p><p>It is so ordered.</p><p>RULING: Petitioner</p>", "error": "The U.S. Court of Appeals for the Fifth Circuit affirmed the district court's ruling for Helix.", "truth": "The district court ruled for Helix, and the U.S. Court of Appeals for the Fifth Circuit reversed.", "nmarks": 4}, {"id": "C013", "text": "<p><mark class='tru' data-n='1'>The Arizona Superintendent of Public Instruction and members of the Arizona Legislature sought relief under Federal Rule of Civil Procedure 60(b)(5) from a series of judgments entered by the United States District Court for the District of Arizona.</mark> In 2000, the district court determined that Arizona had failed to provide English Language Learner programs consistent with the Equal Educational Opportunities Act (EEOA). The court later held the State in civil contempt for failing to comply and rejected proposed legislation as insufficient to remedy the deficiencies.</p><p>The State subsequently moved for relief from the prospective judgments. It relied on several developments: increased state funding, changes in the management and educational practices of the Nogales Unified School District, the adoption of structured English immersion, improved student performance, and the enactment of the No Child Left Behind Act.<mark class='tru' data-n='2'> The district court denied the motion, concluding that although the State had developed a substantially improved infrastructure for English Language Learner instruction, it had not complied with the original judgment.</mark><mark class='err' data-n='3'> The Ninth Circuit affirmed.</mark> It emphasized that Arizona had never appealed the original judgment and had not complied with it, and it required what it characterized as a sufficiently radical change before granting relief. The State sought review in this Court.</p><p>Governing law</p><p>Rule 60(b)(5) permits a court to relieve a party from a judgment when “applying it prospectively is no longer equitable.” The rule recognizes that prospective judgments may become inappropriate when factual or legal circumstances materially change. Relief does not require the moving party to show that the original judgment was erroneous or that the change was unforeseeable. Nor does the rule impose a categorical requirement that the change be “radical.”</p><p>The governing inquiry is equitable and flexible. A party seeking relief must show a significant change in factual conditions or in applicable law that renders continued enforcement detrimental to the public interest. If that showing is made, the court must determine whether the requested relief is suitably tailored to the changed circumstances. In institutional-reform litigation, the court must also respect the distinction between enforcing federal law and maintaining unnecessary judicial control over state and local institutions. The fact that a judgment was not appealed may bear on equitable considerations, but it does not eliminate the authority conferred by Rule 60(b)(5) to modify or dissolve a prospective judgment.</p><p>The EEOA requires educational agencies to take “appropriate action” to overcome language barriers that impede students’ equal participation in instructional programs. It does not itself prescribe a single instructional method, require a particular number of teachers or aides, or establish a fixed statewide funding formula. Compliance with the EEOA is therefore not necessarily measured by adherence to the precise remedial assumptions underlying an earlier judgment. Conversely, compliance with the No Child Left Behind Act does not automatically establish compliance with the EEOA. The statutes impose related but distinct requirements.</p><p>Application</p><p>The lower courts applied an unduly demanding Rule 60(b)(5) standard. The relevant question was not simply whether Arizona had fully complied with the original judgment or whether it had adopted a change so dramatic that the original judgment had become inexplicable. The question was whether substantial changes in law and fact made continued enforcement of the judgment inequitable and whether dissolution or modification was warranted in light of the present record.</p><p>The record identified several material developments. Arizona adopted structured English immersion and enacted legislation establishing a new statewide framework for English Language Learner education. The State also changed its administrative approach, developed improved infrastructure, increased funding, and altered the manner in which programs were managed. The Nogales district, which was central to the litigation, had new leadership and had made significant progress. Even the lower courts recognized that Nogales was performing substantially better and that the State had developed a significantly improved infrastructure for English Language Learner programming.</p><p>Those developments could not be dismissed merely because some deficiencies remained. Rule 60(b)(5) does not condition relief on proof that every problem has disappeared. Nor could the district court treat the funding assumptions underlying its earlier orders as permanently controlling when the State had adopted a different educational methodology and a different system for providing and evaluating services. The original judgment was entered in response to a particular set of facts and a particular remedial premise. Whether the new system was adequate had to be assessed on its own terms.</p><p>The district court also failed to give sufficient consideration to the relationship between changed conditions and the scope of the relief imposed. The litigation began with conditions in Nogales, but the remedy came to affect Arizona’s statewide funding and educational structure. A statewide, ongoing injunction requires careful examination of whether the State’s current system continues to violate federal law and whether the existing judicial remedy remains necessary. The court could not preserve that remedy simply by reasoning that Arizona had not yet demonstrated complete compliance with every aspect of the original order.</p><p>At the same time, the State was not entitled to automatic dissolution. The enactment of No Child Left Behind did not displace the EEOA, and approval of a federal education plan did not by itself establish that Arizona had satisfied its separate obligations under federal law. Nor did evidence of improvement necessarily prove that the improvement was durable or that all English Language Learner programs were adequately funded. Those matters remain for the district court to determine in the first instance.</p><p>But the district court was required to apply the correct legal standard and to evaluate the entire record, including the changed educational methodology, administrative structure, funding system, student performance, and the expanded statewide scope of the remedy.<mark class='err' data-n='4'> The Ninth Circuit likewise erred by treating the State’s failure to appeal or previously comply as effectively dispositive and by demanding a “radical” change rather than applying Rule 60(b)(5)’s flexible equitable standard.</mark></p><p>Accordingly, the judgments below cannot stand.<mark class='err' data-n='5'> The proper disposition is to vacate the Ninth Circuit’s judgment and remand for reconsideration under the correct Rule 60(b)(5) standard.</mark> On remand, the district court should determine whether the changed circumstances warrant dissolution, modification, or continuation of the prospective relief, and should tailor any remaining remedy to the State’s present obligations under the EEOA.</p><p>RULING: Petitioner</p>", "error": "The district court dismissed the Rule 60(b)(5) motion for lack of subject-matter jurisdiction, and the Ninth Circuit affirmed that jurisdictional dismissal.", "truth": "The federal district court denied the Rule 60(b)(5) motion, and the Ninth Circuit affirmed that denial.", "nmarks": 5}, {"id": "C014", "text": "<p>This case comes to us after jury convictions of Maurice Lamont Davis and Andre Levon Glover on several federal offenses, including violations of 18 U.S.C.<mark class='tru' data-n='1'> § 924(c) predicated on Hobbs Act robbery and on aiding and abetting a conspiracy to commit a crime of violence.</mark><mark class='err' data-n='2'> The Fifth Circuit initially affirmed the convictions.</mark> After this Court decided *Sessions v. Dimaya*, the Court remanded for further consideration.<mark class='err' data-n='3'> On remand, the Fifth Circuit upheld the constitutionality of § 924(c)(3)(B) and affirmed the § 924(c) convictions at issue.</mark><mark class='tru' data-n='4'> The defendants petitioned for review, and we granted certiorari to decide whether § 924(c)(3)(B)’s residual definition of “crime of violence” is unconstitutionally vague.</mark></p><p>Governing law</p><p>The Due Process Clause prohibits criminal statutes that fail to provide ordinary people fair notice of the conduct they punish or that invite arbitrary and inconsistent enforcement. A statute is unconstitutionally vague when it leaves too much uncertainty about what conduct falls within its scope.</p><p>Section 924(c) imposes criminal penalties on a person who uses, carries, or possesses a firearm in connection with a “crime of violence.” The statute defines that term in two ways. Under the elements clause, an offense qualifies if it “has as an element the use, attempted use, or threatened use of physical force against the person or property of another.” § 924(c)(3)(A). Under the residual clause, an offense qualifies if it “by its nature, involves a substantial risk that physical force against the person or property of another may be used in the course of committing the offense.” § 924(c)(3)(B).</p><p>In determining whether an offense satisfies a clause of this kind, courts ordinarily apply a categorical approach. They examine the statutory elements of the offense rather than the defendant’s particular conduct and ask whether the ordinary—or least culpable—case encompassed by the offense necessarily involves the required use or risk of force. This approach is required by the statutory language and by the jury-trial limits recognized in decisions such as *Taylor v. United States*. A court therefore must imagine the ordinary case and assess the risk posed by that hypothetical offense.</p><p>In *Johnson v.<mark class='tru' data-n='5'> United States*, this Court held that a similarly worded residual clause in the Armed Career Criminal Act was unconstitutionally vague.</mark> In *Dimaya*, the Court reached the same conclusion as to the residual clause in 18 U.S.C. § 16(b), which used language materially identical to § 924(c)(3)(B). Those decisions establish that a residual clause is constitutionally defective when it requires courts to determine both what the ordinary case of an offense entails and whether that imagined case creates a sufficiently substantial risk of physical force.</p><p>Application</p><p>Section 924(c)(3)(B) suffers from precisely that defect. The clause does not ask whether the defendant actually used or threatened physical force. Nor does it ask whether the charged conduct, as found by the jury, involved a substantial risk of such force. Instead, under the categorical approach, it requires a court to identify the ordinary case encompassed by the charged offense and then estimate whether that hypothetical offense ordinarily presents a substantial risk that force may be used.</p><p>That methodology creates uncertainty at two levels. First, courts must determine the content of an “ordinary” version of an offense even though the statute does not explain how that determination is to be made. Second, courts must decide whether the imagined offense involves a “substantial risk” that physical force “may be used,” without providing a reliable standard for measuring either substantiality or probability. The resulting inquiry depends on judicial speculation rather than on ascertainable statutory elements or the defendant’s actual conduct.</p><p>The Government’s proposed conduct-specific interpretation does not cure the constitutional problem. Section 924(c)(3)(B) defines an offense by reference to what the offense “by its nature” involves. That language points to an offense-based, categorical inquiry, not to a case-specific examination of the facts proved at trial. Moreover, adopting a conduct-specific approach would require courts to disregard the statutory structure and would raise its own constitutional difficulties by allowing a judge, rather than a jury, to determine facts essential to the existence of the aggravated firearm offense.</p><p>Nor can constitutional avoidance save the provision. Constitutional avoidance permits a court to select among genuinely plausible interpretations of statutory text. It does not permit the Court to rewrite the statute or to replace the categorical inquiry required by the text and governing precedent with a different factual test. Because § 924(c)(3)(B) cannot reasonably be construed to avoid the uncertainty identified in *Johnson* and *Dimaya*, the clause must be invalidated.</p><p>This holding concerns only the residual clause. It does not invalidate § 924(c)(3)(A), the elements clause, which remains in force. Thus, a predicate offense may still qualify as a crime of violence if it necessarily includes the use, attempted use, or threatened use of physical force.<mark class='tru' data-n='6'> The parties’ dispute over whether particular convictions—such as completed Hobbs Act robbery—satisfy that separate clause is not resolved by today’s holding.</mark></p><p>Disposition</p><p>Section 924(c)(3)(B) is unconstitutionally vague. The judgment of the court of appeals is therefore reversed insofar as it upheld convictions predicated solely on that clause, and the case is remanded for further proceedings consistent with this opinion.</p><p>RULING: Petitioner</p>", "error": "On remand, the Fifth Circuit upheld 18 U.S.C. § 924(c)(3)(B)'s residual clause as constitutional and affirmed the aiding-and-abetting conspiracy conviction.", "truth": "On remand, the Fifth Circuit held 18 U.S.C. § 924(c)(3)(B)'s residual clause unconstitutionally vague and vacated the aiding-and-abetting conspiracy conviction, while affirming the Hobbs Act robbery conviction.", "nmarks": 6}, {"id": "C015", "text": "<p>IN THE SUPREME COURT</p><p>TOWN OF GREECE, NEW YORK, et al., *Petitioners*<br>v.<br>SUSAN GALLOWAY and LINDA STEPHENS, *Respondents*</p><p>OPINION OF THE COURT</p><p>---</p><p>I. PROCEDURAL HISTORY</p><p>The Town of Greece, New York, is governed by a five-member town board that conducts official business at monthly public meetings. Beginning in 1999, those meetings opened with a prayer offered by an invited member of the local clergy. The Town adopted no written policy governing who could offer the invocation or what it could say. In practice, the clergy who accepted the Town&#x27;s invitations were overwhelmingly Christian, and the prayers they delivered frequently invoked distinctively Christian themes. In 2007, respondents Susan Galloway and Linda Stephens objected; thereafter the range of denominations represented broadened somewhat.</p><p><mark class='tru' data-n='1'>In February 2008, respondents sued the Town and John Auberger, in his official capacity as Town Supervisor, alleging that the prayer practice violated the Establishment Clause of the First Amendment by preferring Christianity over other faiths.</mark><mark class='err' data-n='2'> The District Court entered judgment for the Town.</mark> It found, as a matter of fact, that respondents had failed to present credible evidence of intentional seclusion or exclusion of non-Christian faiths from the invitation process.</p><p><mark class='tru' data-n='3'>The United States Court of Appeals for the Second Circuit reversed.</mark><mark class='tru' data-n='4'> It held that the practice violated the Establishment Clause because, viewed in its totality, it conveyed a clear preference for Christian prayer.</mark><mark class='tru' data-n='5'> Notably, the Court of Appeals did not hold the District Court&#x27;s no-discrimination finding clearly erroneous.</mark> It instead concluded that the Town&#x27;s practice failed constitutional scrutiny notwithstanding the absence of purposeful exclusion, reasoning from the aggregate sectarian content of the prayers and the impression an objective observer would draw. We granted certiorari.</p><p>*A preliminary matter of order.* Counsel for respondents closed one submission by stating that &quot;[t]he Second Circuit nevertheless affirmed the district court&#x27;s judgment for the town&quot; and asking this Court to &quot;reverse,&quot; while elsewhere correctly asking us to &quot;affirm.&quot; The record is clear that respondents prevailed below and defend the Court of Appeals&#x27; judgment here. We treat the inconsistency as a scrivener&#x27;s error, not a concession, and it works no prejudice. We decide the case on the posture reflected in the record.</p><p>II. THE QUESTION PRESENTED</p><p><mark class='tru' data-n='6'>Whether the invocation of prayer at a legislative session violates the Establishment Clause of the First Amendment even in the absence of discrimination in the selection of prayer-givers and in the absence of content restrictions on the prayers offered.</mark></p><p>III. GOVERNING LAW</p><p>The Establishment Clause &quot;must be interpreted by reference to historical practices and understandings.&quot; *Marsh v. Chambers*, 463 U.S. 783 (1983), controls the starting point.<mark class='tru' data-n='7'> There, this Court sustained Nebraska&#x27;s practice of opening legislative sessions with prayer by a state-employed chaplain, resting not on the general-purpose tests developed for other Establishment Clause contexts but on the &quot;unambiguous and unbroken history of more than 200 years&quot; of legislative prayer in this country.</mark> The First Congress appointed paid chaplains days before it approved the language of the First Amendment. That fact does not merely tolerate legislative prayer; it establishes that the Framers did not understand such prayer to be an &quot;establishment&quot; at all.</p><p>*Marsh* supplies three operative principles.</p><p>First, the practice is judged by tradition, not by a freestanding endorsement inquiry. *Marsh* did not ask whether a reasonable observer would perceive the Nebraska chaplaincy as an endorsement of religion. Had it done so, the sixteen-year tenure of a single Presbyterian chaplain would not plausibly have survived.</p><p>Second, courts do not parse the content of prayers. *Marsh* held that it is &quot;not for us to embark on a sensitive evaluation or to parse the content of a particular prayer.&quot; The limiting principle is directional and cumulative: the opportunity may not be &quot;exploited to proselytize or advance any one, or to disparage any other, faith or belief.&quot; That is a prohibition on a pattern of denigration, threat, or conversion-seeking — not a requirement of theological blandness.</p><p>Third, the relevant coercion is real, not felt. *Marsh* expressly rejected a coercion claim pressed by a legislator who testified he felt obliged to stand. The Court reasoned that adults are presumed able to encounter, and to decline to join, religious expression with which they disagree. That is the line between *Marsh* and *Lee v. Weisman*, 505 U.S. 577 (1992), where the audience consisted of schoolchildren subject to the pressures of the school environment.</p><p>Two further points of law bear on this case.</p><p>The Establishment Clause applies to towns and to Congress alike through the Fourteenth Amendment. Petitioner&#x27;s suggestion that municipalities are *categorically* less constrained because &quot;[o]nly Congress could establish a religion for the entire nation&quot; is not persuasive, and we do not adopt it. The correct point — a narrower one — is that the tradition of legislative prayer is not confined to Congress and state legislatures; town and city councils are deliberative legislative bodies that have invoked divine guidance for as long as the Republic has existed. What *is* distinctive about the municipal setting is not the source of governmental power but the proximity of the citizen: town boards adjudicate individual applications, and citizens attend to petition for particular relief. That proximity is properly analyzed under the coercion inquiry, and we analyze it there.</p><p>Finally, a proposed constitutional rule must be administrable by courts without requiring the government to become &quot;a competent judge of religious truth.&quot; A doctrine that obliges legislative bodies to vet prayers for sectarian content, or to achieve denominational proportionality, requires the very entanglement of state and theology the Clause forbids.</p><p>IV. APPLICATION</p><p>A. Selection of prayer-givers</p><p>The District Court found no credible evidence of intentional seclusion of non-Christian faiths. That is a finding of fact, reviewable only for clear error, and the Court of Appeals did not set it aside as clearly erroneous. The record shows an invitation process open to congregations, and that after respondents&#x27; 2007 objection the denominational range broadened. That the resulting roster was overwhelmingly Christian reflects the religious composition of the congregations situated in the Town, not a policy of exclusion.</p><p>Respondents&#x27; answer is that a rotation or open-invitation scheme &quot;does not work&quot;: most citizens attend only one or two meetings and &quot;get the prayer they get that night&quot;; any rotation will be dominated by the local majority; and minority clergy may face hostility and decline to serve. These are serious observations about the sociology of small towns, and we do not dismiss them. But they are arguments about outcomes, not about governmental conduct, and they prove too much. A rule that a facially neutral, non-discriminatory invitation process is nonetheless unconstitutional *because* the local religious demography is lopsided would require the Town to recruit outside its borders until it assembled a denominationally balanced roster — that is, to classify clergy by creed and to manage religious representation by quota. Neutrality cannot be vindicated by compelling the government to sort citizens by faith. And the premise that minority faiths will be deterred is, on this record, speculation: respondents identify no instance in which a non-Christian clergy member sought to offer an invocation in Greece and was refused or discouraged.</p><p>B. Content of the prayers</p><p>Respondents&#x27; principal submission is that the Constitution requires prayers to avoid &quot;points on which believers are known to disagree.&quot; They ground this in Madison&#x27;s premise that government is not a competent judge of religious truth, and they contend that no founding-era prayer violated their principle.</p><p>The argument is thoughtful, but its own formulation defeats it. Counsel conceded that the founding-era prayers did not transgress the proposed rule because &quot;98-1/2 percent of the population was Protestant&quot; and Christ &quot;was not yet a point that disbelievers disagreed&quot; upon. That concession establishes that the absence of offending prayers in the founding era is evidence of religious homogeneity, not evidence of an operative *rule* against sectarian content. Respondents offer no founding-era authority — no statute, no rule of either House, no recorded objection — imposing such a restriction. A constitutional norm cannot be inferred from the silence of a population that had no occasion to break it. Meanwhile, petitioner points to the historical record of congressional chaplaincy, which included prayers that were, as respondents define the term, plainly sectarian.</p><p>The proposed rule also fails the test of administrability, and respondents&#x27; own attempt to apply it demonstrates why. Asked who is excluded by a &quot;points of common agreement&quot; standard, counsel answered that &quot;[t]rue polytheists who don&#x27;t understand their gods as manifestations of the one god are probably excluded. I&#x27;m not sure many others are.&quot; A rule of neutrality whose application requires a federal court to decide whether a given theology counts as sufficiently monotheistic to qualify for the common ground is not neutrality. It is the establishment of a civic creed, enforced by judges, with the adherents of disfavored theologies read out of the tradition. *Marsh*&#x27;s refusal to parse prayers was not fastidiousness; it was the recognition that once courts begin editing invocations, the government necessarily becomes the arbiter of acceptable religious speech.</p><p>Nothing in this record shows the invocations were exploited to proselytize, to threaten damnation, or to disparage other faiths. Sectarian reference, standing alone, is not denigration.</p><p>C. Coercion</p><p>This is respondents&#x27; strongest ground, and it deserves more than the treatment petitioner gave it.</p><p>Respondents correctly identify what makes a town board different from the Nebraska Senate: citizens come before the board to ask for specific and personal things — a cable channel preserved, a group home for a child with Down syndrome, a license, a permit. A petitioner who must shortly ask five officials for a discretionary benefit is differently situated from Senator Chambers, who was their colleague. Petitioner&#x27;s reliance on *Marsh*&#x27;s dismissal of Senator Chambers&#x27; claim therefore proves less than counsel supposed, and its rhetorical flourish that &quot;Americans are not bigots&quot; is not an argument; we disregard it, as we disregard respondents&#x27; invocation of nineteenth-century &quot;church burnings&quot; and &quot;people dead in the streets,&quot; which describes coerced religious exercises imposed on schoolchildren and bears no resemblance to this record.</p><p>Decided on the record rather than on rhetoric, however, the coercion claim fails.</p><p>Petitioner directed the Court to record evidence — Court of Appeals Appendix 929 and 1120 — that the invocation occurs at the 6:00 opening and that the board&#x27;s adjudicative business begins at 6:30 or 6:32. Respondents asserted flatly that &quot;[t]here is no separation in time between the public hearing and the invocation&quot; and that petitioner&#x27;s position is &quot;entirely formalistic,&quot; but they supplied no record citation contradicting the pages petitioner identified. On a contested question of fact, a cited record beats an uncited denial. The separation is not merely formal; it means the citizen with a petition is not standing before the board, application in hand, while the prayer is offered.</p><p>On participation: the record reflects that a request that the audience stand or join was made on three of 121 occasions. There is no evidence that any board member instructed attendees to participate, singled out dissenters, or allocated any benefit or burden by reference to who bowed a head. There is no evidence of reprisal. Respondents&#x27; remaining coercion factors — the presence of children in the room — are answered by the fact that legislative galleries and floors have always included young people, and, more importantly, by the absence of any school-like custodial relationship of the kind that drove *Lee*.</p><p>Respondents&#x27; proposed remedy confirms the character of their claim. They ask for a written policy, guidance to clergy to avoid contested doctrine, an instruction not to request physical participation, disclaimers, and a further separation in time — while conceding that &quot;[t]he coercion can&#x27;t be entirely eliminated.&quot; Several of these are sensible practices that a prudent town might adopt, and petitioner itself described comparable measures as &quot;safe harbors.<mark class='tru' data-n='8'>&quot; But the Establishment Clause is not a code of best practices.</mark> A town&#x27;s failure to reduce residual discomfort that the prayer tradition inherently carries is not a constitutional violation.</p><p>D. The judgment below</p><p>The Court of Appeals reversed a judgment resting on an unimpeached factual finding of non-discrimination, substituting an aggregate-impression test that no *Marsh* factor supports. Because the Town neither discriminated in selecting prayer-givers nor coerced participation, and because the Constitution does not require it to censor the theology of invited clergy, the practice is consistent with the Establishment Clause.</p><p>V. LIMITS OF THE HOLDING</p><p>We hold only what the question presented asks. Today&#x27;s ruling is not a license. A different case would be presented by a pattern, over time, of prayers that denigrate nonbelievers or other faiths, threaten damnation, or seek conversion; by evidence that a board purposefully excluded willing clergy of minority faiths; or by evidence that officials directed attendees to participate, singled out dissenters, or signaled that the disposition of pending business turned on participation. None of that is in this record.</p><p>VI. DISPOSITION</p><p><mark class='tru' data-n='9'>The judgment of the United States Court of Appeals for the Second Circuit is REVERSED, and the judgment of the District Court is reinstated.</mark></p><p>RULING: Petitioner</p>", "error": "The Second Circuit affirmed the district court's judgment in favor of the town.", "truth": "The U.S. Court of Appeals for the Second Circuit reversed the district court and held that the town's prayer practices violated the Establishment Clause.", "nmarks": 9}, {"id": "C016", "text": "<p>Opinion of the Court</p><p>I. Procedural History</p><p>B.L., a student at Mahanoy Area High School, unsuccessfully tried out for the varsity cheerleading team and was placed on the junior-varsity team. While away from school over a weekend, she posted to Snapchat a photograph captioned, “Fuck school fuck softball fuck cheer fuck everything.” The post was visible to approximately 250 people, including other students and cheerleaders. After several students brought the post to the coaches’ attention, the coaches concluded that it violated school and team rules and suspended B.L. from the junior-varsity cheerleading team for one year.</p><p>B.L. brought an action under 42 U.S.C. § 1983, alleging that the suspension violated the First Amendment and that the relevant school and team rules were overbroad, viewpoint discriminatory, and unconstitutionally vague.<mark class='tru' data-n='1'> The District Court granted summary judgment in her favor.</mark><mark class='tru' data-n='2'> The United States Court of Appeals for the Third Circuit affirmed, reasoning that the school could not punish the off-campus expression under the substantial-disruption standard governing student speech at school.</mark></p><p>The School District sought review in this Court. We granted certiorari to decide whether the First Amendment prohibits public-school officials from regulating off-campus student speech.</p><p>II. Governing Law</p><p>Students do not “shed their constitutional rights to freedom of speech or expression at the schoolhouse gate.” *Tinker v. Des Moines Independent Community School District*, 393 U.S. 503, 506 (1969). At the same time, the constitutional rights of students in public schools are applied in light of the special characteristics of the school environment. Under *Tinker*, a school may regulate student expression when it reasonably forecasts that the expression will cause a material and substantial disruption of schoolwork or invade the rights of others. This Court has also recognized limited authority over certain school-sponsored speech, lewd or vulgar speech delivered at school, and speech at a school event reasonably understood as promoting illegal drug use.</p><p>A student’s physical location does not, by itself, categorically determine whether a school may act. Modern communications can carry off-campus expression into the school environment immediately and can facilitate threats, harassment, bullying, cheating, or interference with school operations. The First Amendment therefore does not impose an absolute rule immunizing all off-campus student speech from school regulation.</p><p>But a school’s authority is substantially diminished when speech occurs off campus. Three considerations are particularly important. First, when a student speaks away from school and outside a school-sponsored activity, the school ordinarily does not stand in place of the student’s parents. Second, allowing schools to regulate both on-campus and off-campus expression would subject students to school control throughout the entire day. Courts must be especially skeptical of a rule under which a student can never speak freely about school officials, policies, or activities. Third, schools themselves have an interest in protecting the “marketplace of ideas,” including unpopular, critical, and even offensive expression.</p><p>Schools may retain a special regulatory interest in some off-campus circumstances, including serious or severe bullying or harassment directed at members of the school community, threats against students or teachers, failures to follow rules governing online school activities, cheating, and conduct that compromises school security or the functioning of particular school programs. But the school must identify a sufficiently weighty interest and demonstrate more than discomfort, offense, or generalized concern about morale. The mere fact that off-campus speech concerns the school or reaches students through social media does not place it within the school’s ordinary disciplinary authority.</p><p>III. Application</p><p>B.L.’s Snapchat post was created away from school, over a weekend, on her own time and through a personal social-media account. It was not made during a class, practice, game, school trip, or other school-supervised activity. It did not purport to speak for the school or the cheerleading program.</p><p>The post was vulgar and reflected poorly on B.L.’s judgment. But the First Amendment protects a significant amount of crude, intemperate, and offensive expression, particularly when it is not delivered in a captive school setting. B.L.’s message expressed frustration with school, softball, and cheerleading. It did not threaten anyone, target a particular student for harassment, reveal confidential team information, encourage unlawful conduct, or organize interference with school operations.</p><p>Nor does the record establish a material and substantial disruption. Several students approached the coaches and complained that the post was inappropriate. That reaction demonstrates that the expression reached members of the school community, but it does not by itself establish the disruption required by the First Amendment. Listeners’ offense cannot supply a veto over protected speech. Nothing in the record shows significant interference with classes, cheerleading practices, school security, or the rights of other students.</p><p>The District argues that cheerleading depends upon cohesion, mutual support, and respect for coaches, and that participation in an extracurricular team may carry obligations not applicable to the student body at large. Those interests can be legitimate. A school may adopt appropriately defined rules governing conduct at practices and competitions, and it may in some circumstances address off-campus behavior that directly and seriously undermines a team’s operation. But the asserted interest here is insufficient to justify a year-long suspension for a single generalized expression of frustration. Treating an isolated off-campus criticism as punishable whenever it affects team morale would give school officials excessively broad authority over students’ private expression.</p><p>We therefore decline to adopt the Third Circuit’s reasoning to the extent it establishes an absolute rule that *Tinker* can never apply to off-campus speech. The First Amendment does not categorically deprive schools of authority whenever a student speaks beyond school grounds. Nevertheless, because the School District has not demonstrated the special circumstances or substantial disruption necessary to justify its action in this case, B.L.’s suspension violated the First Amendment.</p><p>IV. Disposition</p><p><mark class='tru' data-n='3'>The judgment of the United States Court of Appeals for the Third Circuit is affirmed.</mark> Public schools retain limited authority over certain off-campus student speech, but that authority did not permit the School District to punish B.L. for the expression shown by this record.</p><p>RULING: Respondent</p>", "error": "The Third Circuit reversed the district court’s grant of summary judgment in B.L.’s favor.", "truth": "The district court granted summary judgment in B.L.’s favor, and the Third Circuit affirmed.", "nmarks": 3}, {"id": "C017", "text": "<p>Procedural History</p><p>Michael Biestek applied for Supplemental Security Income and Disability Insurance benefits in March 2010, alleging disability beginning October 28, 2009, based on degenerative disc disease, Hepatitis C, and depression. The Social Security Administration initially denied the claims. An Administrative Law Judge likewise denied benefits, and the Appeals Council declined review.</p><p>On Biestek’s first appeal, the District Court adopted a magistrate judge’s determination that the ALJ had failed to obtain necessary medical-expert testimony and had posed an insufficiently specific hypothetical to the vocational expert. The case was remanded. On remand, the ALJ determined that Biestek became disabled on May 4, 2013, but that he was not disabled before that date.<mark class='tru' data-n='1'> The District Court affirmed that determination.</mark></p><p><mark class='tru' data-n='2'>The Court of Appeals for the Sixth Circuit affirmed.</mark> It held that substantial evidence supported the ALJ’s findings concerning Biestek’s impairments and that the ALJ properly evaluated the medical and vocational evidence. This appeal concerns whether the vocational expert’s testimony could constitute substantial evidence even though the expert declined to furnish underlying data requested by Biestek’s representative.</p><p>Governing Law</p><p>Under the Social Security Act, judicial review asks whether the Commissioner’s factual findings are supported by “substantial evidence.” 42 U.S.C. § 405(g). Substantial evidence means such relevant evidence as a reasonable mind might accept as adequate to support a conclusion. It requires more than a scintilla, but it does not require proof meeting the standards applicable in a judicial trial.</p><p>At step five of the disability analysis, the agency must establish that work exists in significant numbers in the national economy that the claimant can perform despite his limitations. Vocational-expert testimony may provide evidence on that question. Social Security hearings are administrative rather than adversarial trials, and the ordinary evidentiary rules do not mechanically control the agency’s proceedings.</p><p>The substantial-evidence inquiry is necessarily record-specific. An expert’s refusal to produce every underlying source or work product does not create a categorical rule that the testimony is incompetent or insubstantial. Nor, however, does the title “vocational expert” immunize conclusory testimony from scrutiny. The testimony’s evidentiary value depends on such matters as the expert’s explanation of the opinion, identified sources, the specificity of the hypothetical, the extent and effectiveness of cross-examination, contrary evidence, and other circumstances bearing on reliability.</p><p>*Richardson v. Perales* supports that approach. There, the Court considered whether evidence was sufficiently reliable to constitute substantial evidence in light of the entire administrative record and available procedural protections. It did not establish an inflexible disclosure-on-demand requirement for every item that informs an expert’s opinion.</p><p>Application</p><p>The vocational expert here identified categories of work and offered numerical estimates concerning jobs available in the national economy. The record indicates that the expert’s work involved public employment information as well as professional judgment and surveys used to relate broad occupational data to the particular limitations posed in the ALJ’s hypotheticals. The expert declined to provide certain survey material or client-related files after the ALJ stated that confidential individual files need not be produced.</p><p>That refusal did not, standing alone, deprive the testimony of all probative force. The claimant remained free to examine the expert concerning the occupational categories, methodology, public sources, statistical extrapolations, and bases for the proposed reductions in job numbers. Such questioning could have exposed an unsupported methodology, an unreliable estimate, or a mismatch between the stated jobs and the ALJ’s hypothetical. In an appropriate record, answers elicited through cross-examination—or an expert’s inability to explain the asserted figures—could indeed prevent the testimony from amounting to substantial evidence.</p><p>But the record presented here does not establish that result. The objection was principally a demand for production of underlying data, rather than a developed examination demonstrating that the expert’s estimates lacked a reasoned basis. The expert’s identification of vocational job categories, numerical estimates, and sources of professional information provided a basis on which a reasonable adjudicator could rely. The claimant’s claim that the data might reveal an error is not equivalent to record evidence showing that the testimony was unreliable or insufficient.</p><p>The claimant’s concern is not trivial. Vocational estimates may involve difficult translations between occupational classifications and employment statistics, and disclosure of supporting material may often be sound administrative practice. But the substantial-evidence standard does not require a categorical rule that an expert’s testimony becomes legally void whenever requested underlying materials are not produced. The proper inquiry remains whether, considering the whole record, a reasonable mind could accept the testimony as adequate support for the ALJ’s finding. Here, that standard is met.</p><p>Disposition</p><p>The judgment of the Court of Appeals is affirmed. A vocational expert’s testimony may constitute substantial evidence of other work available in the national economy even when the expert does not provide the underlying data on request; whether it does so depends on the evidence and procedures in the particular administrative record.</p><p>RULING: Respondent</p>", "error": "The Sixth Circuit reversed the district court.", "truth": "The Sixth Circuit affirmed the district court.", "nmarks": 2}, {"id": "C018", "text": "<p>SUPREME COURT OF THE UNITED STATES</p><p>MUTUAL PHARMACEUTICAL COMPANY, INC., *Petitioner*, v. KAREN L. BARTLETT, *Respondent*</p><p>On Writ of Certiorari to the United States Court of Appeals for the First Circuit</p><p>---</p><p>OPINION OF THE COURT</p><p>I. Procedural History</p><p>In December 2004, respondent Karen Bartlett was prescribed sulindac, a non-steroidal anti-inflammatory drug, for shoulder pain. Her pharmacist dispensed a generic form manufactured by petitioner Mutual Pharmaceutical Company. Within months respondent developed Stevens-Johnson syndrome and toxic epidermal necrolysis. Sixty percent of her epidermis deteriorated; she suffered open wounds over most of her body, underwent extended hospitalization and multiple surgeries, and is now nearly blind. The severity of these injuries is not disputed, and this Court records at the outset that nothing in today&#x27;s holding minimizes them.</p><p>Respondent sued in the United States District Court for the District of New Hampshire, initially advancing several negligence and product-liability theories.<mark class='tru' data-n='1'> Only the strict-liability design-defect claim reached the jury.</mark> Petitioner defended on the merits and also asserted that federal law governing generic drug manufacturers preempted the state-law claim. After a fourteen-day trial, the jury returned a verdict for respondent and awarded in excess of $20 million in compensatory damages.</p><p>Petitioner moved for judgment as a matter of law and for a new trial, raising, among other grounds, misapplication of New Hampshire product-liability law, erroneous evidentiary rulings, excessiveness of the award, and preemption. The district court denied relief. The Court of Appeals for the First Circuit affirmed. On the preemption question, the court of appeals acknowledged that federal law forbids a generic manufacturer from altering either the composition or the labeling of its drug, but reasoned that petitioner could have avoided the collision between federal and state law by declining to sell sulindac in New Hampshire at all. We granted certiorari to decide whether federal law preempts a state-law design-defect claim against a generic drug manufacturer.</p><p>We hold that it does, and we reverse.</p><p>II. Governing Law</p><p>A. The Supremacy Clause and impossibility preemption. The Supremacy Clause makes federal law &quot;the supreme Law of the Land,&quot; and state law that conflicts with federal law &quot;is without effect.&quot; A conflict exists, as relevant here, where &quot;compliance with both federal and state regulations is a physical impossibility.&quot; *Florida Lime &amp; Avocado Growers, Inc. v. Paul*, 373 U.S. 132, 142–43 (1963). Petitioner correctly identifies that formulation as the operative one, and correctly notes that the *Florida Lime* inquiry is framed in terms of what is possible &quot;for one engaged in interstate commerce&quot; — that is, for a regulated party *in the market*, not for a hypothetical party that has exited it.</p><p>B. Hatch-Waxman&#x27;s sameness requirements. A generic manufacturer obtains approval under an abbreviated new drug application by demonstrating that its product is the bioequivalent of, and bears labeling identical to, the reference listed drug. 21 U.S.C. § 355(j)(2)(A); 21 C.F.R. § 314.94(a)(5), (a)(8). The duty of sameness is ongoing: a generic manufacturer may not unilaterally alter the drug&#x27;s active ingredient, dosage form, strength, or route of administration, and it may not unilaterally strengthen its warnings.</p><p>C. *PLIVA v. Mensing*. In *PLIVA, Inc. v. Mensing*, 564 U.S. 604 (2011), we held that the labeling-sameness requirement preempts state failure-to-warn claims against generic manufacturers. The reasoning was straightforward: state law demanded a stronger warning; federal law forbade the generic manufacturer from providing one unilaterally; and &quot;when a party cannot satisfy its state duties without the Federal Government&#x27;s special permission and assistance, which is dependent on the exercise of judgment by a federal agency, that party cannot independently satisfy those state duties for pre-emption purposes.&quot; *Id.* at 623–24.</p><p>*Mensing* also disposes, by necessary implication, of the &quot;stop-selling&quot; rationale adopted below. PLIVA was under no federal obligation to market metoclopramide; it could have left the market. We nonetheless found impossibility. The same is true of *Wyeth v. Levine*, 555 U.S. 555 (2009): had &quot;cease marketing&quot; counted as a mode of compliance, no impossibility analysis would ever have been necessary in either case, and the doctrine would be a dead letter. Petitioner&#x27;s point on this score is well taken. Impossibility preemption presupposes a party engaged in the regulated conduct and asks whether, so engaged, it can obey both sovereigns. As *Geier v. American Honda Motor Co.*, 529 U.S. 861 (2000), illustrates, federal standards typically condition conduct rather than compel it; no federal law requires anyone to sell automobiles, yet federal airbag policy could still displace state tort duties.</p><p>D. Damages actions impose &quot;requirements.&quot; Respondent&#x27;s submission that New Hampshire imposes only &quot;a duty to pay compensation&quot; rather than a duty to change conduct cannot be reconciled with our settled law. *Cipollone v. Liggett Group, Inc.*, 505 U.S. 504, 521 (1992); *Riegel v. Medtronic, Inc.*, 552 U.S. 312, 324 (2008). State-law liability rules operate as a form of regulation; the obligation to pay is the sanction by which the underlying safety standard is enforced. Nor does the strict-liability/negligence line bear the weight respondent places on it. Preemption analysis looks to the substance of the state-law duty, not the label of the cause of action.</p><p>E. New Hampshire design-defect law. Under *Thibault v. Sears, Roebuck &amp; Co.*, 118 N.H. 802 (1978), and *Vautour v. Body Masters Sports Industries, Inc.*, 147 N.H. 150 (2001), a plaintiff must show the product was &quot;unreasonably dangerous,&quot; assessed through a risk-utility balancing that expressly includes, among its factors, the presence and efficacy of warnings. New Hampshire courts treat warnings as bearing on whether the design is unreasonably dangerous — a point respondent&#x27;s own counsel accepts when explaining that the jury &quot;may use the warning as a way to limit or minimize the risk.&quot;</p><p>III. Application</p><p>A. The core conflict. New Hampshire law imposed on petitioner a duty not to sell a product whose risks outweigh its utility. Given that the product was on the market, only two avenues existed for petitioner to discharge that duty: alter sulindac&#x27;s chemical composition so as to reduce its risks, or strengthen its labeling so as to reduce the incidence or severity of the harm. Federal law forecloses both. Sulindac is a single-molecule drug; its composition cannot be changed without it ceasing to be sulindac, and in any event the sameness requirement forbids unilateral redesign. And *Mensing* squarely forbids unilateral relabeling.</p><p>Respondent&#x27;s counsel does not contest either premise. She candidly acknowledges that petitioner&#x27;s &quot;hands are tied&quot; as to design, and she affirmatively represents — indeed, presses as a distinguishing feature of this case — that &quot;there is no way to change the label here.&quot; That concession is significant. It removes the one route by which *Wyeth v. Levine* permitted a brand-name manufacturer to escape impossibility: the changes-being-effected regulation, available on newly acquired information. What remains is a state-law duty that petitioner could satisfy only by doing what federal law prohibits.</p><p>B. The court of appeals&#x27; &quot;stop-selling&quot; rationale. The First Circuit&#x27;s holding that petitioner &quot;could have chosen not to make the drug at all&quot; cannot stand, for the reasons given in Part II.C. Respondent, to her credit, devotes little effort to defending it, resting instead on the alternative theories addressed below.</p><p>C. Respondent&#x27;s &quot;duty to compensate&quot; theory. Respondent&#x27;s most forceful argument is that no one can say &quot;with a straight face&quot; that paying a judgment is impossible. The rhetoric is vivid but the premise is legally mistaken. If the obligation to pay damages were merely a monetary burden rather than an enforcement of a substantive safety standard, *Mensing* itself would have come out the other way, as would *Riegel* and *Cipollone*. The judgment here was not imposed for petitioner&#x27;s failure to pay; it was imposed for petitioner&#x27;s having sold a product configured as federal law required it to be configured. That is the conflict.</p><p>D. Respondent&#x27;s adequacy/efficacy distinction. Respondent draws a careful line between the *adequacy* of a warning (whether it describes the risk) and its *efficacy* (whether it reduces the risk), and argues that the district court confined the jury to the latter, so that the warning could only help petitioner. This is the most sophisticated argument in the record, and it does real work in answering pe
