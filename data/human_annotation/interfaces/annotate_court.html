violation arises only where the joinder itself skewed the weighing process, and any residual error is subject to harmless-error review.</p><p>III. Application</p><p>A. The mitigation instruction.<mark class='err' data-n='2'> The Kansas Supreme Court erred in holding that the Eighth Amendment requires the affirmative instruction.</mark> The relevant question is not whether the instruction would have been preferable or even required by state law, but whether its absence prevented the jury from giving effect to mitigating evidence. It did not. The jury was instructed to consider mitigating circumstances and was told to weigh aggravating and mitigating evidence; nothing in the instructions precluded the jury from considering and giving effect to the mitigation presented. The federal Constitution requires only that the sentencer not be *barred* from considering mitigation. The Kansas rule mandating the instruction is a rule of state procedural law, and a state may not transform a state-law instructional requirement into federal constitutional error. The omission of the instruction, even if erroneous under Kansas law, does not violate the Eighth Amendment.</p><p>B. Severance of the penalty phase.<mark class='err' data-n='3'> The Kansas Supreme Court likewise erred.</mark> The defendants each received an individualized sentencing determination: each presented all the mitigation he chose to offer; the jury was expressly instructed to consider each defendant separately, with separate instructions particular to each; the jury returned individual verdict forms; and the same jury had already demonstrated its capacity to distinguish between the brothers at the guilt phase, acquitting one of counts on which it convicted the other. The principal evidence respondents identify — testimony that Reginald was a &quot;corrupting influence&quot; on his younger brother — does not establish federal constitutional error. Even assuming that testimony was erroneously admitted or inadmissible under state law, it was, at most, a claim of state-law evidentiary error, and its admission did not prevent the jury from giving individualized consideration to each defendant&#x27;s character, record, and offense. The Constitution requires individualized *consideration*, not separate *proceedings*. Where, as here, the jury was properly instructed to evaluate each defendant individually, the refusal to sever does not offend the Eighth Amendment. The Kansas Supreme Court&#x27;s reliance on the trial judge&#x27;s failure to make adequate findings under *state* severance law cannot sustain a federal constitutional reversal. To the extent any error occurred, the State&#x27;s concession-based posture and the overwhelming individualized record would in any event render it harmless beyond a reasonable doubt.</p><p>IV. Disposition</p><p><mark class='err' data-n='4'>The judgment of the Kansas Supreme Court is reversed insofar as it rested on federal constitutional grounds.</mark> The Eighth Amendment does not require an instruction that mitigating circumstances need not be proven beyond a reasonable doubt, and the refusal to sever the penalty phases of these joint proceedings did not deny the defendants individualized sentencing determinations. The cases are remanded for further proceedings not inconsistent with this opinion.</p><p>RULING: Petitioner</p>", "error": "The Kansas Supreme Court reversed the Carrs’ underlying convictions along with their death sentences.", "truth": "The Kansas Supreme Court reversed the Carrs’ death sentences based on sentencing-phase errors; it did not reverse their underlying convictions.", "nmarks": 4}, {"id": "C052", "text": "<p>Opinion of the Court</p><p>I. Procedural History</p><p>Jonathan and Reginald Carr were jointly prosecuted in Kansas for a series of robberies, assaults, rapes, and murders committed in Wichita in December 2000. Before trial, the Carrs sought severance, asserting that their defenses would be antagonistic and that a joint proceeding would expose each defendant to evidence that might be inadmissible or nonprejudicial in a separate case. The trial court denied severance. A jury convicted both defendants of numerous offenses and, following a joint penalty proceeding, sentenced them to death.</p><p>The penalty-phase instructions required the jury to find aggravating circumstances beyond a reasonable doubt but did not affirmatively state that mitigating circumstances need not be proved beyond a reasonable doubt. The instructions also directed the jury to consider each defendant separately, and the jury returned a distinct verdict form for each.</p><p><mark class='err' data-n='1'>The Kansas Supreme Court vacated the Carrs’ death sentences.</mark> It concluded that the trial court had not adequately analyzed the need to sever the penalty proceedings and that the joint proceeding impaired the Carrs’ Eighth Amendment right to individualized sentencing. It also held that the omission of an express instruction concerning the absence of a burden of proof for mitigating circumstances may have prevented jurors from giving meaningful effect to mitigating evidence.</p><p>In a separate prosecution, Sidney Gleason was convicted of capital murder and other offenses and received a death sentence.<mark class='err' data-n='2'> On appeal, the Kansas Supreme Court set aside his death sentence on the same mitigation-instruction theory.</mark> Kansas sought review, and the cases came before this Court in consolidated proceedings.</p><p>The questions are whether the Eighth Amendment requires an affirmative instruction that mitigating circumstances need not be proved beyond a reasonable doubt and whether the refusal to sever the Carrs’ penalty proceeding violated their right to individualized capital sentencing.</p><p>II. Governing Law</p><p>The Eighth Amendment requires heightened reliability in capital sentencing. A sentencer may not be prevented from considering relevant evidence concerning a defendant’s character, record, or the circumstances of the offense as a basis for a sentence less than death. *Lockett v. Ohio*; *Eddings v. Oklahoma*. Where an instruction is challenged, the relevant inquiry is whether there is a reasonable likelihood that the jury understood the instructions to preclude constitutionally relevant mitigation. *Boyde v. California*. The Constitution does not, however, require a particular form of capital-sentencing instruction whenever the instructions as a whole permit the jury to consider and give effect to mitigating evidence. *Buchanan v. Angelone*.</p><p>Aggravating circumstances perform a different function. Because they authorize or support a death sentence, a State may place—and Kansas did place—the burden on the prosecution to establish them beyond a reasonable doubt. Mitigating circumstances, by contrast, commonly involve matters of mercy, compassion, character, or reduced moral culpability. Such considerations are not necessarily factual propositions susceptible to proof beyond a reasonable doubt.</p><p>The individualized-sentencing requirement likewise demands that each capital defendant be judged on the basis of that defendant’s own character, record, and participation in the offense. It does not establish a categorical constitutional right to a separate penalty proceeding. Joint proceedings are not unconstitutional merely because codefendants present antagonistic mitigation or because evidence favorable to one defendant reflects unfavorably upon another. A constitutional problem arises only when the procedure prevents the jury from considering each defendant individually or introduces prejudice so severe that the resulting sentencing determination is fundamentally unfair. Errors of state severance law, without more, do not establish an Eighth Amendment violation.</p><p>III. Application</p><p>A. The mitigation instructions</p><p><mark class='err' data-n='3'>The Kansas Supreme Court erred by converting the Eighth Amendment’s requirement that jurors be allowed to consider mitigation into a requirement for a specific burden-of-proof instruction.</mark></p><p>The jurors were expressly told that the State bore the burden of proving aggravating circumstances beyond a reasonable doubt. Nothing in the instructions placed that burden—or any burden—on the defendants with respect to mitigation. Nor did the instructions state that a mitigating circumstance had to be found unanimously or satisfy any prescribed evidentiary threshold. Rather, mitigation was described in terms of fairness, mercy, and reduced moral culpability.</p><p>There is no reasonable likelihood that jurors would understand the express allocation of a beyond-a-reasonable-doubt burden to aggravating circumstances as silently imposing the same burden on mitigation. The concepts are materially different. A juror may regard a circumstance as warranting mercy without first deciding that the circumstance has been established according to a formal standard of proof.</p><p>The respondents’ concern that jurors might have imported the aggravation standard into the mitigation inquiry is not frivolous, but it rests on speculation rather than the language or structure of the instructions. The Eighth Amendment requires a meaningful opportunity to present and consider mitigation; it does not require courts to negate every conceivable misunderstanding through an affirmative instruction. Because the instructions did not prevent the jurors from considering or giving effect to mitigating evidence, their omission of the proposed language was not unconstitutional.</p><p>B. The joint penalty proceeding</p><p>The Carrs were permitted to present the mitigating evidence they selected. The jury was repeatedly directed to consider each defendant individually, received instructions applicable separately to each, and completed separate verdict forms. Its verdicts during the guilt phase also demonstrated an ability to distinguish between the brothers rather than treating them as an undifferentiated unit.</p><p>The respondents principally identify evidence presented on Jonathan Carr’s behalf that Reginald Carr had exercised a corrupting influence over him. That evidence could support Jonathan’s claim of reduced culpability while casting Reginald in an unfavorable light. This concern warrants judicial attention, and a trial court should carefully examine whether antagonistic mitigation creates a serious danger of unfair prejudice. But antagonism alone does not establish that Reginald was denied an individualized sentencing determination. Evidence about the brothers’ relationship could bear on Jonathan’s character and, at least potentially, on Reginald’s character as well. Even assuming some portion of it should have been excluded or warranted severance under Kansas law, a state-law evidentiary or procedural error does not by itself amount to an Eighth Amendment violation.</p><p>The respondent’s reliance on cases involving a skewed capital-sentencing process is unpersuasive here. The jury was not instructed to treat Jonathan’s mitigation as an aggravating circumstance against Reginald, nor was it prevented from considering either defendant’s mitigating evidence. The separate instructions and verdict forms preserved the required defendant-specific inquiry. On this record, the asserted spillover prejudice is too attenuated to show that the joint proceeding rendered either sentence fundamentally unfair.</p><p>The brutality of the underlying crimes cannot substitute for constitutional analysis, and we do not rely on their emotional force to excuse a defective procedure. Nevertheless, after examining the actual instructions, evidence, and verdict mechanism, we conclude that the sentencing process allowed the jury to assess each defendant separately. The Eighth Amendment required no more.</p><p>IV. Disposition</p><p>The Eighth Amendment does not require a capital-sentencing jury to be affirmatively instructed that mitigating circumstances need not be proved beyond a reasonable doubt when the instructions, considered as a whole, do not impose such a burden or prevent meaningful consideration of mitigation. Nor did the joint penalty proceeding in the Carr cases, on this record, violate the constitutional requirement of individualized sentencing.</p><p><mark class='err' data-n='4'>The judgments of the Kansas Supreme Court are reversed insofar as they vacated the death sentences on those grounds, and the cases are remanded for further proceedings consistent with this opinion.</mark> We express no view on any independent issue not encompassed by the questions presented.</p><p>RULING: Petitioner</p>", "error": "The Kansas Supreme Court reversed the Carrs’ underlying convictions along with their death sentences.", "truth": "The Kansas Supreme Court reversed the Carrs’ death sentences based on sentencing-phase errors; it did not reverse their underlying convictions.", "nmarks": 4}, {"id": "C053", "text": "<p>IN RE: WASHINGTON STATE DEPARTMENT OF LICENSING v. COUGAR DEN, INC.</p><p>Opinion of the Court</p><p>---</p><p>I. Procedural History</p><p>This case arises from a $3.6 million assessment issued in December 2013 by the Washington State Licensing Department against Cougar Den, Inc., a fuel distributor owned by a member of the Yakama Nation.<mark class='tru' data-n='1'> The assessment sought unpaid motor vehicle fuel taxes, penalties, and licensing fees on the ground that Cougar Den had hauled fuel across the Oregon–Washington line, and into the Yakama Reservation, without a license and without remitting the state fuel tax.</mark></p><p>Cougar Den protested. The Department&#x27;s administrative law judge sustained the protest, concluding that the assessment could not be squared with Article III of the Treaty with the Yakamas of 1855. The Director of the Department reversed the ALJ and reinstated the assessment.<mark class='err' data-n='2'> Cougar Den appealed to the Yakima County Superior Court, which reversed the Director&#x27;s order and held that the assessment violated the Tribe&#x27;s treaty-secured right to travel.</mark><mark class='err' data-n='3'> The Department sought review in the Supreme Court of Washington, which affirmed the Superior Court.</mark><mark class='tru' data-n='4'> That court held that Article III bars the State from taxing &quot;any trade, traveling, and importation&quot; by Yakama tribal members &quot;that requires the use of public roads,&quot; including activity occurring outside the reservation, and that the treaty therefore preempted application of the wholesale fuel tax to Cougar Den.</mark></p><p>The case comes to this Court on the State&#x27;s challenge to that judgment. Although the docket designates the party defending treaty preemption as Petitioner and the taxing authority as Respondent, the substantive positions are unmistakable and we resolve the case on them: Petitioner contends that Article III forecloses the assessment; Respondent contends that Article III supplies no immunity from a generally applicable excise tax on fuel.</p><p><mark class='tru' data-n='5'>We note at the outset that the Washington Supreme Court&#x27;s formulation sweeps considerably more broadly than the disposition this case requires, and more broadly than the decisions of the Ninth Circuit, which has repeatedly declined to read Article III as a general exemption from state taxes and fees on off-reservation commercial activity.</mark> As explained below, we do not endorse that broad formulation. We nonetheless affirm the judgment, because the tax as applied to Cougar Den falls on the very activity the treaty secures.</p><p>---</p><p>II. Governing Law</p><p>A. The baseline rule of state taxing power. Absent express federal law to the contrary, a State may tax the off-reservation activities and income of tribal members on the same terms as those of other citizens. *Mescalero Apache Tribe v. Jones*, 411 U.S. 145 (1973); *Oklahoma Tax Comm&#x27;n v. Chickasaw Nation*, 515 U.S. 450 (1995). Respondent is correct that tribal membership is not a roving immunity from the &quot;economic framework for trading goods that has developed outside of the reservation.&quot; The question in every case of this kind is therefore not whether the taxpayer is an Indian, but whether some federal enactment — here, a ratified treaty operating through the Supremacy Clause — withdraws the taxed activity from state reach.</p><p>B. Treaty construction. Treaties with Indian tribes are to be construed &quot;as the Indians themselves would have understood them,&quot; with ambiguities resolved in the tribes&#x27; favor and the treaty read not as a grant of rights to the tribe but as &quot;a reservation by them of rights already possessed.&quot; *United States v. Winans*, 198 U.S. 371 (1905); *Choctaw Nation v. United States*, 318 U.S. 423 (1943); *Minnesota v. Mille Lacs Band*, 526 U.S. 172 (1999). Critically, the phrase &quot;in common with citizens of the United States&quot; does not reduce a reserved right to a mere equal-protection guarantee. *Washington v. Washington State Commercial Passenger Fishing Vessel Ass&#x27;n*, 443 U.S. 658 (1979).</p><p>C. Fees versus regulation. The fishing-right cases mark the boundary. A State may impose regulation that is reasonably necessary to conservation of the resource — the subject matter of the treaty — even as applied to treaty holders. *Puyallup Tribe v. Department of Game*, 391 U.S. 392 (1968). But a State may *not* exact a fee as the price of exercising the reserved right, even through a nondiscriminatory, generally applicable licensing scheme. *Tulee v. Washington*, 315 U.S. 681 (1942). The license fee struck down in *Tulee* applied to Indians and non-Indians alike; it fell nonetheless. Respondent&#x27;s suggestion that a ban on hazardous transport would be lawful while a tax is not is therefore no reductio at all: it is precisely the distinction *Puyallup* and *Tulee* draw between regulating the exercise of a right and charging for it.</p><p>D. Identifying what is taxed. Where preemption turns on the character of a state tax, the analysis is formal, not purposive. The Court asks who bears the legal incidence and — decisively here — what the taxpayer did that triggered the tax: the &quot;taxable event.&quot; *Wagnon v. Prairie Band Potawatomi Nation*, 546 U.S. 95 (2005). *Wagnon* refused to look past the statutory taxable event to the State&#x27;s broader objectives; the same discipline binds a State that would look past its own taxable event to characterize a levy more favorably. And the construction that a State&#x27;s highest court places on a state revenue statute is authoritative here. *Mullaney v. Wilbur*, 421 U.S. 684 (1975).</p><p>---</p><p>III. Application</p><p>A. The scope of the reserved right. Article III secures &quot;the right, in common with citizens of the United States, to travel upon all public highways.&quot; Under *Fishing Vessel*, the &quot;in common with&quot; clause does not collapse that right into an ordinary citizen&#x27;s privilege. The historical record recited by the parties — Governor Stevens&#x27;s assurance that the Yakamas could &quot;take [their] goods to market,&quot; including down to the Columbia River, and the fact that the very corridor at issue was ceded land over which the Tribe then traveled freely with goods — establishes that the Yakamas understood themselves to be reserving a right to move themselves and their goods to market over these roads without exaction. Respondent&#x27;s answer is that nothing in the negotiating history addresses taxation of cargo. But the treaty canons place the burden the other way: ambiguity is resolved in the Tribe&#x27;s favor, and it strains the bargain to suppose the Yakamas surrendered this land while retaining only a right to be charged on the same terms as everyone else for crossing it.</p><p>We reject, however, the Washington Supreme Court&#x27;s broader proposition that the treaty immunizes &quot;any trade&quot; that &quot;requires the use of public roads.&quot; Nearly all commerce requires roads. Read that way, Article III would confer the general off-reservation tax immunity that *Mescalero* forecloses, and would render suspect the Ninth Circuit decisions sustaining taxes on off-reservation sales, income, and manufacture. The reserved right protects travel and the transport of goods incident to it; it does not protect every downstream commercial transaction that a truck made possible.</p><p>B. What this tax taxes. The case therefore turns on whether Washington&#x27;s levy operates on travel or on goods. On this record, it operates on travel.</p><p>First, the statute&#x27;s own terms. The taxable event is the *entry of fuel into the State*, and the taxpayer is defined as the *importer*. The scheme further distinguishes among importers according to whether fuel enters by ground transportation over the highways or by other means, deferring the tax in the latter case. Under *Wagnon*&#x27;s formal taxable-event inquiry, the act that triggered Cougar Den&#x27;s liability was hauling fuel over a public highway across the state line.</p><p>Second, the state court&#x27;s authoritative construction. The Washington Supreme Court read the statute as reaching importation that &quot;requires the use of public roads.&quot; We are bound by that reading of state law. And once the State&#x27;s own highest court characterizes the operative event as highway importation, preemption follows nearly of its own force: the State is taxing the precise conduct the treaty secures.</p><p>Respondent&#x27;s counterarguments do not survive contact with the record.<mark class='tru' data-n='6'> That the tax would also reach fuel purchased from an in-state refinery shows only that the statute has applications outside the treaty&#x27;s protection; as applied to Cougar Den, whose fuel entered Washington solely by truck over the highway, the trigger was travel.</mark> That is the correct frame: in *Chickasaw Nation*, a generally applicable tax was preempted *as applied* to protected activity, and in *Tulee* a generally applicable fee fell as applied to a treaty fisherman. Nor does the disaggregation point carry the day. Respondent observes that Cougar Den sometimes engaged a contract hauler and so &quot;possessed&quot; rather than transported. But the statute imputes the act of importation to the fuel&#x27;s owner through its definition of importer — a sensible allocation, since the tax would swamp a hauler&#x27;s fee — and the record reflects that Cougar Den also used its own trucks. A treaty right exercised through an agent is still exercised.</p><p>C. The limiting principle. Our holding is narrow, and we decline Petitioner&#x27;s broader invitation, which Petitioner itself did not press. Yakama members remain subject to state taxes on off-reservation retail sales, on income, and on business activities whose taxable event is something other than highway transport. What a State may not do is select the act of traveling with goods over the public highways as the operative incidence of its tax and then collect from a treaty beneficiary. Such a levy is, in substance and in statutory form, a charge for the exercise of a reserved right — a toll by another name — and *Tulee* forbids it.</p><p><mark class='tru' data-n='7'>Answering the question as presented: the Yakama Treaty does not create a general right to avoid state taxes on off-reservation commercial activities merely because those activities make some use of public highways.</mark> It does bar a tax whose taxable event is the transportation of goods by public highway. Washington&#x27;s fuel tax, as authoritatively construed and as applied to Cougar Den, is the latter.</p><p>---</p><p>IV. Disposition</p><p><mark class='tru' data-n='8'>The judgment of the Supreme Court of Washington is affirmed insofar as it holds the assessment preempted as applied to Cougar Den, and its broader statement that the treaty bars taxation of &quot;any trade&quot; requiring use of public roads is disapproved.</mark> The $3.6 million assessment may not be enforced against Cougar Den.</p><p>RULING: Petitioner</p>", "error": "The Washington Supreme Court upheld the assessment and held that the Yakama Treaty does not preempt the tax.", "truth": "The Washington Supreme Court held that the Yakama Treaty preempts Washington from requiring Cougar Den to pay wholesale fuel taxes.", "nmarks": 8}, {"id": "C054", "text": "<p>Procedural History</p><p>Juan Bravo-Fernandez and Hector Martinez-Maldonado were indicted following a 2005 trip from Puerto Rico to Las Vegas. The Government alleged that Bravo-Fernandez paid for the trip in exchange for Martinez-Maldonado’s support of legislation favorable to Bravo-Fernandez’s private security firm. The indictment included substantive federal-program bribery charges, conspiracy, and Travel Act charges predicated on bribery.</p><p>The jury convicted petitioners of substantive federal-program bribery but acquitted them of conspiracy and the Travel Act counts.<mark class='tru' data-n='1'> The Court of Appeals later vacated the bribery convictions because the jury had received an erroneous instruction concerning the proof required for bribery.</mark> The vacatur did not rest on a determination that the evidence was legally insufficient.</p><p><mark class='err' data-n='2'>On remand, the District Court initially entered an acquittal order, then vacated that order after recognizing that the Court of Appeals’ mandate required only vacatur of the bribery convictions.</mark> Petitioners’ subsequent efforts to reinstate the acquittal order failed. They then argued that the acquittals on the conspiracy and Travel Act counts collaterally estopped the Government from retrying the bribery charges. The District Court denied that request. Petitioners seek review of that ruling.</p><p>Governing Law</p><p>The Double Jeopardy Clause incorporates the doctrine of issue preclusion, sometimes called collateral estoppel. When an issue of ultimate fact has been necessarily determined by a valid and final acquittal, the Government may not relitigate that issue in a later prosecution. *Ashe v. Swenson* requires a court to examine the entire record and determine whether a rational jury could have grounded its acquittal on an issue other than the one the defendant asserts was necessarily resolved in his favor.</p><p>The defendant invoking issue preclusion bears the burden of showing that the prior acquittal necessarily decided the factual issue at stake. An acquittal itself remains final and may not be reconsidered merely because it appears mistaken.</p><p>But the rule does not permit a court to infer a necessary factual determination from an acquittal where the verdicts from the same trial are irreconcilably inconsistent. Under *United States v. Powell*, inconsistency between a conviction and an acquittal means that a reviewing court cannot reliably determine whether the acquittal reflects a factual finding favorable to the defendant, an error, compromise, lenity, or a failure to follow instructions. In that circumstance, the acquittal does not establish issue preclusion.</p><p>A vacated conviction may not be used to establish guilt or to impose punishment. Yet the vacatur of a conviction for instructional error does not erase the historical fact that the jury returned that conviction alongside its acquittals. Nor does it convert the case into one involving a hung count. A hung count expresses no verdict at all; an invalid conviction remains a verdict the jury actually rendered, even though it cannot support a judgment of guilt.</p><p>Application</p><p>Petitioners correctly observe that the acquittals are final and that the Government may not directly set them aside. They also correctly note that, had the Travel Act acquittals necessarily resolved the absence of a bribe, the Government could not retry the substantive bribery charges. Those propositions, however, do not resolve the necessary-decision inquiry.</p><p>The jury convicted petitioners of the substantive bribery offense while acquitting them of offenses that, as charged here, involved bribery as a predicate. Petitioners and the Government agree that those results cannot be reconciled under the instructions and evidence presented.<mark class='tru' data-n='3'> The substantive convictions show that the jury returned a verdict finding bribery; the predicate-offense acquittals point the other way.</mark> That inconsistency prevents a court from determining that the acquittals necessarily embodied a factual finding that no bribe occurred.</p><p>The later vacatur of the bribery convictions does not alter that conclusion.<mark class='tru' data-n='4'> The convictions were vacated because the jury was improperly instructed, not because the evidence was insufficient as a matter of law.</mark> Thus, the Government cannot rely on the convictions as valid adjudications of petitioners’ guilt. But it need not do so.<mark class='tru' data-n='5'> The convictions are relevant only to the limited historical question whether the jury’s acquittals can be read as necessarily deciding that bribery was absent.</mark> Because the jury simultaneously returned contrary guilty verdicts, the answer is no.</p><p>Petitioners’ proposed rule—that a vacated conviction must be treated as though it never existed for every Double Jeopardy purpose—would improperly disregard the actual verdict pattern that makes the claimed preclusion uncertain. The Double Jeopardy Clause protects determinations a jury necessarily made in the defendant’s favor; it does not authorize a court to presume such a determination where the verdicts themselves supply conclusive reason for doubt.</p><p>Nor does the rule concerning hung counts support petitioners. A jury that fails to reach a verdict has made no determination on that count, so the hung count does not undermine an otherwise clear acquittal. Here, by contrast, the jury did reach a guilty verdict on the substantive bribery count. Although that verdict cannot stand because of instructional error, its coexistence with the acquittals makes it impossible to identify a factual issue necessarily decided by the acquittals.</p><p>The Government therefore may retry petitioners on the bribery charges, subject to the ordinary limits imposed by the Double Jeopardy Clause and the appellate mandate.</p><p>Disposition</p><p>The judgment denying petitioners’ motion for acquittal on issue-preclusion grounds is affirmed.</p><p>RULING: Respondent</p>", "error": "The First Circuit vacated the federal bribery convictions for insufficient evidence.", "truth": "The First Circuit vacated the federal bribery convictions because the jury had been improperly instructed about what the government needed to prove, and it remanded the case.", "nmarks": 5}, {"id": "C055", "text": "<p>IN THIS COURT</p><p>Ford Motor Co. — Personal Jurisdiction Cases<br>(consolidated with *Ford Motor Co. v. Bandemer*, No. 19-369)</p><p>---</p><p>I. Procedural History</p><p>Markkaya Jean Gullett, a Montana resident, died in 2015 when the tread separated from a tire on the Ford Explorer she was driving on a Montana highway and the vehicle rolled into a ditch.<mark class='err' data-n='1'> The personal representative of her estate brought design-defect, failure-to-warn, and negligence claims against Ford Motor Company in Montana state court.</mark></p><p><mark class='err' data-n='2'>Ford moved to dismiss for lack of personal jurisdiction under the Due Process Clause.</mark><mark class='err' data-n='3'> It is undisputed that Montana lacks general jurisdiction over Ford: Ford is headquartered in Michigan and incorporated in Delaware.</mark> It is likewise undisputed — indeed, conceded — that Ford purposefully availed itself of the Montana market by advertising, selling, and servicing vehicles and parts in the State. What Ford disputed, and disputes here, is *relatedness*: the Explorer that failed was assembled in Kentucky, first sold to a dealership in Washington, resold to an Oregon resident, and only later brought to Montana by a subsequent purchaser. No Ford conduct in Montana, Ford says, stands anywhere in the causal chain leading to this crash.</p><p>The district court denied the motion, finding a &quot;connection between the forum and the specific claims at issue.<mark class='tru' data-n='4'>&quot; The Montana Supreme Court affirmed, reasoning that by advertising and selling vehicles and parts within Montana, Ford had availed itself of the privilege of doing business there and was therefore amenable to specific jurisdiction on these claims.</mark> Review was sought in this Court, and the case was consolidated with *Bandemer*, which arises out of a Minnesota accident and presents the identical legal question.</p><p>One preliminary matter about the record requires comment. Counsel for the party designated Petitioner asserts at one point that &quot;[t]he Montana Supreme Court reversed the district court&#x27;s denial of Ford&#x27;s motion to dismiss and ordered dismissal for lack of personal jurisdiction,&quot; and that the Montana court &quot;made relatedness needlessly causal.<mark class='err' data-n='5'>&quot; That characterization is irreconcilable with the record before us, which establishes that the district court denied dismissal and that the Montana Supreme Court *affirmed* that denial, sustaining jurisdiction.</mark> Counsel&#x27;s own closing plea — &quot;[w]e urge you to affirm both judgments&quot; — confirms that the misstatement is an error of drafting rather than a competing account of the posture. We take the procedural history from the record, not from counsel&#x27;s characterization of it, and we note that the error is immaterial to the disposition: the question presented is a pure question of law, and the substantive positions of both parties are unmistakable. The party designated Petitioner defends the exercise of jurisdiction; the party designated Respondent, Ford, attacks it. (The internal party labels in the briefs reflect the parties&#x27; postures in the courts below; nothing turns on the nomenclature.) We resolve the question presented as framed.</p><p>II. The Question Presented</p><p><mark class='err' data-n='6'>May a state court, consistent with the Due Process Clause, exercise personal jurisdiction over a nonresident defendant when none of the defendant&#x27;s contacts with that state *caused* the plaintiff&#x27;s claims?</mark></p><p>III. Governing Law</p><p>Since *International Shoe Co. v. Washington*, the constitutional test has been whether a defendant has &quot;certain minimum contacts&quot; with the forum &quot;such that the maintenance of the suit does not offend traditional notions of fair play and substantial justice.&quot; That standard rests on a rationale of reciprocity: a defendant that &quot;exercise[s] the privilege of conducting activities within a state&quot; enjoys &quot;the benefits and protection of the laws of that state,&quot; and those benefits &quot;may give rise to obligations,&quot; including the obligation to answer in the State&#x27;s courts for suits arising from that enjoyment.</p><p>The doctrine has two branches. General jurisdiction reaches any claim, but only where the corporation is &quot;at home&quot; — paradigmatically its place of incorporation and principal place of business. *Goodyear Dunlop Tires Operations, S.A. v. Brown*; *Daimler AG v. Bauman*. Specific jurisdiction is narrower in subject matter but broader in geography: it requires (1) that the defendant purposefully avail itself of the privilege of conducting activities in the forum, and (2) that the plaintiff&#x27;s claims &quot;arise out of or relate to the defendant&#x27;s contacts with the forum.&quot; *Helicopteros Nacionales de Colombia, S.A. v. Hall*; *Burger King Corp. v. Rudzewicz*; *Bristol-Myers Squibb Co. v. Superior Court* (&quot;BMS&quot;).</p><p>Only the second requirement is contested. Ford&#x27;s submission is that &quot;arise out of or relate to&quot; states a single causal standard — but-for causation at a minimum, and properly proximate causation — and that where forum contacts are not a cause of the claim they are &quot;by definition, irrelevant.&quot;</p><p>We reject that reading. Three considerations control.</p><p>First, the text of the standard is disjunctive. The formulation is &quot;arise out of *or relate to*.&quot; The first clause does indeed evoke causation; the second does not. To collapse the two into a single causal inquiry is to read the words &quot;or relate to&quot; out of the standard entirely. This Court does not ordinarily treat its own settled formulations as containing surplusage, and it has repeatedly recited this one in the disjunctive across four decades. That said, the &quot;relate to&quot; clause does not stand as an open invitation. It &quot;incorporates real limits, as it must to adequately protect defendants foreign to a forum.&quot; It is not a license for jurisdiction wherever a defendant does business and a plaintiff happens to be hurt; it demands an affiliation between the forum and the underlying controversy — what *Goodyear* described as &quot;an activity or an occurrence that takes place in the forum State and is therefore subject to the State&#x27;s regulation.&quot;</p><p>Second, this Court has never held causation necessary, and its cases assume otherwise. *World-Wide Volkswagen Corp. v. Woodson* denied Oklahoma jurisdiction over a New York retailer and regional distributor whose only link to Oklahoma was that a consumer drove a car there. But the Court took pains to distinguish the manufacturer and importer, explaining that &quot;if the sale of a product of a manufacturer or distributor . . . is not simply an isolated occurrence, but arises from the efforts of the manufacturer or distributor to serve, directly or indirectly, the market for its product in other States, it is not unreasonable to subject it to suit in one of those States if its allegedly defective merchandise has there been the source of injury to its owner or to others.&quot; Ford dismisses that passage as dictum. It is dictum that this Court has repeated and relied upon for forty years, including in the unanimous opinion in *Goodyear*, and that the lower courts have treated as describing the paradigm case of specific jurisdiction. A rule that would decide this paradigm case the other way is not a refinement of our precedent; it is a repudiation of it.</p><p>Third, the limiting principles Ford invokes come from cases that are materially different. *BMS* barred California jurisdiction because hundreds of nonresident plaintiffs, prescribed and injured outside California, sought to piggyback on the in-state sales of *other* plaintiffs; there was no in-state occurrence connecting their controversies to the forum. *Walden v. Fiore* held that a defendant with *no* contacts with Nevada could not be haled there merely because he knew the plaintiffs would feel the harm in Nevada; the point was that a plaintiff&#x27;s forum connections cannot substitute for the defendant&#x27;s own. *Helicopteros* held that mere purchases in the forum could not support claims wholly unrelated to those purchases, and *Hanson v. Denckla* held that a forum does not acquire jurisdiction by being the controversy&#x27;s convenient center of gravity. Each of these is a limit on jurisdiction where the defendant&#x27;s own forum conduct bears no relation to the dispute. None of them announces a causation requirement, and this Court has never said that a defendant&#x27;s systematic, deliberate cultivation of the forum market for the very product that injured a forum resident in the forum is jurisdictionally &quot;irrelevant.&quot;</p><p>Ford&#x27;s causal rule would also be, in practice, both over- and under-inclusive in ways the Due Process Clause does not require. Under it, a manufacturer that blankets a State with advertising for a model, maintains a dealer and service network there, and supplies replacement parts to keep those vehicles on the road escapes suit when one of those vehicles kills a resident on a State highway — because the first retail sale occurred elsewhere. Jurisdiction would turn on the fortuity of a vehicle&#x27;s chain of title, sending plaintiffs on a &quot;scavenger hunt&quot; to trace the provenance of a pill, a tire, or a toaster, and splitting garden-variety accident cases among multiple forums, potentially leaving a local dealer or repair shop to answer alone for a national manufacturer&#x27;s design. Ford answers that its rule has a &quot;rich history in the common law&quot; and is transsubstantive. Perhaps a causal inquiry is administrable in many settings; the question is not whether it *can* be applied but whether the Constitution *requires* it. Neither history, precedent, nor the fairness and federalism interests the Clause protects compels a rule under which a State may not adjudicate a resident&#x27;s death caused on its own roads by a product the defendant deliberately sold into that market.</p><p>Nor are we persuaded by the &quot;administrability&quot; parade advanced on the other side — must the product be the same model, the same features, how many years of sales, how much advertising? Line-drawing questions of that order attend every standard this Court has articulated in this field, including &quot;purposeful availment&quot; and &quot;at home.&quot; They do not justify adopting a rule that decides the easy cases wrongly. The limits we apply here are stated below, and they are workable.</p><p>IV. Application</p><p>Applying these principles to this record, jurisdiction in Montana is proper.</p><p>Contacts. Purposeful availment is conceded, and correctly so. Ford did not merely find its vehicles in Montana through the &quot;unilateral activity&quot; of third parties, as in *World-Wide Volkswagen*. It advertised in Montana, sold vehicles — including Explorers — through Montana dealerships, and supplied replacement parts and service in Montana that keep Ford vehicles, including used ones, operating on Montana roads. Because availment rests on this direct, deliberate cultivation of the market, we need not and do not address the stream-of-commerce questions that divided the Court in prior cases.</p><p>Relatedness. The connection between those contacts and this controversy is close and non-fortuitous. The plaintiff is a Montana resident. The occurrence — the tread separation, the loss of control, the fatal rollover — took place on a Montana highway, an activity and an occurrence squarely &quot;subject to the State&#x27;s regulation.&quot; The product alleged to be defective is the very make and model Ford systematically markets, sells, and services in Montana. And the claims — defective design, failure to warn, negligence — concern precisely the conduct by which Ford solicits Montanans to buy and keep driving Explorers. Ford&#x27;s Montana activities are not incidental to this suit; they are the reason there are Explorers on Montana roads and Montana owners who rely on Ford&#x27;s representations about them, including in the resale market Ford&#x27;s own advertising and parts supply sustain.</p><p>The reciprocity rationale of *International Shoe* does the decisive work. By cultivating the Montana market for Explorers, Ford enjoys the protection of Montana&#x27;s laws — its roads, its courts, its enforcement of the contracts and property rights that make that market possible. The correlative obligation is the modest one of answering in Montana when one of those vehicles allegedly fails there and kills a Montanan. Ford does not claim, and on this record could not credibly claim, that defending in Montana is burdensome or unfair to it; it identifies no sovereign with a greater interest in this controversy; and it points to no forum-shopping, the plaintiff having sued in the one place everyone would expect.</p><p>Ford&#x27;s contrary submission — &quot;if Ford had done nothing in Montana, the claims would be exactly the same&quot; — proves too much. The same could be said of the manufacturer in the *World-Wide Volkswagen* hypothetical this Court has endorsed for forty years. And it misdescribes the record: had Ford done nothing in Montana, there would be no Montana market in Explorers, no Montana service and parts network sustaining them, and no reason for a Montana resident to have been driving one on a Montana highway in reliance on Ford&#x27;s representations.</p><p>Finally, Ford&#x27;s reliance on the &quot;cardinal rule&quot; that the Due Process Clause protects defendants, not plaintiffs or forum States, is well taken as far as it goes, and we do not rest on Montana&#x27;s interest as an independent ground. But the Clause protects defendants from jurisdiction that is *unfair or unforeseeable to them*. There is nothing unfair or unforeseeable about requiring a company that deliberately courts a State&#x27;s drivers to answer there when one of them dies in the product it courted them to buy.</p><p>Limits. To be clear about the scope of today&#x27;s holding: we do not hold that doing business in a State subjects a defendant to suit on any claim by any plaintiff. Jurisdiction here rests on the conjunction of (i) the defendant&#x27;s deliberate, systematic cultivation of the forum market for the very type of product alleged to be defective, (ii) a plaintiff resident in the forum, and (iii) an injury occurring in the forum. *BMS* remains good law and forecloses the aggregation of unrelated nonresident claims; *Walden* remains good law and forecloses jurisdiction premised on the plaintiff&#x27;s forum ties alone; *Helicopteros* remains good law and forecloses jurisdiction on contacts unconnected to the claim; and *Daimler* remains good law and forecloses using &quot;relate to&quot; as a back door to general jurisdiction.</p><p>V. Disposition</p><p>We hold that the Due Process Clause does not require a causal link — whether but-for or proximate — between a defendant&#x27;s forum contacts and the plaintiff&#x27;s claims. Where a defendant has systematically and deliberately served the forum market for the product alleged to be defective, and a forum resident is injured in the forum by that product, the claims &quot;relate to&quot; the defendant&#x27;s forum contacts within the meaning of this Court&#x27;s precedents, and specific jurisdiction is proper.</p><p><mark class='tru' data-n='7'>The judgment of the Supreme Court of Montana sustaining the district court&#x27;s denial of Ford&#x27;s motion to dismiss is affirmed.</mark> The judgment in the consolidated *Bandemer* case, which presents the same question on materially indistinguishable facts, is likewise affirmed.</p><p>RULING: Petitioner</p>", "error": "The Montana Supreme Court reversed the district court’s denial of Ford’s motion to dismiss and ordered dismissal for lack of personal jurisdiction.", "truth": "The Montana Supreme Court affirmed the district court’s denial of Ford’s motion to dismiss for lack of personal jurisdiction.", "nmarks": 7}, {"id": "C056", "text": "<p>IN THE SUPREME COURT</p><p>Kraig Kahler, *Petitioner*, v. State of Kansas, *Respondent*</p><p>OPINION OF THE COURT</p><p>---</p><p>I. Procedural History</p><p>In November 2009, petitioner Kraig Kahler entered the home of his estranged wife&#x27;s grandmother and shot and killed four members of his family: his wife, his two daughters, and the grandmother. He was charged with capital murder in Kansas state court.</p><p>At trial, Kahler&#x27;s mental condition was extensively litigated. Experts for both the defense and the prosecution agreed that Kahler suffered from major depressive disorder, together with obsessive-compulsive, borderline, paranoid, and narcissistic personality features. The defense expert testified that, as a consequence of that illness, Kahler did not make a rational choice to kill his family and had, at the moment of the shootings, &quot;completely lost control.&quot;</p><p>Kansas law channels that evidence in a particular way. Under K.S.A. § 21-5209, mental disease or defect &quot;is not a defense&quot; to a criminal charge &quot;except as it may be shown&quot; that the defendant &quot;lacked the mental state required as an element of the offense charged.&quot; The practical effect — as both parties agree — is that a Kansas jury does not ask whether a defendant, though he formed the charged mental state, was nonetheless &quot;unable to know the nature and quality of his actions or know the difference between right and wrong with respect to his actions.&quot; Kahler accordingly could not, and did not, submit a freestanding moral-incapacity insanity defense to the guilt-phase jury. He was convicted of capital murder and sentenced to death.</p><p><mark class='err' data-n='1'>Kahler appealed to the Kansas Supreme Court, arguing that § 21-5209 abolishes the insanity defense in violation of the Due Process Clause of the Fourteenth Amendment and the Cruel and Unusual Punishments Clause of the Eighth Amendment.</mark><mark class='err' data-n='2'> That court rejected the constitutional challenge and affirmed the conviction.</mark><mark class='err' data-n='3'> (The parties&#x27; submissions are not fully congruent as to the fate of the sentence: the record statement before us recites that the Kansas Supreme Court affirmed both conviction and sentence, while counsel for petitioner represented at argument that the court affirmed the conviction but vacated the death sentence.</mark> Nothing in our disposition turns on the difference; the question presented reaches the validity of the conviction, and, as explained in Part IV.C, the Eighth Amendment claim fails on either version of the record.)</p><p>We granted review to decide the question presented: whether a State may abolish the insanity defense — that is, may decline to recognize a defense of moral incapacity separate from the mens rea inquiry — consistent with the Eighth and Fourteenth Amendments.</p><p>---</p><p>II. The Governing Law</p><p>A. Due Process and the Definition of Crimes and Defenses</p><p>The starting premise is one of allocation. &quot;[T]he definition of the elements of a criminal offense is entrusted to the legislature, particularly in the case of federal crimes, which are solely creatures of statute.&quot; *Liparota v. United States*. That principle applies with at least equal force to the States, which bear the primary responsibility for defining and enforcing the criminal law. *Patterson v. New York* holds that a State&#x27;s decision about what to make an element, what to make an affirmative defense, and where to place the burden of persuasion is ordinarily beyond constitutional second-guessing.</p><p>The exception is narrow. A state rule of criminal responsibility violates due process only if it &quot;offends some principle of justice so rooted in the traditions and conscience of our people as to be ranked as fundamental.&quot; *Leland v. Oregon*; *Patterson*; *Medina v. California*. The inquiry is historical and demanding. It is not satisfied by showing that a rule is widely adopted, sensible, or even wise. It requires showing that the *particular* rule the State has rejected is a fixed and fundamental principle — not merely that the general subject matter (here, mental illness and culpability) has long been thought relevant to criminal responsibility.</p><p>Two of this Court&#x27;s decisions govern the specific terrain. In *Powell v. Texas*, a plurality declined to constitutionalize any doctrine of criminal responsibility, warning that &quot;nothing could be less fruitful than for this Court to be impelled into defining some sort of insanity test in constitutional terms.&quot; The Court there emphasized that the formulation of responsibility doctrines is a matter of evolving moral, medical, and penological judgment, ill-suited to freezing by constitutional decree.</p><p>In *Clark v. Arizona*, the Court confronted a State that had narrowed its insanity test to moral incapacity alone, dropping the cognitive-incapacity prong. The Court identified at least four distinct strains of insanity doctrine in American law — cognitive incapacity, moral incapacity, volitional (irresistible-impulse) incapacity, and the product test — and held that &quot;no particular formulation has evolved into a baseline for due process,&quot; and that the &quot;insanity rule, like the conceptualization of criminal offenses, is substantially open to state choice.&quot;</p><p>B. The Eighth Amendment</p><p>The Eighth Amendment forbids punishments that are cruel and unusual, and this Court has drawn categorical lines where a national consensus and this Court&#x27;s own judgment converge to place a class of offenders beyond the reach of a particular punishment. *Atkins v. Virginia*; *Roper v. Simmons*; *Ford v. Wainwright* (execution of the presently incompetent). But the Eighth Amendment regulates *punishment*; it has never been held to supply the substantive definition of guilt. And in the capital context, its central command is that the sentencer be permitted to consider all relevant mitigating evidence, including mental illness. *Lockett v. Ohio*; *Eddings v. Oklahoma*.</p><p>---</p><p>III. Application</p><p>A. Kansas Has Not Abolished Consideration of Mental Illness</p><p>Petitioner&#x27;s framing — that Kansas &quot;scrubs moral capacity from its criminal law&quot; — overstates what § 21-5209 does. Kansas has not decreed that mental illness is irrelevant to criminal responsibility. It has made a choice about *where* in the criminal process mental illness operates.</p><p>First, at the guilt phase, Kansas fully excuses a defendant whose illness prevented him from forming the charged mental state. The defendant who, in the classic illustration, strangles a man while believing he is squeezing a lemon is acquitted in Kansas as surely as anywhere else. That is not a trivial residue; it is the cognitive-incapacity strand of the traditional test, operating through the elements of the offense.</p><p>Second, Kansas permits the defendant to offer evidence of mental disease or defect in mitigation at sentencing, and its sentencing regime authorizes commitment to a state institution for treatment in lieu of ordinary incarceration where the defendant&#x27;s condition warrants. Mental illness thus retains a decisive role — it simply does not take the form of a jury verdict of acquittal by reason of insanity.</p><p>This matters greatly given the shape of petitioner&#x27;s own argument. Pressed at argument, counsel for petitioner conceded that &quot;the label doesn&#x27;t matter&quot; and that the ultimate verdict form &quot;is not all that determinative,&quot; so long as the defendant has a &quot;mechanism&quot; to present his lack of moral capacity — including, expressly, &quot;at the back end.&quot; That concession is fatal to the categorical rule petitioner asks us to announce. Once it is admitted that a State may house the moral-capacity inquiry outside the guilt verdict, the constitutional claim collapses into a contest over the timing and consequences of that inquiry — precisely the kind of fine-grained policy calibration *Powell* and *Clark* commit to the States. Counsel&#x27;s residual worry about stigma and collateral consequences is real as a matter of policy, but stigma attaches to a conviction validly obtained under a State&#x27;s lawful definition of the offense; it is not itself a due process violation.</p><p>B. Moral Incapacity Is Not a Fundamental Principle Frozen Into Due Process</p><p>Petitioner&#x27;s historical case is that the right-wrong test has &quot;persisted since the 1500s&quot; and prevails in 48 jurisdictions. Respondent answers that the right-wrong formulation is of &quot;relatively recent vintage,&quot; dating to roughly the 1800s.</p><p>The truth lies between, and it defeats petitioner. The common law&#x27;s through-line is that the deeply disordered offender is not fully culpable. But the *doctrinal expression* of that intuition has been persistently unstable: the &quot;wild beast&quot; test, the &quot;good and evil&quot; inquiry, the *M&#x27;Naghten* rules of 1843, irresistible-impulse supplements, the *Durham* product rule, and the Model Penal Code&#x27;s &quot;substantial capacity&quot; formulation. Jurisdictions have adopted, abandoned, and recombined these over centuries. A principle stated at so high a level of generality that it accommodates all of them cannot do the work petitioner needs; a principle stated with enough specificity to condemn Kansas cannot claim the pedigree petitioner asserts. That is exactly the reasoning of *Clark*: no single formulation is a due process &quot;baseline.&quot;</p><p>Nor does contemporary near-uniformity supply the missing pedigree. Forty-eight jurisdictions have made one policy choice and a handful have made another; that tells us the Kansas approach is unusual, not that it is unconstitutional. Due process is not a headcount. If it were, this Court would be obliged to arrest the development of responsibility doctrine at whatever point the tally happened to stand — the very rigidity *Powell* warned against.</p><p>We note, and reject, one strand of respondent&#x27;s argument. Counsel&#x27;s suggestion that Kansas&#x27;s mens rea approach is &quot;relatively consistent with the cognitive capacity test&quot; is imprecise. A defendant may know exactly what he is doing, and intend it, while being wholly unable to appreciate its wrongfulness; Kansas convicts that defendant where most States would not. But the constitutional question is not whether Kansas&#x27;s own characterization of its statute is apt. It is whether the Constitution forbids the choice Kansas has made. It does not.</p><p>C. The Eighth Amendment Claim</p><p>Petitioner&#x27;s Eighth Amendment theory fails for a distinct reason: it is addressed to guilt rather than punishment.<mark class='err' data-n='4'> The Eighth Amendment does not supply the substantive criteria of criminal responsibility, and petitioner identifies no decision of this Court holding that a conviction — as opposed to a sentence — is cruel and unusual.</mark></p><p>To the extent the claim is directed at the death sentence, it fails on this record. Kansas permitted, and Kahler received, full presentation of his mental condition to the sentencer, satisfying *Lockett* and *Eddings*.<mark class='err' data-n='5'> No further relief is available here on the Eighth Amendment theory: if, as petitioner&#x27;s counsel represented, the Kansas Supreme Court has already vacated the death sentence, the capital claim is moot; and if the sentence stands, it stands on a record in which the sentencer heard the undisputed expert testimony about Kahler&#x27;s disorders.</mark> Either way, petitioner&#x27;s Eighth Amendment argument supplies no independent ground for disturbing the conviction.</p><p>---</p><p>IV. Disposition</p><p>A State does not violate the Due Process Clause of the Fourteenth Amendment when it defines the role of mental illness in its criminal law by reference to the mens rea elements of the offense, while preserving the consideration of mental disease or defect at sentencing and for purposes of commitment and treatment. Neither the Eighth Amendment nor the Fourteenth requires Kansas to adopt a moral-incapacity insanity defense at the guilt phase. The framing of responsibility doctrine in light of advancing medical knowledge and evolving moral judgment remains, as it has long been, a matter committed in the first instance to the States.</p><p>We express no view on the wisdom of Kansas&#x27;s choice. Forty-eight jurisdictions have concluded otherwise, and their judgment is entitled to respect. But the Constitution does not make that judgment mandatory.</p><p><mark class='err' data-n='6'>The judgment of the Supreme Court of Kansas is AFFIRMED.</mark></p><p>RULING: Respondent</p>", "error": "The Kansas Supreme Court affirmed Kahler’s conviction but vacated his death sentence.", "truth": "The Kansas Supreme Court affirmed Kahler’s conviction and death sentence.", "nmarks": 6}, {"id": "C057", "text": "<p>Procedural History</p><p>Jonathan and Reginald Carr were jointly tried for a series of violent offenses committed in Wichita, Kansas, including five murders. Before trial, each moved to sever, asserting that their anticipated defenses and mitigation cases would be antagonistic and that a joint proceeding would create prejudicial evidentiary spillover. The trial court denied severance. At the penalty phase, the jury returned separate death verdicts. Although the instructions required the State to prove aggravating circumstances beyond a reasonable doubt, they did not expressly instruct that mitigating circumstances need not be proved beyond a reasonable doubt.</p><p><mark class='err' data-n='1'>On direct appeal, the Kansas Supreme Court reversed the Carrs’ death sentences.</mark> It concluded that the trial court had not undertaken the requisite analysis of the severance question and that the omission of an affirmative instruction concerning the burden of proving mitigation may have prevented jurors from giving meaningful effect to mitigating evidence. The State sought review, and this Court granted review of the two Eighth Amendment questions presented.</p><p>Governing Law</p><p>The Eighth Amendment requires a capital-sentencing process that permits the sentencer to consider and give effect to relevant mitigating evidence concerning the defendant’s character, record, or circumstances of the offense. *Lockett v. Ohio* and *Eddings v. Oklahoma*. But the Constitution does not prescribe a particular form of jury instruction, nor does it require States to assign the burden of proving mitigating circumstances to either party.</p><p>An instruction is constitutionally infirm only where there is a reasonable likelihood that the jury understood it to bar consideration of constitutionally relevant mitigating evidence. The inquiry considers the instructions as a whole, in their practical context, rather than isolating a single omitted clarification.</p><p>The Eighth Amendment also requires an individualized capital-sentencing determination. That requirement concerns whether the sentencer may consider each defendant’s individual culpability and mitigating circumstances; it does not establish a categorical entitlement to a separate sentencing proceeding whenever codefendants present competing accounts or adverse mitigation evidence. A joint penalty phase violates the Constitution only if it actually prevents a defendant from presenting or receiving meaningful consideration of relevant mitigating evidence, or otherwise renders the sentencing determination constitutionally unreliable.</p><p>Application</p><p>First, the absence of an express instruction that mitigating circumstances need not be proved beyond a reasonable doubt did not violate the Eighth Amendment. The instructions specifically imposed the beyond-a-reasonable-doubt burden on the State as to aggravating circumstances. They did not say that the Carrs bore any burden concerning mitigation, much less that they had to establish mitigation beyond a reasonable doubt. Nor did they direct the jury to disregard mitigating evidence unless it found that evidence proven to a specified standard.</p><p>Read as a whole, the instructions permitted consideration of mitigating circumstances and distinguished the State’s burden to establish aggravation. A reasonable juror would not infer, merely from the State’s stated burden on aggravation, that mitigation had to be proven beyond a reasonable doubt.<mark class='err' data-n='2'> The Kansas Supreme Court’s conclusion rested on speculation about a possible juror misunderstanding, not a reasonable likelihood created by the actual instructions.</mark> The Eighth Amendment requires that mitigating evidence be considered; it does not require the particular affirmative instruction respondents demand.</p><p>Second, the joint sentencing proceeding did not deny either Carr an individualized sentencing determination. Each defendant was able to offer the mitigating evidence he elected to present. The court instructed the jury to consider each defendant separately, gave defendant-specific instructions where appropriate, and required separate verdict forms. The jury’s distinct treatment of the defendants during the guilt phase further confirms its ability to distinguish the evidence and culpability attributable to each brother.</p><p>Respondents principally rely on Jonathan Carr’s evidence that Reginald exerted a corrupting influence on him. That evidence did not establish a constitutional need for separate penalty proceedings. At most, it created tension between their respective mitigation presentations—a commonplace feature of joint trials. The Constitution does not require severance whenever one capital defendant offers evidence unfavorable to another. Nothing in this record shows that either defendant was barred from presenting relevant mitigation, that the jury was instructed to treat either defendant’s culpability as interchangeable with the other’s, or that the joint proceeding distorted the jury’s weighing of aggravation and mitigation in a constitutionally material way.</p><p><mark class='err' data-n='3'>The Kansas Supreme Court may have had authority under state law to require a more elaborate severance analysis.</mark> But an asserted deficiency under state severance practice is not, without more, an Eighth Amendment violation. On the federal constitutional record before us, the Carrs received the individualized consideration the Eighth Amendment commands.</p><p>Disposition</p><p><mark class='err' data-n='4'>The judgment of the Kansas Supreme Court reversing the Carrs’ death sentences on the grounds at issue is reversed.</mark> The failure to give an affirmative no-beyond-a-reasonable-doubt instruction for mitigating circumstances, and the refusal to sever the penalty phase, did not violate the Eighth Amendment.</p><p>RULING: Petitioner</p>", "error": "The Kansas Supreme Court reversed the Carrs’ underlying convictions along with their death sentences.", "truth": "The Kansas Supreme Court reversed the Carrs’ death sentences based on sentencing-phase errors; it did not reverse their underlying convictions.", "nmarks": 4}, {"id": "C058", "text": "<p>Opinion of the Court</p><p>This case concerns the constitutionality of the residual clause in 18 U.S.C. § 924(c)(3)(B), which defines a “crime of violence” as a felony that, “by its nature, involves a substantial risk that physical force against the person or property of another may be used in the course of committing the offense.”</p><p>I. Procedural History</p><p>On November 19, 2015, juries found Maurice Lamont Davis and Andre Levon Glover guilty of multiple offenses.<mark class='tru' data-n='1'> Among those convictions were violations of § 924(c) based on the defendants’ use or carrying of firearms in connection with a Hobbs Act robbery and their aiding and abetting a conspiracy to commit a crime of violence.</mark></p><p>The defendants appealed.<mark class='err' data-n='2'> On January 31, 2017, the United States Court of Appeals for the Fifth Circuit rejected their challenges and affirmed the District Court’s judgments.</mark> The defendants then petitioned for certiorari. After this Court decided *Sessions v.<mark class='err' data-n='3'> Dimaya*, which invalidated an identically worded residual clause, the Court remanded the case to the Fifth Circuit for further consideration.</mark></p><p><mark class='err' data-n='4'>Following supplemental briefing, the Fifth Circuit held that § 924(c)(3)(B) remained constitutional and affirmed the relevant convictions.</mark> The defendants sought review in this Court, presenting the question whether § 924(c)(3)(B) is unconstitutionally vague.</p><p>II. Governing Law</p><p>The Due Process Clause prohibits the government from depriving a person of liberty under a criminal law that is so vague that ordinary people cannot determine what conduct it prohibits or that invites arbitrary and discriminatory enforcement.</p><p>In *Johnson v. United States*, this Court held unconstitutional the Armed Career Criminal Act’s residual clause, which required courts to decide whether an offense “otherwise involves conduct that presents a serious potential risk of physical injury to another.” The Court concluded that the clause created both uncertainty about how to evaluate the risk posed by an offense and uncertainty about the level of risk required.</p><p>In *Sessions v. Dimaya*, the Court applied that reasoning to 18 U.S.C. § 16(b), which defined a crime of violence as a felony that, “by its nature, involves a substantial risk that physical force against the person or property of another may be used in the course of committing the offense.” That language is materially identical to § 924(c)(3)(B).</p><p>Under the categorical approach established by this Court’s precedents, courts ordinarily assess the offense in the abstract rather than determining whether the defendant’s particular conduct involved a substantial risk of force. The court must therefore imagine the “ordinary case” of the offense and decide whether that hypothetical offense presents the requisite risk.</p><p>III. Application</p><p>Section 924(c)(3)(B) suffers from the same constitutional defects identified in *Johnson* and *Dimaya*.</p><p>First, the statute requires a court to determine the level of risk presented by an offense without supplying a sufficiently clear standard. The phrase “substantial risk” does not identify how substantial the risk must be, and the statute further asks whether physical force “may be used” in committing the offense. That formulation leaves substantial room for judicial speculation.</p><p>Second, the statute requires courts to assess the risk posed by an ordinary or hypothetical violation of the offense, rather than the defendant’s actual conduct. The decisionmaker must imagine the ordinary case, identify the conduct that case entails, and then determine whether physical force might be used. That inquiry compounds the uncertainty inherent in the statute’s risk standard.</p><p>The Government argues that § 924(c)(3)(B) should instead be applied in a circumstance-specific manner, focusing on the defendant’s actual conduct. But that approach is inconsistent with the statutory language and this Court’s established interpretation of materially identical provisions. The statute defines a crime of violence “by its nature,” which directs attention to the offense as a category, not merely to the facts of the particular prosecution. Nor may a court adopt an alternative construction simply to avoid the constitutional problem when that construction is not supported by the statute.</p><p>The elements clause in § 924(c)(3)(A), which covers an offense having as an element the use, attempted use, or threatened use of physical force, is not before us and is not affected by this decision. The invalidity of the residual clause likewise does not disturb convictions that can independently rest on the elements clause. But § 924(c)(3)(B) itself fails to provide the clarity that the Constitution requires.</p><p>IV. Disposition</p><p><mark class='tru' data-n='5'>Because § 924(c)(3)(B) is unconstitutionally vague, the judgment of the Fifth Circuit is reversed insofar as it upheld the defendants’ convictions under that provision, and the case is remanded for further proceedings consistent with this opinion.</mark></p><p>RULING: Respondent</p>", "error": "On remand, the Fifth Circuit upheld 18 U.S.C. § 924(c)(3)(B)'s residual clause as constitutional and affirmed the aiding-and-abetting conspiracy conviction.", "truth": "On remand, the Fifth Circuit held 18 U.S.C. § 924(c)(3)(B)'s residual clause unconstitutionally vague and vacated the aiding-and-abetting conspiracy conviction, while affirming the Hobbs Act robbery conviction.", "nmarks": 5}, {"id": "C059", "text": "<p>Opinion of the Court</p><p>Procedural History</p><p>Manachem Zivotofsky was born in Jerusalem in 2002 to parents who are United States citizens. His parents requested that the Department of State list his place of birth on his United States passport as “Israel,” pursuant to § 214(d) of the Foreign Relations Authorization Act of 2003. That provision directs the Secretary of State, upon request, to record “Israel” as the place of birth for a United States citizen born in Jerusalem.</p><p>The State Department declined the request and issued a passport listing Zivotofsky’s birthplace as “Jerusalem.” Zivotofsky, through his parents, brought suit against the Secretary of State to compel enforcement of § 214(d). The District Court dismissed the action as presenting a nonjusticiable political question. The Supreme Court reversed that jurisdictional ruling in *Zivotofsky v. Clinton*, holding that the courts could decide whether the statute was constitutional, and remanded for adjudication on the merits.</p><p><mark class='tru' data-n='1'>On remand, the District Court held § 214(d) unconstitutional because it impermissibly interfered with the President’s exclusive power to recognize foreign sovereigns.</mark><mark class='err' data-n='2'> The Court of Appeals for the District of Columbia Circuit affirmed.</mark> The case is now before this Court to resolve whether § 214(d) infringes the President’s recognition power.</p><p>Governing Law</p><p>The Constitution divides foreign-affairs authority between Congress and the President. Congress possesses substantial enumerated powers bearing on foreign relations, including powers over foreign commerce, naturalization, appropriations, and the regulation of passports incident to those powers. The President, however, is vested with executive power and is assigned the authority to receive ambassadors and other public ministers. U.S. Const. art. II, §§ 1, 3.</p><p>The power to recognize foreign nations and their territorial claims is a component of the President’s authority to conduct the Nation’s diplomatic relations. Recognition is not merely an abstract legal judgment; it communicates the United States’ official position to foreign governments and determines which sovereign the Nation treats as possessing authority over disputed territory. The President’s recognition determination must be capable of being stated with one voice. Accordingly, Congress may not require the Executive to issue an official statement that contradicts the President’s determination concerning recognition.</p><p>Congress’s otherwise broad authority over passports does not include power to compel an official passport designation that conflicts with the President’s recognition policy. A passport is an official communication by the United States to foreign governments concerning its bearer. Its contents may therefore bear directly upon the Nation’s diplomatic representation.</p><p>Application</p><p>The United States has maintained the position that it recognizes no nation as sovereign over Jerusalem unless and until the issue is resolved through negotiations between the relevant parties. That is the Executive’s recognition determination.</p><p>Section 214(d), however, commands the Secretary of State, at the citizen’s request, to designate “Israel” as the place of birth for a person born in Jerusalem. Although the provision is limited to passports and consular birth reports, and although it allows individual choice, its mandated statement is nonetheless an official statement of the United States. A passport that identifies Jerusalem as being in Israel conveys that the United States treats Jerusalem as part of Israel for that official purpose.</p><p>That message contradicts the President’s stated policy of withholding recognition of any sovereign claim to Jerusalem. Foreign governments and interested parties reasonably understand official United States documents to express the position of the United States, not merely the personal preference of the passport holder. The statute thus does more than regulate the mechanics of passport issuance. It directs the Executive Branch to communicate a position inconsistent with the Nation’s recognition policy.</p><p>Zivotofsky argues that a passport designation is not formal recognition and that Congress may prescribe passport content pursuant to its enumerated powers. But the constitutional defect does not depend on whether § 214(d), viewed in isolation, constitutes a complete and formal recognition of Israeli sovereignty over Jerusalem. It is enough that the statute requires the Executive to issue an official communication that contradicts the President’s recognition determination. Congress may legislate extensively in matters touching foreign affairs, but it may not compel the President to speak inconsistently with the Nation’s chosen recognition position.</p><p>Nor does the prospect that the State Department might disclaim any intended change in policy save the statute. The constitutional division of authority cannot rest on the Executive’s ability to mitigate the diplomatic consequences of a congressional command. Section 214(d) itself requires the contradictory designation and thereby prevents the President from maintaining the required consistency in the Nation’s recognition policy.</p><p>Disposition</p><p>Section 214(d) of the Foreign Relations Authorization Act of 2003 infringes the President’s exclusive authority to recognize foreign sovereigns and is unconstitutional. The judgment of the Court of Appeals affirming dismissal of Zivotofsky’s claim is affirmed.</p><p>RULING: Respondent</p>", "error": "The D.C. Circuit reversed the district court and held Section 214(d) constitutional.", "truth": "The D.C. Circuit affirmed the district court's judgment that Section 214(d) impermissibly interfered with the President's exclusive recognition power.", "nmarks": 2}, {"id": "C060", "text": "<p>The case comes to us after six trials arising from the 1996 murders of four employees of Tardy Furniture Store in Winona, Mississippi. In the first trial, Curtis Flowers was convicted of murdering one employee and sentenced to death.<mark class='err' data-n='1'> The Mississippi Supreme Court reversed, holding that the admission of evidence concerning the other three murders deprived Flowers of a fair trial.</mark><mark class='err' data-n='2'> A second trial, involving a different victim, likewise ended in a conviction and death sentence that the Mississippi Supreme Court reversed on the same ground.</mark></p><p>In the third trial, Flowers was tried for all four murders, convicted, and sentenced to death.<mark class='tru' data-n='3'> The Mississippi Supreme Court again reversed, this time concluding that the prosecutor, Doug Evans, had engaged in racial discrimination in jury selection.</mark> The fourth and fifth trials also involved all four murders, but both ended in mistrials when the juries could not reach unanimous verdicts.</p><p><mark class='tru' data-n='4'>At the sixth trial, the State again tried Flowers for all four murders.</mark> The jury convicted him on all counts and imposed a death sentence. During jury selection, the prosecution exercised five of its six peremptory strikes against African-American prospective jurors. Flowers argued that those strikes violated the Sixth and Fourteenth Amendments.<mark class='tru' data-n='5'> The Mississippi Supreme Court rejected the claim.</mark> This Court granted certiorari and remanded for reconsideration in light of *Foster v. Chatman*, 578 U.S. 488 (2016).<mark class='tru' data-n='6'> On remand, the Mississippi Supreme Court again upheld the conviction and rejected Flowers’s Batson claim.</mark> We granted review to determine whether that court applied *Bats
