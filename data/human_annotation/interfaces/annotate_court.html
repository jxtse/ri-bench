titioner&#x27;s contention that this case is merely *Mensing* in disguise. But it does not carry the day, for two reasons.</p><p>First, the distinction does not remove warnings from the state-law liability calculus; it merely relocates them within it. A state-law rule that measures unreasonable dangerousness in part by asking whether the manufacturer&#x27;s warning sufficiently minimized risk still holds the manufacturer to a warning standard it is federally forbidden to meet.</p><p>Second, and dispositively, the design-sameness ground is independent. Even assuming the warning played no role whatever — even accepting respondent&#x27;s account of Judge Laplante&#x27;s instructions in full — petitioner remained unable to alter sulindac&#x27;s formulation. The same federal sameness mandate that governed labeling in *Mensing* governs composition here. The claim is therefore preempted on a ground that does not depend on resolving the parties&#x27; dispute about the jury instructions, and we need not decide whether petitioner preserved or waived a freestanding warning-preemption argument in its Rule 50 motion.</p><p>E. Respondent&#x27;s waiver objection. Respondent contends that the certiorari petition sought only an impossibility ruling and that any obstacle-preemption theory is waived. We accept that limitation. Our holding today rests on impossibility alone, and the outcome is unchanged.</p><p>F. The FDA-rulemaking argument. Respondent urges that preemption must await notice-and-comment rulemaking identifying drugs immune from such claims. But impossibility preemption arises from the operation of the statutory and regulatory scheme Congress and the agency have already established, not from any further agency pronouncement. The conflict here is created by the sameness requirements themselves.</p><p>G. The brand-name slippery slope. Respondent warns that petitioner&#x27;s rule would sweep in brand-name manufacturers. It would not. *Wyeth* turned on the brand-name manufacturer&#x27;s unilateral authority to strengthen labeling under the CBE regulation and its control over its own design. Generic manufacturers possess neither. The asymmetry respondent finds anomalous is a consequence of the bargain Congress struck in Hatch-Waxman, and its correction lies with Congress.</p><p>IV. Observations on the Prevailing Party&#x27;s Weaker Contentions</p><p>Because a ruling should distinguish what persuades from what does not, we note that several of petitioner&#x27;s submissions do not support the judgment we enter.</p><p>First, petitioner&#x27;s assertion that this case is &quot;directly controlled by *Mensing*&quot; because &quot;the warning was critical to the design defect case&quot; overstates the record. The trial judge&#x27;s pretrial instructions, as described without contradiction by respondent, drew a deliberate line between adequacy and efficacy and barred argument on adequacy in light of petitioner&#x27;s waiver of the comment k defense. Petitioner prevails on the design-sameness ground, not on a recharacterization of this claim as a failure-to-warn claim.</p><p>Second, petitioner&#x27;s contention that a design-defect verdict necessarily means &quot;no physician would prescribe the drug for any person&quot; is not an accurate description of New Hampshire risk-utility law and is unnecessary to the result.</p><p>Third, we note that petitioner&#x27;s litigation posture — waiving comment k on the eve of trial and introducing no affirmative evidence of the drug&#x27;s benefits — left the risk-utility record markedly one-sided. Respondent is right to observe as much. But a preemption defense is not forfeited by a defendant&#x27;s choice of trial tactics on the merits, and the conflict we identify is one of law.</p><p>Finally, we record that the briefing on both sides contained rhetorical flourishes and characterizations of opposing counsel&#x27;s positions that added nothing to the analysis. We have disregarded them. We have likewise disregarded the emotional weight of respondent&#x27;s injuries, which is considerable and which we do not doubt, because impossibility preemption does not vary with the gravity of the plaintiff&#x27;s harm. Sympathy is not a canon of construction.</p><p>V. Disposition</p><p>State-law design-defect claims that turn on the adequacy of a drug&#x27;s risk-utility profile are preempted as applied to generic drug manufacturers, who can change neither the drug&#x27;s composition nor its labeling. The judgment of the Court of Appeals for the First Circuit is reversed, and the case is remanded for further proceedings consistent with this opinion.</p><p>It is so ordered.</p><p>RULING: Petitioner</p>", "error": "Both Bartlett's design-defect and failure-to-warn claims were submitted to the jury.", "truth": "Only Bartlett's design-defect product-liability claim made it to trial; no failure-to-warn claim was submitted to the jury.", "nmarks": 1}, {"id": "C019", "text": "<p>RULING</p><p>I. Procedural History</p><p>This case arises from a permit application made in 1994 by Coy A. Koontz to the St. Johns River Water Management District (&quot;the District&quot;), which had jurisdiction over his land. Koontz sought permission to develop more of his property than an earlier permit allowed. The District agreed to issue the permit only on the condition that Koontz (1) deed the remainder of his property into a conservation area and (2) perform additional offsite mitigation work on surrounding areas at a cost estimated between roughly $10,000 and $150,000. Koontz agreed to the conservation easement but declined the offsite mitigation, and the District denied his application. Critically, the District admitted in the pretrial statement that &quot;the denials were based exclusively on the fact that the plaintiff would not provide additional mitigation to offset impacts from the proposed project.&quot;</p><p>Koontz sued. The Florida trial court found in his favor, holding that the District&#x27;s actions effected a taking and that imposing conditions on a permit is constitutional only if the required action serves the same governmental purpose as the ban on development.<mark class='tru' data-n='1'> The Fifth District Court of Appeal affirmed, and the underlying factual findings — including the finding that the offsite mitigation demanded exceeded what the law permitted — were left undisturbed.</mark><mark class='err' data-n='2'> The Supreme Court of Florida reversed and dismissed the case.</mark> This Court granted certiorari to resolve whether the government is liable for a taking when it refuses to issue a permit until the landowner agrees to dedicate personal resources (here, money for offsite mitigation) to a public use.</p><p>II. Governing Law</p><p>The Fifth Amendment&#x27;s Takings Clause provides that private property shall not be taken for public use without just compensation. Under the unconstitutional conditions doctrine as articulated in *Nollan v. California Coastal Commission*, 483 U.S. 825 (1987), and *Dolan v. City of Tigard*, 512 U.S. 374 (1994), the government may not condition the grant of a land-use permit on the landowner&#x27;s surrender of a portion of his property unless the condition bears an &quot;essential nexus&quot; to a legitimate governmental interest (*Nollan*) and is &quot;roughly proportional&quot; both in nature and extent to the impact of the proposed development (*Dolan*).</p><p>Two questions frame the parties&#x27; dispute. First, does *Nollan* and *Dolan* scrutiny apply when the demand imposed is not a physical conveyance of an interest in land but an obligation to expend money? Second, does the doctrine apply when the government&#x27;s response to the landowner&#x27;s refusal is to deny the permit rather than to grant it subject to the condition?</p><p>On the first question, nothing in the logic of the unconstitutional conditions doctrine limits its application to exactions of easements or other interests in real property. The doctrine rests on the principle that the government may not leverage its legitimate permitting power to extract from a landowner a benefit — property — to which it has no entitlement. Money, like real property, is property; the surrender of personal resources to a public use is a burden on property in the same sense as the surrender of an easement. The operative vice is coercion through the permitting process, not the particular form the exaction takes.</p><p>On the second question, the doctrine is not defeated merely because the government withholds rather than grants the permit. Where the government expressly conditions its approval on the landowner&#x27;s surrender of property, the landowner faces a choice: surrender the property or forgo the permit. That choice, and the coercion it entails, is present whether the ultimate agency action is characterized as a grant with conditions or a denial premised on refusal to accept the conditions. To hold otherwise would permit the government to evade *Nollan* and *Dolan* scrutiny simply through the formality of a denial — a result the unconstitutional conditions doctrine cannot tolerate.</p><p>III. Application</p><p>The record establishes that the District imposed an actual, express condition: the performance of offsite mitigation at a cost of up to $150,000. The District itself conceded, in the pretrial statement and again before the Supreme Court of Florida, that its denial rested &quot;exclusively&quot; on Koontz&#x27;s refusal to provide the additional mitigation, which &quot;would be offsite because the available conservation land on site was, in the district&#x27;s view, insufficient.&quot; This is not a case where liability would turn on the vagaries of negotiation; the condition was identified, the refusal was identified, and the denial was expressly premised on the refusal. The finality concern that might otherwise counsel restraint is absent.</p><p>The District&#x27;s demand for money to fund offsite mitigation is a demand for the dedication of personal resources to a public use. Because the condition imposed an obligation to spend money as the price of a permit, and because the demand was enforced through a permit denial, the *Nollan* and *Dolan* framework governs. Applying that framework, the trial court found — and the appellate court affirmed as a matter of law — that Koontz&#x27;s project would have a minimal impact on viable wetlands, and that the offsite mitigation demanded by the District, beyond the conservation easement, was excessive and disproportionate to any impact of the development.<mark class='err' data-n='3'> Those findings were left undisturbed by the Supreme Court of Florida, which dismissed for lack of jurisdiction without reaching the merits, and they are therefore binding on this Court.</mark></p><p>The District&#x27;s counterarguments are unpersuasive. Its contention that *Nollan* and *Dolan* apply only to exactions of physical access rights conflates the facts of those cases with their rationale; *Lingle v. Chevron U.S.A.*, 544 U.S. 528 (2005), confirmed that those cases police the government&#x27;s use of the permitting process to extort property, not merely its regulation of land. Nor does requiring *Nollan* and *Dolan* scrutiny here render every regulatory compliance cost a taking: ordinary, generally applicable requirements that development comply with environmental standards are regulations; a demand that a permit applicant, alone, dedicate money or land to a public use in excess of what proportionality permits is an exaction. Koontz&#x27;s claim is the latter, and the findings below establish the excess.</p><p>IV. Disposition</p><p><mark class='err' data-n='4'>The judgment of the Supreme Court of Florida is reversed, and the case is remanded for further proceedings not inconsistent with this opinion.</mark> The government is liable for a taking where it refuses to issue a permit until the landowner agrees to dedicate personal resources to a public use in a manner that fails the essential nexus and rough proportionality requirements of *Nollan* and *Dolan*.</p><p>RULING: Petitioner</p>", "error": "The Supreme Court of Florida dismissed the case for lack of jurisdiction.", "truth": "The Supreme Court of Florida reversed the Fifth District Court of Appeal.", "nmarks": 4}, {"id": "C020", "text": "<p>IN THE SUPREME COURT OF THE UNITED STATES</p><p>*Ohio, et al. v. American Express Co.* — Ruling on the Question Presented</p><p>I. Procedural History</p><p><mark class='err' data-n='1'>In 2010, the United States and seventeen States sued Visa, MasterCard, and American Express under Section 1 of the Sherman Act, alleging that anti-steering contractual provisions — here, American Express&#x27;s &quot;non-discriminatory provisions&quot; (NDPs) — unreasonably restrained trade by preventing merchants from discouraging use of Amex cards at the point of sale.</mark> Visa and MasterCard resolved the claims by consent judgment in 2011 and rescinded their anti-steering rules. American Express proceeded to trial.</p><p><mark class='err' data-n='2'>The district court found that the NDPs suppressed price competition on the merchant side of the credit-card platform and entered judgment for the plaintiffs.</mark><mark class='tru' data-n='3'> On appeal, the Second Circuit reviewed the district court&#x27;s factual findings for clear error and its legal conclusions de novo, and reversed.</mark> The court of appeals held that because credit-card transactions occur on a two-sided platform, the rule of reason requires weighing the NDPs&#x27; net effect on both merchants *and* cardholders, and that the government&#x27;s merchant-side showing was insufficient to establish a prima facie case of anticompetitive effect. The government sought review in this Court, and certiorari was granted.<mark class='err' data-n='4'> American Express appears as petitioner by virtue of its cross-petition defending the judgment below on the allocation of the prima facie burden; the United States and the States appear as respondent.</mark><mark class='err' data-n='5'> We note, as a matter of order, that petitioner&#x27;s opening excerpt misstates the judgment below as an &quot;affirmance&quot;; the Second Circuit reversed the district court.</mark> The error is immaterial to the merits, but counsel is cautioned to conform argument to the record.</p><p><mark class='err' data-n='6'>The question presented is whether the government&#x27;s showing that the NDPs stifled price competition on the merchant side sufficed, under the rule of reason, to prove anticompetitive effects and thereby shift to American Express the burden of establishing procompetitive justifications.</mark></p><p>II. Governing Law</p><p>Section 1 of the Sherman Act prohibits contracts that unreasonably restrain trade. Not every restraint is unlawful; vertical restraints — agreements between a supplier and its customers or distributors — are judged under the rule of reason, *Leegin Creative Leather Products, Inc. v. PSKS, Inc.* (2007), because they may promote interbrand competition even when they constrain intrabrand conduct. Under the rule of reason, the plaintiff bears the initial burden of demonstrating that the challenged restraint produces substantial anticompetitive effects in a relevant market. Only if that burden is carried does it shift to the defendant to show procompetitive justifications, after which the court weighs the effects.</p><p>Market definition and the measurement of competitive effects must correspond to the &quot;product at issue&quot; and to the economic reality of the market. *Times-Picayune Publishing Co. v. United States* (1953), recognized that a platform serving interdependent customer groups must be analyzed with attention to its structure. Where, as here, a platform offers a single *transactional* product — the simultaneous sale of services to cardholder and merchant such that neither can consume the service without the other at the moment of sale — the two sides cannot meaningfully be severed for purposes of assessing the restraint&#x27;s competitive effects. Evidence of higher prices on one side of a two-sided transaction platform, standing alone, does not establish anticompetitive effect, because the price on either side reflects the cost of serving both sides. *Brooke Group Ltd. v. Brown &amp; Williamson Tobacco Corp.* (1993), cautions that a price increase, without more, tells the trier of fact little: courts must ask whether prices rose because of market forces or because of a restriction of output, quality, or competition.</p><p>III. Application</p><p>A. The credit-card platform is a single two-sided transaction market. The record establishes a classic two-sided network. Cardholders value a card only if merchants accept it; merchants accept it only if cardholders carry it. No transaction — the product at issue — occurs unless cardholder and merchant come together simultaneously. This distinguishes *Times-Picayune*, where the newspaper could complete a sale to advertisers or to readers independently. Because Amex directly sets the prices on both sides and cannot profitably serve one side without the other, a court evaluating the NDPs must consider the net effect of the restraint on both sides of the platform.</p><p>B. The government&#x27;s prima facie showing was confined to one side of a single market. The government&#x27;s proof — that merchant fees rose, that merchants were contractually barred from steering, and that Discover&#x27;s low-price strategy was frustrated when merchants declined to steer for fear of violating the NDPs — is genuine evidence of a restraint on merchant-side behavior, and respondent marshals it ably. Its strongest points are twofold. First, the *Indiana Federation of Dentists* argument: a defendant may not suppress competition over one dimension of a product in order to channel resources toward another dimension it prefers; competition, not the defendant, should set the ratio between merchant fees and cardholder rewards. Second, the horizontal-cartel analogy: had the four networks jointly adopted no-steering rules, the arrangement would be per se unlawful, and the NDPs are said to produce the same effect network-wide.</p><p>These arguments are not without force, but they cannot carry the government&#x27;s initial burden on this record. The government did not prove the price of the product at issue. It demonstrated an increase in one *component* of that price — the merchant fee — while conceding that output of transactions soared and quality (in rewards and services to cardholders) improved dramatically. Merchant fees are not merely an input cost; on a two-sided transaction platform they are simultaneously the funding source for cardholder-side price reductions. Every reward, cash-back benefit, and service enhancement is a price *decrease* on the cardholder side of the same product. The government&#x27;s own expert testified that assessing only one side of a two-sided platform yields misleading conclusions. A prima facie case built on a price increase to part of a product, unaccompanied by proof of restricted output, diminished quality, or extraction of excess profits, is precisely the false-positive risk this Court has warned against in the vertical-restraint context. The district court&#x27;s findings of merchant-side harm, which petitioner does not here contest, &quot;clap with one hand&quot;: they describe but one side of a transaction that cannot exist without the other.</p><p>Nor does the *Dentists* analogy displace this conclusion. The NDPs do not dictate the merchant-fee/reward ratio; they prevent merchants — Amex&#x27;s contractual counterparties — from discriminating against Amex cardholders at the point of sale. Amex remains free to pursue its high-cost/high-reward model only so long as cardholders and merchants continue to transact on its network, against three rivals holding roughly 94% of remaining transaction volume. Where four networks compete intensely for both merchants and cardholders, and output and quality have grown, the restraint has not been shown to depress competition *on the platform as a whole*. Respondent&#x27;s horizontal-cartel framing, while rhetorically vivid, proves too little in a rule-of-reason case: it would condemn virtually any vertical restraint that dampens one dimension of interbrand rivalry, contrary to *Leegin*.</p><p>C. Disposition of the burden. Because the government failed to demonstrate that the NDPs produced substantial anticompetitive effects on the two-sided credit-card transaction market as a whole, its prima facie burden was not carried. The burden of establishing procompetitive justifications therefore never shifted to American Express. We need not decide whether the NDPs are affirmatively procompetitive, nor announce a categorical rule for all two-sided platforms; our holding is confined to transaction platforms in which a single product cannot be sold to one side without simultaneously being sold to the other.</p><p>IV. Disposition</p><p><mark class='err' data-n='7'>The judgment of the Second Circuit is affirmed on the question presented.</mark> The government&#x27;s merchant-side showing was insufficient to prove anticompetitive effects under the rule of reason, and the burden of demonstrating procompetitive benefits did not shift to American Express.</p><p>RULING: Petitioner</p>", "error": "The Second Circuit affirmed the district court’s judgment that American Express’s NDPs violated antitrust law.", "truth": "The Second Circuit reversed the district court’s ruling that American Express’s NDPs violated antitrust law.", "nmarks": 7}, {"id": "C021", "text": "<p>Procedural History</p><p>California voters enacted Proposition 12 in 2018. As relevant here, the measure prohibits the in-state sale of pork derived from breeding pigs confined in a manner that does not satisfy California’s space requirements.<mark class='tru' data-n='1'> Industry associations representing pork producers and farmers brought this action, alleging that Proposition 12 violates the dormant Commerce Clause because it regulates extraterritorially and imposes burdens on interstate commerce that are excessive in relation to California’s interests.</mark></p><p><mark class='tru' data-n='2'>The district court dismissed the complaint for failure to state a claim.</mark><mark class='tru' data-n='3'> It concluded that Proposition 12 neither discriminates against interstate commerce nor impermissibly regulates wholly out-of-state commerce, and that the complaint did not plausibly establish an undue burden under *Pike v.</mark> Bruce Church, Inc.<mark class='tru' data-n='4'>* The Court of Appeals for the Ninth Circuit affirmed.</mark> The challengers sought review in this Court. We affirm.</p><p>Governing Law</p><p>The Commerce Clause grants Congress the power to regulate interstate commerce.<mark class='tru' data-n='5'> Its dormant component limits certain state measures that discriminate against or unduly burden interstate commerce.</mark> A state law that facially, purposefully, or practically discriminates against interstate commerce is ordinarily invalid unless the State establishes a sufficient justification and the absence of reasonable nondiscriminatory alternatives.</p><p>A nondiscriminatory law may also be invalid under *Pike* where the burden it imposes on interstate commerce is “clearly excessive in relation to the putative local benefits.” *Pike* does not, however, authorize courts to displace ordinary state regulation merely because compliance is costly, affects out-of-state firms more heavily, or influences business decisions beyond state borders.<mark class='tru' data-n='6'> The dormant Commerce Clause protects interstate commerce; it does not guarantee a producer any particular method of production or industrial organization.</mark> See *Exxon Corp. v. Governor of Maryland*.</p><p>The Court’s extraterritoriality precedents—such as *Baldwin v. G.A.F. Seelig, Inc.*, *Brown-Forman Distillers Corp. v. New York State Liquor Authority*, and *Healy v. Beer Institute*—principally prohibit state measures that control prices or commercial transactions occurring wholly outside the State, particularly where the law effectively dictates the terms of out-of-state sales. Those decisions do not establish a free-standing rule invalidating every in-state sales condition that has upstream effects on production elsewhere. States commonly set standards for goods sold within their borders, even if producers outside the State alter their practices in order to serve that market.</p><p>At the pleading stage, the challengers must allege facts making their entitlement to relief plausible. Assertions of economic cost or policy disagreement, without a plausible showing of discrimination, impermissible extraterritorial control, or a burden clearly excessive relative to cognizable local benefits, do not suffice.</p><p>Application</p><p>Proposition 12 regulates the sale of pork in California. It does not forbid producers from raising pigs under other conditions for sale outside California, prescribe the terms on which pork may be sold in other States, or regulate prices paid in other markets. Producers may choose to supply California-compliant pork to California while supplying other markets through different production arrangements. The fact that supply chains, packers, or retailers may find segregation costly or may prefer broader operational changes does not transform an in-state sales rule into direct regulation of wholly out-of-state commerce.</p><p>The challengers’ contrary position depends on the assertion that, because pork is processed and distributed through an integrated national market, California’s requirements will practically induce producers to change practices beyond California. That allegation identifies an economic consequence of California’s market regulation, not the type of extraterritorial price control or direct command over out-of-state transactions prohibited by *Baldwin*, *Brown-Forman*, and *Healy*. Accepting that theory would cast constitutional doubt on a wide range of ordinary state product and sales standards whenever a national producer found separate compliance burdensome.<mark class='tru' data-n='7'> The dormant Commerce Clause does not compel that result.</mark></p><p><mark class='tru' data-n='8'>Nor does the complaint plausibly state a *Pike* claim.</mark> Proposition 12 applies evenhandedly to in-state and out-of-state pork alike. The asserted compliance costs may be substantial for producers serving California, and the Court does not discount the practical difficulties alleged by farmers and processors. But costs borne principally by out-of-state firms do not alone establish a constitutionally undue burden. California has a legitimate interest in determining which products may be sold in its marketplace based on the conditions under which those products are produced, including its moral concern regarding animal confinement. The record also supplies a non-speculative basis for California’s asserted health and safety interests: the allegations acknowledge a correlation between intensive confinement and increased salmonella rates in growing pigs, and California may reasonably conclude that animal stress and confinement conditions bear on food safety.</p><p>The challengers respond that Proposition 12 will balkanize the national market and invite other States to impose competing production conditions, including conditions concerning wages, labor practices, or other out-of-state conduct. That concern is not immaterial. A state law conditioning local sales on an unrelated, company-wide policy governing products or conduct wholly outside the regulating State could present a materially different case. But Proposition 12 is tied to the production of the particular pork offered for sale in California and to the confinement of the breeding sows producing that pork. It therefore differs from a mandate regulating a producer’s general operations or its separate out-of-state transactions.</p><p><mark class='err' data-n='9'>Finally, the respondent’s assertion that the Ninth Circuit reversed the district court and remanded for trial is contrary to the stipulated procedural record, which establishes that the Ninth Circuit affirmed dismissal.</mark> The Court resolves the case on that record, rather than on that contrary characterization.</p><p>The complaint does not plausibly allege discrimination, prohibited extraterritorial regulation, or a burden on interstate commerce clearly excessive in relation to Proposition 12’s legitimate local interests. Congress retains authority to enact a uniform national rule if it concludes that conflicting state standards warrant one. The dormant Commerce Clause does not itself invalidate California’s measure on the allegations presented.</p><p>Disposition</p><p>The judgment of the Court of Appeals is affirmed.</p><p>RULING: Petitioner</p>", "error": "The Ninth Circuit reversed the district court’s dismissal and remanded the case for trial.", "truth": "The district court dismissed the complaint for failure to state a claim, and the U.S. Court of Appeals for the Ninth Circuit affirmed, finding that the complaint did not plausibly plead a dormant Commerce Clause violation under either theory.", "nmarks": 9}, {"id": "C022", "text": "<p>Procedural History</p><p>In 1996, four employees of the Tardy Furniture Store in Winona, Mississippi, were murdered during an armed robbery. Curtis Giovanni Flowers was prosecuted for those crimes in six separate trials.<mark class='err' data-n='1'> His first two convictions were reversed by the Mississippi Supreme Court because prejudicial evidence concerning the other victims had been admitted.</mark> His third conviction and death sentence were reversed because prosecutor Doug Evans had exercised peremptory challenges in a racially discriminatory manner. The fourth and fifth trials ended in mistrials.</p><p>At the sixth trial, Flowers was charged with the four capital murders. During jury selection, the State used five of its six peremptory strikes against Black prospective jurors. Flowers objected under *Batson v. Kentucky*, contending that the strikes were racially motivated. The trial court accepted the prosecutor’s proffered race-neutral explanations and denied the objections. Flowers was convicted.</p><p><mark class='tru' data-n='2'>The Mississippi Supreme Court rejected Flowers’s *Batson* claim and affirmed.</mark><mark class='err' data-n='3'> This Court directed the Mississippi Supreme Court to reconsider in light of *Foster v.</mark> Chatman*, which reaffirmed that a court must consider all evidence bearing on purposeful discrimination rather than accept facially neutral explanations in isolation.<mark class='tru' data-n='4'> On remand, the Mississippi Supreme Court again upheld the conviction.</mark> We granted review to decide whether that court correctly applied *Batson*.</p><p>Governing Law</p><p>The Equal Protection Clause forbids a prosecutor from exercising a peremptory strike because of a prospective juror’s race. *Batson* supplies a three-step framework. First, the opponent of the strike must make a prima facie showing that race was a motivating factor. Second, the striking party must offer a race-neutral explanation. Third, the trial court must determine whether the objecting party has proved purposeful discrimination.</p><p>At the third step, the question is not merely whether each stated reason is facially race neutral. The court must make “a sensitive inquiry into such circumstantial and direct evidence of intent as may be available.” The inquiry considers all relevant circumstances, including the prosecutor’s history of jury-selection practices, the number and pattern of strikes, disparate questioning of Black and white prospective jurors, investigation directed selectively at Black prospective jurors, and comparisons between struck Black jurors and white jurors who were accepted despite possessing materially similar characteristics.</p><p>Although reviewing courts ordinarily afford substantial deference to a trial court’s credibility determinations, deference does not require acceptance of findings that the full record demonstrates are clearly erroneous. A prosecutor’s asserted reasons must be assessed collectively and against the actual treatment of similarly situated jurors.</p><p>Application</p><p>The record here presents an extraordinary pattern. Across the first four trials, Mr. Evans exercised 36 peremptory challenges, all against Black prospective jurors.<mark class='err' data-n='5'> The Mississippi Supreme Court itself had previously found racial discrimination in his jury selection in Flowers’s third trial.</mark> That history does not by itself establish a constitutional violation in the sixth trial, but it is highly relevant evidence bearing on intent. The State properly concedes that, under *Miller-El*, such history is part of the required analysis.</p><p>The sixth trial did not occur in a vacuum. The State used five of six peremptory strikes against Black prospective jurors. The numerical disparity is substantial, particularly when viewed with the prior history. The prosecutor also questioned the Black prospective jurors who were struck at dramatically greater length than the white jurors who were seated: on average, 29 questions to the former and 1.1 questions to the latter. Nor was the disparity simply a matter of neutral follow-up. The record reflects aggressive questioning of Black jurors designed to elicit possible reservations or connections, while white jurors with comparable concerns or associations were not subjected to similar examination.</p><p>The State maintains that its strikes were justified because each struck juror knew, worked with, or was related to Flowers or members of his family, and because one juror gave inaccurate information on a questionnaire. Those considerations may, in an appropriate record, provide race-neutral grounds for a strike. But the ultimate issue is whether those reasons genuinely motivated the State’s decisions. Here, the State’s selective reliance on those grounds is probative. Comparable relationships, knowledge, or potential concerns among white jurors did not prompt equivalent questioning, investigation, or strikes. The State’s investigation of several Black prospective jurors, without a comparable effort as to white jurors, further supports the inference that the stated explanations were not applied evenhandedly.</p><p>The State also urges that the unusual circumstances of a sixth trial in a small community account for the questioning and the jurors’ many connections to the parties. Those circumstances may explain why follow-up questions were appropriate. They do not explain why the follow-up was so overwhelmingly and intensively directed at Black prospective jurors, nor why white jurors with similar connections were treated differently.</p><p><mark class='tru' data-n='6'>The Mississippi Supreme Court erred by evaluating the State’s reasons too narrowly and without giving proper cumulative force to the relevant evidence: the prosecutor’s extensive prior history of striking Black jurors in these prosecutions; the prior adjudication of a *Batson* violation; the five-of-six strike pattern in the sixth trial; the severe disparity in questioning; the selective investigation of Black jurors; and the disparate treatment of similarly situated white jurors.</mark> Taken together, those circumstances establish that race was a substantial motivating factor in the State’s use of peremptory challenges.</p><p>Flowers has therefore carried his burden at *Batson*’s third step. The State’s facially race-neutral explanations cannot withstand scrutiny in light of the complete record.</p><p>Disposition</p><p><mark class='tru' data-n='7'>The judgment of the Mississippi Supreme Court is reversed, and the case is remanded for further proceedings consistent with this ruling.</mark></p><p>RULING: Petitioner</p>", "error": "The Mississippi Supreme Court dismissed Flowers’s Batson claim as procedurally defaulted.", "truth": "The Mississippi Supreme Court rejected Flowers’s jury-selection arguments and, on remand, again upheld the ruling for the State; it did not dismiss his Batson claim as procedurally defaulted.", "nmarks": 7}, {"id": "C023", "text": "<p>Opinion</p><p>Kahler was charged in Kansas with murdering his wife, two daughters, and their grandmother. At trial, experts for both sides agreed that he suffered from serious mental disorders and personality disturbances. The defense expert testified that Kahler’s illness caused him temporarily to lose control and prevented him from making a rational choice to kill. The jury nevertheless convicted him of the four murders and imposed a death sentence.<mark class='err' data-n='1'> The Kansas Supreme Court affirmed the convictions but vacated the death sentence.</mark><mark class='err' data-n='2'> Kahler sought review in this Court, contending that Kansas’s restriction on the insanity defense violates the Eighth and Fourteenth Amendments.</mark></p><p>We affirm.</p><p>I. Governing Law</p><p>The Due Process Clause requires the State to prove every element of a criminal offense beyond a reasonable doubt. It also forbids criminal punishment that is fundamentally inconsistent with principles of justice deeply rooted in the Nation’s history and traditions. But the Constitution does not generally require the States to adopt any particular definition of criminal responsibility or any particular affirmative defense.</p><p>Insanity doctrines have varied substantially across jurisdictions and over time. Some legal systems have focused on a defendant’s ability to understand the nature of the act; others have asked whether the defendant knew the difference between right and wrong; still others have considered volitional incapacity, mental illness, or whether the defendant could form the mental state required for the offense. The existence of an insanity defense in many jurisdictions does not, by itself, establish that one specific formulation is constitutionally required.</p><p>The Eighth Amendment likewise does not establish a single constitutionally mandated insanity rule for determining criminal guilt. The Amendment imposes limits on punishment, including restrictions concerning the execution of persons who are incompetent or otherwise constitutionally ineligible for execution. But it does not require a State to excuse every defendant whose mental illness impaired moral judgment, rational decisionmaking, or self-control.</p><p>A State may therefore define its criminal offenses and defenses, so long as it continues to require proof of the requisite mental state and does not impose punishment without proof of the elements of the crime.</p><p>II. Application</p><p>Kansas has not made mental illness wholly irrelevant to criminal responsibility. Its law permits a defendant to present evidence of mental disease or defect insofar as that evidence tends to show that the defendant lacked the mental state required for the charged offense. Thus, if mental illness prevents a defendant from forming the intent or other mens rea that Kansas law makes an element of the crime, the defendant may rely on that evidence to contest the State’s proof.</p><p>What Kansas does not permit is a separate determination that a defendant is legally excused solely because mental illness prevented him from understanding that his conduct was morally or legally wrong, or because the illness caused him to lose control. Kahler argues that this limitation is unconstitutional because the common-law tradition treated moral capacity as central to culpability and because most jurisdictions retain some version of a right-versus-wrong insanity test.</p><p>That argument establishes, at most, that Kansas has chosen a minority approach. It does not establish that Kansas has violated the Constitution. The historical record does not reveal a single, fixed insanity rule that was uniformly accepted as essential to criminal adjudication. Rather, the content and scope of insanity doctrines have differed considerably. The Constitution does not constitutionalize one historical test while invalidating all others.</p><p>Nor does Kansas’s rule permit conviction without proof of a culpable mental state. The jury must still determine whether the State proved the mental element of each offense. Kahler’s evidence that he suffered from depression, obsessive-compulsive disorder, and personality disorders could be considered insofar as it bore on whether he formed the required intent. The Constitution does not require Kansas to extend that inquiry into a freestanding determination of moral incapacity.</p><p>The Due Process Clause also does not require a separate verdict of “not guilty by reason of insanity.” A State may choose to treat mental illness as relevant to the elements of an offense rather than as an affirmative excuse, provided that its overall scheme remains rational and fundamentally fair. Kansas’s scheme meets that standard.</p><p>The Eighth Amendment does not alter this conclusion. Kahler has not shown that Kansas’s definition of criminal responsibility is cruel or unusual merely because it differs from the rule used in most other States. The Eighth Amendment does not mandate a particular moral theory of criminal culpability or require an insanity defense based on inability to distinguish right from wrong or inability to control one’s conduct. Any separate constitutional limitations governing the execution of mentally incompetent prisoners do not require a broader defense at the guilt phase.</p><p>III. Disposition</p><p>Kansas may abolish a traditional insanity defense in the form urged by Kahler and may instead allow evidence of mental disease or defect only to the extent that it negates the mens rea required for the charged offense.<mark class='err' data-n='3'> Because Kansas’s rule does not eliminate the requirement that the State prove every element of the crime and does not violate the Eighth Amendment, Kahler’s conviction is constitutionally valid.</mark></p><p>RULING: Respondent</p>", "error": "The Kansas Supreme Court affirmed Kahler’s conviction but vacated his death sentence.", "truth": "The Kansas Supreme Court affirmed Kahler’s conviction and death sentence.", "nmarks": 3}, {"id": "C024", "text": "<p>Supreme Court of the United States</p><p>Wesley Harris, et al., Petitioners, v. Arizona Independent Redistricting Commission, et al., Respondents.</p><p>---</p><p>I. Procedural History</p><p><mark class='tru' data-n='1'>Following the 2010 census, the Arizona Independent Redistricting Commission redrew the State&#x27;s legislative districts.</mark><mark class='err' data-n='2'> Wesley Harris and other individual voters (Petitioners) sued the Commission in the United States District Court for the District of Arizona, alleging that the new districts were under-populated in Democratic-leaning districts and over-populated in Republican-leaning districts in violation of the Equal Protection Clause of the Fourteenth Amendment.</mark><mark class='tru' data-n='3'> The Commission defended the deviations as the product of its efforts to comply with the Voting Rights Act of 1965, including its then-applicable obligation to obtain federal preclearance.</mark></p><p><mark class='tru' data-n='4'>The three-judge district court found in favor of the Commission, holding that the map reflected a good-faith effort to comply with the Voting Rights Act.</mark> Petitioners appealed directly to this Court pursuant to 28 U.S.C. § 1253, presenting two questions: (1) whether the desire to gain partisan advantage justifies intentional population deviations from one-person, one-vote; and (2) whether the pursuit of favorable preclearance review from the Department of Justice may justify such deviations in light of *Shelby County v. Holder*, 570 U.S. 529 (2013).</p><p>Before turning to the merits, the Court notes a procedural irregularity.<mark class='err' data-n='5'> Several excerpts submitted by counsel for Respondents misstate the judgment below — asserting that the district court &quot;found in favor of Harris&quot; — and otherwise argue at length that the deviations violated the Equal Protection Clause, a position adverse to the judgment Respondents were retained to defend.</mark><mark class='tru' data-n='6'> These submissions are disregarded to the extent they contradict the record, which establishes that the district court entered judgment for the Commission.</mark> The Court decides this appeal on the record and the governing law, not on counsel&#x27;s confused presentation.</p><p>II. Governing Law</p><p><mark class='err' data-n='7'>The Equal Protection Clause requires a State to make &quot;an honest and good faith effort to construct districts .</mark> . . as nearly of equal population as is practicable.&quot; *Reynolds v. Sims*, 377 U.S. 533, 577 (1964). The Court has never demanded perfect equality. Deviations may be tolerated where they &quot;are based on legitimate considerations incident to the effectuation of a rational state policy,&quot; *id.* at 579, and compliance with the Voting Rights Act is a quintessential rational state policy, *Mahan v. Howell*, 410 U.S. 315 (1973); *Upham v. Seamon*, 456 U.S. 37 (1982) (per curiam). Conversely, a deviation adopted solely &quot;to obtain political advantage&quot; is an illegitimate use of the apportionment power. *Reynolds*, 377 U.S. at 580.</p><p><mark class='err' data-n='8'>The Court has drawn a practical line at roughly ten percent: deviations below that threshold are *de minimis* as a matter of law, and a challenger must show that the deviations &quot;primarily&quot; resulted from illegitimate reapportionment goals rather than legitimate ones.</mark> *Brown v. Thomson*, 467 U.S. 547, 555 (1984); *Voinovich v. Quilter*, 507 U.S. 146, 161 (1993). Because the question is one of predominant purpose, a plan is not invalid merely because its deviations exceed what strict necessity would have required; an apportionment authority need not pursue VRA compliance by the most minimal means available.</p><p>Finally, under Federal Rule of Civil Procedure 52(a)(6), this Court reviews the district court&#x27;s factual findings for clear error. Whether the Commission acted in good faith is a factual question committed in the first instance to the trial court.</p><p>III. Application</p><p>A. Partisan advantage. The first question must be answered no.<mark class='err' data-n='9'> A desire to secure electoral advantage for one party is not a legitimate justification for population deviations, and this Court has said so since *Reynolds*.</mark> Petitioners are correct on this principle. But principle is not enough; they must show on this record that the 8.8 percent deviation *primarily* served that illegitimate end. The deviation is below the ten-percent threshold, so the burden of demonstrating predominant illegitimate purpose rests on Petitioners. *Brown*; *Voinovich*.<mark class='err' data-n='10'> The district court, having heard the evidence, found that the deviations were the product of a good-faith effort to comply with the Voting Rights Act.</mark> Petitioners identify no clear error in that finding. Their strongest point — that under-population was not strictly &quot;necessary&quot; for preclearance, and that a draft map with roughly a 4 percent deviation satisfied the Act according to the Commission&#x27;s own expert — goes to whether the Commission took the most minimal path, not to whether VRA compliance was its predominant purpose. Under our precedents, that showing is insufficient. That the deviations may have incidentally favored one party — or, as Petitioners put it, that an &quot;incompetent gerrymander is no less a gerrymander&quot; — does not displace the district court&#x27;s credibility determination that VRA compliance, not partisanship, drove the map.</p><p>B. The Voting Rights Act and *Shelby County*.<mark class='err' data-n='11'> The second question must be answered in the qualified affirmative: good-faith efforts to comply with the Voting Rights Act, including the preclearance regime as it existed at the time of mapdrawing, remain a legitimate state policy justifying deviations under ten percent.</mark> *Shelby County* invalidated the coverage formula for preclearance in 2013, but the Commission drew this map in 2012, when Section 5 of the Act was unquestionably operative and binding upon Arizona as a covered jurisdiction. A redistricting body cannot be faulted, years later, for having complied with federal law that then commanded its obedience. Petitioners&#x27; contrary argument — that the VRA never &quot;required&quot; under-populated districts and that the Commission&#x27;s legal advice was flawed — again attacks the necessity of the measures rather than their purpose. The law does not require a Commission to guess correctly what the Department of Justice would demand in an admittedly opaque preclearance process; it requires only that deviations be drawn in good faith for a legitimate reason. The district court found they were, and that finding stands.</p><p>C. The weight of the arguments. Petitioners&#x27; brief states the one-person, one-vote principle forcefully and correctly, but rests on the assertion that the Commission&#x27;s legal advice was wrong — a contention that, even if true, would not establish predominant illegitimate purpose or clear error. Respondents&#x27; submission, for its part, is of no assistance: it concedes intentional, systematic deviations, argues that the VRA cannot trump the Constitution, and misstates the judgment below — positions that actually support the Petitioners and reveal a serious failure of advocacy. Notably, none of Respondents&#x27; confessions alters the analysis, because the concessions (intentional deviations, drawn to protect minority ability-to-elect districts) are consistent with the district court&#x27;s findings of a good-faith VRA rationale, which our precedents treat as legitimate. The judgment must nonetheless be affirmed on the law and the record, whatever the quality of the briefing that accompanied it.</p><p>IV. Disposition</p><p><mark class='err' data-n='12'>For the foregoing reasons, the first question presented is answered no; the second is answered yes insofar as good-faith compliance with the Voting Rights Act as it stood when the map was drawn may justify deviations below the ten-percent threshold, notwithstanding *Shelby County*.</mark> The judgment of the district court is affirmed.</p><p>It is so ordered.</p><p>RULING: Respondent</p>", "error": "The district court found in favor of Harris and held that the population deviations violated the Equal Protection Clause rather than representing a good-faith effort to comply with the Voting Rights Act.", "truth": "The district court found in favor of the Arizona Independent Redistricting Commission and held that the population deviations represented a good-faith effort to comply with the Voting Rights Act.", "nmarks": 12}, {"id": "C025", "text": "<p>Opinion of the Court</p><p>Fane Lozman, a resident and persistent critic of the City of Riviera Beach, opposed the City’s marina redevelopment plan and brought a state-law action challenging its approval. During a closed meeting concerning that litigation, city councilmembers discussed how to respond to Lozman; the transcript may be understood as contemplating intimidation or other measures directed against him.</p><p>Lozman later spoke during the public-comment portion of a city council meeting. When he began discussing alleged corruption in local government, a councilmember directed him to stop. Lozman continued, and the councilmember instructed a police officer to arrest him. Lozman was charged with disturbing a lawful assembly and other offenses. Although the prosecutor concluded that probable cause supported the arrest, the charges were dismissed because successful prosecution was considered unlikely.</p><p>Lozman then sued the City under 42 U.S.C. § 1983, alleging, among other claims, that the City caused his arrest in retaliation for his protected speech and prior lawsuit. Following a jury trial, judgment was entered for the City. The district court denied Lozman’s motion for a new trial. On appeal, the lower appellate court treated the existence of probable cause as fatal to the First Amendment retaliatory-arrest claim and affirmed. We granted review to decide whether probable cause necessarily defeats such a claim as a matter of law.</p><p>I. Governing Law</p><p>The First Amendment prohibits government officials from subjecting a person to adverse action in retaliation for protected expression or petitioning activity. Ordinarily, a retaliation plaintiff must establish protected activity, governmental action sufficient to deter such activity, retaliatory motive, and a causal connection—ultimately, that the adverse action would not have occurred absent the protected conduct. Under the framework associated with *Mt. Healthy City Board of Education v. Doyle*, a defendant may avoid liability by showing that it would have taken the same action for lawful reasons.</p><p>Probable cause is highly relevant to that causal inquiry, but it is not invariably conclusive. In *Hartman v. Moore*, the Court required a retaliatory-prosecution plaintiff to plead and prove an absence of probable cause. That requirement responded to features distinctive to prosecution claims: the immediate decisionmaker is ordinarily an immune prosecutor; the defendant is often a different, upstream official; and prosecutorial independence creates a presumption of regularity and a causal difficulty in connecting the defendant’s animus to the prosecution.</p><p>Those considerations do not automatically govern every retaliatory arrest. Arrests often require officers to make rapid judgments, and an objective probable-cause rule can protect legitimate law enforcement from intrusive inquiries into subjective motive. But this case does not principally concern an officer’s split-second choice among possible arrestees. It concerns an alleged premeditated policy of retaliation adopted by the municipality itself and implemented at the direction of a city official.</p><p>Municipal liability under § 1983 cannot rest on respondeat superior. A plaintiff must connect the constitutional injury to an official municipal policy, custom, or decision attributable to a final policymaker. When that showing is made, however, the presence of probable cause does not categorically erase an otherwise actionable municipal policy designed to punish protected expression.</p><p>II. Application</p><p>Lozman engaged in activity at the core of the First Amendment: he criticized public officials and petitioned the government through litigation. His arrest was plainly an adverse governmental action.</p><p>More importantly, Lozman’s theory is supported by evidence materially different from a bare allegation that an arresting officer harbored an improper subjective motive. He points to the closed-session transcript as objective evidence that city officials discussed retaliatory or intimidating measures in response to his lawsuit. He also relies on the later sequence at the public meeting, where a councilmember ordered the officer to arrest him after he attempted to speak about governmental corruption. That evidence, if credited, could permit a factfinder to conclude that the arrest implemented an official plan to retaliate against Lozman for protected activity.</p><p>The City disputes that characterization. It argues that the closed-session discussion reflected only a decision to devote resources to defending the litigation, that Lozman was permitted to speak at other meetings, and that the officer had no prior knowledge of Lozman and independently determined that an arrest was warranted. Those matters bear on whether an official retaliatory policy existed and whether that policy caused the arrest. They may ultimately persuade a factfinder that the City did not retaliate. They do not establish that probable cause defeats the claim as a matter of law.</p><p>Nor does *Hartman* require a contrary result. There is no comparable need here to infer causation through an immune prosecutor’s independent and deliberative decision. Lozman alleges direct municipal action, identifies objective evidence of an antecedent retaliatory policy, and contends that a city policymaker caused that policy to be implemented during a public meeting. Applying *Hartman* as a categorical bar in these circumstances would allow a municipality deliberately to use an otherwise lawful arrest as an instrument for punishing protected speech.</p><p>Our holding is narrow. We do not decide that probable cause is irrelevant in ordinary retaliatory-arrest cases, nor do we decide that Lozman has proved the existence or implementation of an official policy. We hold only that, on this record and under this municipal-policy theory, probable cause does not defeat the First Amendment claim as a matter of law.</p><p>III. Disposition</p><p>The judgment affirming the rejection of Lozman’s retaliatory-arrest claim is vacated, and the case is remanded for further proceedings consistent with this opinion. On remand, Lozman must still prove the required elements of municipal liability, retaliatory motive, and causation. The City remains free to show that no retaliatory policy existed or that the arrest would have occurred independently of Lozman’s protected conduct.</p><p>RULING: Petitioner</p>", "error": "The jury found in favor of Lozman on his common-law false-arrest claim, while finding for the City on his constitutional claims.", "truth": "The jury found in favor of the City on all of Lozman's claims, including his common-law false-arrest claim.", "nmarks": 0}, {"id": "C026", "text": "<p>OPINION OF THE COURT</p><p>I. Procedural History</p><p>This action arises under 42 U.S.C. § 1983 out of an October 2010 search of a residential property in Los Angeles County and the shooting that followed. Respondents Angel Mendez and Jennifer Lynn Garcia, who lived in a wooden shed in the backyard of the Hughes residence, sued Deputies Christopher Conley and Jennifer Pederson of the Los Angeles County Sheriff&#x27;s Department, alleging three Fourth Amendment violations: (1) a warrantless entry into and search of their residence; (2) a failure to knock and announce before entering; and (3) excessive force in the shooting that left Mendez requiring amputation of his right leg below the knee and left Garcia shot in the back.</p><p>Following a bench trial, the District Court found for respondents on the warrantless-search and knock-and-announce claims. On the excessive-force claim, however, the District Court made a critical finding: it held that the deputies&#x27; use of force was reasonable under the circumstances. Deputy Conley, upon opening the shed door, perceived through a curtain the silhouette of a person holding a rifle, shouted &quot;Gun!&quot;, and both deputies fired. Whether Mendez was merely repositioning the BB gun or was pointing it at the deputies was the subject of conflicting testimony, but the District Court resolved the reasonableness question in the deputies&#x27; favor as of the moment force was employed.</p><p><mark class='err' data-n='1'>Notwithstanding that finding, the District Court imposed liability for the shooting under the Ninth Circuit&#x27;s &quot;provocation rule,&quot; which permits an officer who is otherwise found to have used reasonable force to be held liable for that force where the officer intentionally or recklessly provoked a violent confrontation by means of a separate Fourth Amendment violation.</mark><mark class='tru' data-n='2'> The Court of Appeals for the Ninth Circuit affirmed.</mark> Petitioners sought review in this Court, and we granted certiorari.</p><p>The question presented is twofold: whether an officer may be held liable under the provocation rule for a use of force that has been found reasonable and not excessive; and whether an incident culminating in a reasonable use of force negates a prior Fourth Amendment unlawful-entry violation.</p><p>II. Governing Law</p><p>A. The excessive-force inquiry is an objective inquiry into the seizure itself.</p><p>A claim that officers used excessive force in the course of an arrest, investigatory stop, or other seizure is governed by the Fourth Amendment&#x27;s reasonableness standard. *Graham v. Connor*, 490 U.S. 386 (1989). That standard requires &quot;careful attention to the facts and circumstances of each particular case,&quot; including &quot;the severity of the crime at issue, whether the suspect poses an immediate threat to the safety of the officers or others, and whether he is actively resisting arrest.&quot; *Id.* at 396. The test is objective and is applied &quot;from the perspective of a reasonable officer on the scene,&quot; making &quot;allowance for the fact that police officers are often forced to make split-second judgments—in circumstances that are tense, uncertain, and rapidly evolving.&quot; *Id.* at 396–97; see also *Scott v. Harris*, 550 U.S. 372 (2007).</p><p>Two features of that standard are decisive here. First, the inquiry is directed at *the seizure*—the force employed—and asks whether *that* governmental intrusion was reasonable. Second, once a court has answered that question in the affirmative, the Fourth Amendment inquiry into the force is at an end. A search or seizure that satisfies the Fourth Amendment does not become unreasonable by operation of some antecedent, analytically distinct constitutional wrong. The Fourth Amendment is not a general charter of police prudence; it protects against unreasonable searches and seizures, and the reasonableness of each is assessed on its own terms. Different Fourth Amendment violations are analyzed as separate violations, each with its own elements and its own remedy.</p><p>B. The provocation rule cannot be reconciled with that framework.</p><p>The Ninth Circuit&#x27;s provocation rule instructs that an otherwise reasonable use of force becomes actionable when it was proximately caused by an earlier constitutional violation that the officer committed intentionally or recklessly and that provoked a violent response. That rule is incompatible with *Graham* in at least three ways.</p><p>*First*, it manufactures an excessive-force claim where, by hypothesis, there was no excessive force. It converts a lawful seizure into an unlawful one by importing the unlawfulness of a separate act. That is doctrinally incoherent: as petitioner&#x27;s counsel put it, &quot;there is something very incongruous about holding an officer liable for a use of force that is not excessive at the moment at which it is used, and therefore is reasonable, and therefore, in compliance with the Fourth Amendment.&quot;</p><p>*Second*, the rule effectively creates a new species of constitutional tort—liability for &quot;creating a dangerous situation&quot;—untethered from any particular search or seizure. The Fourth Amendment does not contain a free-floating duty to avoid conduct that might foreseeably escalate into violence. A rule of that generality would sweep in an unlimited range of antecedent police decisions and would subject officers to liability for reasonable, life-preserving reactions to danger.</p><p>*Third*, the rule is unnecessary. Where an officer commits a distinct Fourth Amendment violation—an unlawful entry, for example—§ 1983 already supplies a remedy for the harms proximately caused by *that* violation. The provocation rule is thus an end-run around the settled limits of both the excessive-force standard and ordinary tort causation principles.</p><p>C. Rejecting the provocation rule does not extinguish antecedent violations.</p><p>The second half of the question presented supplies its own answer. Nothing about a later reasonable use of force retroactively cures or negates an earlier warrantless entry. The entry claim and the force claim are independent. Where, as here, an unlawful entry has been established, the plaintiff may recover all damages proximately caused by that unlawful entry. *Cf. Hudson v. Michigan*, 547 U.S. 586, 592–94 (2006) (analyzing the causal relationship between a knock-and-announce violation and the harm alleged, and cautioning against unbounded attenuation). Proximate cause requires &quot;some direct relation between the injury asserted and the injurious conduct alleged,&quot; and asks whether the harm was a foreseeable consequence within the scope of the risk created by the wrong—not whether the wrong was a but-for antecedent in an unbroken chain.</p><p>That is the correct framework for evaluating whether shooting injuries may be recovered as consequential damages of an unlawful entry. It is a causation question, resolved under ordinary tort principles, not a reasonableness question smuggled into the excessive-force analysis.</p><p>III. Application</p><p>A. Liability for the shooting cannot rest on the provocation rule.</p><p>The District Court found that the deputies&#x27; use of force was reasonable. That finding controls the excessive-force claim. Deputy Conley opened a door and perceived a silhouette holding what appeared to be a rifle at close range; he shouted a warning and fired. Whatever may be said of how the deputies came to be standing at that door, the Fourth Amendment permitted the response to the threat as it reasonably appeared at that moment. Having found the force reasonable, the courts below were not free to relabel it unreasonable because of the deputies&#x27; earlier misconduct. The judgment below, insofar as it rests on the provocation rule, cannot stand.</p><p>Respondents&#x27; proposed substitute standard—that &quot;where a government official takes action that foreseeably creates a need for the use of force and results in that use of force, *Graham*/*Scott* balancing should determine whether that action is objectively unreasonable&quot;—fares no better. It is the provocation rule under a different name, and indeed a broader one: it dispenses with the requirement of a predicate constitutional violation and with any mental-state limitation, resting liability instead on foreseeable creation of a &quot;need for force.&quot; That formulation would subject to *Graham* balancing an indeterminate universe of antecedent police decisions—when to approach, whether to wait for backup, how to position officers—none of which is itself a search or seizure. *Graham* balancing is a tool for assessing the reasonableness of a particular intrusion; it is not a general negligence standard for police tactics. Respondents&#x27; invocation of *Kentucky v. King*, 563 U.S. 452 (2011), does not carry the weight placed on it. *King* held that police may rely on exigent circumstances they did not create *by violating the Fourth Amendment*; it addressed the availability of a justification for a warrantless entry, and confirms that the relevant question is whether the officers&#x27; predicate conduct itself violated the Constitution—not that lawful force becomes unlawful when preceded by unlawful conduct.</p><p>We also reject respondents&#x27; suggestion that the deputies were &quot;no different than trespassers&quot; and that this alone resolves the force question. Officers who enter unlawfully are liable for the unlawful entry and its consequences; they do not thereby forfeit the right of self-defense, nor does their trespass transform an objectively reasonable defensive response into a constitutional violation.</p><p>B. The unlawful entry survives, and the causation question remains open.</p><p>The converse proposition, urged as the second half of the question presented, is likewise rejected. The reasonableness of the shooting does not negate, excuse, or absorb the antecedent warrantless entry. That violation was independently established and remains actionable. Petitioner&#x27;s counsel candidly acknowledged as much, conceding that liability may well attach to an officer who &quot;has committed a clearly unconstitutional act, which is not just entering, but also failing to knock and announce,&quot; and that the officer &quot;can be held liable for violating clearly established law . . . and what proximately flows from that.&quot;</p><p>That concession identifies the proper path on remand. The courts below, having taken the provocation shortcut, never conducted a rigorous proximate-cause analysis of the damages flowing from the unlawful entry (and, as found below, the failure to knock and announce). Respondents are entitled to have that analysis performed under settled tort principles: whether the shooting injuries bear a sufficiently direct relation to the entry, and whether they fall within the scope of the risk that the warrant requirement and the knock-and-announce rule exist to guard against. We express no view on how that question should be resolved. We hold only that it must be answered under proximate-cause doctrine rather than by recharacterizing reasonable force as excessive.</p><p>IV. Disposition</p><p>The Ninth Circuit&#x27;s provocation rule is incompatible with this Court&#x27;s excessive-force jurisprudence and is hereby rejected. An officer who uses force that is objectively reasonable at the moment it is employed does not violate the Fourth Amendment, and may not be held liable for excessive force on the theory that an earlier, distinct Fourth Amendment violation provoked the confrontation. At the same time, a subsequent reasonable use of force does not negate or extinguish a prior unlawful entry; liability for that violation persists, and damages are available for all harms proximately caused by it.</p><p><mark class='err' data-n='3'>The judgment of the Court of Appeals for the Ninth Circuit is REVERSED, and the case is REMANDED for further proceedings consistent with this opinion, including consideration whether the shooting injuries were proximately caused by the warrantless entry.</mark></p><p>RULING: Petitioner</p>", "error": "The Ninth Circuit reversed the district court’s judgment.", "truth": "The U.S. Court of Appeals for the Ninth Circuit affirmed.", "nmarks": 3}, {"id": "C027", "text": "<p><mark class='err' data-n='1'>This case comes to the Court on review of a decision of the United States Court of Appeals for the Second Circuit.</mark> Respondents are Muslim men who were born outside the United States but reside here lawfully. They allege that FBI agents placed them on the No Fly List in retaliation for their refusal, on religious grounds, to act as informants against other Muslims. Respondents maintain that they posed no threat to aviation and that the listing caused them substantial personal, professional, and financial injuries.</p><p>Respondents sued the agents in their official and individual capacities under the First and Fifth Amendments, the Administrative Procedure Act, and the Religious Freedom Restoration Act of 1993 (RFRA).<mark class='tru' data-n='2'> The United States District Court dismissed their claims against the agents.</mark><mark class='tru' data-n='3'> A panel of the Second Circuit reversed.</mark> The court denied rehearing en banc, over the dissent of several judges. One of the agents, Tanzin, then sought review in this Court. We granted review to decide whether RFRA authorizes suits seeking money damages against individual federal employees.</p><p>Governing law</p><p>RFRA provides that the government may not substantially burden a person’s exercise of religion unless applying that burden is the least restrictive means of furthering a compelling governmental interest. 42 U.S.C. § 2000bb-1. The statute further provides:</p><p>&gt; A person whose religious exercise has been burdened in violation of this section may assert that violation as a claim or defense in a judicial proceeding and obtain appropriate relief against a government.</p><p>RFRA defines “government” to include a branch, department, agency, instrumentality, and official of the United States, as well as any other person acting under color of law.</p><p>The statutory text supplies both a cause of action and a remedy. “Appropriate relief” is a broad phrase. Nothing in RFRA limits that phrase to equitable relief, nor does the statute distinguish between suits against officials in their official capacities and suits against them in their individual capacities. When Congress intends to restrict a remedy to equitable relief or to official-capacity defendants, it knows how to say so. RFRA contains no such limitation.</p><p>A personal-capacity suit seeks relief from the individual defendant for actions taken under color of law. It does not impose liability on the United States Treasury and does not implicate sovereign immunity in the same manner as a suit seeking damages from the Government itself. Thus, the fact that RFRA authorizes relief “against a government” does not foreclose a damages action against an individual official who acted under color of federal law.</p><p>Application</p><p>The agents contend that “appropriate relief against a government” means only relief available against the Government or its officials in their official capacities, and that money damages are presumptively unavailable absent an express reference to damages. That reading is inconsistent with RFRA’s text.</p><p>First, the statute expressly encompasses an “official of the United States” and “other person acting under color of law.” Those terms naturally include an individual government employee sued for his own conduct. The statute does not say that such an official may be sued only in an official capacity. Nor does it state that appropriate relief means “appropriate equitable relief,” even though Congress has used that formulation in other statutes.</p><p>Second, damages can be “appropriate relief” under RFRA. Some violations of religious exercise are completed before a court can issue an injunction. A destroyed religious text, a compelled religious violation, or a lost job or educational opportunity may not be remedied by prospective relief. A categorical rule barring damages would therefore deny meaningful relief for some RFRA violations, despite the statute’s instruction that a prevailing person may obtain appropriate relief.</p><p>Third, the availability of a damages remedy does not require treating this case as a judicially implied constitutional action of the sort addressed in Bivens. Congress enacted an express cause of action and expressly authorized “appropriate relief.” The Court’s task is therefore to determine the scope of the remedy Congress provided, not to create a cause of action where Congress supplied none.</p><p>The Government’s reliance on sovereign immunity and the general reluctance to expose federal employees to personal liability does not alter the result. Those principles may limit suits against the United States or the Government itself, but they do not rewrite RFRA’s remedial language or transform a personal-capacity action into an official-capacity action. Nor does the possibility of qualified immunity justify eliminating damages at the threshold. Qualified immunity may protect an individual official if the official’s conduct did not violate clearly established law, but that defense is distinct from the statutory question presented here and can be addressed on remand.</p><p>Finally, the Government’s policy concerns about chilling federal employees, particularly in national-security contexts, cannot overcome clear statutory text. RFRA reflects Congress’s judgment that government action substantially burdening religious exercise must satisfy the statute’s demanding standard. The possibility that a damages remedy may create litigation or impose costs on officials is not a basis for adding limitations that Congress did not include.</p><p>Accordingly, RFRA permits a person whose religious exercise has been unlawfully burdened to seek money damages against an individual federal employee sued in the employee’s personal capacity, subject to any applicable defenses, including qualified immunity.</p><p><mark class='err' data-n='4'>The judgment of the Second Circuit is affirmed, and the case is remanded for further proceedings.</mark></p><p>RULING: Respondent</p>", "error": "A panel of the U.S. Court of Appeals for the Second Circuit affirmed the District Court's dismissal.", "truth": "A panel of the U.S. Court of Appeals for the Second Circuit reversed the District Court's dismissal.", "nmarks": 4}, {"id": "C028", "text": "<p>Opinion of the Court</p><p>I. Procedural History</p><p>Betty Dukes and five other women brought this action against Wal-Mart, alleging that its nationwide employment practices caused women to receive lower pay and fewer or delayed promotions compared with similarly situated men. They sought to represent a class comprising all women employed by Wal-Mart nationwide at any time after December 26, 1998—an estimated class of more than 1.5 million employees.</p><p>The District Court certified the nationwide class under Federal Rule of Civil Procedure 23(b)(2). In addressing the requested backpay remedy, the court contemplated resolving classwide liability and then using statistical or formula-based procedures rather than conducting individualized proceedings for each claimant.<mark class='tru' data-n='1'> The United States Court of Appeals for the Ninth Circuit upheld class certification, ultimately doing so three times.</mark></p><p>Wal-Mart petitioned for review, contending that the named plaintiffs failed to establish the commonality and related cohesion required by Rule 23(a), and that claims for individualized backpay could not properly be maintained as a mandatory, non-opt-out class under Rule 23(b)(2). We granted review to determine whether the small group of named plaintiffs may represent the nationwide class described above.</p><p>II. Governing Law</p><p>A party seeking class certification must affirmatively satisfy every applicable requirement of Rule 23. Under Rule 23(a), the proposed class must meet the requirements of numerosity, commonality, typicality, and adequacy of representation. Numerosity alone is not enough. Nor does the mere existence of questions shared at a high level of generality establish commonality.</p><p>Commonality requires a common contention whose truth or falsity will resolve an issue central to every class member’s claim in one stroke. In an employment-discrimination action, it is not sufficient to ask generally whether the employer discriminated against women. The plaintiffs must identify a common employment practice and offer significant proof that the challenged practice operated in a common discriminatory manner across the proposed class. A district court must conduct the rigorous analysis necessary to determine whether that requirement has been met, even when the certification inquiry overlaps with the merits.</p><p>An employer’s delegation of subjective discretion may, in an appropriate case, support class treatment. But delegation alone does not establish a common discriminatory practice. Where thousands of managers exercise discretion in different stores, departments, and employment circumstances, the plaintiffs must supply a sufficient evidentiary basis for concluding that the discretion was exercised according to a common mode that produced the same legally relevant injury.</p><p>Rule 23(b)(2), meanwhile, applies when a defendant has acted or refused to act on grounds generally applicable to the class, such that final injunctive or corresponding declaratory relief is appropriate for the class
