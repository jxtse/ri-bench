 Petitioner&#x27;s case.<mark class='err' data-n='9'> The Department argues that because a beneficiary is, under trust law, the &quot;true owner&quot; of trust income and the very &quot;heart&quot; of the trust, the State&#x27;s protection of its residents supplies the requisite contacts, and a pro rata tax on trust income comports with due process.</mark> The Department also invokes its reading of *Stewart*, suggesting this Court affirmed a tax on beneficial interests even absent receipt of actual income.</p><p>These arguments have force as a matter of trust formalism, but they prove too much. The Petitioner&#x27;s categorical rule would permit taxation whenever an in-state beneficiary exists, without regard to whether that beneficiary has any present entitlement to, control over, or receipt of the taxed income. Neither *Brooke*, nor *Greenough*, nor *Curry* sustains so broad a proposition: each involved a present vested right or actual enjoyment, not a mere possibility of future receipt. And *Safe Deposit* squarely forecloses the Petitioner&#x27;s position where, as here, the beneficiary&#x27;s interest in the accumulated income during the tax years was contingent on the trustee&#x27;s future exercise of discretion. The Petitioner&#x27;s reliance on the beneficiary&#x27;s formal status under the trust instrument, and its observation that under Section 1.2 of the instrument the children &quot;may also receive distributions,&quot; underscores rather than cures the defect: a possibility of future distribution is not a present right.<mark class='err' data-n='10'> The argument that the beneficiary is &quot;part of the trust&quot; is unpersuasive because due process protects against taxation absent a concrete relationship between the taxpayer, the taxed property, and the State—not against taxation absent some abstract linkage.</mark></p><p>B. The Respondent&#x27;s case. The Trust counters that during the tax years the income was not in any meaningful sense Kaestner&#x27;s. She did not possess or control it; she could not access, use, or pledge it; she had no say in its investment; she received nothing; and she had no guarantee she would ever receive a penny of it, in North Carolina or elsewhere. The trustee, subject to fiduciary duties, possessed the funds, could buy and sell property with them, incur liability, and enter contracts—the indicia of ownership this Court has long recognized. The tax was thus premised on a prediction—that the beneficiary would someday, somewhere, receive the money—that was at the time of taxation unknown and unknowable.</p><p>This argument is the stronger one, and it aligns squarely with *Safe Deposit* and the principles underlying *Quill* and *International Shoe*. During the 2005–2008 tax years, Kaestner&#x27;s residency was the only connection North Carolina could claim.<mark class='tru' data-n='11'> The trustee resided in Connecticut; the trust was created in New York and administered outside North Carolina; the trust&#x27;s documents and assets were located outside the State; no distributions were made to Kaestner.</mark> Her interest in the accumulated income was contingent on the trustee&#x27;s discretion, and the class of potential recipients, their identities, and their future domiciles were all unknown. A tax imposed on the prediction of future receipt—without any present right, receipt, or control—does not rest on the kind of definite, concrete relationship between the State and the taxed property that due process demands. The State&#x27;s protection of its residents, standing alone and divorced from any actual benefit to, or exercise of power over, the taxed income, is insufficient.</p><p>We need not and do not hold that a beneficiary&#x27;s in-state residency can never support taxation. Where a beneficiary has a present vested right to income, receives distributions, or exercises control, the analysis may well differ.<mark class='err' data-n='12'> We hold only that the Due Process Clause does not permit a State to tax income accumulated in trust, of which the beneficiary received nothing and to which she had no present right, based solely on the fact that the beneficiary resided in the State.</mark></p><p>IV. Disposition</p><p><mark class='err' data-n='13'>The judgment of the court below upholding the tax on the ground that beneficiary domicile alone supplied adequate contacts is reversed.</mark> The statute, as applied to these tax years, violates the Due Process Clause, and the Trust is entitled to the refund of taxes paid. The cause is remanded for further proceedings not inconsistent with this opinion.</p><p>RULING: Respondent</p>", "error": "The state appellate court reversed and held that a beneficiary’s domicile alone supplied adequate contacts to tax the Trust.", "truth": "The state appellate court found that a beneficiary’s North Carolina domicile alone did not establish sufficient contacts to tax the out-of-state Trust.", "nmarks": 13}, {"id": "C078", "text": "<p>OPINION OF THE COURT</p><p>I. Procedural History</p><p>This case arrives on direct appeal from a three-judge district court convened under 28 U.S.C. § 2284 to hear a challenge to Alabama&#x27;s 2021 congressional redistricting plan for the State&#x27;s seven seats in the United States House of Representatives.</p><p>Following the 2020 census, Alabama enacted a plan containing a single majority-Black district. A group of registered voters and several organizations sued, alleging that the plan violates Section 2 of the Voting Rights Act by packing Black voters into one district while cracking other concentrations of Black voters — principally in the Black Belt — across multiple districts, so as to minimize the number of districts in which Black voters can elect candidates of their choice.</p><p><mark class='tru' data-n='1'>After a preliminary-injunction hearing, the three-judge court found that the plaintiffs were likely to succeed on their Section 2 claim and granted a preliminary injunction directing the State to draw a new map.</mark><mark class='err' data-n='2'> Alabama applied to this Court to stay that injunction.</mark> The Court granted the stay by a 5–4 vote pending resolution of the merits, and the case is now before us on the merits.</p><p>One preliminary matter requires comment. Counsel for petitioner, in the excerpts submitted to this Court, at one point asserts that &quot;[t]he three-judge district court denied the challengers&#x27; request for a preliminary injunction and left Alabama&#x27;s map in place,&quot; and that &quot;[t]hat refusal was error.<mark class='tru' data-n='3'>&quot; That statement is flatly contrary to the record.</mark><mark class='tru' data-n='4'> The district court granted the injunction; indeed, the very existence of Alabama&#x27;s stay application — and of this appeal — presupposes as much.</mark> Petitioner&#x27;s remaining submissions are consistent with the actual posture, repeatedly invoking the deference owed to the district court&#x27;s findings under clear-error review. We treat the contrary passage as an error of transcription or drafting by counsel, and we decide the case on the record as it is, not as it was misdescribed. We note, however, that the mistake is not costless: it obscured the posture-specific question actually before us, which is not whether the plaintiffs have proved a violation after final judgment but whether the district court permissibly found a likelihood of success.</p><p>II. Governing Law</p><p>Section 2 of the Voting Rights Act, as amended in 1982, prohibits any voting standard, practice, or procedure that &quot;results in a denial or abridgement of the right of any citizen of the United States to vote on account of race or color.&quot; A violation is established if, &quot;based on the totality of circumstances,&quot; the political processes &quot;are not equally open to participation&quot; by members of a protected class in that its members &quot;have less opportunity than other members of the electorate to participate in the political process and to elect representatives of their choice.&quot;</p><p>Two features of that text govern this case. First, the 1982 amendment deliberately replaced an intent requirement with a results test. Congress acted against the backdrop of *City of Mobile v. Bolden* and legislated to make discriminatory purpose unnecessary. Second, the statute itself supplies the comparison the inquiry demands — minority voters&#x27; opportunity measured against that of &quot;other members of the electorate.&quot;</p><p>*Thornburg v. Gingles* supplies the framework that has governed for four decades. A plaintiff must show (1) that the minority group is &quot;sufficiently large and geographically compact to constitute a majority in a reasonably configured district&quot;; (2) that the group is politically cohesive; and (3) that the majority votes sufficiently as a bloc usually to defeat the minority&#x27;s preferred candidate. Satisfying the preconditions is necessary but not sufficient; the court must then conduct a searching, &quot;intensely local appraisal&quot; of the totality of the circumstances, guided by the Senate Factors and informed by proportionality, *Johnson v. De Grandy*, and by the legitimate state interests emphasized in *Brnovich v. DNC*.</p><p>Three doctrinal points bear emphasis.</p><p>Reasonable configuration is not perfection, and it is not a race-blindness requirement. An illustrative plan must respect traditional districting criteria — compactness, contiguity, respect for political subdivisions and communities of interest — sufficiently that the district could plausibly be drawn. But the plan is illustrative, not remedial. It need not be the map the State must adopt, and the plaintiff need not show that the district would emerge by accident.</p><p>Awareness of race is not predominance. The *Shaw*/*Miller* line condemns maps in which race is &quot;the predominant factor&quot; to which traditional criteria are &quot;subordinated.&quot; Consciousness of race in service of compliance with the Voting Rights Act is not itself unconstitutional. *Cooper v. Harris* and *Bethune-Hill* confirm both the standard and the appellate posture: while the legal standard is reviewed de novo, the determination whether race in fact predominated is a finding of fact reviewed only for clear error.</p><p>Clear-error review governs the Gingles findings. *Gingles* and *Anderson v. Bessemer City* make this explicit. Where two permissible views of the evidence exist, the fact-finder&#x27;s choice between them cannot be clearly erroneous.</p><p>Finally, statutory stare decisis carries unusual force here. Congress has twice reenacted and amended the Voting Rights Act since *Gingles* without disturbing its framework.</p><p>III. Application</p><p>Alabama does not principally contend that it prevails under Section 2 as this Court has applied it for forty years. It contends that the law should change: that a plaintiff must show a second majority-Black district would emerge from a race-neutral benchmark — the map a neutral map drawer, aided by computer simulations, would produce — and that because Alabama&#x27;s plan is the product of neutral principles (chiefly core retention and preservation of the Gulf community of interest), it is by definition &quot;equally open.&quot; We address that argument, then the State&#x27;s narrower claims of legal error, then the record.</p><p>A. The race-neutral benchmark</p><p>The proposed benchmark cannot be reconciled with the statute&#x27;s text. Section 2 asks whether the political processes are &quot;equally open&quot; and whether minority voters &quot;have less opportunity.&quot; Those are outcome-directed inquiries. A test asking what a hypothetical neutral cartographer would have drawn is, as petitioner correctly observes, an inquiry into the motives and purposes animating the line-drawing. It would restore, in substance, the intent test that Congress removed in 1982 — a State could immunize a dilutive map merely by showing its drafters proceeded without conscious racial design. Congress rejected precisely that.</p><p>The benchmark also fails on its own terms. The State disclaims any requirement of simulations, but its position collapses into them: absent an algorithmic baseline, &quot;what a neutral map drawer would do&quot; is not a standard but a slogan. And the simulation evidence in this record demonstrates why it cannot bear the weight the State places on it. As petitioner explained without effective rebuttal, simulated map sets are the product of a cascade of subjective choices — which criteria to encode; how to quantify inexact concepts like compactness and communities of interest; how to weight competing criteria; how many maps constitute a sufficient ensemble; and how to read the resulting distribution. A computer-scientist amicus observes that the space of possible configurations runs to trillions. An ensemble is only as neutral as the judgments embedded in it. Calling the output an &quot;objective benchmark&quot; mistakes the formalism for objectivity.</p><p>The State&#x27;s own account of Dr. Imai&#x27;s third ensemble illustrates the difficulty rather than dispelling it. Alabama emphasizes that when the expert was instructed to guarantee one narrowly majority-Black district and then prioritize the Gulf and Black Belt groupings, the second-highest district averaged roughly 36% Black voting-age population. But that result is a function of the instructions given — beginning by fixing a single 50–51% district and then optimizing for particular county groupings is a set of constraints, not a neutral state of nature. A benchmark whose output turns so visibly on its inputs cannot be the touchstone of statutory liability.</p><p>Nor is the benchmark necessary to avoid constitutional difficulty. Petitioner identifies, correctly, several existing safeguards. The first *Gingles* precondition already requires reasonable configuration, screening out the bizarre districts condemned in *Shaw*. The *Shaw*/*Miller* line independently polices predominance at the remedial stage. And a State retains latitude in choosing among lawful remedies; the illustrative plan does not bind it. Alabama&#x27;s contention that Section 2 is &quot;at war with&quot; the Equal Protection Clause rests on equating any consideration of race with unconstitutional action — a proposition this Court&#x27;s careful predominance line has always rejected.</p><p>We acknowledge the force of the State&#x27;s practical concern, pressed through the Louisiana example, that States may feel whipsawed between Section 2 and the Equal Protection Clause. That concern is real and deserves candor. But it is a concern about the administration of remedies at the margins, not a reason to rewrite the liability standard. The State&#x27;s proposed cure — a benchmark that would permit the dismantling of long-standing majority-minority districts wherever a simulation failed to generate them by chance — would work a far greater disruption than the disease.</p><p>B. The claimed legal errors</p><p><mark class='err' data-n='5'>Alabama argues that the district court committed legal error at *Gingles* 1 by excusing plaintiffs from accounting for all traditional districting criteria, particularly core retention, and by finding no racial predominance.</mark></p><p>Core retention is a legitimate redistricting goal, as *Karcher* recognized, and *Abrams v. Johnson* shows a court may weigh it. But *Abrams* arose in a distinct posture: a federal court drawing a remedial plan after *Miller* had invalidated a racially gerrymandered map, where deference to the State&#x27;s prior choices carried particular force. It did not hold that every traditional criterion must be satisfied in every illustrative plan, still less that a State may elevate core retention into a categorical defense. Were it otherwise, core retention would become a ratchet: a State that once drew a dilutive map could preserve it indefinitely by pleading fidelity to its own prior lines. Section 2&#x27;s results test does not permit a State to insulate present dilution by invoking the durability of the arrangement producing it.</p><p>The predominance argument fares no better. Alabama invokes *Bethune-Hill* and *ALBC* for de novo review, but those cases establish de novo review of the legal standard; *Cooper v. Harris* holds squarely that whether race in fact predominated is a factual question reviewed for clear error. The district court applied the correct standard and found race did not predominate.<mark class='err' data-n='6'> Alabama offers no showing that the finding was clearly erroneous — only the assertion that the illustrative districts &quot;arch across the state,&quot; which is an argument about compactness that the district court considered and resolved on the evidence.</mark></p><p>C. The record</p><p>On the findings actually made below, this is not a close case under existing law.</p><p><mark class='err' data-n='7'>The district court found that voting in Alabama is intensely racially polarized, among the starkest in the nation, satisfying *Gingles* 2 and 3.</mark> It found the history and continuing effects of official racial discrimination severe. It found Black Alabamians significantly underrepresented: roughly 27% of the population, with one of seven seats — well short of proportionality under *De Grandy*. It found the Black Belt a historic, cohesive, and economically distinctive community of interest that Alabama&#x27;s plan cracks. And it found, after applying multiple accepted compactness metrics, that the illustrative plans performed as well as or better than the enacted plan on nearly all relevant traditional criteria — a point the State&#x27;s counsel came close to conceding.</p><p>Alabama&#x27;s principal factual rejoinder is the Gulf community of interest and the division of Mobile County. The district court considered that interest and found it did not outweigh the cracking of the Black Belt — itself an undisputed community of interest of at least equal historical pedigree. That is the &quot;intensely local appraisal&quot; Section 2 demands. It is the kind of judgment *Anderson* commits to the fact-finder, and the choice between two permissible readings of conflicting evidence about competing communities of interest is not clear error.</p><p>Alabama&#x27;s evidence about increased Black registration and turnout is genuine and creditable, and it properly bears on the totality of the circumstances. But turnout is not opportunity to elect. Where voting is as polarized as the court found it here, high Black turnout produces defeat with regularity rather than representation. As petitioner aptly put it, invoking *Brnovich*, Section 2 looks to the totality of the circumstances — not the totality of one.</p><p>We emphasize the posture. We do not hold that Alabama must adopt any particular map, nor that proportionality is required, nor that Section 2 mandates maximization — *De Grandy* forecloses the last, and nothing in our holding disturbs it. We hold only that the district court applied the correct legal framework and that its findings, reviewed with the deference the law requires, amply support its conclusion that plaintiffs are likely to succeed on the merits.</p><p>IV. Disposition</p><p><mark class='err' data-n='8'>The judgment of the three-judge district court granting a preliminary injunction is affirmed.</mark> The stay previously entered by this Court is vacated, and the case is remanded for further proceedings consistent with this opinion.</p><p>RULING: Petitioner</p>", "error": "The three-judge district court denied the challengers’ request for a preliminary injunction and left Alabama’s map in place.", "truth": "The three-judge district court granted a preliminary injunction ordering Alabama to draw a new congressional map.", "nmarks": 8}, {"id": "C079", "text": "<p>IN THE SUPREME COURT OF THE UNITED STATES</p><p>*United States, Petitioner, v. Maurice Lamont Davis and Andre Levon Glover, Respondents.*</p><p>---</p><p>I. Procedural History</p><p>On November 19, 2015, juries in the United States District Court for the Northern District of Texas found respondents Maurice Lamont Davis and Andre Levon Glover guilty on multiple counts, including two counts of violating 18 U.S.C.<mark class='tru' data-n='1'> § 924(c): illegal use or carrying of a firearm in relation to a crime of violence (Hobbs Act robbery), and illegal use or carrying of a firearm to aid and abet a conspiracy to commit a crime of violence.</mark><mark class='tru' data-n='2'> Respondents appealed, and on January 31, 2017, the Fifth Circuit issued an opinion denying their challenges and affirming the district court&#x27;s judgment in full.</mark></p><p>Respondents petitioned this Court for certiorari. Following our decision in *Sessions v. Dimaya*, 584 U.S.<mark class='tru' data-n='3'> ___ (2018), we granted certiorari, vacated the judgment, and remanded to the Fifth Circuit for further consideration in light of that decision.</mark><mark class='err' data-n='4'> On remand, after supplemental briefing, the Fifth Circuit held that the residual clause of § 924(c)(3)(B) was unconstitutional under *Dimaya*, but upheld the subsection on an alternative ground—that a &quot;crime of violence&quot; under § 924(c) could be assessed by reference to the specific conduct in which the defendant engaged, rather than by the categorical approach applied to the offense&#x27;s elements.</mark><mark class='tru' data-n='5'> On that basis, the Fifth Circuit affirmed its prior judgment as to the Hobbs Act robbery count (which was independently sustainable under § 924(c)(3)(A), the elements clause) but affirmed the aiding-and-abetting-conspiracy count, the predicate for which was established only through the residual clause.</mark></p><p><mark class='tru' data-n='6'>The United States petitioned for certiorari on the question whether § 924(c)(3)(B)—the residual clause defining a &quot;crime of violence&quot; for purposes of a § 924(c) prosecution—is unconstitutionally vague.</mark> We granted certiorari.</p><p>II. Governing Law</p><p>A. The Void-for-Vagueness Doctrine. The Due Process Clause of the Fifth Amendment guarantees that criminal statutes provide fair notice of the conduct they prohibit and supply determinate standards to prevent arbitrary and discriminatory enforcement. *Johnson v. United States*, 576 U.S. 591 (2015). A statute is unconstitutionally vague when it &quot;fails to provide ordinary people fair notice of the conduct it punishes&quot; or &quot;is so standardless that it invites arbitrary enforcement.&quot;</p><p>B. *Johnson* and *Dimaya*.<mark class='tru' data-n='7'> In *Johnson*, this Court held that the residual clause of the Armed Career Criminal Act, which defined &quot;violent felony&quot; as an offense that &quot;involves conduct that presents a serious potential risk of physical injury to another,&quot; was unconstitutionally vague because it combined an &quot;ordinary case&quot; categorical inquiry with &quot;an ill-defined and largely unbounded&quot; risk assessment, leaving judges and juries to &quot;reach significantly different results&quot; on materially identical facts.</mark> In *Dimaya*, we extended that reasoning to 18 U.S.C. § 16(b), a residual clause containing language materially indistinguishable from the ACCA residual clause, in the immigration-removal context.</p><p>C. Section 924(c)(3). Section 924(c) criminalizes using or carrying a firearm during and in relation to a &quot;crime of violence,&quot; and imposes a mandatory consecutive sentence for that conduct. Subsection (3)(A) supplies the elements clause: an offense is a crime of violence if it &quot;has as an element the use, attempted use, or threatened use of physical force against the person or property of another.&quot; Subsection (3)(B) supplies the residual clause: an offense qualifies if it &quot;by its nature, involves a substantial risk that physical force against the person or property of another may be used in the course of committing the offense.&quot; As the parties and the Fifth Circuit agree, the words &quot;by its nature&quot; compel a categorical approach: courts must ask whether the *offense*, as defined by its elements in the ordinary case, poses the requisite risk—not whether this particular defendant&#x27;s conduct did so. *See Taylor v. United States*, 495 U.S. 575 (1990).</p><p>III. Application</p><p>A. The residual clause of § 924(c)(3)(B) is void for vagueness. The inquiry under (3)(B) presents precisely the same two defects that doomed the residual clauses in *Johnson* and *Dimaya*. First, the phrase &quot;by its nature&quot; requires a court to picture the kind of conduct that the offense *ordinarily* involves—an exercise in judicial imagination about hypothetical offenders, not a factual finding about the actual one. Second, the clause requires a court to estimate the &quot;substantial risk&quot; that physical force &quot;may be used&quot; in the course of committing an offense—a speculative, open-ended inquiry offering no determinate benchmark. As in *Johnson* and *Dimaya*, reasonable judges reviewing materially identical records will reach divergent conclusions about whether a given predicate offense involves the requisite risk, and that indeterminacy produces arbitrary and unpredictable outcomes in the administration of a statute that imposes a mandatory minimum prison term.</p><p>Petitioner concedes, as it must, that the statutory language is materially indistinguishable from the ACCA and § 16(b) residual clauses invalidated in *Johnson* and *Dimaya*. Its central contention is instead that the narrower context of § 924(c)—which applies only in federal criminal prosecutions, rather than to sentencing enhancements generally or to removal proceedings—cures the vagueness. We disagree. The vice identified in *Johnson* inheres in the *language* of the clause itself and in the categorical inquiry it mandates, not in the breadth of the population it covers. Whether a statute applies to ten defendants or ten thousand, a judge sentencing under it must still perform the same ill-defined imaginative exercise, and a defendant subject to a mandatory consecutive sentence for a § 924(c) offense has an even stronger interest in fair notice and determinate application than an offender facing an enhanced guideline range. Context narrows the class of cases; it does not supply the missing standard.</p><p>B. A conduct-based construction is unavailable. Petitioner argues, in the alternative, that the constitutional difficulty could be avoided by reading § 924(c)(3)(B) to permit a circumstance-specific inquiry into the defendant&#x27;s actual conduct. But this construction is foreclosed by the statutory text. The words &quot;by its nature&quot; direct the court to the offense as defined, not to the facts of the defendant&#x27;s case. Under the constitutional-avoidance canon, a court may adopt a narrowing construction only when the statutory text is &quot;genuinely susceptible&quot; of it; it may not rewrite a statute to rescue it from constitutional doubt. Moreover, as respondent persuasively observes, a conduct-based approach would raise the very Sixth Amendment concerns the categorical approach was adopted to avoid: it would make guilt on a § 924(c) count turn on disputed facts about how a *particular* defendant acted—facts that under *Apprendi v. New Jersey*, 530 U.S. 466 (2000), must be found by a jury beyond a reasonable doubt, yet would here be resolved by judicial guesswork on a preponderance record. Petitioner&#x27;s proposed reading thus trades vagueness for a different constitutional defect, and it is not the reading the statute bears.</p><p>C. The common history of the provisions confirms the result. Respondent&#x27;s second point—that § 924(c)(3)(B) shares a common drafting history with the ACCA residual clause invalidated in *Johnson*—is well taken and reinforces the textual conclusion. Congress drew the language from the same well; the same words carry the same constitutional infirmity.</p><p>D. What survives. Our holding is confined to § 924(c)(3)(B). The elements clause in § 924(c)(3)(A)—which asks whether the offense &quot;has as an element the use, attempted use, or threatened use of physical force&quot;—defines crimes of violence by reference to the elements of the charged offense, an objective and determinate inquiry, and is not before us as a matter of challenge. Thus, convictions such as respondents&#x27; Hobbs Act robbery count, sustainable under the elements clause, remain unaffected.</p><p>E. Assessment of the parties&#x27; submissions. Petitioner&#x27;s strongest point—that Congress in 1986 did not focus on the choice between categorical and circumstance-specific approaches—is candidly conceded, but it cannot save the statute; that Congress did not contemplate the problem is precisely why the clause as written invites the arbitrary adjudication the Due Process Clause forbids. Petitioner&#x27;s fallback demand that respondents show that the categorical approach is the &quot;only plausible construction&quot; inverts the burden: the government, not the defendant, must ensure that a criminal statute provides fair notice and determinate application. Respondent&#x27;s arguments, by contrast, track the reasoning of *Johnson* and *Dimaya* at every step: identical language, shared history, and the unavailability of a conduct-based saving construction. We find them persuasive on all three points.</p><p>IV. Disposition</p><p>For the foregoing reasons, the residual clause of 18 U.S.C.<mark class='tru' data-n='8'> § 924(c)(3)(B) is unconstitutionally vague, and the judgment of the Fifth Circuit upholding the residual clause and affirming respondents&#x27; convictions on the aiding-and-abetting-conspiracy counts under § 924(c) is reversed.</mark><mark class='tru' data-n='9'> That portion of the Fifth Circuit&#x27;s judgment affirming the Hobbs Act robbery counts—supported by the elements clause of § 924(c)(3)(A), which is unaffected by this opinion—is affirmed.</mark> The case is remanded for further proceedings consistent with this opinion.</p><p>It is so ordered.</p><p>RULING: Respondent</p>", "error": "On remand, the Fifth Circuit upheld 18 U.S.C. § 924(c)(3)(B)'s residual clause as constitutional and affirmed the aiding-and-abetting conspiracy conviction.", "truth": "On remand, the Fifth Circuit held 18 U.S.C. § 924(c)(3)(B)'s residual clause unconstitutionally vague and vacated the aiding-and-abetting conspiracy conviction, while affirming the Hobbs Act robbery conviction.", "nmarks": 9}, {"id": "C080", "text": "<p>Procedural History</p><p>Benjamin Carter, a former employee of Kellogg Brown &amp; Root (KBR), filed this qui tam action in 2006 under the False Claims Act (FCA), alleging that KBR maintained a policy of submitting fraudulent timesheets and thereby overbilling the United States for services performed in Iraq. Shortly before trial in 2010, the Government identified an earlier-filed action alleging related fraud.<mark class='err' data-n='1'> The District Court dismissed Carter’s action under the FCA’s first-to-file bar.</mark></p><p>Carter filed a new complaint in 2011. KBR moved to dismiss on two grounds: that the action was untimely under the FCA’s limitations period and that another related qui tam action remained pending when Carter filed.<mark class='err' data-n='2'> The District Court dismissed the refiled complaint.</mark><mark class='tru' data-n='3'> The Court of Appeals for the Fourth Circuit reversed, concluding that the Wartime Suspension of Limitations Act (WSLA) did not apply to civil FCA claims and that, because the related actions had since been dismissed, the first-to-file rule did not bar Carter’s suit.</mark> This Court granted review.</p><p>Governing Law</p><p>The WSLA suspends the running of limitations periods applicable to an “offense” involving fraud against the United States during specified wartime periods. 18 U.S.C. § 3287. In statutory context, however, “offense” in § 3287 refers to a criminal offense. The statute appears in Title 18’s criminal-procedure provisions; its operative terms—such as “indictable,” “prosecuted,” and the surrounding limitations provisions—are criminal in character; and its history does not establish that Congress silently transformed a wartime criminal limitations statute into an extraordinary tolling rule for civil fraud actions.</p><p>The Court therefore holds that the WSLA applies only to criminal offenses. It does not suspend the limitations period for a civil FCA action brought either by the Government or by a private relator. This construction also avoids an implausible result: civil liability for conduct occurring during a wartime authorization could otherwise remain effectively unbounded for years after the conduct, without the ordinary civil limitations rules Congress specifically enacted for FCA litigation.</p><p>The FCA’s first-to-file provision states: “When a person brings an action under this subsection, no person other than the Government may intervene or bring a related action based on the facts underlying the pending action.” 31 U.S.C. § 3730(b)(5). The provision’s plain language makes pendency the relevant condition. A later related action is barred while an earlier related action remains pending. Once the earlier action has been dismissed, however, it is no longer a “pending action,” and the text no longer prohibits a later relator from filing a related case.</p><p>The first-to-file rule thus establishes a one-case-at-a-time rule, not a forever-bar. Other doctrines—including claim preclusion where applicable, the FCA’s limitations provisions, and the Government’s substantial authority to intervene in or dismiss qui tam litigation—remain available to prevent repetitive or abusive suits.</p><p>Application to the Record</p><p>Carter seeks civil remedies under the FCA for alleged fraudulent billing by KBR. His action is not a criminal prosecution. Accordingly, the WSLA cannot be invoked to suspend the FCA’s limitations period merely because the alleged fraud occurred during military operations in Iraq. Whether Carter’s 2011 complaint was timely must therefore be evaluated under the FCA’s own limitations rules, without WSLA tolling.</p><p>KBR is correct that the Court of Appeals could not rely on the WSLA to preserve a civil FCA claim. To the extent the court below treated the WSLA as applicable to civil fraud litigation, that conclusion was erroneous.</p><p>KBR does not prevail, however, on its proposed permanent reading of the first-to-file bar. The statute prohibits a related action only when it is filed while a prior related action is pending. The related suits that had previously impeded Carter’s case had been dismissed by the time relevant to the refiled complaint. Their prior existence, standing alone, did not permanently disable Carter from bringing a later action. The first-to-file provision therefore did not require dismissal on that basis.</p><p>Disposition</p><p>The judgment of the Court of Appeals is vacated insofar as it is inconsistent with the holding that the WSLA does not apply to civil FCA claims. The case is remanded for further proceedings to determine the timeliness of Carter’s complaint under the FCA’s applicable limitations provisions.<mark class='err' data-n='4'> The Court of Appeals’ conclusion that the first-to-file bar applies only while a related action is pending is affirmed.</mark></p><p>RULING: Petitioner</p>", "error": "The U.S. Court of Appeals for the Fourth Circuit affirmed the district court’s dismissal of Carter’s complaint.", "truth": "The U.S. Court of Appeals for the Fourth Circuit reversed the district court’s dismissal of Carter’s complaint.", "nmarks": 4}, {"id": "C081", "text": "<p>Opinion of the Court</p><p>I. Procedural History</p><p>In 2013, Adaucto Chavez-Meza pleaded guilty to conspiracy and possession with intent to distribute methamphetamine. His advisory Sentencing Guidelines range was 135 to 168 months. The Government recommended a sentence at the bottom of that range, and the District Court imposed a 135-month sentence.</p><p>After the Sentencing Commission amended the Guidelines in 2014, Chavez-Meza became eligible for a reduced sentence under 18 U.S.C. § 3582(c)(2). He requested a reduction to 108 months, the bottom of the amended range. The District Court granted relief but reduced the sentence to 114 months rather than 108 months. Its order, entered on a standard form, stated that the court had taken into account the policy statement in U.S.S.G. § 1B1.10 and the sentencing factors in 18 U.S.C. § 3553(a).</p><p>Chavez-Meza appealed, arguing that the District Court had not adequately explained its selection of 114 months.<mark class='tru' data-n='1'> The United States Court of Appeals for the Tenth Circuit affirmed, holding that the District Court’s statement that it had considered the relevant statutory and Guidelines factors was sufficient.</mark> We granted review to resolve whether § 3582(c)(2) invariably requires a further explanation when a court does not grant a proportional reduction, or whether the form order used here can suffice.</p><p><mark class='err' data-n='2'>The briefs contain an isolated assertion that the Tenth Circuit “reversed” the sentence-reduction order.</mark><mark class='tru' data-n='3'> That assertion conflicts with the stipulated procedural history, which establishes that the Tenth Circuit affirmed.</mark> We therefore proceed on the record rather than counsel’s mistaken characterization.</p><p>II. Governing Law</p><p>Section 3582(c)(2) permits a district court to reduce a term of imprisonment when the Sentencing Commission has retroactively lowered the applicable Guidelines range. In deciding whether, and to what extent, to grant a reduction, the court must consider the applicable § 3553(a) factors and act consistently with the Commission’s policy statements.</p><p>A § 3582(c)(2) proceeding is not a plenary resentencing. As recognized in *Dillon v. United States*, it is a limited sentence-modification proceeding. Congress did not import into § 3582(c)(2) every procedural requirement governing an original sentencing. In particular, § 3582(c)(2) does not contain the express statement-of-reasons requirement found in § 3553(c).</p><p>That does not mean explanation is never required. Judicial discretion must rest on a reasoned basis and remain susceptible to appellate review. Under the principle reflected in *Rita v. United States*, the record must contain enough to satisfy a reviewing court that the sentencing judge considered the parties’ arguments and exercised independent legal judgment. The necessary amount of explanation depends on the circumstances. A substantial departure, an unusual case, or a significant nonfrivolous argument may require an express response. Conversely, a routine within-Guidelines determination may be adequately explained by a short order when the judge’s reasoning and consideration of the relevant matters are apparent from the record.</p><p>We therefore reject both categorical extremes. Boilerplate language is not sufficient in every case merely because it recites § 3553(a). But § 3582(c)(2) also does not invariably require a separate narrative explaining why the court selected one point rather than another within the amended range. Nor does the statute create a presumption that a reduction must preserve the defendant’s former relative position within the Guidelines range.</p><p>III. Application</p><p>The District Court acted within the amended Guidelines range and granted Chavez-Meza a substantial reduction—from 135 months to 114 months. The same judge had imposed the original sentence and was familiar with the offense and the prior sentencing record. The written order expressly stated that the court had considered both the applicable § 3553(a) factors and the relevant Sentencing Commission policy statement. Nothing in the record indicates that the court relied on an impermissible consideration, misunderstood the amended range, or failed to recognize its authority to impose the requested 108-month sentence.</p><p>Chavez-Meza’s argument for additional explanation has genuine force. Because the original sentence was at the bottom of the former range while the reduced sentence was above the bottom of the amended range, a brief statement identifying the reason for selecting 114 months would have made appellate review easier. District courts would generally be well advised to provide such a statement.</p><p>But the absence of that additional explanation does not itself establish reversible error. A defendant eligible under § 3582(c)(2) is not entitled to a proportional reduction or to the lowest sentence in the amended range. The selection of 114 months was a routine, lawful, within-range exercise of discretion in an abbreviated proceeding. The record identifies no particular new, material, and nonfrivolous contention that the District Court silently disregarded. A request for the bottom of the amended range, without more, does not compel a factor-by-factor response.</p><p>The respondent’s concern that appellate review will otherwise become meaningless is overstated. Reviewing courts may still determine whether the district court identified the correct range, recognized its discretion, considered the matters the statute requires, relied on permissible factors, and imposed a substantively lawful sentence. If the record suggests legal error, reliance on unsupported facts, or disregard of a substantial argument, a conclusory form may not suffice. This record presents none of those circumstances.</p><p>The petitioner’s broader suggestion that no reasons are required absent an express statutory command is likewise too sweeping. Courts must exercise discretion rationally, and the adequacy of an explanation remains dependent on the record. We uphold this order not because standard-form language is universally sufficient, but because the form, considered together with the nature of this limited proceeding and the existing sentencing record, adequately demonstrates a reasoned exercise of discretion here.</p><p>IV. Disposition</p><p><mark class='tru' data-n='4'>The judgment of the United States Court of Appeals for the Tenth Circuit is affirmed.</mark></p><p>RULING: Petitioner</p>", "error": "The Tenth Circuit reversed the district court’s sentence-reduction order.", "truth": "The Tenth Circuit affirmed the district court’s sentence-reduction order.", "nmarks": 4}, {"id": "C082", "text": "<p>SUPREME COURT OF THE UNITED STATES</p><p>Benisek, et al. v. Lamone, et al.</p><p>---</p><p>Procedural History</p><p>Plaintiffs, registered Republican voters in Maryland&#x27;s Sixth Congressional District, challenged the State&#x27;s 2011 congressional redistricting plan under the First Amendment, alleging that State officials retaliated against them for their prior votes and political association by redrawing the Sixth District to dilute the weight of their votes.<mark class='tru' data-n='1'> Plaintiffs sought a preliminary injunction barring enforcement of the 2011 plan and requiring adoption of a new map in advance of the 2018 midterm elections.</mark></p><p><mark class='tru' data-n='2'>A majority of the three-judge district court panel denied the motion and stayed the case pending this Court&#x27;s decision in *Gill v.</mark> Whitford*.<mark class='tru' data-n='3'> In doing so, the majority reasoned that (1) to establish actual, concrete injury, plaintiffs were required to prove that the 2011 gerrymander had dictated and would continue to dictate the outcome of *every* election held in the district under the map; (2) the burden-shifting framework of *Mt.</mark> Healthy City School District Board of Education v. Doyle* does not apply to First Amendment retaliation challenges to partisan gerrymanders; and (3) the record did not permit a finding that the gerrymander was a but-for cause of Democratic victories in the district in 2012, 2014, or 2016.</p><p>Plaintiffs appealed directly to this Court under 28 U.S.C. § 1253, presenting three questions: whether the district court erred as to each of those holdings.</p><p>A preliminary observation is warranted. In oral argument, counsel for plaintiffs asserted that &quot;the district court granted a preliminary injunction and ordered the State to adopt a new map before the 2018 election,&quot; and asked &quot;for affirmance under the proper legal standards.<mark class='tru' data-n='4'>&quot; That assertion is flatly contrary to the record: the district court majority *denied* the preliminary injunction.</mark> Counsel&#x27;s statement is a misrepresentation of the procedural posture, and it is disregarded. Plaintiffs are appellants from the denial of their motion, and the question is whether that denial should be reversed. The Court also notes, without prejudice to the respondent, that counsel&#x27;s argument in places strayed from the questions presented and into unresponsive exchanges; those remarks carry no weight in the analysis.</p><p>Governing Law</p><p>Standing and injury. Article III requires a concrete, particularized, actual or imminent injury. *Lujan v. Defenders of Wildlife*, 504 U.S. 555 (1992). In the First Amendment retaliation context, a plaintiff suffers cognizable injury when government action burdens the plaintiff&#x27;s protected speech, association, or voting conduct because of its viewpoint. *See Rutan v. Republican Party of Illinois*, 497 U.S. 62 (1990). The injury need not be total exclusion from the franchise; it suffices that the challenged action &quot;operated to disadvantage&quot; the plaintiff&#x27;s exercise of protected rights. *See Anderson v. Celebrezze*, 460 U.S. 780 (1983); *Elrod v. Burns*, 427 U.S. 347 (1976).</p><p>Mt. Healthy burden-shifting. Where a plaintiff shows that constitutionally protected conduct was a &quot;substantial&quot; or &quot;motivating&quot; factor in an adverse government action, the burden shifts to the government to show it would have taken the same action absent the protected conduct. *Mt. Healthy City School District Board of Education v. Doyle*, 429 U.S. 274 (1977); *Reynolds v. Sims*, 377 U.S. 533 (1964) (recognizing but-for causation in the redistricting context). The *Mt. Healthy* framework is a general feature of retaliation analysis, and nothing in the First Amendment&#x27;s application to the ballot distinguishes partisan gerrymandering claims from other retaliation claims in this respect.</p><p>Preliminary injunction standard. A movant must establish that he is likely to succeed on the merits, that he is likely to suffer irreparable harm absent relief, that the balance of equities tips in his favor, and that an injunction is in the public interest. *Winter v. Natural Resources Defense Council*, 555 U.S. 7 (2008). Review of a denial of a preliminary injunction is for abuse of discretion; underlying findings of fact are reviewed for clear error, and legal conclusions de novo. *Glossip v. Gross*, 576 U.S. 863 (2015); *Salazar v. Buono*, 559 U.S. 700 (2010) (plurality opinion).</p><p>Application</p><p>I. The &quot;dictation of every election&quot; standard is erroneous.</p><p><mark class='tru' data-n='5'>The district court majority held that plaintiffs could establish actual, concrete injury only by proving that the 2011 gerrymander dictated, and would continue to dictate, the outcome of *every* election in the district.</mark> That standard is not the law. First Amendment retaliation analysis asks whether the plaintiff&#x27;s protected activity was burdened because of viewpoint — not whether the burden is dispositive in every contest. A rule requiring proof of total electoral domination would immunize from scrutiny any gerrymander imperfect enough to leave a single election&#x27;s outcome uncertain. Retaliation claims elsewhere in the doctrine require no such showing; a plaintiff burdened in the exercise of protected rights suffers injury even if the burden is not always outcome-determinative. The district court erred as a matter of law on this point.</p><p>II. Mt. Healthy burden-shifting applies.</p><p>The majority&#x27;s second holding — that *Mt. Healthy* is inapplicable — must also be rejected. The respondent argues that a First Amendment retaliation theory supplies no manageable standard for &quot;how much politics is too much,&quot; and that discriminatory intent of the sort at issue is &quot;ever present,&quot; as *Davis v. Bandemer*, 478 U.S. 109 (1986), recognized. The respondent is correct that intent alone cannot be the whole of the claim; a plaintiff must still show a concrete burden on protected conduct, and *Mt. Healthy* preserves the State&#x27;s ability to prove the map would have been drawn the same way for independent reasons. But the answer to the concern about overbroad liability is the *Mt. Healthy* framework itself, not its exclusion. Once a plaintiff demonstrates that retaliatory purpose was a motivating factor in the redistricting, the burden shifts to the State to justify the map by legitimate, non-retaliatory criteria. The district court erred in holding the framework unavailable.</p><p>III. The causation holding was not clear error on this record.</p><p>The third question is closer, and here the district court&#x27;s denial must stand — though not because its legal standards were correct. Even under the corrected legal framework (substantial-factor motivation plus burden on protected activity, with *Mt. Healthy* available to the State), the preliminary record does not compel reversal.</p><p>The causation evidence is genuinely incomplete. The NCEC-developed sample maps were assessed as more favorable to Democratic candidates, but there is no evidence that the enacted map was among them. Former Governor O&#x27;Malley testified that the final document was likely created by the legislative director and staff of the Department of Planning. The circumstantial indicators — the shift in the Cook Partisan Voting Index from &quot;safe&quot; Republican to &quot;likely&quot; Democratic, and Representative Delaney&#x27;s 20.9-point victory in 2012 followed by subsequent Democratic wins — are consistent with an effective gerrymander, but on a preliminary record they do not establish as clearly erroneous the district court&#x27;s finding that but-for causation remains unproven for 2012, 2014, and 2016.<mark class='tru' data-n='6'> District-specific results may reflect candidate quality, national tides, and the incumbency advantage of a newly elected member; the district court, which heard the testimony and reviewed the exhibits, was entitled on this incomplete record to conclude that plaintiffs had not yet carried their burden of demonstrating a likelihood of success on the causation element.</mark></p><p>Moreover, the equitable considerations cut against the extraordinary relief requested. Plaintiffs challenge a map adopted in 2011 and seek to have it redrawn on the eve of the 2018 election, after years of litigation conducted at their own chosen pace. A party that delays in seeking preliminary relief &quot;must accept the consequences of that delay.&quot; The disruption of electoral administration mid-cycle — with primary dates approaching and candidate filing underway — weighs heavily against the injunction regardless of the merits. Plaintiffs&#x27; invocation of 2 U.S.C. § 2a(c) is unsupported by any record evidence, as their own counsel conceded, and was never passed upon by the district court. The public interest in orderly elections therefore reinforces the denial.</p><p>IV.</p><p>To summarize: the district court&#x27;s legal holdings on the injury standard and on *Mt. Healthy* were erroneous, and we disapprove them. But the denial of preliminary relief is sustainable on the independent grounds that the preliminary record does not establish a likelihood of success on causation and that the balance of equities and the public interest do not favor mid-cycle disruption. A denial of a preliminary injunction is reviewed for abuse of discretion, and on this record there was none.</p><p>The proper course is the one this Court has counseled in comparable circumstances: remand is unnecessary to express our view that the strict standards adopted below should not govern further proceedings, while affirming the order denying preliminary injunctive relief.</p><p>The distinction bears emphasis. We do not hold that partisan gerrymandering is beyond judicial cognizance; nor do we hold that a First Amendment retaliation theory can never succeed on a proper record. We hold only that this record, at this stage, and at this hour before the 2018 election, does not warrant the extraordinary remedy plaintiffs seek.</p><p>Disposition</p><p><mark class='tru' data-n='7'>The order of the district court denying plaintiffs&#x27; motion for a preliminary injunction is affirmed.</mark><mark class='tru' data-n='8'> The legal standards announced by the district court majority — requiring proof of dictation of every electoral outcome and excluding *Mt.</mark> Healthy* burden-shifting — are rejected, and shall not be applied on remand should plaintiffs renew their claims on a further developed record. Costs are taxed to plaintiffs.</p><p>RULING: Respondent</p>", "error": "The district court granted a preliminary injunction and ordered the State to adopt a new map before the 2018 election.", "truth": "A majority of the district court panel denied the plaintiffs’ motion for a preliminary injunction and stayed the case pending the outcome of Gill v. Whitford.", "nmarks": 8}, {"id": "C083", "text": "<p>RULING</p><p>Procedural History</p><p>Petitioners Christopher Conley and Jennifer Pederson, deputies of the Los Angeles County Sheriff&#x27;s Department, shot respondents Angel Mendez and Jennifer Lynn Garcia during a warrantless entry into the shack where respondents lived. Mendez and Garcia brought suit under 42 U.S.C. § 1983, alleging Fourth Amendment violations. The district court held for respondents on two claims—that the deputies conducted an unreasonable warrantless search and that they violated the knock-and-announce rule—but also held that the use of force itself was reasonable under the circumstances.<mark class='err' data-n='1'> Notwithstanding that finding, the district court held the deputies liable for the shooting under the Ninth Circuit&#x27;s provocation rule, under which an officer who intentionally or recklessly provokes a violent confrontation through a Fourth Amendment violation may be held liable for a use of force that would otherwise be lawful.</mark><mark class='tru' data-n='2'> The United States Court of Appeals for the Ninth Circuit affirmed.</mark> Petitioners now bring this appeal, and this Court granted review on the question whether an officer may be held liable under the provocation rule where the use of force itself was objectively reasonable, and whether an incident leading to a reasonable use of force negates the separate Fourth Amendment violation of unlawful entry.</p><p>Governing Law</p><p>The touchstone of Fourth Amendment reasonableness is *Graham v. Connor*, 490 U.S. 386 (1989), which directs that all claims of excessive force are evaluated under an objective reasonableness standard judged &quot;from the perspective of a reasonable officer on the scene, rather than with the 20/20 vision of hindsight.&quot; The calculus &quot;allows for the fact that police officers are often forced to make split-second judgments—in circumstances that are tense, uncertain, and rapidly evolving—about the amount of force that is necessary.&quot; The reasonableness inquiry depends on the &quot;severity of the crime at issue, whether the suspect poses an immediate threat to the safety of the officers or others, and whether he is actively resisting arrest or attempting to evade arrest by flight.&quot;</p><p>*Graham* also makes clear that a Fourth Amendment violation is analyzed separately as to each type of government conduct: the validity of a search is assessed under one standard, the validity of a seizure under another. An unreasonable search does not render an otherwise reasonable use of force unreasonable, and vice versa. The Court has never endorsed a rule that would conflate a prior constitutional violation with a subsequent seizure, importing the former into the Graham analysis of the latter. *See also Scott v. Harris*, 550 U.S. 372 (2007) (reasonableness of a seizure judged on the objective circumstances of the particular seizure).</p><p>Application</p><p>The provocation rule cannot sustain liability where the force used was reasonable. The Ninth Circuit&#x27;s provocation rule, as applied here, holds deputies liable for a shooting that both lower courts agreed was objectively reasonable. That result is incompatible with *Graham*. A use of force that is reasonable at the moment it is employed does not become an unconstitutional seizure by virtue of events that preceded it. The deputy who opens a door and sees the silhouette of an armed figure in dim light, and who fires in a split-second perception of mortal danger, does not violate the Fourth Amendment when that judgment is objectively reasonable. To hold otherwise would create a new, free-standing constitutional tort untethered from any search-or-seizure analysis of the force actually used, and would deter reasonable defensive action in the very circumstances the Fourth Amendment permits it.</p><p>Petitioner&#x27;s counsel is correct that the provocation rule, as an excessive-force theory, is &quot;incongruous&quot;: it imposes liability for a use of force that is not excessive at the moment it is used. The rule also allows recovery to turn on the presence of a separate antecedent violation without any principled connection between that violation and the character of the force used. Respondents&#x27; proposed alternative—a totality test asking whether an officer&#x27;s &quot;predicate act&quot; foreseeably created a need for force, balanced under *Graham* and *Scott*—suffers from the same defect. It would permit a court to relitigate the reasonableness of the use of force by attributing to it the unreasonableness of an earlier, distinct act. *Kentucky v. King*, 563 U.S. 452 (2011), on which respondents rely, addressed exigent circumstances excusing the warrant requirement; it did not adopt, and does not support, importing the unreasonableness of a warrantless entry into the separate Graham analysis of a subsequent seizure.</p><p>The reasonable use of force does not negate the separate Fourth Amendment violations. Petitioners prevail on the provocation rule, but not on everything. The question presented also asks whether the incident leading to a reasonable use of force negates the unlawful entry. It does not. The deputies entered respondents&#x27; dwelling—a structure in which respondents had a recognized privacy interest—without a warrant, without consent, and without any recognized exception; and they entered without knocking and announcing. These are discrete Fourth Amendment violations, separately cognizable, and unaffected by the fact that the subsequent use of force was reasonable. Petitioner&#x27;s own counsel acknowledged as much at argument: a knock-and-announce violation proximately causing what follows is a violation of clearly established law. The availability of remedies for those distinct violations is a matter for remand; liability for the shooting itself cannot rest on the provocation theory.</p><p>Note on the briefs. Respondents argue that the entry without notice and the failure to announce were both proximate causes of the harm, and that under a totality approach the officers&#x27; &quot;objectively unreasonable behavior&quot; should itself ground liability. Proximate cause is a sound principle, but it cannot supply the constitutional predicate that *Graham* requires: an unconstitutional seizure. Where the seizure itself was reasonable, causation from an earlier unreasonable search cannot convert the shooting into excessive force. Respondents may, of course, pursue damages for the unlawful entry and failure to knock and announce, subject to qualified immunity and remand proceedings.</p><p>Disposition</p><p><mark class='err' data-n='3'>The judgment of the Ninth Circuit is reversed insofar as it sustained liability for the shooting under the provocation rule.</mark> The Ninth Circuit&#x27;s provocation rule is rejected as inconsistent with the objective reasonableness standard of *Graham v. Connor*. The case is remanded for further proceedings consistent with this opinion, including consideration of respondents&#x27; separate claims arising from the warrantless entry and the failure to knock and announce.</p><p>RULING: Petitioner</p>", "error": "The Ninth Circuit reversed the district court’s judgment.", "truth": "The U.S. Court of Appeals for the Ninth Circuit affirmed.", "nmarks": 3}, {"id": "C084", "text": "<p>Opinion of the Court</p><p>Benjamin Robers pleaded guilty to one count of conspiracy to commit wire fraud arising from a mortgage-fraud scheme. He obtained two residential loans by falsely representing his income, his intent to occupy the properties, and his intent to repay the loans. He made no payments. After default, the lenders foreclosed, took title to the properties, and sold them.</p><p>The District Court ordered restitution under the Mandatory Victims Restitution Act (MVRA), 18 U.S.C. § 3663A, in the amount of $218,952.18. To calculate the lenders’ losses, it offset the loan amounts by the proceeds the lenders actually received when they later sold the houses.<mark class='err' data-n='1'> Robers challenged that calculation, arguing that the proper offset was the houses’ fair market value at the time of foreclosure.</mark><mark class='err' data-n='2'> The Court of Appeals agreed with Robers in relevant part, vacated the restitution calculation, and remanded for a new order valuing the houses at foreclosure.</mark><mark class='tru' data-n='3'> It also vacated attorney fees and other expenses.</mark> The case is now before this Court.</p><p>Governing law</p><p>The MVRA requires a defendant convicted of an offense involving property to make restitution to the victim. Section 3663A(b)(1) provides that the restitution order must require the defendant:</p><p>&gt; in the case of an offense resulting in damage to or loss or destruction of property of a victim of the offense—  <br>&gt; (A) return the property to the owner of the property or someone designated by the owner; or  <br>&gt; (B) if return of the property under subparagraph (A) is impossible or impracticable, pay an amount equal to—  <br>&gt; (i) the greater of—  <br>&gt; (I) the value of the property on the date of the damage, loss, or destruction; or  <br>&gt; (II) the value of the property on the date of sentencing,  <br>&gt; less  <br>&gt; (ii) the value (as of the date the property is returned) of any part of the property that is returned.</p><p>The statute therefore distinguishes between the property that was lost and other property later transferred to the victim. Restitution is intended to compensate the victim for its actual loss caused by the defendant’s offense, not to provide either a windfall to the victim or a speculative benefit to the defendant.</p><p>Here, the property lost by the lenders was money: the loan proceeds disbursed as a result of the fraudulent applications. The houses were not the money the lenders lost. They were collateral securing the loans and were acquired by the lenders only after Robers defaulted.</p><p>Accordingly, surrendering title to the houses did not return “any part” of the loan money within the meaning of § 3663A(b)(1). The houses could reduce the lenders’ loss only to the extent they were converted into money—ordinarily, when the lenders sold them.<mark class='err' data-n='4'> The relevant offset is therefore the amount the lenders actually received from the sales, not the houses’ estimated value at the time of foreclosure.</mark></p><p>Application</p><p>Robers argues that foreclosure fully returned the lenders’ property interest because the lenders had agreed to accept the houses as security for the loans. That argument confuses the collateral securing the debt with the money disbursed as a result of the fraud. The lenders did not lose houses and later recover houses. They lost money and later obtained title to real estate.</p><p>Nor does the fact that the lenders could foreclose alter the calculation. Foreclosure transferred the houses to the lenders, but it did not restore the loan proceeds. The lenders remained short the difference between the amounts they had advanced and the amounts they ultimately recovered from the properties. That difference is the loss caused by Robers’s fraud.</p><p>The later sale proceeds provide an objective measure of the amount recovered. Valuing the houses at foreclosure would require estimating what the properties were worth at an earlier point, even though the lenders in fact converted them into money before sentencing. The statute directs the court to subtract the value of property “as of the date the property is returned.” In this case, however, the property lost—the loan money—was not returned. The proper measure of recovery is therefore the money the lenders obtained by selling the houses.</p><p>This result does not improperly place market risk on Robers. The fraud caused the lenders to make the loans and, upon default, to foreclose and dispose of the collateral. The resulting proceeds are relevant to the lenders’ actual loss. If a property’s value changed during the period before sale, the actual amount recovered—not an earlier appraisal—best reflects the loss remaining at sentencing.</p><p>The District Court therefore correctly used the resale proceeds to offset the loan amounts. The Court of Appeals erred in requiring valuation at foreclosure.<mark class='tru' data-n='5'> Its separate disposition concerning attorney fees and other expenses is not challenged here and remains undisturbed.</mark></p><p>Disposition</p><p><mark class='err' data-n='6'>The judgment of the Court of Appeals is reversed insofar as it required the houses to be valued at foreclosure, and the case is remanded for further proceedings consistent with this opinion.</mark></p><p>RULING: Petitioner</p>", "error": "The Seventh Circuit reversed the district court’s restitution ruling and remanded with instructions to value the houses at foreclosure.", "truth": "The Seventh Circuit affirmed the district court's holding in part, vacated attorney fees and other expenses from the restitution award, and remanded for entry of a corrected restitution sum.", "nmarks": 6}, {"id": "C085", "text": "<p>The case arises from a challenge to the Secretary of the Interior’s decision to place the Bradley Property in trust for the Match-E-Be-Nash-She-Wish Band of Pottawatomi Indians, commonly known as the Gun Lake Tribe. After the Tribe constructed and opened a casino on the property, David Patchak sued the Secretary and other federal officials, alleging that the Secretary lacked authority under the Indian Reorganization Act to take the property into trust.</p><p><mark class='err' data-n='1'>The case previously reached this Court, which held that Patchak could pursue his challenge and that the Quiet Title Act did not bar his suit.</mark> While the case was pending on remand, Congress enacted the Gun Lake Act. Section 2(a) ratified and confirmed the Secretary’s acquisition of the Bradley Property. Section 2(b) provided that an action “relating to” the property “shall not be filed or maintained in a Federal court and shall be promptly dismissed.”</p><p>The district court dismissed Patchak’s suit pursuant to Section 2(b), and the Court of Appeals affirmed. We granted review to decide whether Congress violated separation-of-powers principles by directing dismissal of a pending lawsuit without altering the underlying substantive or procedural law governing the dispute.</p><p>The Constitution assigns the legislative power to Congress and the judicial power to the federal courts. Congress may enact laws that alter the legal rules governing pending cases, and it may define and limit the jurisdiction of the lower federal courts. Those powers are subject to constitutional limits. Congress may not, for example, direct the judiciary to decide a case according to a rule that leaves the governing law unchanged while effectively prescribing the result. Nor may Congress exercise the judicial power itself by revising a final judgment or deciding the merits of a particular controversy.</p><p>But Congress may change the law applicable to pending litigation, including by withdrawing jurisdiction over a category of cases. When it does so, the courts retain authority to determine whether the new law applies and, if it does, to dismiss the case. The fact that the statute affects a pending lawsuit, or that Congress was aware of a particular lawsuit when it acted, does not by itself make the statute unconstitutional. The relevant question is whether Congress enacted a governing legal rule or instead directed the courts to reach a result under unchanged law.</p><p>Section 2(b) is a jurisdictional rule. It removes federal-court jurisdiction over legal actions relating to the Bradley Property and directs dismissal of such actions. The court’s task under the statute is not to determine whether the Secretary lawfully acquired the property under the preexisting law. Nor is the court required to enter judgment declaring that the Secretary prevailed on the merits. The court need only determine whether the pending action falls within the category identified by Congress. If it does, the action may not be maintained in federal court.</p><p>That conclusion is not altered by the fact that dismissal gives the federal defendants the practical victory they sought. Jurisdictional laws frequently terminate litigation without a merits determination. A dismissal for lack of jurisdiction does not become an exercise of judicial power merely because it resolves a particular case or because Congress expected that result. Congress may also enact a narrow jurisdictional rule that happens to affect only one pending lawsuit. The Constitution does not require every jurisdictional rule to apply to a broad class of cases.</p><p>Patchak’s contrary argument would prevent Congress from withdrawing jurisdiction whenever it knew that a particular case would be dismissed. That would improperly limit Congress’s recognized authority to make jurisdictional changes applicable to pending cases. The separation-of-powers principle does not require Congress to amend the underlying substantive law when it changes the jurisdiction of the federal courts. Section 2(b) itself supplies the new rule governing the litigation: the action cannot be filed or maintained in federal court and must be dismissed.</p><p>Nor did Congress revise a final judgment. No final judgment on the merits had been entered in Patchak’s case. The prior decision of this Court determined that Patchak’s suit could proceed under the law then in effect; it did not immunize the case from subsequent changes in jurisdiction. Once Congress enacted Section 2(b), the lower courts were required to apply that law to the pending action.</p><p>Accordingly, Section 2(b) does not violate the separation of powers. Congress acted within its authority to define the jurisdiction of the federal courts, and the courts below properly dismissed Patchak’s action.</p><p>The judgment of the Court of Appeals is affirmed.</p><p>RULING: Respondent</p>", "error": "The Supreme Court held that Patchak lacked Article III standing to sue.", "truth": "The Supreme Court held that Patchak had standing to sue.", "nmarks": 1}, {"id": "C086", "text": "<p>Procedural History</p><p>Juan Bravo-Fernandez and Hector Martinez-Maldonado were indicted on charges arising from Bravo-Fernandez’s payment for a trip to Las Vegas taken with Martinez-Maldonado, then a Puerto Rican senator. The Government alleged that the payment was made in exchange for Martinez-Maldonado’s support of legislation beneficial to Bravo-Fernandez’s security firm. The indictment charged, among other offenses, federal-program bribery, conspiracy, and a Travel Act violation predicated on the alleged bribery.</p><p><mark class='tru' data-n='1'>The jury convicted both defendants of the standalone federal bribery offense, but acquitted them of conspiracy and of the Travel Act count.</mark> The latter two counts required bribery-related conduct as an essential predicate.<mark class='tru' data-n='2'> The Court of Appeals for the First Circuit later vacated the bribery convictions because the jury had been improperly instructed concerning the elements the Government was required to prove.</mark> The court remanded for further proceedings.</p><p><mark class='tru' data-n='3'>On remand, the District Court initially entered an acquittal order, but vacated that order after the Government correctly noted that the Court of Appeals’ mandate had vacated the convictions rather than directed judgments of acquittal.</mark> The defendants then sought to prevent retrial on the bribery charges.<mark class='tru' data-n='4'> They maintained that the jury’s acquittals on the conspiracy and Travel Act charges necessarily determined that no bribery occurred and therefore collaterally estopped the Government from trying the bribery counts again.</mark> The District Court denied that request. This appeal followed.</p><p>Governing Law</p><p>The Double Jeopardy Clause protects a defendant not only against a second prosecution for the same offense after an acquittal, but also against relitigation of an ultimate issue of fact that a valid acquittal necessarily resolved in the defendant’s favor. *Ashe v. Swenson*, 397 U.S. 436 (1970). This principle is commonly termed criminal collateral estoppel or issue preclusion.</p><p>The defendant invoking issue preclusion bears the burden to show that the prior acquittal necessarily decided the particular factual issue the Government seeks to litigate. Courts determine that question by examining the entire trial record—including the pleadings, evidence, arguments, and jury instructions—and asking whether a rational jury could have grounded its acquittal on an issue other than the one asserted as preclusive.</p><p>That rule does not permit a court to speculate about a jury’s reasoning. An acquittal may have preclusive force only when the record establishes with certainty what the jury actually decided. Thus, a hung count ordinarily does not undermine the preclusive consequence of an acquittal, because a hung jury has made no determination at all. *Yeager v. United States*, 557 U.S. 110 (2009).</p><p>A different rule applies where the same jury returns legally inconsistent verdicts. Under *United States v. Powell*, 469 U.S. 57 (1984), inconsistent verdicts generally stand because they may result from mistake, compromise, or lenity, and a reviewing court cannot know which verdict reflects the jury’s considered factual judgment. Consequently, an acquittal accompanied by an inconsistent conviction does not ordinarily establish that the jury necessarily resolved a factual issue in the defendant’s favor.</p><p>Finally, reversal of a conviction for trial error ordinarily permits retrial. A conviction vacated because of an erroneous instruction cannot be used to establish guilt, but its prior existence remains part of the historical record in determining whether the jury returned inconsistent verdicts. Vacatur for legal error does not retroactively reveal what the jury actually decided when it rendered its verdict.</p><p>Application</p><p>The defendants’ argument depends on treating the acquittals alone as conclusive proof that the jury found no bribery. Were those acquittals the jury’s only relevant determinations, the argument would have force: the disputed predicate of the conspiracy and Travel Act counts was the alleged bribery, and the defendants contend that the other elements of those offenses were not genuinely contested.</p><p>But the jury did not merely acquit on those counts. It also convicted the defendants of the standalone bribery offense. That conviction was inconsistent with acquittals that, on the defendants’ theory, necessarily rested on the absence of bribery. The verdicts therefore do not provide the required certainty that the acquittals reflected a factual finding that no bribery occurred. They instead demonstrate that the jury did not consistently apply the instructions across the counts, or that it exercised lenity, compromised, or otherwise reached a result whose reasoning cannot be reconstructed.</p><p>The subsequent vacatur of the bribery convictions does not alter that conclusion.<mark class='err' data-n='5'> The Court of Appeals vacated those convictions because the jury received an erroneous instruction, not because the evidence was legally insufficient to sustain a properly instructed conviction.</mark><mark class='tru' data-n='6'> That ruling prevents the Government from relying on the vacated convictions as proof that defendants committed bribery.</mark> It does not, however, erase the fact that the jury returned those convictions or eliminate the inconsistency that they reveal.</p><p>This case is therefore unlike one involving acquittals alongside hung counts. A hung count tells a court nothing about the jury’s resolution of the charge. Here, by contrast, the returned guilty verdicts establish that the jury’s verdicts were irreconcilable on the defendants’ asserted factual premise. Because the Court cannot determine whether the acquittals rested on a finding of no bribery rather than on error, lenity, or another unreviewable basis, the defendants have not carried their burden to establish that the issue was necessarily decided in their favor.</p><p><mark class='err' data-n='7'>The Double Jeopardy Clause does not bar retrial of the bribery charges after the convictions were vacated for instructional error.</mark></p><p>Disposition</p><p>The judgment of the District Court denying the defendants’ motion for acquittal and permitting further prosecution is affirmed.</p><p>RULING: Respondent</p>", "error": "The First Circuit vacated the federal bribery convictions for insufficient evidence.", "truth": "The First Circuit vacated the federal bribery convictions because the jury had been improperly instructed about what the government needed to prove, and it remanded the case.", "nmarks": 7}, {"id": "C087", "text": "<p>Procedural History</p><p>Brandon W. Owens filed this putative class action in state court on October 30, 2012, alleging that Dart Cherokee Basin Operating Company and Cherokee Basin Pipeline underpaid oil-and-gas royalties owed to class members, in breach of contract. The petition sought damages but did not state a sum certain.</p><p>On December 5, 2012, Dart Cherokee and Cherokee Basin Pipeline removed the action to federal district court under the Class Action Fairness Act of 2005 (CAFA). Their notice of removal alleged that the proposed class met CAFA’s class-size and minimal-diversity requirements and that the amount in controversy exceeded $8 million. The notice did not attach evidence substantiating that amount.</p><p><mark class='tru' data-n='1'>The district court remanded the action, reasoning that the removing defendants had failed to submit evidence with their notice establishing that the amount in controversy exceeded CAFA’s $5 million threshold.</mark><mark class='tru' data-n='2'> The Court of Appeals for the Tenth Circuit upheld that
