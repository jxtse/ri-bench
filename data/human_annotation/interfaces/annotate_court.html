on v. Kentucky*, 476 U.S. 79 (1986), correctly.</p><p>Governing law</p><p>The Equal Protection Clause forbids a prosecutor from exercising peremptory challenges to exclude prospective jurors on account of race. *Batson* establishes a three-step framework.</p><p>First, the defendant must make a prima facie showing that the strike was based on race. Relevant circumstances may include a pattern of strikes against jurors of a particular race, the prosecutor’s questions and statements during voir dire, and the composition of the jury ultimately selected.</p><p>Second, once a prima facie showing is made, the burden shifts to the prosecutor to provide a race-neutral explanation for each challenged strike. The explanation need not be persuasive or plausible at that stage; it must merely be facially race neutral.</p><p>Third, the trial court must determine whether the defendant has proved purposeful discrimination. At that stage, the court evaluates the prosecutor’s credibility and the plausibility of the stated reasons in light of the entire record. Comparative evidence—how similarly situated jurors of different races were treated—is relevant. So too is a prosecutor’s history of discriminatory strikes in the same case. The question is not whether race was the sole reason for a strike, but whether race was a motivating factor.</p><p>Appellate review gives substantial deference to a trial court’s factual findings, particularly credibility determinations. But deference does not mean that a reviewing court may examine each strike in isolation or disregard compelling evidence of discriminatory intent. The court must consider the totality of the circumstances.</p><p>Application</p><p>The record, viewed cumulatively, establishes a strong inference that race was a motivating factor in the prosecution’s jury strikes.</p><p>The numerical pattern is significant. In the first four trials, the same prosecutor exercised 36 peremptory challenges, and every one was used against an African-American prospective juror. In the sixth trial, he used five of six available strikes against African-American jurors. Numbers alone do not prove discrimination, but this pattern is not an ordinary or isolated event. It occurred in the same prosecution, in the same county, against the same defendant, and under the direction of the same prosecutor.</p><p>The prosecutor’s questioning provides further evidence. He questioned the struck African-American jurors at substantially greater length than the white jurors who were accepted. The African-American jurors were subjected to detailed and sometimes aggressive questioning about their views, relationships, and backgrounds, while white jurors who gave comparable answers were accepted with little inquiry. Such disparate questioning is probative because it may reveal that the stated concerns were developed after the fact rather than applied consistently.</p><p>The record also includes investigations of several African-American prospective jurors outside the ordinary voir dire process. Investigation is not inherently improper, and a prosecutor may reasonably verify information that creates legitimate doubt about a juror’s answers. But here the investigations must be considered alongside the prosecutor’s broader pattern. The prosecutor pursued information about African-American jurors even where the record supplied no substantial reason to distrust their answers, and the purported corroboration was not consistently produced or substantiated.</p><p>The prosecutor offered facially race-neutral explanations for the challenged strikes, including that certain jurors had relationships with Flowers or his family, had worked with relatives, or had been untruthful on a questionnaire. Those reasons cannot simply be accepted at face value. The relevant inquiry is whether they were credible and consistently applied.</p><p>Several of the asserted reasons were weakened by the comparative evidence. White jurors with comparable connections, experiences, or equivocal answers were not struck. The prosecutor’s questioning of African-American jurors was also more searching and confrontational than his questioning of similarly situated white jurors. That disparate treatment undermines the claim that the strikes were based solely on the stated nonracial concerns.</p><p><mark class='err' data-n='7'>Most importantly, the Mississippi Supreme Court failed to evaluate the evidence as a whole.</mark> It treated the strikes one by one and gave controlling weight to the prosecutor’s facially neutral explanations. But *Batson* requires a sensitive inquiry into all relevant circumstances. The prosecutor’s history in this very case, the striking pattern in the sixth trial, the disparate questioning, the investigations, and the weaknesses and inconsistencies in the stated explanations reinforce one another. Considered cumulatively, they demonstrate purposeful discrimination.</p><p>The State emphasizes that the sixth trial occurred in a small community and that the challenged jurors had connections to Flowers or his family. Those facts may be relevant to the prosecutor’s motives, but they do not resolve the constitutional question. A legitimate concern about a juror must still be applied in a race-neutral and consistent manner. Nor does the small size of the community explain why all 36 earlier strikes were directed at African-American jurors or why the prosecutor treated similarly situated white jurors differently.</p><p><mark class='tru' data-n='8'>The State also contends that Flowers’s Batson claim was procedurally defaulted.</mark><mark class='err' data-n='9'> But the Mississippi Supreme Court addressed the merits of the claim, and the judgment before us rests on its merits analysis.</mark> In any event, the question presented concerns whether that analysis correctly applied *Batson*. On that question, the court below did not give adequate consideration to the entire record.</p><p>Disposition</p><p><mark class='err' data-n='10'>The Mississippi Supreme Court erred in its application of *Batson*.</mark> The totality of the circumstances demonstrates that the prosecution’s peremptory strikes were motivated in substantial part by race. The judgment is therefore reversed, and the case is remanded for further proceedings consistent with this opinion.</p><p>RULING: Petitioner</p>", "error": "The Mississippi Supreme Court dismissed Flowers’s Batson claim as procedurally defaulted.", "truth": "The Mississippi Supreme Court rejected Flowers’s jury-selection arguments and, on remand, again upheld the ruling for the State; it did not dismiss his Batson claim as procedurally defaulted.", "nmarks": 10}, {"id": "C061", "text": "<p>Procedural History</p><p>These consolidated cases arise from mandatory life-without-parole sentences imposed on fourteen-year-old offenders convicted of homicide-related offenses.</p><p><mark class='tru' data-n='1'>In Alabama, Evan Miller was transferred from juvenile court and tried as an adult for capital murder committed during an arson.</mark><mark class='tru' data-n='2'> A jury found him guilty, and the circuit court imposed the statutorily mandatory sentence of life imprisonment without the possibility of parole.</mark> Miller moved for a new trial, contending that the sentence violated the Eighth Amendment. The trial court denied relief; the Alabama Court of Criminal Appeals affirmed; and the Supreme Court of Alabama denied certiorari.</p><p>In Arkansas, Kuntrell Jackson was tried as an adult and convicted of capital murder and aggravated robbery arising from a movie-store robbery in which his codefendant shot the clerk.<mark class='err' data-n='3'> The trial court likewise imposed a mandatory life-without-parole sentence.</mark> Jackson later sought habeas relief on Eighth and Fourteenth Amendment grounds. The circuit court dismissed his petition, and the Supreme Court of Arkansas affirmed.</p><p>Both petitioners now seek review of the constitutionality of those mandatory sentences.<mark class='err' data-n='4'> To the extent an excerpt in petitioner’s submission characterizes Miller’s sentencing as discretionary, the stipulated record states that the sentence was mandatory, and the Court decides the matter on that record.</mark></p><p>Governing Law</p><p>The Eighth Amendment, applicable to the States through the Fourteenth Amendment, prohibits cruel and unusual punishments. Its proportionality principle requires that punishment account for both the offense and the offender.</p><p>The Supreme Court’s juvenile-sentencing precedents establish that children are constitutionally different from adults for sentencing purposes. In *Roper v. Simmons*, the Court held that juveniles may not be sentenced to death. In *Graham v. Florida*, it held that juveniles who commit nonhomicide offenses may not receive life without parole and must have a meaningful opportunity to obtain release based on demonstrated maturity and rehabilitation.</p><p>Those decisions rest on enduring characteristics of youth: juveniles ordinarily have diminished maturity and responsibility, are more vulnerable to outside pressure and their immediate environment, and possess characters that are not yet fully formed. These characteristics reduce a juvenile’s culpability and make it especially difficult to conclude at the time of sentencing that a child is irredeemably corrupt.</p><p>Homicide is undeniably more serious than nonhomicide crime, and States retain substantial authority to punish juvenile homicide offenders severely. But a sentencing scheme may not make life without parole automatic for a juvenile homicide offender. Before imposing that penalty, the sentencer must have discretion to consider youth and its attendant circumstances—including the offender’s age and immaturity, family and home environment, degree of participation in the crime, the effect of peer pressure, the circumstances of the offense, and the possibility of rehabilitation.</p><p>Application to the Record</p><p>The respondents correctly stress the gravity of the crimes. Miller participated in a killing involving a beating and arson. Jackson participated in an armed robbery during which a codefendant killed the clerk. The State may reasonably regard homicide as distinct from nonhomicide offenses, may seek to protect the public, and may give weight to retribution and the interests of victims’ families. Nothing in this ruling minimizes either the losses suffered or the States’ legitimate penological concerns.</p><p>But those considerations do not validate the sentencing procedures used here.<mark class='tru' data-n='5'> Each petitioner was fourteen years old, and each received life without parole because the governing statute made that sentence mandatory.</mark> Neither sentencing court had authority to decide whether the particular child’s youth, role in the offense, developmental immaturity, background, or prospect for rehabilitation rendered the harshest available punishment disproportionate.</p><p>That constitutional defect is particularly consequential on these facts. Miller and Jackson were not merely juveniles generally; they were fourteen-year-old children. Jackson’s record further indicates that he was not the shooter and that the shooting was committed by a codefendant. A mandatory scheme treats those circumstances as legally irrelevant. The Eighth Amendment does not permit that result.</p><p>Respondents’ reliance on legislative authorization and the seriousness of aggravated murder is substantial as far as it goes. Legislatures may establish severe penalties for homicide, and the fact that many jurisdictions authorize life without parole is relevant. Yet authorization of a punishment does not eliminate the judiciary’s duty to enforce the constitutional requirement of individualized sentencing where youth is central to culpability. Nor can a transfer-to-adult-court decision substitute for a sentencing determination. Transfer may reflect a judgment that juvenile-court jurisdiction is inadequate; it is not necessarily a considered judgment that the child must die in prison.</p><p><mark class='tru' data-n='6'>The Court does not hold that a juvenile convicted of homicide can never receive life without parole.</mark> Nor does it require release at any particular age. It holds only that the Eighth and Fourteenth Amendments forbid a sentencing regime that requires life without parole for a juvenile homicide offender without permitting the sentencer to consider the offender’s youth and attendant circumstances.</p><p>Disposition</p><p>The judgments sustaining petitioners’ mandatory life-without-parole sentences are reversed. The cases are remanded for resentencing under procedures that allow the sentencing authority to consider petitioners’ youth, individual culpability, and capacity for rehabilitation before determining whether life without parole is constitutionally proportionate.</p><p>RULING: Petitioner</p>", "error": "The trial court imposed Evan Miller's life-without-parole sentence through individualized, discretionary sentencing.", "truth": "The trial court sentenced Evan Miller to a mandatory term of life imprisonment without the possibility of parole.", "nmarks": 6}, {"id": "C062", "text": "<p>Opinion of the Court</p><p>Procedural History</p><p>Current and former Xerox employees brought this ERISA action in the United States District Court for the Southern District of New York. The employees had previously left Xerox, received lump-sum distributions of their retirement benefits, and were later rehired. They alleged that Xerox improperly calculated the benefits payable following their reemployment.</p><p>In earlier proceedings, Xerox had applied a “phantom account” or reconstructed-account method to offset the prior lump-sum distributions. The courts concluded that method was not adequately disclosed and could not be used to determine plaintiffs’ benefits. On remand, the dispute became what offset, if any, the Plan permitted. Xerox’s plan administrator adopted an alternative interpretation under which the prior distribution would be offset by the annuity it could have purchased at normal retirement age using applicable annuity assumptions.</p><p>The District Court declined to defer to that interpretation and instead selected its own remedial approach. It also held that releases executed by certain plaintiffs were unenforceable.<mark class='tru' data-n='1'> The Court of Appeals for the Second Circuit upheld the remedy and agreed that the releases were unenforceable.</mark><mark class='tru' data-n='2'> As pertinent here, the Court of Appeals held that the District Court had no obligation to defer to the administrator’s new construction because the construction was offered during litigation rather than through an administrative benefits proceeding.</mark><mark class='tru' data-n='3'> It further held that the District Court possessed “allowable discretion” to adopt any reasonable interpretation of the Plan in calculating benefits.</mark></p><p>Xerox sought review of those rulings. We granted review on the two questions concerning judicial deference to the Plan administrator and the District Court’s authority to construe the Plan.</p><p>Governing Law</p><p>Under *Firestone Tire &amp; Rubber Co. v. Bruch*, a court reviews an ERISA plan administrator’s benefits determination de novo unless the plan gives the administrator discretionary authority to construe the plan or determine eligibility. Where discretionary authority exists, the administrator’s interpretation is reviewed for abuse of discretion—often described as arbitrary-and-capricious review.</p><p>That rule reflects ERISA’s reliance on plan documents and on fiduciaries assigned responsibility to administer them. It promotes consistent interpretation, permits application of specialized pension expertise, and avoids replacing the plan’s designated decisionmaker with a court whenever the meaning of plan language is disputed.</p><p>The rule is not forfeited merely because an administrator previously adopted an interpretation that a court properly rejected. A prior error may bear on whether a later interpretation is reasonable, and serious fiduciary misconduct, bad faith, or procedural unfairness may justify other relief. But a single erroneous interpretation does not transfer the administrator’s delegated interpretive authority permanently to the judiciary. The ordinary remedy for an administrator’s erroneous benefits determination is remand to the administrator for a renewed exercise of its discretion.</p><p>Nor may a district court, simply because it is fashioning relief after an ERISA violation, select among competing reasonable interpretations of plan terms. When the Plan delegates interpretive discretion to the administrator, the court’s function is to review the administrator’s interpretation under the governing deferential standard, not to substitute the court’s preferred reasonable interpretation.</p><p>Application</p><p>The Second Circuit departed from these principles in two related ways.</p><p>First, it treated the setting in which Xerox offered its interpretation—litigation and remedial proceedings following the invalidation of the reconstructed-account method—as sufficient reason to withhold deference altogether. That was error. The pertinent question is not whether the administrator first articulated its interpretation in an initial administrative claim determination. It is whether the Plan vested the administrator with discretion to interpret the relevant provisions and whether the interpretation rendered in the renewed proceeding was within the bounds of that authority.</p><p>The prior ruling against Xerox did not establish that the administrator was incapable of exercising honest and fair discretion on remand. The prior reconstructed-account method had been rejected because it was inadequately disclosed and therefore could not govern these plaintiffs’ benefits. But Xerox’s later proposal was materially different: it construed the Plan’s provisions concerning the “accrued benefit attributable to” a prior distribution as permitting an offset based on the annuity that the actual lump sum could purchase at normal retirement age. Whether that construction is ultimately reasonable must be assessed under the applicable deferential standard. The court could not refuse deference merely because Xerox had previously advanced an unsuccessful construction.</p><p><mark class='tru' data-n='4'>Second, the Court of Appeals erred in authorizing the District Court to adopt “any reasonable” interpretation of the Plan.</mark> The fact that more than one interpretation might be reasonable does not empower a court to choose the one it finds most equitable or preferable. Discretionary authority belongs in the first instance to the administrator selected by the Plan. The District Court may reject an interpretation that is arbitrary, capricious, contrary to the Plan, or otherwise unlawful; it may not itself exercise the administrator’s delegated discretion.</p><p>The employees correctly emphasize that ERISA requires adequate disclosure and that a summary plan description need not—and ordinarily cannot—catalog every actuarial calculation in exhaustive detail. Those principles remain relevant to the validity of any proposed offset and to the reasonableness of the administrator’s construction. Likewise, the history of benefit statements and the Plan’s prior disclosure failures may be considered insofar as they bear on the legality and reasonableness of a renewed interpretation. But they do not establish a categorical rule stripping the administrator of discretion after one invalidated interpretation.</p><p>The appropriate course is therefore to return the matter to the Plan administrator for a renewed interpretation of the governing Plan terms. Any resulting determination remains subject to judicial review for abuse of discretion and for compliance with ERISA’s substantive and disclosure requirements.</p><p>Disposition</p><p><mark class='tru' data-n='5'>The judgment of the Court of Appeals is reversed insofar as it held that the District Court owed no deference to Xerox’s plan administrator and insofar as it authorized the District Court to choose any reasonable interpretation of the Plan.</mark> The case is remanded for further proceedings consistent with this opinion.</p><p>RULING: Petitioner</p>", "error": "The Second Circuit affirmed the district court's holding that the release forms were unenforceable.", "truth": "The Second Circuit held that the district court erred in finding the release forms unenforceable and concluded that the forms were enforceable because they were signed knowingly and voluntarily.", "nmarks": 5}, {"id": "C063", "text": "<p>Procedural History</p><p>Following the 2020 census, Alabama enacted a congressional redistricting plan for its seven seats in the United States House of Representatives. The plan included one majority-Black district. Registered voters and civic organizations challenged the plan under § 2 of the Voting Rights Act of 1965, contending that Alabama packed Black voters into that single district while cracking other geographically concentrated Black communities among districts where white bloc voting defeated their preferred candidates.</p><p><mark class='err' data-n='1'>A unanimous three-judge District Court concluded that the challengers were substantially likely to establish a § 2 violation.</mark><mark class='err' data-n='2'> It entered a preliminary injunction requiring Alabama to prepare a lawful replacement map.</mark> Alabama sought emergency relief in this Court. By a 5–4 vote, this Court stayed the injunction pending merits review. The merits question is now properly before us.</p><p><mark class='err' data-n='3'>The respondent’s assertion that the District Court denied preliminary relief is contrary to the stated procedural record.</mark><mark class='tru' data-n='4'> The District Court granted the injunction; the issue is whether that determination was legally and factually sound.</mark></p><p>Governing Law</p><p>Section 2 prohibits any voting standard, practice, or procedure that results in a denial or abridgment of the right to vote on account of race or color. A violation is established where, “based on the totality of circumstances,” minority voters have less opportunity than other members of the electorate “to participate in the political process and to elect representatives of their choice.” 52 U.S.C. § 10301.</p><p>For a vote-dilution claim involving single-member districts, *Thornburg v. Gingles* requires plaintiffs first to establish three threshold conditions: (1) the minority group is sufficiently large and geographically compact to constitute a majority in a reasonably configured single-member district; (2) the minority group is politically cohesive; and (3) the majority votes sufficiently as a bloc usually to defeat the minority group’s preferred candidate. If those preconditions are met, the court considers the totality of circumstances, including the history and effects of discrimination, racial polarization in voting, and the practical opportunity of minority voters to elect their candidates of choice.</p><p>The first *Gingles* condition does not demand that a plaintiff’s illustrative district be designed without awareness of race. That condition necessarily asks whether a sufficiently numerous and compact minority population may be assembled into a reasonably configured district. Plaintiffs must, however, provide illustrative plans that respect traditional districting principles—such as equal population, contiguity, compactness, political subdivisions, and communities of interest—and that do not make race predominant to the exclusion of those principles.</p><p>Section 2 is a results-based statute. Congress amended it expressly to avoid making discriminatory purpose a necessary prerequisite to relief. A State’s assertedly race-neutral motive in retaining existing district lines may be relevant to the totality-of-circumstances inquiry, but it does not itself resolve whether the enacted plan affords minority voters an equal electoral opportunity. Nor does § 2 require maximization of majority-minority districts or guarantee proportional representation.</p><p>Factual findings concerning compactness, racial polarization, and whether race predominated in the proposed illustrative plans are reviewed for clear error. Legal conclusions drawn from those findings are reviewed independently.</p><p>Application to the Record</p><p><mark class='tru' data-n='5'>The District Court found that Black voters in Alabama are sufficiently numerous and geographically compact to form a majority in a second reasonably configured congressional district.</mark> It reached that conclusion after examining multiple illustrative maps and traditional compactness measures. Those maps performed as well as, or better than, the enacted plan under nearly all relevant traditional districting criteria. The court further found that the proposed districts were not bizarrely shaped and that race did not predominate in their design.</p><p>Those findings satisfy the first *Gingles* precondition. Alabama’s proposed rule—that plaintiffs must instead demonstrate that a second majority-Black district would emerge from a race-neutral simulation or other race-blind process—cannot be reconciled with the statute or the established *Gingles* framework. A race-neutral benchmark may be useful evidence in an appropriate case, but it is not a statutory element of a § 2 vote-dilution claim. Requiring plaintiffs to discover a majority-minority district without considering the location of minority voters would substantially nullify the first *Gingles* requirement.</p><p>Alabama’s reliance on core retention, preservation of Gulf-area communities of interest, and avoidance of county divisions identifies legitimate redistricting interests. But those interests are not categorical.<mark class='err' data-n='6'> The District Court was entitled to weigh them against evidence that the Black Belt is itself a historically significant and economically cohesive community, and against the evidence that Alabama’s plan split that community while concentrating Black voting strength in one district.</mark><mark class='err' data-n='7'> The record does not show clear error in the District Court’s conclusion that the challengers’ illustrative plans accommodated traditional criteria at least as well as the State’s map.</mark></p><p>The remaining preconditions also support relief.<mark class='err' data-n='8'> The District Court found exceptionally severe racial polarization in Alabama voting and found that white bloc voting ordinarily defeats Black voters’ preferred candidates outside the existing majority-Black district.</mark> The history and continuing effects of discrimination, together with substantial Black underrepresentation in congressional representation, reinforce the conclusion that the enacted configuration denies Black voters an equal opportunity to elect their preferred candidates.</p><p>Respondent is correct that § 2 does not authorize proportional representation, does not require a State to maximize majority-minority districts, and must be applied consistently with equal-protection limits on race-based line drawing. Those propositions are important but do not alter the result. The relief supported here is not an instruction to maximize minority districts or to subordinate every neutral criterion to race.<mark class='tru' data-n='9'> It is the narrower conclusion that, on this record, Alabama may draw a reasonably configured second district in which Black voters have a fair opportunity to elect a representative of their choice, and that its failure to do so, amid the established conditions of racial bloc voting and historical discrimination, violates § 2.</mark></p><p>Disposition</p><p>Alabama’s 2021 congressional redistricting plan violates § 2 of the Voting Rights Act. The judgment granting preliminary injunctive relief is affirmed, and the case is remanded for implementation of a remedial plan consistent with this opinion.</p><p>RULING: Petitioner</p>", "error": "The three-judge district court denied the challengers’ request for a preliminary injunction and left Alabama’s map in place.", "truth": "The three-judge district court granted a preliminary injunction ordering Alabama to draw a new congressional map.", "nmarks": 9}, {"id": "C064", "text": "<p>Opinion of the Court</p><p>Fane Lozman, a resident and frequent critic of the City of Riviera Beach, opposed the City’s proposed redevelopment of its marina and sued the City under Florida’s Sunshine Law.<mark class='err' data-n='1'> During a closed meeting concerning that litigation, members of the city council discussed how the City should respond to Lozman; the transcript, viewed in Lozman’s favor, contains evidence suggesting that councilmembers contemplated using intimidation against him.</mark></p><p>Several months later, Lozman spoke during the public-comment portion of a city council meeting. When he began discussing governmental corruption, a councilmember directed him to stop. After Lozman continued, the councilmember instructed a police officer to arrest him. Lozman was charged with disturbing a lawful assembly and other offenses. A prosecutor later concluded that probable cause supported the arrest but dismissed the charges because successful prosecution was unlikely.</p><p>Lozman brought this action against the City under 42 U.S.C. § 1983, alleging, among other claims, that the City caused his arrest in retaliation for his protected criticism and his lawsuit against it.<mark class='err' data-n='2'> At trial, the jury was instructed in a manner that required Lozman to establish the absence of probable cause to prevail on his First Amendment retaliatory-arrest claim.</mark><mark class='err' data-n='3'> The jury returned a verdict for the City, and the District Court denied Lozman’s motion for a new trial.</mark> On appeal, the Court of Appeals affirmed, treating the existence of probable cause as an absolute bar to the retaliatory-arrest claim. We granted review.</p><p>I. Governing Law</p><p>The First Amendment prohibits government officials from subjecting an individual to adverse action because of that individual’s protected speech or petitioning activity. A retaliation plaintiff ordinarily must establish that he engaged in protected activity, that the government took adverse action against him, and that the protected activity was a substantial or motivating factor for that action. Under *Mt. Healthy City Board of Education v. Doyle*, the government may avoid liability by proving that it would have taken the same action even absent the protected conduct.</p><p>In *Hartman v. Moore*, this Court held that a plaintiff alleging retaliatory prosecution generally must plead and prove the absence of probable cause. That rule responded to features distinctive to prosecution claims. The official alleged to possess retaliatory animus is commonly not the prosecutor who causes the injury; prosecutors exercise independent judgment and enjoy absolute immunity; and courts presume that prosecutorial decisions are regular. Absence of probable cause supplies necessary evidence connecting the retaliating official’s animus to the prosecutor’s action.</p><p>Those considerations do not automatically extend to every retaliatory arrest. Arrest decisions can present substantial practical concerns: officers frequently must act quickly, speech may form part of the conduct they are assessing, and probable cause supplies an important objective measure of lawful police action. Probable cause is therefore highly relevant to causation and may defeat many retaliation claims. But it does not follow that probable cause categorically precludes every First Amendment claim involving an arrest.</p><p>We need not decide here the rule governing the mine-run case in which a plaintiff alleges that an individual officer made a discretionary arrest in retaliation for speech occurring during the encounter. This case presents a narrower and materially different claim. Lozman alleges that the City itself adopted a preexisting official policy of retaliation against him for protected speech and then caused his arrest pursuant to that policy. Municipal liability under § 1983 requires proof that the constitutional injury resulted from an official municipal policy or decision; respondeat superior is insufficient. That requirement, together with ordinary causation principles and the *Mt. Healthy* defense, provides substantial protection against liability based merely on an officer’s subjective motives.</p><p>II. Application</p><p>Lozman’s claim concerns core First Amendment conduct. He alleges retaliation for criticizing public officials and petitioning the courts through his Sunshine Law suit. His theory is supported by objective evidence independent of the arresting officer’s state of mind—most notably, the transcript of the council’s closed meeting and the councilmember’s direction that he be arrested during a later public meeting.</p><p>The City disputes Lozman’s interpretation of the closed-session transcript. It also emphasizes that the arresting officer testified that he had never heard of Lozman and independently determined that an arrest was warranted. Those matters may bear on whether the City had an official retaliatory policy, whether that policy caused the arrest, and whether the arrest would have occurred regardless of Lozman’s protected activity. They do not, however, justify foreclosing the claim solely because probable cause existed.</p><p>Unlike the retaliatory-prosecution claim in *Hartman*, adjudicating Lozman’s theory does not require a court to infer causation through the protected and presumptively independent decision of an immune prosecutor. The challenged conduct was allegedly directed by municipal policymakers themselves, and objective evidence may permit a factfinder to determine whether the City formed and implemented an unconstitutional retaliatory policy.</p><p>Nor does probable cause necessarily establish the City’s *Mt. Healthy* defense. It shows that there was a lawful basis upon which an arrest could have been made; it does not conclusively prove that the City would have caused this arrest absent Lozman’s protected criticism and litigation. Probable cause remains relevant evidence on that issue, but it is not an absolute bar under the circumstances alleged here.</p><p>We hold only that probable cause does not defeat, as a matter of law, a retaliatory-arrest claim alleging that a municipality acted pursuant to an official policy of retaliation against a particular person for prior protected speech, where the alleged policy is supported by objective evidence. On remand, Lozman must still prove the existence of such a municipal policy, retaliatory causation, and all other elements of his § 1983 claim. The City remains free to show that it would have caused the arrest even without the protected activity.</p><p>III. Disposition</p><p>The judgment of the Court of Appeals is vacated, and the case is remanded for further proceedings consistent with this opinion.</p><p>RULING: Petitioner</p>", "error": "The jury found in favor of Lozman on his common-law false-arrest claim, while finding for the City on his constitutional claims.", "truth": "The jury found in favor of the City on all of Lozman's claims, including his common-law false-arrest claim.", "nmarks": 3}, {"id": "C065", "text": "<p>IN THE SUPREME COURT</p><p>Lakhdar Boumediene, et al., *Petitioners*, v. George W. Bush, President of the United States, et al., *Respondents*.</p><p>OPINION OF THE COURT</p><p>---</p><p>I. PROCEDURAL HISTORY</p><p>Petitioners are six Algerian nationals seized in Bosnia in 2002 on suspicion of plotting an attack on the United States embassy there, classified by the Executive as enemy combatants, and since confined at the United States Naval Station at Guantanamo Bay, Cuba — territory held by the United States under a long-term lease from the Republic of Cuba. Petitioners filed petitions for writs of habeas corpus in the District Court for the District of Columbia, invoking the Due Process Clause, statutes, treaties, the common law, and the law of nations.</p><p>The District Court dismissed all claims on the ground that an alien held at an overseas military base has no right to seek the writ. The Court of Appeals for the District of Columbia Circuit affirmed. This Court reversed in *Rasul v. Bush*, holding that the federal habeas statute reached non-citizen detainees at Guantanamo.</p><p>Congress responded. The Detainee Treatment Act of 2005 (DTA) created Combatant Status Review Tribunals (CSRTs) and provided for exclusive, limited review of CSRT determinations in the D.C. Circuit. The Military Commissions Act of 2006 (MCA) then withdrew federal-court jurisdiction over habeas applications filed by aliens detained as enemy combatants, and made that withdrawal applicable to &quot;all cases, without exception,&quot; pending on or after the date of enactment.</p><p>On the second appeal, the D.C.<mark class='tru' data-n='1'> Circuit ruled for the Government on both statutory and constitutional grounds.</mark> It held that the MCA by its terms reached Petitioners&#x27; pending cases, one evident purpose of the Act being to displace this Court&#x27;s decision in *Hamdan v. Rumsfeld*. It further held that the Suspension Clause protects only the writ as it existed in 1789; that the writ so understood would not have run to a foreign military enclave leased from a foreign sovereign; and that constitutional guarantees do not extend to aliens outside the sovereign territory of the United States.</p><p>We granted certiorari. Four questions are presented: (1) whether the MCA strips jurisdiction over these petitions; (2) if so, whether it violates the Suspension Clause; (3) whether detainees may invoke the Fifth Amendment and the Geneva Conventions; and (4) whether Petitioners may challenge the adequacy of DTA review before invoking it.</p><p>---</p><p>II. THE GOVERNING LAW</p><p>A. The Statutory Question</p><p>We agree with the Court of Appeals on the first question, and the parties before us do not seriously contest it. The MCA&#x27;s jurisdictional bar applies to &quot;all cases, without exception&quot; pending on or after enactment that relate to any aspect of the detention of an alien determined to be an enemy combatant. That language is not susceptible of a saving construction. The canon of constitutional avoidance permits a court to choose among fairly available readings; it does not permit a court to rewrite an unambiguous command. Counsel for the Government put the matter accurately: Congress &quot;ha[s] come in and said: The way we are going to deal with this is we are going to remove jurisdiction for that habeas petition.&quot; Petitioners&#x27; own framing accepts the point, resting their case on the Suspension Clause rather than on statutory evasion.</p><p>The MCA therefore withdraws statutory habeas jurisdiction over these petitions. We must reach the constitutional question.</p><p>B. The Suspension Clause</p><p>The Clause provides: &quot;The Privilege of the Writ of Habeas Corpus shall not be suspended, unless when in Cases of Rebellion or Invasion the public Safety may require it.&quot; It is not a grant of rights to prisoners in the first instance; it is a limitation on the power of the political branches. Its placement in Article I, among the restrictions on legislative power, confirms that its office is structural. The Framers, having lived under executive detention by prerogative, &quot;viewed freedom from unlawful restraint as a fundamental precept of liberty&quot; and wrote into the Constitution a guarantee that the Judiciary&#x27;s power to inquire into the legality of detention could be withdrawn only in the gravest emergencies, by the political branches acting openly and by name.</p><p>The Government urges, and the court below held, that the protected privilege is frozen as of 1789. We accept, as a floor, that the Clause protects at least the writ as it existed when the Constitution was ratified. But that baseline is a floor, not a ceiling, and the historical record is far less favorable to the Government than the court below supposed.</p><p>The common-law writ ran not by reference to lines on a map but by reference to the reach of the sovereign&#x27;s control over the jailer. It issued to the Cinque Ports, to the palatinates, to the Channel Islands, and — as Petitioners demonstrate — to territories that were &quot;no part of the Realm of England,&quot; including India, where royal charter vested judges with the common-law authorities of King&#x27;s Bench, among them the power to issue habeas. Petitioners&#x27; further point is telling and unrebutted: in 1777 and 1783 Parliament found it necessary to *suspend* the writ as to persons seized on the high seas or &quot;out of the realm,&quot; including American seamen. One does not suspend a writ that never ran.</p><p>The Government answers with three supposed obstacles at common law: geography, a categorical rule that the writ was unavailable to prisoners of war, and a bar on controverting the return. Each is overstated. *Schiever* and the Spanish sailors&#x27; cases did not turn on a jurisdictional bar; the courts entertained the applications, considered affidavits of the prisoners and of third parties, and decided on that material that the applicants were lawfully held as prisoners of war. That is an exercise of jurisdiction, not a refusal of it. And the very question presented here — &quot;I am not a combatant&quot; — is the question those courts reached. As to controverting the return, the rule was never absolute, and it was at its weakest precisely where it matters here: in cases of executive detention unaccompanied by any trial, where no adjudicated record existed to which a court might defer.</p><p>The Government&#x27;s reliance on *Liversidge v. Anderson* and *Greene v. Secretary of State* is misplaced for reasons more fundamental than the fact, candidly acknowledged, that those authorities surfaced late. Those were 1941 decisions construing a specific wartime regulation of a Parliament possessing plenary power to define and to suspend the privilege; they resolved a question of statutory construction, not a constitutional limit on legislative power. Lord Atkin&#x27;s dissent, insisting that judges are not &quot;more executive minded than the executive,&quot; has worn better than the majority. In any event, a British court&#x27;s deference to a Home Secretary&#x27;s subjective satisfaction tells us little about what the United States Constitution forbids Congress to do.</p><p>Nor does the Government&#x27;s *Rasul*-and-*Braden* argument carry the day. That the federal habeas *statute* may not have been read to reach Guantanamo before *Braden* overruled *Ahrens*&#x27;s immediate-custodian gloss establishes only how Congress and this Court once construed a statute. The scope of a statute does not fix the reach of a constitutional restraint on Congress. The absence of litigation is not the absence of right; for most of the period in question, no one was held at Guantanamo in circumstances that would have provoked the question.</p><p>C. Where the Clause Operates</p><p>The question, then, is not whether Guantanamo lies within the *de jure* sovereignty of the United States — the lease reserves ultimate sovereignty to Cuba — but whether the Constitution&#x27;s restraints follow the Government there. We reject the proposition that the political branches may switch the Constitution on and off at will by the expedient of drafting a lease. The Insular Cases and *Reid v. Covert* teach that the application of constitutional guarantees outside the states is governed by objective factors and practical concerns, not by formal labels.</p><p>*Johnson v. Eisentrager* is not to the contrary. The prisoners there were enemy aliens who had been tried and convicted by a military commission with counsel and an adversary record, held at Landsberg Prison in occupied Germany, where the United States exercised neither *de facto* sovereignty nor unchallenged control, and where the practical burdens of judicial process were manifest. The relevant factors are (i) the citizenship and status of the detainee and the adequacy of the process by which that status was determined; (ii) the nature of the site of apprehension and detention; and (iii) the practical obstacles inherent in resolving the prisoner&#x27;s entitlement to the writ.</p><p>---</p><p>III. APPLICATION</p><p>A. Guantanamo</p><p>Each factor favors Petitioners. Their status as enemy combatants is contested and was determined not by an adversary tribunal with counsel but by a CSRT. Guantanamo is not a theater of active combat and not occupied enemy territory; the United States has exercised complete jurisdiction and control there for over a century, in a facility it built, staffs, and governs entirely, answerable to no competing sovereign in fact. And there are no practical obstacles of the *Eisentrager* kind: the detainees are held in a secure facility administered under American law, litigation from Guantanamo has proceeded in the district court for years without disruption to military operations, and the Government has identified no friction with a host government, because there is none.</p><p>Counsel for Petitioners rightly conceded that this holding is not a charter for habeas wherever American forces tread. Elsewhere, jurisdiction would depend on facts and circumstances, including the terms of any status-of-forces agreement allocating control; justiciability doctrines and separation-of-powers concerns may counsel restraint; and on the merits, review would be anything but plenary, since members of enemy armed forces are detainable. Guantanamo presents the easy case.</p><p>The Suspension Clause therefore has full effect at Guantanamo. Because the MCA effects a withdrawal of the privilege and Congress has made no finding of rebellion or invasion and invoked no suspension, the Act is unconstitutional as applied to Petitioners *unless* Congress has supplied an adequate and effective substitute.</p><p>B. Ripeness</p><p>The Government says Petitioners must first seek DTA review. We disagree. Where the claim is that Congress has unconstitutionally stripped the court of jurisdiction, the adequacy of the substitute is the very question the Suspension Clause poses; requiring exhaustion would make the constitutional inquiry unanswerable until the injury is complete. More concretely, the costs of delay here are not hypothetical. Some Petitioners have been held for six years. The record shows that two years into DTA review the Government has not produced the record on review in a single case, has said it cannot do so, and has been invited by the Court of Appeals to conduct entirely new CSRT proceedings — with the Government proposing to proceed five cases at a time. Habeas is, above all, an expeditious remedy. To demand exhaustion on this record would be to require Petitioners to spend years pursuing the very process whose constitutional sufficiency is in doubt.</p><p>C. Adequacy of the Substitute</p><p>A substitute is adequate only if it affords the prisoner a meaningful opportunity to demonstrate that he is held pursuant to an erroneous application or interpretation of law, and gives the reviewing court authority to order release. DTA review fails on both counts.</p><p>First, the CSRT that generates the record is not an adjudication to which a reviewing court may safely defer. The detainee has no counsel, only a &quot;personal representative.&quot; He may be denied access to the classified evidence against him. A presumption operates in favor of the Government&#x27;s evidence as accurate and genuine. The record before us includes the colloquy in which Mr. Ait-Idir was accused of associating with a known Al Qaeda operative whom he was not permitted to name — an accusation impossible to rebut because it was impossible to identify.</p><p>Second, and decisively, the Court of Appeals on DTA review takes that ex parte, in camera record as given, carrying the same presumption, and will not receive new evidence. The consequence is illustrated by Mr. Kurnaz. Told at his CSRT — without counsel and without access to information — that he had associated with a man said to have died in a suicide bombing, he could say only that he had no reason to suspect the man of terrorism. When the Government filed the CSRT record as its factual return in habeas, counsel obtained within twenty-four hours affidavits from a German prosecutor and from the supposedly deceased man himself, alive in Dresden and never involved in terrorism. That exculpatory evidence could not have been developed in the CSRT and cannot be introduced on DTA review. A procedure that cannot correct so plain an error is not an adequate substitute for the Great Writ; it is a ratification of the Executive&#x27;s own file.</p><p>The Government&#x27;s rejoinder — that measured against 1789 the DTA is a &quot;remarkable liberalization&quot; — rests on the cramped view of the common law we have rejected, and on *Liversidge*, which we have explained away. Even taking the eighteenth-century baseline, a habeas court confronting executive detention without trial could and did consider affidavits from the prisoner and from third parties to determine whether he was in truth a prisoner of war. The DTA gives less. We do not prescribe the details of the proceedings on remand; the habeas court retains ample authority to protect classified information through protective orders and other safeguards, as Judge Green&#x27;s rulings demonstrate. What the Constitution requires is that the detainee have a meaningful opportunity to controvert the Government&#x27;s return with evidence, before a judge with power to order release.</p><p>D. The Remaining Question</p><p>Because we hold that Petitioners are entitled to proceed in habeas, we do not reach in the first instance whether the Fifth Amendment&#x27;s Due Process Clause or the Geneva Conventions supply independent relief. Those contentions, and the contention that the Executive&#x27;s definition of &quot;enemy combatant&quot; exceeds the authority conferred by the AUMF as construed in *Hamdi*, are properly addressed by the habeas court on a developed record.</p><p>---</p><p>IV. DISPOSITION</p><p>We hold: (1) the MCA does strip statutory habeas jurisdiction over these petitions; (2) the Suspension Clause has full effect at Guantanamo Bay, and because the DTA is not an adequate and effective substitute for habeas and Congress has not validly suspended the writ, the MCA&#x27;s jurisdictional bar is unconstitutional as applied to Petitioners; (3) Petitioners need not exhaust DTA review before raising that challenge; and (4) the remaining claims are left for the habeas court.</p><p>The judgment of the Court of Appeals is reversed, and the cases are remanded with instructions to return them to the District Court for prompt habeas proceedings consistent with this opinion.</p><p>It is so ordered.</p><p>RULING: Petitioner</p>", "error": "The D.C. Circuit ruled in the detainees' favor on both points.", "truth": "The D.C. Circuit ruled in favor of the government on both the MCA-applicability and Suspension Clause points.", "nmarks": 1}, {"id": "C066", "text": "<p>Opinion of the Court</p><p>Benjamin Carter worked for Kellogg Brown &amp; Root (“KBR”), a Government contractor providing logistical services to the United States military in Iraq. In 2006, Carter brought a qui tam action under the False Claims Act (“FCA”), alleging that KBR used fraudulent time sheets to overbill the Government.</p><p>Shortly before trial in 2010, the parties learned of an earlier-filed action asserting related claims.<mark class='err' data-n='1'> The District Court concluded that the earlier action triggered the FCA’s first-to-file bar and dismissed Carter’s suit.</mark> Carter filed the present complaint in 2011. KBR again moved to dismiss, contending both that the FCA’s six-year limitations period had expired and that another related action was pending when Carter filed.<mark class='err' data-n='2'> The District Court dismissed the complaint.</mark></p><p><mark class='tru' data-n='3'>The Court of Appeals for the Fourth Circuit reversed.</mark> It treated the Wartime Suspension of Limitations Act (“WSLA”) as suspending the limitations period for civil fraud claims and held that the first-to-file bar no longer prevented Carter’s action from proceeding because the related actions had been dismissed by the time of its decision. We granted review to determine whether the WSLA applies to private civil FCA actions and whether the first-to-file bar continues after the earlier action is no longer pending.</p><p>I. Governing Law</p><p>The WSLA, 18 U.S.C. § 3287, suspends the running of statutes of limitations applicable to certain “offense[s]” involving fraud against the United States while the Nation is at war or while a congressional authorization for the use of the Armed Forces remains in effect, and for a specified period thereafter.</p><p>In its statutory setting, “offense” refers to a crime. The WSLA appears in Title 18, and neighboring limitations provisions use “offense” in connection with indictment and criminal trial. That context supplies the term’s ordinary legal meaning. Congress has elsewhere used broader language—such as “violation,” or an express reference to both indictment and civil proceedings—when it intended a suspension provision to encompass civil liability.</p><p>The WSLA’s history does not establish that Congress transformed it into a civil tolling statute. Although Congress removed the words “now indictable” in 1944, that deletion does not clearly expand “offense” beyond its established criminal meaning. A fundamental enlargement of a criminal limitations provision to encompass all civil fraud actions would ordinarily be expressed more directly. The FCA, moreover, contains its own detailed limitations rules, including a discovery-based provision. Those specific civil rules should not be displaced by an expansive reading of a general criminal suspension statute.</p><p>The FCA’s first-to-file provision states:</p><p>&gt; “When a person brings an action under this subsection, no person other than the Government may intervene or bring a related action based on the facts underlying the pending action.”  <br>&gt; 31 U.S.C. § 3730(b)(5).</p><p>The word “pending” ordinarily describes an action that remains undecided or in progress. Once an action has been dismissed, it is no longer pending. The provision therefore does not impose a permanent, first-filed-case bar extending beyond the life of the earlier suit.</p><p>That conclusion does not render the provision ineffectual. While the first action remains pending, no private party may intervene in it or bring a related action. Other doctrines—including claim preclusion—may prevent repetitive litigation after a merits judgment. But those doctrines do not permit us to omit the word “pending” or convert it into “first-filed.”</p><p>The relevant time for application of § 3730(b)(5), however, is the time the later complaint is filed. If a related action is pending at that moment, the later action is barred. The subsequent dismissal of the earlier action does not retroactively validate a complaint that could not lawfully be brought when filed. The later relator may, subject to the applicable limitations period and other defenses, file a new action after the earlier one has ceased to be pending.</p><p>II. Application</p><p>Carter’s claim is civil. It was brought by a private relator under the FCA and seeks civil remedies for alleged fraudulent billing. Because the WSLA suspends limitations periods for criminal offenses, it does not toll the limitations period governing Carter’s suit. It is immaterial that the alleged conduct could also support a criminal prosecution or that the fraud occurred in connection with wartime contracting. The character of this proceeding is civil, and the WSLA does not make Carter’s otherwise untimely complaint timely.</p><p>The possibility of prolonged or effectively indefinite tolling reinforces, but does not independently dictate, that conclusion. Under the contrary interpretation, civil claims could remain viable for many years after the alleged conduct, depending on the formal termination of hostilities. Congress may enact such a rule, but the word “offense,” read in its statutory and historical context, does not establish that it did so here.</p><p>As to the first-to-file question, we agree with Carter that the bar does not persist forever merely because a related action was once filed. Section 3730(b)(5) is a one-case-at-a-time rule, not a one-case-ever rule. KBR’s proposed permanent bar cannot be reconciled with Congress’s use of “pending.”</p><p>That conclusion does not save Carter’s present complaint. The record establishes that a related action was pending when Carter filed the 2011 complaint. The complaint was consequently barred at the moment of filing. The later dismissal of the related action did not revive it.<mark class='err' data-n='4'> The Court of Appeals therefore erred insofar as it allowed this already-filed complaint to proceed based on events occurring after its filing.</mark></p><p>III. Disposition</p><p>We hold that the Wartime Suspension of Limitations Act does not toll the limitations period for civil claims under the False Claims Act, including qui tam claims brought by private relators. We further hold that the FCA’s first-to-file bar applies only while a related action remains pending, but that whether the bar applies is determined when the later action is filed. Because Carter’s present complaint was filed while a related action was pending and because the WSLA does not make his civil claim timely, the judgment permitting this action to proceed cannot stand.</p><p>The judgment of the Court of Appeals is vacated, and the case is remanded for proceedings consistent with this opinion.</p><p>RULING: Respondent</p>", "error": "The U.S. Court of Appeals for the Fourth Circuit affirmed the district court’s dismissal of Carter’s complaint.", "truth": "The U.S. Court of Appeals for the Fourth Circuit reversed the district court’s dismissal of Carter’s complaint.", "nmarks": 4}, {"id": "C067", "text": "<p>IN THE SUPREME COURT</p><p>United States Forest Service, et al., *Petitioner,*<br>v.<br>Earth Island Institute, et al., *Respondents.*</p><p>OPINION OF THE COURT</p><p>---</p><p>I. Procedural History</p><p><mark class='tru' data-n='1'>Respondents Earth Island Institute and affiliated conservation organizations sued the Forest Service in the Eastern District of California, challenging regulations promulgated in 2003 that exempt certain categorically excluded site-specific activities from the notice, comment, and administrative appeal procedures that the Forest Service Decision Making and Appeals Reform Act (&quot;ARA&quot;) directs the agency to establish.</mark> The complaint joined that facial challenge to the regulations with an as-applied challenge to a particular timber sale, the Burnt Ridge Project, to which the challenged regulations had in fact been applied.</p><p>The Burnt Ridge claim was resolved by settlement; the sale was withdrawn and that portion of the case was dismissed.<mark class='err' data-n='2'> The district court nonetheless proceeded to the freestanding challenge to the regulations, held them contrary to the ARA, and — as respondents&#x27; counsel clarified at argument — entered declaratory relief, declining an injunction.</mark><mark class='err' data-n='3'> The Ninth Circuit affirmed the invalidation of the regulations, reasoning that if Congress had intended to permit the Forest Service to curtail notice, comment, and appeal for categorically excluded activities, it would not have enacted the ARA, and it sustained (indeed imposed in the first instance) nationwide injunctive relief covering ten categories of projects across all national forests.</mark> For standing, the court of appeals relied principally on the declaration of Mr. Bensman, reproduced at pages 70a–71a of the petition appendix.</p><p>This Court granted certiorari on two related jurisdictional questions: whether respondents have Article III standing to challenge the regulations absent a live dispute over their application, and whether the challenge remained ripe after the Burnt Ridge sale was withdrawn and that claim dismissed. We do not reach the merits of the ARA construction, nor the propriety of nationwide relief.</p><p><mark class='err' data-n='4'>At the outset, we note that both sides have litigated this appeal without resort to personal attack, and each has made candid concessions — petitioner acknowledging that the agency&#x27;s own scoping practices supply notice in many cases, and respondents acknowledging that the Ninth Circuit &quot;may have said a bit much&quot; in treating nationwide relief as compelled by the APA&#x27;s text, and that one authority pressed at argument (Northeastern Florida Chapter of Contractors) was not briefed.</mark> We consider that authority, but its lateness is immaterial to the outcome.</p><p>II. Governing Law</p><p>Article III confines the judicial power to &quot;Cases&quot; and &quot;Controversies,&quot; and the doctrine of standing is an essential element of that limitation. A plaintiff must demonstrate (1) an injury in fact that is concrete, particularized, and actual or imminent, not conjectural or hypothetical; (2) causation fairly traceable to the challenged conduct; and (3) redressability. *Lujan v. Defenders of Wildlife*, 504 U.S. 555 (1992). An organization may sue on behalf of its members only if at least one identified member would have standing in his own right. *Sierra Club v. Morton*, 405 U.S. 727 (1972).</p><p>Where a plaintiff asserts deprivation of a procedural right, the ordinary requirements of immediacy and redressability are relaxed: a person accorded a procedural right to protect his concrete interests may sue without meeting the normal standards for those two elements. *Defenders*, 504 U.S. at 572 n.7. But that relaxation is conditioned on the existence of a *concrete interest* that the procedure protects. &quot;Deprivation of a procedural right without some concrete interest that is affected by the deprivation — a procedural right in vacuo — is insufficient to create Article III standing.&quot; The plaintiff must therefore identify an actual or imminently threatened application of the challenged procedure to a concrete interest of an identified member.</p><p>Standing is assessed claim by claim and as of the commencement of suit, but jurisdiction must exist at all stages. When the only live application of a challenged rule departs the case by settlement, the remaining freestanding claim must stand on its own jurisdictional footing.</p><p>The APA reinforces, and does not displace, these limits. Section 702 affords review to a person &quot;adversely affected or aggrieved by agency action,&quot; and § 706 directs that agency procedures be reviewed in a challenge to the final agency action in which they were applied. As this Court explained in *Lujan v. National Wildlife Federation*, 497 U.S. 871 (1990), &quot;[a] regulation is not ordinarily considered the type of agency action &#x27;ripe&#x27; for judicial review under the APA until the scope of the controversy has been reduced to more manageable proportions, and its factual components fleshed out, by some concrete action applying the regulation to the claimant&#x27;s situation in a fashion that harms or threatens to harm him.&quot;</p><p>Ripeness turns on the fitness of the issues for decision and the hardship of withholding review. *Abbott Laboratories v. Gardner*, 387 U.S. 136 (1967). Where a rule governs only the internal procedures the agency will follow in approving site-specific projects, and imposes no obligation and no immediate practical effect on the plaintiff&#x27;s primary conduct, the hardship prong is ordinarily unsatisfied. *Ohio Forestry Ass&#x27;n v. Sierra Club*, 523 U.S. 726 (1998).</p><p>III. Application</p><p>A. The settled claim cannot carry the freestanding challenge.</p><p>At filing, respondents had a live controversy: the Burnt Ridge Project applied the challenged regulations to a specific tract in which identified members — Mr. Marderosian among them — had concrete recreational and aesthetic interests, and as to which one of them submitted a 23-page comment. Had that claim survived, this would be a different case; a plaintiff injured by a concrete application may in an appropriate case seek relief reaching the rule that produced the injury.</p><p>But respondents settled that claim and obtained the withdrawal of the sale. A settlement is a voluntary relinquishment of the concrete dispute, not a preservation of it. Having secured all they sought as to Burnt Ridge, respondents cannot use the dismissed claim as a jurisdictional passport for a nationwide facial attack. The question is therefore whether the remaining claim — a challenge to procedural regulations &quot;standing alone,&quot; as petitioner accurately characterizes it — is supported by an independent showing of imminent injury to an identified member.</p><p>B. The declarations do not supply that showing.</p><p>The Bensman declaration, on which the court of appeals rested, does not. As petitioner demonstrates from the appendix, the allegations bearing on the regulations *at issue here* occupy a narrow compass at 70a–71a; the balance concerns other regulations no longer in the case. The only specific projects identified are timber sales — and in the one instance described, the Allegheny National Forest scoping notice for a series of sales, the declarant *knew of* and *commented on* the projects. That recitation, whatever else it shows, does not describe a member deprived of participation in an imminent, identified project governed by the challenged exemptions. The remainder amounts to an intention to visit unnamed forests at unspecified times — the &quot;some day&quot; intentions that *Defenders* holds insufficient because they lack &quot;any description of concrete plans, or indeed even any specification of when the some day will be.&quot;</p><p>Respondents&#x27; strongest rejoinder is that the regulations are stipulated to apply on an ongoing basis in every national forest, so that injury to *some* member is a statistical near-certainty. The premise is accepted; the conclusion does not follow. Article III requires that an identified member be injured, not that injury be probable somewhere within an organization&#x27;s membership. To accept a probabilistic theory would dispense with the particularity requirement altogether whenever a large organization challenges a rule of general application — which is to say, always. That is a generalized grievance about the lawfulness of government conduct, a grievance respondents share with every citizen who cares about the national forests, and it is committed to the political branches, not to the courts.</p><p>The later-filed declarations do not cure the defect. Respondents argue that although filed after judgment, they describe events antedating it, and that standing is a &quot;practical&quot; inquiry. Practicality does not extend to establishing jurisdiction retroactively by supplementation after the district court has ruled; and in any event, the supplemental materials repeat the same generality — ongoing application of the rules to forests at large — that renders the core showing inadequate.</p><p>C. Respondents&#x27; authorities are distinguishable.</p><p>Respondents&#x27; analogies are not frivolous and deserve direct answer.</p><p>*Sullivan v. Zebley* and *Thomas v. Union Carbide* confirm that facial challenges to published regulations are sometimes entertained. But in each the challenged rule had already operated upon the plaintiff to deny a benefit or to compel participation in a scheme; the plaintiffs&#x27; own concrete stakes were fixed. Respondents&#x27; own formulation of the test — that facial review is permitted &quot;where the regulation has been applied&quot; — is the answer to their claim, because the one application to them has been settled away. Indeed, respondents&#x27; citation of *National Park Hospitality Ass&#x27;n*, held unripe precisely because the rule &quot;had not yet been applied,&quot; underscores the point.</p><p>*Blum v. Yaretsky* and *Northeastern Florida Contractors* involved plaintiffs with a demonstrated history of repeated, identified encounters with the challenged practice — transferred nursing-home residents, regular bidders on a defined stream of municipal contracts — making recurrence concrete rather than conjectural. Here, by contrast, the challenged exemptions attach to discrete, unpredictable, locally sited projects across 190-odd million acres; no declarant has tied himself to any identified forthcoming project. The *Methow Valley* observation in *Defenders* footnote 8 and Justice Kennedy&#x27;s concurrence likewise concerned plaintiffs whose local, site-specific stake was self-evident from the record. Respondents&#x27; declarants&#x27; local stake — Sequoia for Mr. Marderosian — was tied to Burnt Ridge, and Burnt Ridge is gone.</p><p>*FEC v. Akins* and *Havens Realty* are invoked only tentatively, and respondents expressly disclaim reliance on organizational standing. We accept that disclaimer and rest on representational standing, which fails for the reasons given.</p><p>D. Ripeness independently bars review.</p><p>Even assuming a member could show some attenuated injury, the freestanding claim is not ripe. The challenged rules regulate nothing that respondents do; they govern the internal procedures the agency will follow before approving a site-specific action. They impose no obligation and alter no primary conduct, and the harm they may cause is entirely contingent on which future projects are proposed, where, and whether the exemptions are invoked. Under *Abbott Labs* and *Ohio Forestry*, that is the paradigm of a claim that should await concrete application, when the controversy will be reduced to manageable proportions and the factual setting fleshed out. Section 706 of the APA points the same way: procedural error is reviewed in a challenge to the final agency action in which the procedure was employed. Should the Forest Service approve a project without the notice or appeal the ARA requires, an aggrieved plaintiff may say so then, in a suit that identifies the forest, the project, and the injury. Nothing in today&#x27;s ruling forecloses that.</p><p>E. Arguments we do not accept from the prevailing party.</p><p>We reject several of petitioner&#x27;s contentions, and record that they play no part in the result.</p><p>First, petitioner&#x27;s suggestion that the ARA &quot;is not written in terms of conferring rights on individuals&quot; and merely &quot;fine-tune[s]&quot; internal housekeeping is unpersuasive. A statute directing the agency to establish an appeals process &quot;providing an opportunity for notice and comment&quot; creates precisely the kind of participatory procedure whose denial is a cognizable procedural injury — when, and only when, it is tethered to a concrete interest in an identified project. The defect in respondents&#x27; case is the absent tether, not the absence of a protectable procedural right.</p><p>Second, petitioner&#x27;s extended showing that the Sierra Club and its declarants receive abundant notice through the Schedule of Proposed Actions and scoping letters, and that Mr. Bensman&#x27;s organization declines to subscribe to local newspapers, is largely beside the jurisdictional point and verges on a merits defense of the regulations. That members are diligent monitors of agency activity neither establishes nor defeats standing; it is their inability to identify an imminent, particular application that is dispositive.</p><p>Third, we express no view on petitioner&#x27;s arguments concerning the scope of relief — whether &quot;set aside&quot; in § 706 operates nationwide, or whether *United States v. Mendoza* interests were properly weighed. Those questions are substantial, but a court without jurisdiction has no occasion to calibrate a remedy.<mark class='err' data-n='5'> We note only that the Ninth Circuit&#x27;s imposition of a nationwide injunction in the first instance, after the district court had deliberately confined itself to declaratory relief, sits uneasily with ordinary principles of appellate restraint.</mark></p><p>IV. Disposition</p><p>Respondents&#x27; freestanding challenge to the 2003 regulations, shorn of the settled Burnt Ridge claim, rests on no identified member&#x27;s imminent, concrete injury, and is in any event unripe for review.<mark class='err' data-n='6'> The judgment of the Court of Appeals for the Ninth Circuit is reversed as to the freestanding challenge to the regulations, the nationwide injunction and declaratory judgment are vacated, and the cause is remanded with instructions to dismiss that claim for want of jurisdiction.</mark> The dismissal is without prejudice to any future challenge brought upon a concrete application of the regulations.</p><p>*It is so ordered.*</p><p>RULING: Petitioner</p>", "error": "The district court denied injunctive relief and entered only a declaratory judgment, while the Ninth Circuit imposed the nationwide injunction in the first instance.", "truth": "The district court found for Earth Island and issued a nationwide injunction against the Forest Service; the Ninth Circuit affirmed that ruling.", "nmarks": 6}, {"id": "C068", "text": "<p>Opinion of the Court</p><p>This case concerns the proper test for determining who may maintain a false-advertising action under §43(a) of the Lanham Act. Specifically, we decide whether courts should import the multifactor standing test developed for antitrust actions in *Associated General Contractors* (“AGC”).</p><p>I. Procedural History</p><p>Lexmark International, Inc., a manufacturer of printers and toner cartridges, sued Static Control Components, Inc. (“SCC”), alleging that SCC infringed Lexmark’s intellectual-property rights by manufacturing microchips used to repair and resell Lexmark toner cartridges. SCC counterclaimed, alleging, among other things, that Lexmark violated the Lanham Act through false advertising directed to cartridge remanufacturers.</p><p><mark class='tru' data-n='1'>The District Court dismissed SCC’s Lanham Act claims for lack of standing.</mark><mark class='tru' data-n='2'> The Court of Appeals for the Sixth Circuit reversed, concluding that the District Court had applied the wrong standing test.</mark><mark class='tru' data-n='3'> The Sixth Circuit employed a “reasonable interest” test, under which a claimant must show a reasonable interest to be protected against the alleged advertising and a reasonable basis for believing that the advertising will damage that interest.</mark> Unlike several other circuits, it declined to apply the antitrust factors identified in AGC.</p><p><mark class='err' data-n='4'>One excerpt in the Petitioner’s submission states that the Sixth Circuit affirmed dismissal.</mark><mark class='tru' data-n='5'> That statement conflicts with the stipulated procedural history, which establishes that the Sixth Circuit reversed.</mark> We therefore rely on the stipulated record.<mark class='tru' data-n='6'> This Court granted review to resolve whether the test governing a Lanham Act false-advertising plaintiff is the same as the standing test used under the antitrust statutes.</mark></p><p>II. Governing Law</p><p>Section 43(a) of the Lanham Act creates a civil action against a person who, in commercial advertising or promotion, misrepresents the nature, characteristics, qualities, or geographic origin of goods, services, or commercial activities. The statute authorizes suit by a person who believes that he or she is or is likely to be damaged by the prohibited conduct. Section 45 further identifies protection against unfair competition as one of the Act’s purposes.</p><p>Whether SCC has a statutory cause of action is distinct from whether it possesses Article III standing. The parties do not meaningfully dispute that SCC alleges a concrete economic injury traceable to Lexmark’s conduct and redressable through judicial relief. The disputed issue is whether SCC falls within the class of plaintiffs Congress authorized to sue.</p><p>That inquiry has two components.</p><p>First, the plaintiff’s asserted interests must fall within the Lanham Act’s zone of interests. In a false-advertising action, the plaintiff must allege injury to a commercial interest in reputation, goodwill, or sales. Harm suffered solely as a consumer, or an injury unrelated to commercial competition and marketplace reputation, ordinarily does not suffice.</p><p>Second, the plaintiff’s injury must have been proximately caused by the statutory violation. A plaintiff ordinarily satisfies that requirement by alleging economic or reputational injury flowing directly from deception produced by the defendant’s advertising—for example, where deception causes customers to withhold trade from the plaintiff. A merely remote, derivative, or incidental loss is insufficient.</p><p>The antitrust-specific AGC test does not govern this inquiry. Although some AGC considerations may overlap with ordinary proximate-cause principles, its complete multifactor framework reflects the language, history, remedial structure, and policy concerns of the antitrust statutes. The Lanham Act does not direct courts to transplant that framework.</p><p><mark class='tru' data-n='7'>We likewise decline to adopt the Sixth Circuit’s “reasonable interest” formulation as the controlling test.</mark> Its open-ended language does not adequately anchor the inquiry in the statutory zone of interests and traditional proximate-cause principles. The judgment below may nevertheless be affirmed if SCC’s allegations satisfy the correct standard.</p><p>III. Application</p><p>SCC alleges that Lexmark told cartridge remanufacturers that remanufacturing Lexmark cartridges—and, specifically, using SCC’s products to do so—would violate Lexmark’s legal rights. According to SCC, those representations were false and caused remanufacturers to refrain from purchasing SCC’s microchips. SCC therefore alleges both lost sales and injury to the commercial reputation of its products.</p><p>Those alleged injuries fall within the Lanham Act’s zone of interests. SCC is not proceeding as a disappointed consumer or asserting a generalized interest in truthful advertising. It claims injury to its own sales and commercial standing resulting from statements concerning the legality and usability of its goods. Such interests are central, rather than tangential, to the Act’s protection against unfair competition.</p><p>SCC also adequately alleges proximate causation. The asserted causal chain is straightforward: Lexmark allegedly made false statements to SCC’s existing or prospective customers concerning SCC’s products; those customers relied on the statements and withheld purchases; SCC consequently lost sales and suffered reputational harm. The participation of cartridge remanufacturers in that chain does not make SCC’s injury impermissibly remote. Consumer or customer reliance is often the means by which false advertising injures another commercial actor.</p><p>Respondent correctly observes
