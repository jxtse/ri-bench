result.</mark> The case is now before this Court to resolve whether evidence supporting federal jurisdiction must accompany a notice of removal.</p><p>Governing Law</p><p>CAFA gives federal district courts original jurisdiction over certain class actions where, among other requirements, the proposed class has at least 100 members, minimal diversity exists, and the matter in controversy exceeds $5 million in the aggregate. 28 U.S.C. § 1332(d).</p><p>The removal statute requires a defendant to file “a notice of removal signed pursuant to Rule 11 of the Federal Rules of Civil Procedure and containing a short and plain statement of the grounds for removal.” 28 U.S.C. § 1446(a). That language mirrors the pleading standard applicable to a complaint. It requires a good-faith jurisdictional allegation, not evidentiary proof accompanying the initial notice.</p><p>Where the plaintiff contests the removing defendant’s amount-in-controversy allegation, or where the court properly questions it, the defendant must then establish the amount in controversy by a preponderance of the evidence. See 28 U.S.C. § 1446(c)(2)(B). The statute thus distinguishes between an allegation in a notice of removal and proof required once that allegation is challenged.</p><p>Nothing in § 1446(a) requires a defendant to attach affidavits, business records, expert calculations, or other evidence to the notice itself. Requiring such evidence at the outset would improperly convert a “short and plain statement” into an evidentiary submission requirement that Congress did not enact.</p><p>Application to the Record</p><p>The defendants’ notice alleged that the amount in controversy exceeded $8 million—well above CAFA’s $5 million jurisdictional minimum. Although the notice did not include supporting evidence, the absence of attachments did not render the notice deficient under § 1446(a).</p><p>Respondent argues that the allegation was conclusory and that defendants possessed information from which damages could have been calculated. But a defendant’s obligation at the notice stage is to allege, in good faith and consistent with Rule 11, facts supporting the existence of federal jurisdiction. It need not prove those facts before any party or court has put them in dispute.</p><p>To be sure, the amount-in-controversy allegation is not immune from scrutiny. Once contested, defendants bear the burden to demonstrate jurisdictional facts by a preponderance of the evidence. Respondent may challenge the asserted damages, including by showing that certain leases authorize deductions or that the defendants’ ownership interest reduces the recoverable amount. Those issues concern the evidence ultimately bearing on the amount in controversy. They do not justify a categorical rule requiring evidence to be submitted with every notice of removal.</p><p><mark class='tru' data-n='3'>The district court remanded solely because defendants did not supply evidence with their notice.</mark> That was legal error. The court should have accepted the jurisdictional allegation unless and until it was properly challenged, at which point it could require evidence and determine whether CAFA’s jurisdictional requirements were in fact met.</p><p>Disposition</p><p>The judgment remanding the action is reversed, and the matter is remanded for proceedings consistent with this opinion, including any appropriate determination of the amount in controversy should it be contested.</p><p>RULING: Petitioner</p>", "error": "The Tenth Circuit affirmed the district court's remand.", "truth": "The Tenth Circuit held that the district court should not have remanded the case.", "nmarks": 3}, {"id": "C088", "text": "<p>This case comes to us from the Supreme Court of South Carolina. Adoptive Couple, residents of South Carolina, initiated proceedings to adopt Baby Girl, whose biological mother had decided to place her for adoption. The biological father was a registered member of the Cherokee Nation.<mark class='tru' data-n='1'> After the Cherokee Nation intervened and asserted that Baby Girl was an “Indian child” under the Indian Child Welfare Act (ICWA), the father opposed the adoption and sought custody.</mark></p><p><mark class='tru' data-n='2'>The family court denied the adoption petition and awarded custody to the biological father.</mark><mark class='tru' data-n='3'> It concluded that the father qualified as a “parent” under ICWA because he was Baby Girl’s biological father and sought custody after learning of the adoption.</mark> The court further concluded that Adoptive Couple had failed to comply with ICWA’s requirements concerning parental consent and remedial efforts. The Supreme Court of South Carolina affirmed.<mark class='tru' data-n='4'> We granted review to determine whether ICWA permits a noncustodial, unwed biological father to block an adoption voluntarily initiated by a non-Indian parent and whether ICWA treats such a father as a “parent” absent compliance with state-law requirements for attaining legal parental status.</mark></p><p>I. Governing Law</p><p>Congress enacted ICWA in response to the unwarranted removal of many Indian children from their families and tribes. The statute establishes minimum federal standards governing the removal of Indian children from their families and the termination of parental rights. It also protects the interests of Indian tribes in maintaining their political and cultural communities.</p><p><mark class='err' data-n='5'>ICWA defines “parent” as a biological parent of an Indian child or an Indian person who has lawfully adopted the child.</mark> But the statute expressly provides that the term does not include “the unwed father where paternity has not been acknowledged or established.”</p><p>Several ICWA provisions are relevant. Section 1912(d) requires a party seeking to terminate parental rights to demonstrate that active efforts have been made to provide remedial and rehabilitative services designed to prevent the breakup of the Indian family, and that those efforts have proved unsuccessful. Section 1912(f) permits termination of parental rights only upon proof beyond a reasonable doubt that continued custody by the parent is likely to result in serious emotional or physical damage to the child. Section 1913 governs the withdrawal of consent to adoption. These provisions protect parental rights that exist; they do not independently create parental rights in a person who lacks them under the statute and applicable state law.</p><p>ICWA’s provisions must therefore be read in light of the distinction between (1) protecting an existing Indian family from unwarranted separation and (2) establishing a parental relationship where none has been legally recognized. The statute addresses the former.<mark class='tru' data-n='6'> It does not give every biological father an absolute veto over an otherwise lawful adoption.</mark></p><p>II. Application</p><p>Baby Girl is an Indian child for purposes of ICWA because of her biological connection to the Cherokee Nation.<mark class='err' data-n='7'> That conclusion, however, does not resolve whether the biological father is a “parent” within the meaning of the Act.</mark></p><p>The father was not married to the mother, never lived with Baby Girl, and did not provide financial support during the mother’s pregnancy. The record further indicates that he did not comply with the state-law requirements necessary for an unwed father to establish legal parental status. The text message in which he stated that he would relinquish his rights did not establish paternity or otherwise demonstrate that he had assumed the legal responsibilities of parenthood.<mark class='tru' data-n='8'> Nor did his later assertion of a desire for custody transform him into a parent under ICWA.</mark></p><p>The statutory exclusion of an unwed father whose paternity has not been acknowledged or established is decisive. Congress did not define “parent” to include every biological connection. It required an unwed father to take the legal or affirmative steps necessary to establish paternity.<mark class='err' data-n='9'> Because the father had not done so, he was not a “parent” entitled to invoke ICWA’s parental protections.</mark></p><p>The lower courts also erred in treating sections 1912(d) and 1912(f) as barriers to the adoption. Section 1912(d) is directed at efforts to prevent the breakup of an existing Indian family. It requires remedial and rehabilitative efforts when a parent’s existing relationship with the child is at risk of being severed. It does not require adoptive parents to provide services to a biological father who has never established a legal or custodial relationship with the child, nor does it create such a relationship by default.</p><p>Section 1912(f) likewise concerns the termination of an existing parental relationship. It does not require proof beyond a reasonable doubt that placement with a noncustodial biological father would harm the child before an adoption may proceed. The provision cannot be used to convert the father’s unestablished biological claim into a legally protected custodial right.</p><p>The father’s reliance on section 1913 is similarly misplaced. That provision governs the withdrawal of a valid consent to adoption. The father’s statement that he would relinquish his rights did not constitute a legally effective consent by which he acquired a right to withdraw consent under ICWA. More fundamentally, the adoption could not be blocked by applying a consent-withdrawal provision to a person who had not established the parental status protected by the Act.</p><p>This conclusion does not diminish the interests of the Cherokee Nation or the protections Congress enacted for Indian children. It simply gives effect to the statutory boundary Congress drew.<mark class='tru' data-n='10'> ICWA protects Indian families and the existing parental rights of Indian parents; it does not authorize a noncustodial, unwed biological father who has not established paternity under state law to prevent an adoption solely because the child is an Indian child.</mark></p><p><mark class='tru' data-n='11'>Accordingly, the South Carolina courts erred in holding that the father was an ICWA “parent” and in awarding him custody on that basis.</mark> The judgment must be reversed and the matter remanded for proceedings consistent with this opinion, including consideration of any remaining issues under state law and any ICWA provisions properly applicable to the adoption.</p><p>RULING: Petitioner</p>", "error": "The family court held that the biological father was not a “parent” under ICWA.", "truth": "The family court held that the biological father was a “parent” under ICWA because of his paternity and his pursuit of custody upon learning of the adoption.", "nmarks": 11}, {"id": "C089", "text": "<p>In the Supreme Court of the United States</p><p>FLOWERS, Petitioner, v. MISSISSIPPI, Respondent</p><p><mark class='err' data-n='1'>*On writ of certiorari to the Supreme Court of Mississippi*<br></mark><br>---</p><p>I. Procedural History</p><p>This case comes to the Court on the sixth trial of a single defendant for a single 1996 quadruple homicide at a furniture store in Winona, Mississippi. Petitioner Curtis Flowers has been tried six times by the same prosecutor, District Attorney Doug Evans.</p><p><mark class='err' data-n='2'>The first trial, for the murder of one employee, ended in conviction and a death sentence; the Supreme Court of Mississippi reversed because of the prejudicial admission of evidence concerning the other three victims.</mark> The second trial, for the murder of a second employee, ended the same way and was reversed on the same ground.<mark class='err' data-n='3'> The third trial joined all four counts and produced a conviction and death sentence, which the Supreme Court of Mississippi reversed upon finding that the prosecutor had engaged in purposeful racial discrimination in jury selection — the second judicial finding in this litigation that the State&#x27;s use of its peremptory strikes was infected by race.</mark> The fourth and fifth trials, also on all four counts, ended in mistrials when the juries could not reach unanimity at the guilt phase.</p><p>The sixth trial, again on all four counts and again prosecuted by Mr. Evans, resulted in conviction and a sentence of death.<mark class='tru' data-n='4'> Among the grounds Flowers pressed on appeal was that the State had exercised its peremptory challenges in a racially discriminatory manner, in violation of the Sixth and Fourteenth Amendments and *Batson v.</mark> Kentucky*, 476 U.S. 79 (1986). The State struck five African-American prospective jurors.<mark class='tru' data-n='5'> The Supreme Court of Mississippi rejected the *Batson* claim.</mark></p><p>This Court granted certiorari, vacated, and remanded for reconsideration in light of *Foster v. Chatman*, 578 U.S. ___ (2016).<mark class='tru' data-n='6'> On remand the Supreme Court of Mississippi again affirmed, holding in the alternative that the claim was procedurally defaulted and that, on the merits, the State&#x27;s race-neutral explanations were supported by the record.</mark><mark class='tru' data-n='7'> We again granted certiorari, limited to whether the Supreme Court of Mississippi erred in its application of *Batson*.</mark> We hold that it did.</p><p>II. Governing Law</p><p>*Batson* held that the Equal Protection Clause forbids a prosecutor from striking a prospective juror on account of race. The prohibition protects three distinct interests: the defendant&#x27;s right to a jury selected by nondiscriminatory criteria; the excluded juror&#x27;s right not to be denied participation in civic life because of her race; and the public&#x27;s confidence in the fairness of the criminal justice system. *Powers v. Ohio*, 499 U.S. 400 (1991).</p><p>The familiar framework has three steps. The defendant must make a prima facie showing that a strike was exercised on the basis of race; the burden then shifts to the State to offer a race-neutral explanation; and the trial court must then decide whether the defendant has carried his burden of proving purposeful discrimination. *Batson*, 476 U.S. at 96–98. The third step is the decisive one, and it is not satisfied by the mere recitation of a facially neutral reason. A reason that is neutral on its face may nonetheless be pretextual, and the court must determine whether it is.</p><p>Three principles drawn from this Court&#x27;s later cases govern the third-step inquiry here.</p><p>*First*, the court must undertake &quot;a sensitive inquiry into such circumstantial and direct evidence of intent as may be available,&quot; *Batson*, 476 U.S. at 93, and must consider &quot;all of the circumstances that bear upon the issue of racial animosity,&quot; *Snyder v. Louisiana*, 552 U.S. 472, 478 (2008). The evidence is to be assessed cumulatively, not item by item. A court that disposes of each strand of evidence in isolation — asking of each, standing alone, whether it compels a finding of discrimination — has not applied *Batson*; it has evaded it. *Foster*, 578 U.S. ___.</p><p>*Second*, the historical record of the prosecutor&#x27;s conduct is part of &quot;all of the circumstances.&quot; *Miller-El v. Dretke*, 545 U.S. 231 (2005), rested in substantial part on the prosecuting office&#x27;s past practices in jury selection. Respondent concedes the point: counsel acknowledged at argument that &quot;as this Court has held in *Miller-El*, history is part of the consideration.&quot; Where the history is not the diffuse history of an office over decades but the specific history of the same prosecutor, in the same case, against the same defendant — including a prior judicial finding of purposeful discrimination — it is probative in the highest degree. A court may not, as Respondent invites, &quot;take that out of the case.&quot;</p><p>*Third*, disparate questioning of prospective jurors by race, side-by-side comparison of struck minority jurors with similarly situated seated white jurors, misstatements of the record offered in support of a strike, and investigative efforts directed at minority panelists alone are all recognized indicia of pretext. *Miller-El*, 545 U.S. at 241–52; *Snyder*, 552 U.S. at 483–84; *Foster*, 578 U.S. ___.</p><p>Finally, a federal claim is not insulated from review by an asserted state procedural bar unless the state ground is both independent of federal law and adequate to support the judgment.<mark class='tru' data-n='8'> Where the state court has in fact adjudicated the federal claim on the merits — as the Supreme Court of Mississippi did here, both originally and on remand from this Court&#x27;s *Foster* order — the procedural ruling is not independent, and we may reach the merits.</mark></p><p>III. Application</p><p>We take Respondent&#x27;s threshold argument first. Counsel maintained that &quot;the Mississippi Supreme Court properly dismissed Flowers&#x27;s *Batson* claim as procedurally defaulted.&quot; But that court did not rest on default alone; it proceeded to evaluate, and to accept, the State&#x27;s asserted race-neutral justifications for each strike, and it did so again after this Court remanded for reconsideration in light of *Foster*. A state court that reaches and resolves the federal question has not placed its judgment on a ground independent of federal law. The merits are properly before us.</p><p>On the merits, the cumulative record is extraordinary.</p><p>The numerical history. Across the first four trials, the State exercised 36 peremptory challenges, every one of them against an African-American prospective juror. In the sixth trial, the State used five of its six strikes against African-American panelists. Respondent does not dispute these figures; counsel answered &quot;Yes, Your Honor, that is correct.&quot; Numbers alone rarely decide a *Batson* claim, but a pattern this absolute is powerful circumstantial evidence of intent. And this history includes something more than statistics: two prior judicial findings, in this very prosecution, that this very prosecutor discriminated on the basis of race in selecting a jury. Respondent characterizes that history as &quot;troubling&quot; but &quot;confined to this case.&quot; That is precisely what makes it damning rather than exculpatory.</p><p>Disparate questioning. The State posed an average of 29 questions to each struck African-American panelist and an average of 1.1 questions to each seated white juror. Respondent&#x27;s explanation — that Winona is a town of roughly 5,000 people in which connections to the parties abound — does not answer the disparity. If small-town familiarity generated a need for searching voir dire, that need would have applied with equal force to white panelists, who were asked essentially nothing. A justification that explains the questioning of Black panelists but not the non-questioning of white panelists explains nothing at all. Petitioner is also correct that the disparity extended beyond raw counts to tone: the record shows aggressive interrogation of an African-American panelist until an initial disclaimer of difficulty was converted into a concession that bias was &quot;possible,&quot; an approach not taken with white panelists.</p><p>Comparators and the accuracy of the proffered reasons. Respondent asserts that each struck juror &quot;either worked with a relative, were related, or knew, intimately, family members&quot; of the defendant. The difficulty is that seated white jurors bore comparable connections to the case and to the Flowers family and were neither questioned nor struck. Under *Miller-El* and *Foster*, a reason that applies equally to an unstruck white juror is evidence that the reason is not the real one.</p><p>The treatment of the panelist said to have worked alongside Flowers&#x27;s relative illustrates the point. The panelist volunteered the acquaintance; the State offered no reason to doubt her account of its limits; the State nonetheless produced a witness who asserted the two worked in close proximity and claimed documentary records would confirm it; and when the records were requested, they were never produced. Respondent&#x27;s reply — that the witness was brought back the next day — does not cure the failure to substantiate. A strike defended by an assertion the State declined to document, against a panelist whose own account the State had no independent reason to disbelieve, bears the hallmarks of pretext.</p><p>Out-of-court investigation. The State investigated three African-American panelists outside the courtroom and no white panelist. As Petitioner conceded, a prosecutor may investigate venire members; but investigation applied by race is itself evidence of race-based selection.</p><p>Institutional context. Respondent&#x27;s observation that the Attorney General&#x27;s Office could assume the prosecution only upon the district attorney&#x27;s request, and was not so requested, is accurate as a matter of state law but irrelevant to the constitutional question. The absence of a mechanism to displace a prosecutor does not lower the constitutional standard applicable to his conduct.</p><p>The error of the court below was methodological. Confronted with this record, it examined each strike in isolation, asked whether the State&#x27;s stated reason for that strike was facially neutral, and, finding that it was, moved on — while setting the prosecutor&#x27;s history to one side. *Batson*, as elaborated in *Miller-El*, *Snyder*, and *Foster*, requires the opposite: a cumulative assessment of all relevant circumstances. Undertaken properly, that assessment here yields only one plausible conclusion. The State&#x27;s strikes in the sixth trial were motivated in substantial part by discriminatory intent.<mark class='err' data-n='9'> The trial court&#x27;s contrary conclusion was clearly erroneous, and the Supreme Court of Mississippi erred in sustaining it.</mark></p><p>We do not hold that a prosecutor&#x27;s history is dispositive, nor that a single strike in a vacuum would suffice. We hold that where the history of this case, the numerical pattern, the disparate questioning, the unsupported and comparator-defeated justifications, and the race-selective investigation all point the same direction, *Batson* is violated.</p><p>IV. Disposition</p><p><mark class='err' data-n='10'>The judgment of the Supreme Court of Mississippi is reversed, and the case is remanded for further proceedings not inconsistent with this opinion.</mark></p><p>RULING: Petitioner</p>", "error": "The Mississippi Supreme Court dismissed Flowers’s Batson claim as procedurally defaulted.", "truth": "The Mississippi Supreme Court rejected Flowers’s jury-selection arguments and, on remand, again upheld the ruling for the State; it did not dismiss his Batson claim as procedurally defaulted.", "nmarks": 10}, {"id": "C090", "text": "<p>Opinion of the Court</p><p>I. Procedural History</p><p>Markkaya Jean Gullett, a Montana resident, died after a tire tread separated while she was driving a Ford Explorer on a Montana highway, causing the vehicle to leave the road and roll into a ditch.<mark class='err' data-n='1'> The personal representative of Gullett’s estate brought design-defect, failure-to-warn, and negligence claims against Ford Motor Company in Montana state court.</mark></p><p><mark class='err' data-n='2'>Ford moved to dismiss for lack of personal jurisdiction.</mark> Ford is incorporated in Delaware and headquartered in Michigan. The Explorer was assembled in Kentucky and initially sold in Washington State. After subsequent private sales, a purchaser brought it into Montana. Ford therefore maintained that none of its Montana contacts caused the estate’s claims.</p><p><mark class='err' data-n='3'>The Montana district court denied Ford’s motion, finding a sufficient connection between Montana, Ford’s forum activities, and the claims.</mark><mark class='tru' data-n='4'> The Montana Supreme Court affirmed.</mark> It reasoned that Ford had purposefully availed itself of the Montana market by advertising and selling Ford products and parts there and that the in-state accident supplied the required connection between the forum and the controversy.</p><p>Ford sought review in this Court. The case was consolidated with *Ford Motor Company v. Bandemer*, No. 19-369, which presents the same jurisdictional issue arising from Minnesota.<mark class='err' data-n='5'> One excerpt submitted by counsel describes the Montana Supreme Court as having ordered dismissal, but that statement conflicts with the stated procedural record.</mark><mark class='tru' data-n='6'> We therefore proceed on the record showing that the Montana Supreme Court affirmed the denial of Ford’s motion.</mark></p><p>II. Governing Law</p><p><mark class='err' data-n='7'>The Due Process Clause permits a state court to exercise either general or specific personal jurisdiction over a corporate defendant.</mark> General jurisdiction ordinarily lies where the corporation is incorporated or maintains its principal place of business.<mark class='err' data-n='8'> Ford is neither incorporated nor headquartered in Montana, so only specific jurisdiction is at issue.</mark></p><p>Under *International Shoe Co. v. Washington*, a nonresident defendant must have sufficient contacts with the forum such that exercising jurisdiction accords with “traditional notions of fair play and substantial justice.” Specific jurisdiction requires that the defendant purposefully avail itself of the privilege of conducting activities in the forum and that the plaintiff’s claims “arise out of or relate to” those forum contacts.</p><p>The phrase “arise out of or relate to” does not impose causation as an inflexible requirement in every case. “Arise out of” commonly denotes a causal relationship. “Relate to,” however, has independent content. Although the latter phrase does not authorize jurisdiction based on any connection whatsoever, it permits jurisdiction where the defendant has deliberately cultivated a forum market for the kind of product at issue and that product causes the alleged injury within the forum.</p><p>This rule remains one of specific, not general, jurisdiction. A corporation’s unrelated forum business does not subject it to suit there on every controversy. There must be an adequate affiliation among the defendant’s purposeful forum conduct, the subject matter of the litigation, and the in-state occurrence.</p><p>*World-Wide Volkswagen Corp. v. Woodson* illustrates the distinction. The unilateral movement of a product into a State does not, standing alone, establish the manufacturer’s forum contact. But a manufacturer that systematically serves a State’s market can reasonably anticipate suit there when the marketed product allegedly malfunctions and causes injury in that State.</p><p>Nor does *Bristol-Myers Squibb Co. v. Superior Court* require a different result. There, the claims of nonresident plaintiffs concerned injuries and transactions occurring outside the forum, leaving no adequate affiliation between those claims and the forum. Similarly, *Walden v. Fiore* establishes that a plaintiff’s forum residence or injury cannot substitute for contacts created by the defendant itself. Those decisions prevent jurisdiction based solely on the plaintiff’s relationship to the forum; they do not require proof that a particular sale or advertisement was a but-for cause of the injury whenever the defendant’s purposeful market activity and the in-state controversy are otherwise closely related.</p><p>III. Application</p><p>Ford purposefully availed itself of the Montana market. The record identifies Ford’s advertising and sale of products and parts in Montana. This was deliberate commercial activity directed toward the State, not a contact created solely by the unilateral conduct of the Explorer’s successive owners.</p><p>The estate’s claims are also sufficiently related to that activity. This suit concerns an alleged defect in a Ford vehicle. The vehicle allegedly malfunctioned while being used in Montana, injuring and killing a Montana resident on a Montana highway. Montana consequently is not merely the plaintiff’s chosen forum or the controversy’s abstract “center of gravity”; it is the place where the product allegedly failed and where the injury occurred. The State has a direct regulatory interest in the safety of products of the kind Ford promotes and supports within its borders.</p><p>It is undisputed that Ford’s Montana activities did not cause this particular Explorer to enter Montana. The vehicle was assembled in Kentucky, first sold in Washington, and brought to Montana after intervening private transactions. That absence of causation does not defeat jurisdiction. Ford’s proposed rule would effectively read “relate to” out of the governing formulation by requiring every qualifying claim to arise causally from a particular forum contact. Due process demands a substantial connection, but not always a causal chain between the defendant’s in-state conduct and the acquisition of the precise item that caused injury.</p><p>Ford’s administrability concern has some force. A standard based on relatedness requires courts to distinguish genuinely connected market activity from merely similar or remote business. But a proximate-cause requirement would introduce its own line-drawing problems and is not compelled by the constitutional text or precedent. The necessary limitation is supplied by purposeful availment and by the requirement of a meaningful affiliation among the forum, the defendant’s relevant market conduct, and the specific controversy.</p><p>The estate’s broader reliance on Montana’s convenience and sovereign interests, standing alone, would be insufficient. A State does not acquire jurisdiction merely because it offers the most convenient forum or has an interest in compensating a resident. Here, however, those considerations supplement rather than replace Ford’s own purposeful Montana contacts and the suit’s connection to the Ford product market cultivated through those contacts.</p><p>Our holding is correspondingly narrow. The location of an accident alone does not establish specific jurisdiction over a foreign manufacturer, nor does the sale of unrelated products permit suit on any claim.<mark class='err' data-n='9'> Jurisdiction is proper here because Ford purposefully served the Montana market relevant to the allegedly defective product, and that kind of product allegedly caused the injury that is the subject of the suit within Montana.</mark></p><p>IV. Disposition</p><p>The Due Process Clause does not require a showing that Ford’s Montana contacts caused the estate’s claims.<mark class='err' data-n='10'> Because the claims sufficiently relate to Ford’s purposeful activities in Montana, the Montana courts may exercise specific personal jurisdiction over Ford.</mark><mark class='tru' data-n='11'> The judgment of the Montana Supreme Court is affirmed.</mark></p><p>RULING: Respondent</p>", "error": "The Montana Supreme Court reversed the district court’s denial of Ford’s motion to dismiss and ordered dismissal for lack of personal jurisdiction.", "truth": "The Montana Supreme Court affirmed the district court’s denial of Ford’s motion to dismiss for lack of personal jurisdiction.", "nmarks": 11}, {"id": "C091", "text": "<p>Opinion of the Court</p><p>I. Procedural History</p><p>Jose Sanchez and his wife, citizens of El Salvador, entered the United States without inspection or admission in 1997 and again in 1998. After earthquakes struck El Salvador in 2001, they received Temporary Protected Status (“TPS”) under 8 U.S.C. § 1254a and remained in the United States through extensions of that designation.</p><p>In 2014, they applied for adjustment to lawful-permanent-resident status under 8 U.S.C. § 1255. United States Citizenship and Immigration Services denied the applications because neither applicant had been “inspected and admitted or paroled into the United States,” as § 1255(a) requires.</p><p>The applicants challenged those denials in federal district court.<mark class='err' data-n='1'> The district court granted summary judgment in their favor, holding that a grant of TPS satisfies § 1255(a)’s admission requirement.</mark><mark class='tru' data-n='2'> The United States Court of Appeals for the Third Circuit reversed, concluding that TPS does not constitute an admission.</mark> The applicants sought review in this Court.</p><p><mark class='err' data-n='3'>Although one submitted excerpt states that the Third Circuit affirmed the district court, that assertion conflicts with the stipulated procedural record.</mark><mark class='tru' data-n='4'> We therefore rely on the case facts, which establish that the Third Circuit reversed.</mark></p><p>II. Governing Law</p><p>Section 1255(a) permits the Attorney General, subject to specified conditions, to adjust the status of an alien who “was inspected and admitted or paroled into the United States.” The Immigration and Nationality Act separately defines “admission” and “admitted” as “the lawful entry of the alien into the United States after inspection and authorization by an immigration officer.” 8 U.S.C. § 1101(a)(13)(A).</p><p>TPS provides qualifying foreign nationals temporary protection from removal and authorization to remain and work in the United States during the designated period. The provision principally relied upon here, § 1254a(f)(4), states that, during the period in which an alien has TPS, “for purposes of adjustment of status under section 1255” and change of status under § 1258, the alien “shall be considered as being in, and maintaining, lawful status as a nonimmigrant.”</p><p>The statutory scheme thus distinguishes lawful *status* from *admission*. Section 1254a(f)(4) expressly addresses the former, while § 1255(a) independently requires the latter. When Congress intends to excuse or modify an adjustment prerequisite for a particular category of persons, it knows how to do so expressly.</p><p>III. Application</p><p>The applicants do not contend that their physical entries into the United States met the statutory definition of admission. They entered without inspection or authorization. Their eligibility therefore depends on whether the later grant of TPS must itself be treated as an admission for purposes of § 1255(a).</p><p>It need not. Section 1254a(f)(4) directs that a TPS recipient be treated as being in and maintaining lawful nonimmigrant status. That language cures a distinct obstacle to adjustment arising from a failure to possess or maintain lawful status. It does not say that a TPS recipient shall be deemed “inspected and admitted or paroled,” nor does it refer to entry, inspection, or authorization by an immigration officer.</p><p>The applicants’ strongest argument is that admission is ordinarily associated with nonimmigrant status and that the words “as a nonimmigrant” must have operative effect. Those words do have effect: they identify the kind of lawful status that TPS recipients are deemed to possess for the specified statutory purposes. But treating a person as possessing lawful nonimmigrant status does not rewrite the historical circumstances of that person’s entry. Status describes lawful permission to remain under a designated classification; admission concerns lawful entry after inspection and authorization. The Act can, and here does, regulate those concepts separately.</p><p>The applicants also point to provisions concerning nonimmigrant crewmen, U-visa holders, and changes of nonimmigrant classification. Those provisions show that admission and nonimmigrant status frequently coincide. They do not establish that the concepts are invariably identical. Indeed, Congress’s use elsewhere of express language addressing admission or adjustment notwithstanding the manner in which status was acquired weighs against inferring such language in § 1254a(f)(4).</p><p>Nor does this interpretation render § 1254a(f)(4) superfluous. It benefits TPS recipients who independently satisfy § 1255(a)’s admission-or-parole requirement by preventing their TPS period from disqualifying them under separate lawful-status requirements. The provision need not eliminate every barrier to adjustment to have meaningful operation.</p><p>The humanitarian importance of TPS does not support a different textual result. TPS protects eligible persons from removal during extraordinary conditions in their home countries. Congress did not, merely by granting that temporary protection, create a general pathway to permanent residence for recipients who entered without inspection. Whether such a pathway should exist is a matter for Congress.</p><p>Because the statutory text resolves the issue, we need not decide whether administrative deference would independently sustain the Government’s interpretation.</p><p>IV. Disposition</p><p>A grant of Temporary Protected Status under 8 U.S.C. § 1254a does not constitute an “admission” under 8 U.S.C. § 1255.<mark class='err' data-n='5'> The judgment of the Court of Appeals is affirmed.</mark></p><p>RULING: Respondent</p>", "error": "The U.S. Court of Appeals for the Third Circuit affirmed the district court’s grant of summary judgment to Sanchez and his wife.", "truth": "The U.S. Court of Appeals for the Third Circuit reversed the district court’s grant of summary judgment to Sanchez and his wife.", "nmarks": 5}, {"id": "C092", "text": "<p>RULING</p><p>Before the Court: the constitutionality of Section 2(b) of the Gun Lake Trust Land Reaffirmation Act (&quot;the Gun Lake Act&quot;), which provides that an action &quot;relating to the [Bradley Property] shall not be filed or maintained in a Federal court and shall be promptly dismissed.&quot;</p><p>*A note on designations.* The parties&#x27; submissions use &quot;Petitioner&quot; to denote the party defending Section 2(b) and urging affirmance of the judgment of dismissal, and &quot;Respondent&quot; to denote David Patchak, who contends that Section 2(b) is unconstitutional. We adopt those designations here to avoid confusion.</p><p>---</p><p>I. Procedural History</p><p>The Match-E-Be-Nash-She-Wish Band of Pottawatomi Indians (the Gun Lake Tribe) was federally recognized in 1999. In 2001 the Tribe petitioned to have the Bradley Property taken into trust under the Indian Reorganization Act, 25 U.S.C. § 465; the Bureau of Indian Affairs granted the petition in 2005; the United States took title in 2009; and the Tribe thereafter built and opened the Gun Lake Casino on the land.</p><p>Respondent Patchak, who lives near the property, sued the Secretary of the Interior under the Administrative Procedure Act, contending that the Secretary lacked authority under the IRA to take the land into trust.<mark class='err' data-n='1'> That suit reached this Court on threshold questions, and we held in *Patchak I* that the Quiet Title Act did not bar the suit and that Patchak had prudential standing to press his claim.</mark> In so holding, the Court expressly observed that whether claims of this kind should be permitted was a matter committed in the first instance to Congress&#x27;s legislative judgment.</p><p>Congress then enacted the Gun Lake Act. Section 2(a) &quot;ratified and confirmed&quot; the Secretary&#x27;s 2005 acquisition of the Bradley Property in trust and declared the land to be trust land. Section 2(b), the provision at issue, directs that any action &quot;relating to&quot; that land &quot;shall not be filed or maintained in a Federal court and shall be promptly dismissed.&quot;</p><p>On remand, the District Court dismissed Patchak&#x27;s suit for want of subject-matter jurisdiction, holding that Section 2(b) stripped the federal courts of jurisdiction over his action and that the provision was a permissible exercise of Congress&#x27;s power to define the jurisdiction of the federal courts. The Court of Appeals affirmed, reasoning that Congress had changed the law rather than dictated the result under old law, and that a statute withdrawing federal jurisdiction over a category of cases — even a category as narrow as this one — does not exercise the judicial power. Patchak&#x27;s separate due process challenge was rejected below, and this Court denied review of that question. We granted review limited to the separation-of-powers question presented: whether a statute that directs the federal courts to &quot;promptly dismiss&quot; a pending suit, without amending the underlying substantive or procedural law, violates the separation of powers.</p><p>II. Governing Law</p><p>Article III vests the judicial power in this Court &quot;and in such inferior Courts as the Congress may from time to time ordain and establish,&quot; and it makes this Court&#x27;s appellate jurisdiction subject to &quot;such Exceptions, and under such Regulations as the Congress shall make.&quot; From these clauses flows a settled proposition: the jurisdiction of the federal courts is, within constitutional bounds, a creature of statute, and what Congress confers it may withdraw. *Ex parte McCardle* remains the paradigm. There, with a case already argued and under submission, Congress repealed the appellate jurisdiction on which the case rested; this Court dismissed, declining to &quot;inquire into the motives of the legislature&quot; and holding that when jurisdiction ceases, &quot;the only function remaining to the court is that of announcing the fact and dismissing the cause.&quot; *Assessors v. Osborne* and *Hallowell v. Commons* apply the same rule to pending cases: no litigant has a vested right in a particular federal forum, and a jurisdictional change applies to cases pending when it takes effect.</p><p>Three limits bound that power, and we take each seriously.</p><p>First, *United States v. Klein* teaches that the jurisdictional label is not talismanic. Congress may not, under the guise of regulating jurisdiction, &quot;prescribe a rule of decision&quot; that requires a court to decide a pending case in a particular way *under existing law* — there, by directing courts to treat a presidential pardon as conclusive proof of disloyalty and then to dismiss for want of jurisdiction on that basis, while simultaneously impairing the pardon power. Klein&#x27;s vice was that Congress commanded a result without changing the law the courts were to apply.</p><p>Second, *Plaut v. Spendthrift Farm* holds that Congress may not retroactively command the federal courts to reopen final judgments. The judicial power includes the power to render dispositive judgments; legislative revision of an entered judgment is forbidden.</p><p>Third, and correlatively, *Bank Markazi v. Peterson* and *Robertson v. Seattle Audubon Society* confirm the affirmative side of the line: Congress *may* amend applicable law and make that amendment govern pending cases, even a single pending case, and even where the amendment effectively determines the outcome. &quot;[A] statute does not impinge on judicial power when it directs courts to apply a new legal standard to undisputed facts.&quot; Nor is a law invalid merely because it addresses one case or a small class; *Bank Markazi* so held on facts far starker than these, where the statute identified the pending litigation by docket number.</p><p>Two further principles inform the analysis. A jurisdictional statute is itself *law* — law that speaks to the forum rather than to the merits. When Congress withdraws jurisdiction, the court&#x27;s judicial function is not usurped; it is exercised, by determining whether the case falls within the withdrawn category and, if so, dismissing. And the interpretive clear-statement rule of *Arbaugh v. Y &amp; H Corp.* is a tool for sorting genuinely ambiguous provisions — typically elements-versus-jurisdiction questions in claim-processing statutes. It does not require magic words where the text speaks unmistakably in forum terms.</p><p>III. Application</p><p>A. Section 2(b) is a jurisdictional statute, not a decree of judgment.</p><p>Respondent urges that Section 2(b) is not truly jurisdictional because it nowhere uses the word &quot;jurisdiction&quot; and because it speaks of &quot;claims.&quot; *Arbaugh* does not carry that weight. Section 2(b) does not describe an element of a cause of action, a filing deadline, or an exhaustion requirement. It says that an action &quot;shall not be filed or maintained *in a Federal court*.&quot; A provision addressed in terms to the *forum* — barring filing and maintenance of suit in the federal courts — is jurisdictional in the most classical sense. That is the same office performed by the repealer in *McCardle*, which likewise did not incant the word &quot;jurisdiction&quot; so much as withdraw the authority to proceed. A clear-statement rule designed to prevent courts from inadvertently converting ordinary statutory conditions into jurisdictional bars cannot be inverted into a requirement that Congress use a particular vocabulary to accomplish an unmistakable forum-closing purpose.</p><p>B. Section 2(b) changes the law; it does not command a result under old law.</p><p>The question presented assumes that the Gun Lake Act &quot;does not amend the underlying substantive or procedural laws.&quot; The record does not bear out that premise, in either of two senses.</p><p>Most directly, jurisdiction *is* law. Before the Gun Lake Act, the APA&#x27;s waiver of sovereign immunity supplied the basis for Patchak&#x27;s suit; Section 2(b) withdrew that consent and closed the federal forum for a defined class of actions. That is a change in the legal rules governing the courts&#x27; authority, and it is precisely the kind of change *McCardle*, *Osborne*, and *Hallowell* hold may be applied to pending cases. *Block v. North Dakota* confirms the corollary Petitioner presses: a plaintiff may not evade Congress&#x27;s chosen terms of consent by recasting the suit as an officer action for prospective relief. When Congress withdraws its consent to suit, it has altered the operative law, not merely the outcome.</p><p>Beyond that, Section 2(a) ratified and confirmed the Secretary&#x27;s 2005 trust acquisition and declared the Bradley Property to be trust land. That is substantive legislation of the most conventional kind — Congress doing directly what it authorized the Secretary to do. Respondent&#x27;s argument that Section 2(a) is either &quot;meaningless&quot; or merely &quot;implemented&quot; by Section 2(b) proves too much. If 2(a) has independent substantive force, then the Act plainly changed the underlying law. If it does not, the claim against 2(b) reduces to the pure jurisdictional objection already answered.</p><p>Klein is therefore not this case. Klein&#x27;s statute left the governing substantive law untouched and told the courts what evidentiary weight to assign a particular fact and what result to reach on that basis — all while invading a separate constitutional power committed to the President. Section 2(b) tells no court how to construe the IRA, how to weigh evidence, or which party has the better of the merits. It says only that the federal courts shall not entertain the dispute. A court applying Section 2(b) performs a judicial act: it construes the statute, determines whether the suit before it &quot;relat[es] to&quot; the Bradley Property, and dismisses if it does. Respondent&#x27;s complaint that Congress &quot;decided what 2(a) means&quot; and then foreclosed judicial construction of it misdescribes the statute&#x27;s operation; Congress did not direct any interpretation of 2(a) at all. It made the interpretation unnecessary by removing the case from the federal docket.</p><p>C. No final judgment has been disturbed.</p><p>*Plaut* marks the outer boundary of Congress&#x27;s power to legislate with respect to litigation, and Section 2(b) does not approach it. *Patchak I* resolved threshold questions of standing and the reach of the Quiet Title Act; it entered no final judgment on the merits of Patchak&#x27;s IRA claim. Nothing in the Gun Lake Act reopens, revises, or nullifies any judgment this or any court has rendered. The suit was pending, and a litigant&#x27;s interest in a pending case is not a vested right in a federal forum.</p><p>D. Targeting one case does not, without more, offend the separation of powers.</p><p>Respondent&#x27;s strongest theme is that Congress acted because it disliked the result in *Patchak I* and legislated at a single plaintiff. Two answers suffice. First, *McCardle* itself squarely presented that objection, and this Court declined to look behind a facially general jurisdictional enactment to search for illicit legislative motive. Second, *Bank Markazi* forecloses the proposition that a statute is unconstitutional merely because it governs one pending case. Section 2(b) is framed as a category — all actions &quot;relating to&quot; the Bradley Property, whether already filed or filed hereafter — and it will govern future suits by others as it governs this one. Petitioner&#x27;s point is well taken that a constitutional rule turning on whether a plaintiff happened to file the day before or the day after enactment, or on how many other plaintiffs happened to appear, would be neither principled nor administrable.</p><p>E. The &quot;Smith wins&quot; hypothetical, and the line we draw.</p><p>Respondent argues that a jurisdictional withdrawal is functionally identical to a statute declaring &quot;Smith wins,&quot; and invokes *CRST Van Line v. EEOC* for the proposition that a dismissed plaintiff has lost. That a dismissal is a practical defeat is true but beside the point. The separation-of-powers inquiry is not whether Congress has affected an outcome — Congress affects outcomes whenever it legislates — but whether Congress has *exercised the judicial power*: whether it has arrogated to itself the rendering of a judgment on the merits between parties, or compelled a court to lend its imprimatur to a result Congress has decreed under unchanged law.</p><p>A statute declaring &quot;Smith wins&quot; does exactly that: it adjudicates, and it conscripts the courts to announce an adjudication that is Congress&#x27;s, not theirs. A statute closing the federal forum does not. It produces no merits judgment, no preclusive determination of the parties&#x27; rights, and no judicial declaration that one side was right on the law. It leaves the plaintiff to such other remedies and fora as may exist, and it leaves the political responsibility for the enactment squarely with the political branches, which must answer for it. As the line drawn in the scholarly submission invoked by Petitioner has it, wholly excluding the federal courts from a class of controversies is categorically different from vesting jurisdiction while dictating how the adjudicatory function must be performed. The first forgoes the judiciary&#x27;s institutional authority; the second borrows it. Section 2(b) falls on the first side of that line.</p><p>We do not suggest that the jurisdictional label immunizes any enactment. Klein remains good law, and a statute that purported to strip jurisdiction only upon a court&#x27;s first finding the facts or construing the law in a prescribed manner would present a very different question. So too would a statute that reopened final judgments, or that operated as a bill of attainder, or that so deprived a party of any opportunity to be heard as to offend due process. *Bank Markazi* expressly preserved those other constraints. Here, the due process claim was pressed below and review of it was denied; it is not before us. On the separation-of-powers ground alone, Section 2(b) is a valid exercise of Congress&#x27;s Article III power to define and withdraw the jurisdiction of the federal courts.</p><p>IV. Disposition</p><p>Section 2(b) of the Gun Lake Act is a jurisdictional enactment that changed the law governing the federal courts&#x27; authority to entertain a defined class of actions and applied that change to pending cases. It did not reopen a final judgment, did not prescribe a rule of decision under unchanged law, and did not direct any court to reach a particular merits result. It therefore does not violate the separation of powers. The judgment of the Court of Appeals affirming the dismissal of Respondent&#x27;s action is affirmed.</p><p>RULING: Petitioner</p>", "error": "The Supreme Court held that Patchak lacked Article III standing to sue.", "truth": "The Supreme Court held that Patchak had standing to sue.", "nmarks": 1}, {"id": "C093", "text": "<p>RULING</p><p>In re Civil Forfeiture Post‑Seizure Process (Culley et al. v. Alabama officials)</p><p>---</p><p>I. Procedural History</p><p>On February 17, 2019, Halima Tariffa Culley&#x27;s son was stopped while driving a car titled to his mother. He was arrested and charged with marijuana and paraphernalia offenses, and the vehicle was seized. Culley&#x27;s informal efforts to retrieve the car failed. Ten days later — on February 27, 2019 — the State of Alabama filed a civil forfeiture action in state court. Twenty months later, the state court granted Culley summary judgment on Alabama&#x27;s statutory innocent‑owner defense and ordered the car returned.</p><p>Culley then brought a putative class action in federal district court under 42 U.S.C. § 1983, alleging that the state and local officials&#x27; failure to afford a *prompt post‑deprivation retention hearing* — a hearing, held within days or weeks of seizure and separate from the forfeiture proceeding itself, at which an owner could press innocent ownership and obtain interim return of the vehicle — violated the Eighth and Fourteenth Amendments.<mark class='err' data-n='1'> The district court entered judgment for the defendants.</mark><mark class='tru' data-n='2'> The Court of Appeals for the Eleventh Circuit affirmed as to the claims that were not moot, holding in substance that a timely forfeiture proceeding is all the process the Due Process Clause requires.</mark> The claimants sought further review, and we granted it to resolve the methodological conflict among the lower courts.</p><p>A word on the record before we proceed. Counsel for the Petitioner — specifically, the excerpt submitted on behalf of the federal government as amicus — states that &quot;[t]he Eleventh Circuit reversed the district court&#x27;s judgment for the defendants on the nonmoot claims.&quot; That statement is inconsistent with the record, which establishes that the Eleventh Circuit *affirmed* as to the nonmoot claims, and it is inconsistent with the balance of Petitioner&#x27;s own submission, which asks us to &quot;affirm.&quot; We take the record as it is: the courts below ruled for the officials, and Petitioner here defends that judgment while Respondent asks us to adopt a different test and remand. We note also that the parties&#x27; captions in this Court do not track the alignment below; we use the designations as presented in the briefs, and nothing turns on the labels.</p><p>The question presented is narrow and methodological: what test must a district court apply in determining whether and when a post‑deprivation hearing is required by the Due Process Clause? Petitioner says the answer lies in the speed‑of‑proceeding framework of *Barker v. Wingo*, as imported into forfeiture law by *United States v. $8,850* and *United States v. Von Neumann*. Respondent says the answer is *Mathews v. Eldridge*.</p><p>II. Governing Law</p><p>Due process requires &quot;the opportunity to be heard at a meaningful time and in a meaningful manner.&quot; The content of that guarantee is not fixed by a single formula. Where this Court has confronted a question of procedure with no settled historical answer and no controlling precedent, it has balanced private and governmental interests against the risk of error under *Mathews*. But *Mathews* is a residual tool, not a trump. Where historical practice and this Court&#x27;s decisions already supply the answer to the precise question asked, a court does not rebalance the interests afresh; it applies the settled rule.</p><p>Three bodies of law bear on this case.</p><p>*First, founding‑era practice.* The Collection Act of 1789 and its successors established the template for in rem forfeiture of personal property: property was seized, and it was held until the forfeiture proceeding was decided. No statute of the era, and no decision of this Court construing them, required an interim &quot;retention&quot; hearing at which the owner could obtain provisional return. Indeed, the Collection Acts permitted the government a lengthy interval — measured in years, not days — between seizure and institution of the action. Respondent&#x27;s assertion, drawn from an amicus brief, that &quot;courts had to rule within 14 days of the filing date at common law&quot; conflates a rule about the pace of proceedings *once filed* with a supposed constitutional entitlement to an *interim* hearing, and it cannot be reconciled with the Collection Acts&#x27; generous pre‑filing window. What the historical record shows is a concern with *promptness of the proceeding*, not with a preliminary mini‑trial.</p><p>*Second, this Court&#x27;s forfeiture cases.* In *$8,850*, the Court held that the due process question raised by a delay between seizure and the forfeiture hearing is governed by the four *Barker* factors — length of delay, reason for delay, the claimant&#x27;s assertion of his rights, and prejudice. In *Von Neumann*, the Court stated that &quot;the forfeiture proceeding, without more, provides the postseizure hearing required by due process,&quot; and that a timely forfeiture proceeding satisfies &quot;any due process right&quot; the claimant may have. And in *Calero‑Toledo v. Pearson Yacht Leasing Co.*, the Court identified the governmental interests distinctive to movable property: it can be concealed, removed, destroyed, or put to further unlawful use.</p><p>*Third, the Mathews line.* *Mathews* and *Fuentes* supply the balancing framework for civil deprivations generally, and in *United States v. James Daniel Good Real Property* the Court applied *Mathews* to hold that the government must ordinarily afford notice and a hearing *before* seizing real property. But *Good* rested expressly on the immovability of real property — land cannot be driven across a state line — and distinguished *Pearson Yacht* on that ground. *Good* is therefore not authority for importing *Mathews* into the very different question of interim process after the lawful seizure of a car.</p><p>III. Application</p><p>A. *Von Neumann* and *$8,850* answer this question; *Mathews* does not displace them.</p><p>Respondent&#x27;s principal move is to characterize the claim as one about a *separate* interest — not the interest in a speedy final adjudication addressed in *$8,850*, but an interest in *possession during* the pendency of the case — and to analogize to *Gerstein v. Pugh*, where a prompt probable‑cause determination is required notwithstanding the separate speedy‑trial right. The analogy is elegant but does not hold.</p><p>*Gerstein* rests on the unique weight of physical liberty; the Fourth Amendment itself, not generalized due process balancing, supplies the requirement of a prompt judicial determination of probable cause for detention of a *person*. Respondent&#x27;s rule would produce the anomaly Petitioner identifies: more constitutionally mandated interim process for the pretrial deprivation of a car than for the pretrial detention of its owner, whose criminal trial may be months away and whose affirmative defenses — including defenses fully exonerating him — are ordinarily heard only at trial.</p><p>Nor can Respondent successfully cabin *Von Neumann* to its Part II. It is true that Part II concluded the claimant had no protected interest in a remission petition. But Part III of that opinion *assumed* a separate interest existed and still found the claimant&#x27;s rights unimpaired by the interval preceding final disposition. The Court&#x27;s reasoning was that the separate interest, whatever its content, was vindicated by a timely forfeiture proceeding. The same logic governs the innocent‑owner defense here. That defense is a defense to forfeiture. It is asserted, litigated, and — as Culley&#x27;s own case proves — won in the forfeiture proceeding itself. Alabama&#x27;s creation of a statutory innocent‑owner defense enlarges what a claimant may prove at the hearing; it does not, of its own force, generate a constitutional right to prove it twice, once quickly and once properly.</p><p>B. *Barker*, not *Mathews*, is the operative framework.</p><p>Respondent&#x27;s objections to *Barker* are practical rather than doctrinal, and they are overstated.</p><p>- *That &quot;it takes a year before Barker even kicks in.&quot;* The length of delay is a triggering inquiry calibrated to context; the *$8,850* Court applied it to an 18‑month interval and nothing in that decision fixes a one‑year floor for seizures of a family automobile.<br>- *That &quot;Barker does not account for private interests.&quot;* It does. The prejudice factor is precisely where the claimant&#x27;s particularized hardship enters — the missed medical appointments, the lost job, the car needed for a livelihood that Respondent recounts. Those are prejudice, and they count.<br>- *That &quot;Barker provides no flexibility in the remedy.&quot;* In the criminal context the remedy is dismissal; in the forfeiture context the analogous remedy is dismissal of the forfeiture and return of the property — a complete remedy, not an inadequate one. And a court applying *Barker*&#x27;s &quot;reason for delay&quot; factor has every tool needed to police a government that, as Respondent puts it, sits on its hands — including the five months of unresponsive discovery Respondent describes in the Sutton matter. A State that stalls will lose the forfeiture.</p><p>*Mathews*, by contrast, asks federal courts to do what Petitioner rightly calls legislating: to decree, ex ante and across fifty jurisdictions, the timing, form, and evidentiary architecture of a hearing the Constitution has never been understood to require. Respondent protests that it seeks no &quot;national rule,&quot; only a remand for the lower courts to apply *Mathews* flexibly. But a test whose content is unknowable until after decades of &quot;percolation&quot; — Respondent&#x27;s own word, invoking the gap between *Gerstein* and *Riverside* — is not a framework; it is an invitation to constitutionalize the civil procedure of asset forfeiture one circuit at a time.</p><p>That approximately twenty States and the federal government (18 U.S.C. § 983(f)) have adopted retention hearings or hardship‑release mechanisms shows that such procedures are workable and, in many settings, wise. It does not show that they are *compelled*. The Constitution sets a floor; legislative innovation above that floor is evidence of a healthy federalism, not of a constitutional violation by those who have not yet innovated. Alabama&#x27;s subsequent adoption of a prompter hearing, which Respondent notes, is a legislative judgment, not an admission.</p><p>C. The record.</p><p>Applying the correct framework, the judgment below stands. Culley&#x27;s vehicle was seized on February 17, 2019, and the State instituted forfeiture ten days later. The claimants were before a court within two weeks of seizure. A bond mechanism was available to secure interim return and was not used. The twenty months that followed were consumed by ordinary civil litigation in which, on this record, the claimants did not press for expedition — no motion for prompt summary judgment, no demand for a speedy adjudication of the innocent‑owner defense. Respondent&#x27;s answer — that &quot;no court has considered the value of additional process&quot; — is a request to relitigate under a test we decline to adopt. Under *Barker* and *$8,850*, with the claimants&#x27; own failure to assert their rights weighing heavily, the courts below correctly found no due process violation. And Culley ultimately prevailed on the merits of her innocent‑owner defense and recovered her car: the forfeiture proceeding did exactly what due process asks of it.</p><p>Two clarifications, lest our holding be read too broadly. First, *Barker* is not a rubber stamp. A timely forfeiture proceeding is constitutionally *required*, and a State that institutes late, or having instituted, allows the case to languish while holding a citizen&#x27;s only means of transportation, violates the Due Process Clause and must return the property. Second, we do not disturb *Good*: real property, which cannot abscond, remains subject to its rule. Our holding is confined to personal property, where the *Pearson Yacht* interests — concealment, removal, further unlawful use — retain full force.</p><p>IV. Disposition</p><p>We hold that where the government seizes personal property subject to civil forfeiture, the Due Process Clause requires a timely forfeiture hearing and does not require a separate preliminary or &quot;retention&quot; hearing. The timeliness of that proceeding is assessed under the flexible, fact‑bound factors of *Barker v. Wingo* as applied in *United States v. $8,850*, not under the interest‑balancing framework of *Mathews v. Eldridge*.<mark class='tru' data-n='3'> The judgment of the Court of Appeals for the Eleventh Circuit is affirmed.</mark></p><p>RULING: Petitioner</p>", "error": "The Eleventh Circuit reversed the district court’s judgment for the defendants on the nonmoot claims.", "truth": "The district court ruled for the defendants, and the Eleventh Circuit affirmed that judgment as to the claims that were not moot.", "nmarks": 3}, {"id": "C094", "text": "<p>Procedural History</p><p>Betty Dukes and five other current or former female Wal-Mart employees brought this Title VII action on behalf of themselves and a proposed nationwide class of women employed by Wal-Mart at any time since December 26, 1998. They alleged that Wal-Mart’s compensation and promotion practices caused women, as a group, to receive lower pay and wait longer for management promotions than similarly situated men.</p><p>The District Court certified a class under Federal Rule of Civil Procedure 23(b)(2). The certified class encompassed approximately 1.5 million women, making it nationwide in scope and including both current and former employees. The court concluded that the claims shared common issues concerning Wal-Mart’s delegation of pay and promotion decisions to local managers, its corporate culture, and alleged gender disparities. It further concluded that backpay could be addressed through statistical and formula-based proceedings rather than individualized hearings.</p><p><mark class='tru' data-n='1'>The Court of Appeals for the Ninth Circuit upheld certification.</mark> Wal-Mart sought review, arguing that the named plaintiffs cannot represent this enormous and diverse class because the asserted injuries arise from individualized decisions of thousands of managers and because claims for individualized monetary relief cannot be adjudicated in a mandatory Rule 23(b)(2) class. We granted review.</p><p>Governing Law</p><p>A party seeking class certification must affirmatively demonstrate compliance with Rule 23. Rule 23(a) requires, among other things, that “there are questions of law or fact common to the class” and that the claims of the representative parties are typical of the claims of the class. Commonality requires more than the existence of questions that can be phrased in common terms. The class members’ claims must depend upon a common contention whose truth or falsity will resolve an issue central to the validity of each claim “in one stroke.”</p><p>A Title VII disparate-treatment claim requires proof that an employer intentionally discriminated against the affected employee. In a pattern-or-practice action, classwide proof may establish that discrimination was the employer’s standard operating procedure. But a plaintiff must identify a common employment policy or practice that connects the class members’ claims and permits a common answer to the question whether the employer acted unlawfully.</p><p>Rule 23(b)(2) permits a mandatory, non-opt-out class only where the party opposing the class “has acted or refused to act on grounds that apply generally to the class,” so that final injunctive or declaratory relief is appropriate respecting the class as a whole. Individualized claims for monetary relief do not fit within Rule 23(b)(2) merely because they accompany a request for injunctive relief. In particular, backpay claims requiring determinations of whether particular employees were victims of discrimination, and permitting an employer to present individualized defenses, cannot be resolved through a procedure that deprives either side of those determinations.</p><p>Application to the Record</p><p>The named plaintiffs have not established the requisite commonality. Their theory is not that Wal-Mart maintained a uniform policy directing managers to discriminate against women. To the contrary, Wal-Mart’s formal policies prohibit discrimination and promote diversity. Plaintiffs instead challenge the company’s delegation of substantial discretion over compensation and promotion to managers throughout the country, coupled with an asserted corporate culture that allegedly allowed gender stereotypes to affect those decisions.</p><p>That theory identifies no common mode by which the delegated discretion produced discrimination across the entire company. Delegating discretion to thousands of managers, in stores and departments with different personnel, circumstances, and decisionmakers, is not itself a discriminatory policy. The named plaintiffs’ claims turn on distinct employment histories and particular decisions: one plaintiff was promoted into management; another was discharged for disciplinary reasons; another was promoted and later demoted after disciplinary issues. Whether each experienced discrimination would require examination of the relevant position, supervisor, qualifications, performance, and circumstances.</p><p>The evidence offered to bridge these individualized inquiries is inadequate. Plaintiffs’ sociological evidence does not establish the extent to which stereotyping actually influenced employment decisions across the company. Their statistical evidence, moreover, does not show a common discriminatory effect throughout Wal-Mart’s nationwide operations; Wal-Mart’s evidence indicated no pay disparity at most stores. Even accepting that disparities may exist in some stores or decisionmaking units, plaintiffs have not shown that a single answer would resolve whether Wal-Mart discriminated against every member of a class encompassing more than a million women.</p><p>The class also cannot be maintained under Rule 23(b)(2). The requested backpay is not incidental to injunctive or declaratory relief. Each award would require determining whether a particular woman was denied a promotion or paid less because of sex, what employment decision would have been made absent discrimination, and what monetary amount, if any, she should receive. Wal-Mart is entitled to present evidence that a particular decision was based on lawful grounds. Likewise, employees who claim they were injured are entitled to an adjudicatory process that considers their individual circumstances.</p><p>The proposed statistical sampling and formula approach cannot substitute for those determinations. A procedure that estimates a number of victims and distributes damages without allowing Wal-Mart to contest individual claims would conflict with Title VII’s limitation of relief to actual victims of discrimination and would deny the parties the process due in the adjudication of individualized monetary claims.</p><p>This conclusion does not foreclose appropriately defined classes challenging a particular discriminatory policy or a discrete decisionmaking unit. But the six named plaintiffs may not, on this record, represent a nationwide class whose claims rest on countless discretionary decisions by different managers.</p><p>Disposition</p><p><mark class='err' data-n='2'>The judgment of the Court of Appeals affirming class certification is reversed.</mark> The case is remanded for further proceedings consistent with this opinion.</p><p>RULING: Petitioner</p>", "error": "The U.S. Court of Appeals for the Ninth Circuit reversed the class certification three times.", "truth": "The U.S. Court of Appeals for the Ninth Circuit upheld the class certification three times.", "nmarks": 2}, {"id": "C095", "text": "<p>Opinion of the Court</p><p>I. Procedural History</p><p>Petitioner Russell Bucklew was convicted by a Missouri jury of murder, kidnapping, and rape, and was sentenced to death. After exhausting his state remedies, and with an execution date set for May 21, 2014, Petitioner filed suit in federal district court under 42 U.S.C. § 1983, raising an as-applied Eighth Amendment challenge to Missouri&#x27;s lethal injection protocol. He alleged that a rare and severe congenital medical condition would cause him to hemorrhage and potentially choke on his own blood during a lethal injection. As an alternative, he proposed execution by nitrogen hypoxia, and he sought discovery into the qualifications of two members of the execution team.</p><p>The district court granted summary judgment to the State on two independent grounds: (1) Petitioner failed to show that Missouri&#x27;s method &quot;presents a risk that is sure or very likely to cause serious illness and needless suffering, and give rise to sufficiently imminent dangers,&quot; and (2) he failed to identify &quot;an alternative that is feasible, readily implemented, and in fact significantly reduces a substantial risk of severe pain.&quot; The district court also denied discovery, declining to assume that Missouri&#x27;s execution personnel are incompetent or unqualified.<mark class='tru' data-n='1'> The United States Court of Appeals for the Eighth Circuit reviewed the district court&#x27;s findings de novo and affirmed.</mark> Petitioner now appeals to this Court on the questions presented.</p><p>II. Governing Law</p><p>The Eighth Amendment prohibits punishments that are cruel and unusual. In Baze v. Rees, 553 U.S. 35 (2008), and Glossip v. Gross, 576 U.S. 863 (2015), this Court established the controlling framework for method-of-execution challenges. To prevail, an inmate must satisfy a substantial burden of proof on both elements:</p><p>First, he must show that the State&#x27;s method &quot;presents a risk that is surely or very likely to cause serious illness and needless suffering.&quot; This is not a burden that can be satisfied by speculation or by hypothetical possibilities; a prisoner must present evidence demonstrating a substantial risk of severe pain that is &quot;sure or very likely&quot; to occur, not merely possible.</p><p>Second, and independently, he must identify an alternative method of execution that is &quot;feasible, readily implemented, and in fact significantly reduces a substantial risk of severe pain.&quot; Courts do not invalidate a method of execution simply because some degree of pain might be involved or because another method might in the abstract seem preferable. The question is whether the challenger has carried his burden to show that a known and available alternative would significantly reduce the risk of pain relative to the State&#x27;s chosen method. This requirement follows from the principle that the Eighth Amendment does not demand the absence of pain, but the avoidance of cruel and unusual punishment; where an available alternative is shown, the State&#x27;s refusal to adopt it may suggest that its chosen method serves no legitimate penological interest.</p><p>Additionally, a party seeking discovery must demonstrate a factual basis sufficient to warrant it. Courts do not presume government incompetence or misconduct absent some concrete showing; unfounded speculation about the qualifications of state personnel is not a proper basis for discovery.</p><p>III. Application</p><p>A. The as-applied challenge. Petitioner&#x27;s medical condition is genuinely serious and unusual, and his concern about a hemorrhage during lethal injection is not frivolous. However, the record before the district court did not establish that the alleged risk was &quot;sure or very likely&quot; to cause serious illness and needless suffering. Petitioner&#x27;s submissions relied largely on predictions about how his condition might interact with the protocol — predictions his own counsel acknowledged were never investigated and could not be confirmed (&quot;we cannot say he certainly is in imminent danger&quot;; &quot;that&#x27;s just never been investigated&quot;). Speculation, even medically informed speculation, does not satisfy the demanding standard of Baze and Glossip.</p><p>B. The proposed alternative. Petitioner&#x27;s proposal of nitrogen hypoxia was not supported by evidence showing that it is feasible and readily implementable by Missouri, or that it would in fact significantly reduce the risk of severe pain as applied to his condition. Under Glossip, the burden of developing such evidence rests squarely on the challenger, and it is a burden Petitioner did not meet at summary judgment.<mark class='tru' data-n='2'> The district court correctly granted judgment to the State on this ground.</mark></p><p>C. Discovery. Petitioner sought discovery into the qualifications of two members of the execution team based only on the bare assertion that they &quot;might not be qualified.&quot; That is precisely the kind of unsupported assumption the district court refused to indulge, and rightly so. Without any concrete evidence calling the team&#x27;s competence into question, denial of discovery was proper.</p><p>D. The parties&#x27; presentations. We note for the record several defects in the parties&#x27; submissions. Counsel for Petitioner argued extensively from materials outside the record (medical records from the summer), which we do not consider. Counsel also conceded candidly that key facts — the status of the tracheostomy, the interaction of bleeding complications with the tracheostomy, and the imminence of any danger absent a pending execution date — remain unknown and uninvestigated. These concessions underscore the evidentiary insufficiency of the as-applied challenge.<mark class='err' data-n='3'> Counsel for the Respondent, for its part, asserted that the district court dismissed the challenge &quot;for lack of standing,&quot; which mischaracterizes the district court&#x27;s actual holdings — the court ruled on the merits under the Glossip framework, not on standing.</mark> We disregard that misstatement. The State&#x27;s evidence that its single-drug pentobarbital protocol has been used repeatedly without significant incident, if credited, further supports the reasonableness of the chosen method.</p><p>IV. Disposition</p><p>The Eighth Amendment does not excuse an inmate with a severe medical condition from the Glossip requirement that he prove an adequate and readily implemented alternative method that significantly reduces the risk of severe pain. Petitioner failed to carry that burden, failed to show a sure or very likely risk of needless suffering, and failed to establish a basis for discovery into execution-team qualifications.<mark class='tru' data-n='4'> The judgment of the United States Court of Appeals for the Eighth Circuit, affirming the district court&#x27;s grant of summary judgment to the State and denial of discovery, i
