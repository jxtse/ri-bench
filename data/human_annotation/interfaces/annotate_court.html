that the Lanham Act is not a general federal tort for every commercial misrepresentation. That concern is substantial, but it is addressed by the requirements of commercial injury within the statutory zone of interests and proximate causation. It does not justify importing the entire AGC framework. Respondent’s assertion that any broader test would necessarily chill truthful commercial speech is also too speculative to override the statutory text.</p><p>Petitioner, for its part, argues too broadly insofar as it suggests that any business whose goods are mentioned or implicated in an advertisement must be entitled to sue. Being the “target” or subject of a statement is relevant but not independently dispositive. A plaintiff must still allege a qualifying commercial injury proximately caused by the deception. SCC has done so here.</p><p>IV. Disposition</p><p>The test for maintaining a Lanham Act false-advertising action is not the same as the antitrust-standing test under AGC. A plaintiff must instead plead an injury to a commercial interest in reputation, goodwill, or sales that falls within the Lanham Act’s zone of interests and was proximately caused by the alleged violation.</p><p><mark class='tru' data-n='8'>Although the Sixth Circuit used an imprecise “reasonable interest” test, it correctly reversed the dismissal because SCC’s allegations satisfy the governing statutory standard.</mark> The judgment of the Court of Appeals is therefore affirmed, and the case may proceed consistent with this opinion.</p><p>RULING: Petitioner</p>", "error": "The Sixth Circuit affirmed the district court's dismissal of SCC's false-advertising claims for lack of standing.", "truth": "The district court dismissed SCC's false-advertising claims for lack of standing, but the Sixth Circuit reversed and held that the district court had used the wrong standing test.", "nmarks": 8}, {"id": "C069", "text": "<p>Opinion of the Court</p><p>I. Procedural History</p><p>Sherman Nealy and Music Specialist, Inc. brought this copyright action in December 2018 against Warner Chappell Music, Inc., Artist Publishing Group, LLC, Atlantic Recording Corporation, and related parties. They alleged that the defendants had infringed copyrights in works from Music Specialist’s catalog through licensing and exploitation dating to 2008.</p><p>The parties stipulated before trial that the controversy concerned ownership of the asserted copyrights. The District Court granted summary judgment in part and denied it in part. The case then proceeded on an interlocutory appeal concerning the temporal scope of available damages.<mark class='err' data-n='1'> Applying the circuit’s discovery accrual rule, the Eleventh Circuit held that a plaintiff whose infringement claim is timely because it was brought within three years after discovery may recover damages for infringements occurring more than three years before suit was filed.</mark></p><p>The copyright defendants sought review of that ruling. The question before this Court assumes application of the discovery accrual rule and asks whether 17 U.S.C. § 507(b) nevertheless imposes a separate three-year limit on recoverable damages.</p><p>II. Governing Law</p><p>Section 507(b) provides: “No civil action shall be maintained under the provisions of this title unless it is commenced within three years after the claim accrued.” The provision regulates when an action must be commenced.<mark class='err' data-n='2'> It does not state that damages are unavailable for conduct occurring more than three years before commencement of the action.</mark></p><p>Section 504, which governs monetary remedies, permits a copyright owner to recover actual damages and the infringer’s profits or, when applicable, statutory damages. It contains no independent three-year lookback limitation. Where Congress has wished to impose express temporal restrictions on monetary recovery elsewhere in the copyright laws, it has done so directly. Courts may not insert such a restriction into § 504 or transform § 507(b)’s claim-accrual rule into an unstated damages cap.</p><p>The defendants principally rely on *Petrella v. Metro-Goldwyn-Mayer, Inc.<mark class='err' data-n='3'>*, which repeatedly described a copyright plaintiff as ordinarily able to recover damages only for infringements occurring within the three years preceding suit.</mark> But *Petrella* applied the separate-accrual rule to a plaintiff who did not invoke the discovery rule. Each infringing act created a separate claim, and claims arising from acts more than three years before suit were themselves untimely.<mark class='err' data-n='4'> *Petrella* expressly reserved the question whether the Copyright Act permits a discovery accrual rule.</mark></p><p><mark class='err' data-n='5'>Thus, *Petrella* did not decide whether damages are restricted when an older infringement gives rise to a claim that is timely under a discovery rule.</mark><mark class='err' data-n='6'> Its statements about three years of retrospective relief reflected the accrual rule operating in that case, not an independent remedial limitation applicable even to timely claims.</mark></p><p>We do not decide here whether the discovery rule is correct, whether it should be confined to fraud or concealment, or precisely how it applies to ownership disputes. The question presented assumes the discovery accrual rule applied by the courts of appeals. Deciding the rule’s validity or scope would exceed what is necessary to resolve the identified conflict.</p><p>III. Application</p><p>Nealy and Music Specialist filed suit in 2018 and seek damages for alleged infringements beginning in 2008. Under the assumption governing this appeal, their claims are timely because they accrued when the plaintiffs discovered, or reasonably should have discovered, the asserted infringements.</p><p>Once that premise is accepted, § 507(b) presents no additional obstacle. The statute asks whether the civil action was commenced within three years after the claim accrued. It does not ask whether the underlying infringing act occurred within three years before filing.<mark class='err' data-n='7'> Treating the date of infringement as an absolute damages cutoff would disregard the assumed discovery-based accrual date and effectively replace that rule with an injury-based limitation for purposes of monetary relief.</mark></p><p>The defendants’ reliance on the ordinary understanding that a claim accrues when a plaintiff possesses a complete cause of action raises a substantial question about the validity of the discovery rule itself. It does not, however, establish a separate damages bar after a claim has been deemed timely under that rule. Their proposed fraud-only exception likewise concerns when a claim accrues, an issue not resolved in this appeal.</p><p>Nor does *Petrella* compel a different result. In that case, infringements outside the three-year period produced untimely claims. Here, by contrast, the question expressly posits timely claims for older acts. Extending *Petrella* to bar relief on such claims would decide by implication the very discovery-rule question that *Petrella* reserved and would do so without supporting language in either § 507(b) or § 504.</p><p>The argument that allowing recovery may expose defendants to substantial liability for long-past conduct presents a legitimate policy concern. But Congress prescribed a limitation measured from claim accrual and did not enact a general three-year damages lookback. Courts may not add one based on their own assessment of repose and compensation.</p><p>IV. Disposition</p><p><mark class='err' data-n='8'>When a copyright claim is timely under the assumed discovery accrual rule, § 507(b) does not separately limit damages to infringements occurring during the three years immediately preceding suit.</mark> The plaintiffs may therefore seek damages for earlier infringements, subject to proving ownership, infringement, timeliness under the governing discovery rule, and the amount of recoverable damages.</p><p>The judgment of the Court of Appeals is affirmed.</p><p>RULING: Respondent</p>", "error": "The Eleventh Circuit held that a copyright plaintiff with a timely claim under the discovery accrual rule may not recover damages for infringement occurring more than three years before the lawsuit was filed.", "truth": "The Eleventh Circuit held that a copyright plaintiff with a timely claim under the discovery accrual rule may recover damages for infringement occurring more than three years before the lawsuit was filed.", "nmarks": 8}, {"id": "C070", "text": "<p>North Carolina Department of Revenue v. Kimberley Rice Kaestner 1992 Family Trust</p><p>Procedural History</p><p><mark class='tru' data-n='1'>This case arises from a challenge to North Carolina&#x27;s taxation of a trust whose only ostensible connection to the State was the domicile of one of its beneficiaries.</mark><mark class='tru' data-n='2'> The Kimberley Rice Kaestner 1992 Family Trust (the &quot;Trust&quot;) paid North Carolina income tax on income accumulated between 2005 and 2008, and in 2009 its representatives sought a refund from the North Carolina Department of Revenue.</mark> The Department denied the claim, and the Trust&#x27;s representatives sued in state court, seeking both a refund and a declaration that the enabling statute was unconstitutional as applied.</p><p>The trial court granted the Department&#x27;s motion to dismiss the request for injunctive relief, but allowed the constitutional claims to proceed.<mark class='err' data-n='3'> On cross-motions for summary judgment, the trial court held the statute unconstitutional as applied and granted judgment to the Trust.</mark> The Department appealed.<mark class='err' data-n='4'> The state appellate court, however, reversed, holding that the beneficiary&#x27;s in-state domicile alone supplied sufficient contacts to sustain the tax.</mark><mark class='err' data-n='5'> The Trust sought review in this Court, and we granted certiorari to resolve whether the Due Process Clause of the Fourteenth Amendment prohibits a State from taxing trust income based solely on the in-state residence of a trust beneficiary.</mark></p><p>Governing Law</p><p>The Due Process Clause requires &quot;minimum contacts&quot; between a State and the property it seeks to tax. Quill Corp. v. North Dakota; Miller Bros. Co. v. Maryland. The &quot;linchpin&quot; of that inquiry is whether the taxed entity has a sufficient relationship—understood in terms of control, benefit, or protection—to the taxing State. It is not enough that a State identify some attenuated connection to the taxed property; the connection must be substantial enough to make taxation fair and just.</p><p>Our precedents bear this out. In Safe Deposit &amp; Trust Co. v.<mark class='err' data-n='6'> Virginia, we held that Virginia could not tax a trust when the trustee, the trust assets, and the place of administration were all outside the State, even though some beneficiaries resided there.</mark> Conversely, in Curry v. McCanless, we upheld a tax where the beneficiary&#x27;s domicile was coupled with the trustee&#x27;s in-state residence and the settlor&#x27;s in-state domicile, which together vested in the beneficiary a sufficiently concrete interest. And in Greenough v.<mark class='err' data-n='7'> Tax Assessors, the beneficiary had actually received income from the trust within the taxing State.</mark></p><p><mark class='tru' data-n='8'>What these cases establish is a consistent principle: taxation of trust income comports with due process only when the beneficiary&#x27;s in-state connection is paired with some additional substantive link—residence of the settlor or trustee, situs of the trust assets, receipt of income by the beneficiary, or the beneficiary&#x27;s right to demand and control distributions.</mark><mark class='err' data-n='9'> Domicile alone, severed from any of these reinforcing contacts, does not suffice.</mark></p><p>Application to the Record</p><p><mark class='tru' data-n='10'>The record here establishes that the Trust&#x27;s ties to North Carolina amount to nothing more than the domicile of Kimberley Rice Kaestner during the tax years in question.</mark> The Trust was created in New York by a settlor domiciled there.<mark class='tru' data-n='11'> At the time of the 2002 division that created the Trust, and throughout the relevant period, the trustee resided in Connecticut, the trust records were maintained outside North Carolina, and the trust assets were custodied elsewhere.</mark> See Safe Deposit, supra.</p><p>Critically, the beneficiary received nothing from the Trust during the tax years at issue. She had no right to demand distributions, no power to control the trustee&#x27;s investment or disbursement decisions, and no guarantee that she would ever receive a penny. As the Trust&#x27;s representatives emphasize, the taxed income remained in the trustee&#x27;s possession and control, subject only to his fiduciary duty to the class of beneficiaries as a whole.<mark class='tru' data-n='12'> The North Carolina statute instead taxes accumulated income based on a prediction—unknown and unknowable at the time of imposition—that the beneficiary might one day receive a distribution.</mark> Due process does not permit taxation premised on so speculative a footing.</p><p>The Department&#x27;s reliance on the beneficiary&#x27;s status as the &quot;true owner&quot; of trust income under trust law cannot carry the day. The beneficiary&#x27;s interest here is a mere expectancy: she holds no present possessory right, and under the trust instrument distributions to her were discretionary rather than mandatory. Curry is therefore inapposite, because there the beneficiary&#x27;s domicile was reinforced by the settlor&#x27;s and trustee&#x27;s in-state residence and a vested beneficial interest. The Department&#x27;s invocation of our summary affirmance in Stewart Estate does not alter the analysis, as the opinion there reflects no taxation of undistributed, discretionary income on the strength of beneficiary residence alone.</p><p>North Carolina&#x27;s tax also cannot be justified by the benefits and protections the State provides to its residents. The beneficiary here received no income, exercised no control over the trust property, and could demand nothing from the trustee during the tax years. The benefits the State conferred upon her as a resident were in no way tied to the trust property being taxed. The State&#x27;s asserted power amounts to taxation based on a relationship that, during the years at issue, generated no economic reality connecting the beneficiary to the accumulated income.</p><p><mark class='err' data-n='13'>We hold, therefore, that the residence of a non-contingent beneficiary alone—where the trustee, the trust assets, and the administration of the trust are all located outside the State, and where the beneficiary received no income and had no right to demand or control any—does not supply the minimum contacts that due process requires before a State may tax trust income.</mark> The statute is unconstitutional as applied to the Trust.</p><p>Disposition</p><p><mark class='err' data-n='14'>The judgment of the state appellate court is reversed, and summary judgment is rendered for the Trust on its constitutional claim.</mark> The case is remanded for further proceedings consistent with this opinion, including appropriate refund relief.</p><p>RULING: Respondent</p>", "error": "The state appellate court reversed and held that a beneficiary’s domicile alone supplied adequate contacts to tax the Trust.", "truth": "The state appellate court found that a beneficiary’s North Carolina domicile alone did not establish sufficient contacts to tax the out-of-state Trust.", "nmarks": 14}, {"id": "C071", "text": "<p>Opinion of the Court</p><p>Procedural History</p><p>Jack Davis, a candidate for Congress in New York’s Twenty-Sixth Congressional District, brought this action challenging § 319 of the Bipartisan Campaign Reform Act of 2002, commonly called the Millionaire’s Amendment. The provision alters the ordinary federal contribution limits when a candidate spends substantial personal funds on his own campaign. In general, once a self-financed candidate’s expenditures pass specified thresholds, the opposing candidate may accept individual contributions at a higher limit.</p><p>Davis alleged that the provision violates the First Amendment because it burdens a candidate’s decision to use personal resources to engage in political speech, and violates the equal-protection component of the Fifth Amendment because it subjects candidates to unequal contribution and reporting rules.</p><p><mark class='tru' data-n='1'>The district court rejected Davis’s challenge.</mark><mark class='err' data-n='2'> It concluded that Davis lacked standing to press, or in any event had not established, a cognizable First Amendment injury because the statute did not directly restrict his campaign expenditures and instead increased speech by his opponent.</mark><mark class='tru' data-n='3'> The court also rejected the Fifth Amendment claim, reasoning that a self-financed candidate and an opponent who does not self-finance are not similarly situated.</mark> Davis invokes the direct-review procedure supplied by the campaign-finance statute. We first conclude that he has standing and then reach the constitutional question.</p><p>Governing Law</p><p>Political speech lies at the core of the First Amendment. A candidate’s expenditure of personal funds to advocate his own election is political expression of the highest constitutional importance. *Buckley v. Valeo* holds that the Government may not impose limits on a candidate’s expenditures from personal resources, for such restrictions directly limit the quantity of political speech a candidate may disseminate.</p><p>Contribution limits, although they affect associational and expressive interests, may be sustained when they are closely drawn to serve the sufficiently important governmental interest in preventing actual or apparent quid pro quo corruption. But that interest does not permit Congress to regulate campaign speech because it regards some candidates’ resources, speech, or electoral prospects as excessive. The Government may not seek to “level the playing field” among candidates by burdening a candidate’s protected political expression.</p><p>A plaintiff has standing where he has suffered, or faces a sufficiently imminent threat of, a concrete injury fairly traceable to the challenged statute and redressable by a favorable judgment. A statute need not prohibit speech outright to cause a First Amendment injury. A substantial governmental disincentive attached to the exercise of protected speech may itself be a cognizable burden.</p><p>Application</p><p>Davis has standing. He is a candidate who intends to use substantial personal funds in support of his candidacy. Section 319 makes that decision consequential: as Davis spends additional personal money, his opponent may receive contributions at limits unavailable in an ordinary race, while Davis remains subject to the ordinary limits applicable to his own contributors. The statute thereby changes the campaign-finance conditions under which Davis must speak and compete. That injury is concrete, traceable to § 319, and redressable by invalidation of the challenged provision.</p><p><mark class='tru' data-n='4'>On the merits, § 319 cannot be reconciled with the First Amendment.</mark> Although the provision does not formally cap Davis’s personal expenditures, it imposes a penalty for making them. A candidate who finances his own speech beyond the statutory threshold activates a substantial fundraising advantage for his opponent. The consequence is not merely incidental disclosure or a neutral administrative requirement; it is a state-created disadvantage tied directly to the candidate’s exercise of his right to spend personal funds for political advocacy.</p><p>The Government contends that the statute does not restrict speech because Davis remains free to spend as much as he chooses and because the provision increases the total amount of speech in an election. That contention misunderstands the First Amendment. Government may not burden one speaker’s protected expenditures simply because the burden enables or subsidizes additional speech by another. The constitutional question is whether the Government has attached an adverse consequence to Davis’s protected expression, not whether the race as a whole may contain more campaign communications.</p><p>Nor is the burden justified by an anti-corruption interest. A candidate’s use of his own money does not create the quid pro quo corruption concern that supports ordinary contribution limits. The Millionaire’s Amendment instead operates on the premise that a candidate’s financial capacity gives him an electoral advantage that Congress may offset by permitting his opponent to raise larger private contributions. That is an effort to equalize candidates’ relative financial resources and competitive positions. However understandable that objective may be as a policy matter, it is not a constitutionally permissible basis for burdening a candidate’s independent campaign expenditures.</p><p>The statute’s special disclosure obligations do not save the contribution-limit scheme. Disclosure may serve legitimate informational interests and may facilitate enforcement of otherwise valid campaign-finance rules. But the disclosure requirements here principally operate as the trigger for a regime that unconstitutionally penalizes a candidate’s personal political expenditures. Congress may not accomplish indirectly, through asymmetric contribution limits activated by self-financing, what it could not accomplish through a direct limit on self-financing.</p><p><mark class='err' data-n='5'>Because § 319 violates the First Amendment, we need not separately decide Davis’s Fifth Amendment equal-protection claim.</mark> The appropriate remedy is to invalidate the challenged asymmetrical contribution-limit mechanism rather than to preserve it through an unequal burden on Davis’s speech.</p><p>Disposition</p><p>The judgment of the district court is reversed. Section 319’s Millionaire’s Amendment, insofar as it raises an opponent’s contribution limits in response to a candidate’s personal campaign expenditures, violates the First Amendment.</p><p>RULING: Petitioner</p>", "error": "The district court dismissed Davis's First Amendment claim for lack of standing.", "truth": "The district court rejected Davis's First Amendment claim on the merits, reasoning that the law did not implicate the First Amendment because it did not impede his ability to spend money in support of his message.", "nmarks": 5}, {"id": "C072", "text": "<p>Procedural History</p><p><mark class='tru' data-n='1'>Shannon Nelson and Louis Madden were separately charged with sexual-assault offenses in Colorado and were required to pay monetary assessments arising from those prosecutions.</mark> Nelson was acquitted of all charges. Madden was acquitted of one of the two charges against him. After their convictions or charge-specific judgments were set aside, each sought the return of money collected by the State in connection with the invalidated proceedings.</p><p><mark class='err' data-n='2'>The trial court concluded that it lacked jurisdiction to award Nelson a refund.</mark><mark class='err' data-n='3'> In Madden’s case, the trial court ordered return only of sums traceable to the single charge on which he was acquitted.</mark><mark class='tru' data-n='4'> The Colorado Court of Appeals held that Colorado was required to refund the amounts Nelson and Madden had paid in connection with the convictions or charges that had been set aside.</mark> The Colorado Supreme Court reversed. It held that the Colorado Exoneration Act supplied the exclusive means to recover such losses and that petitioners could recover only if they proved, by clear and convincing evidence, that they were actually innocent. Petitioners seek review of that ruling under the Due Process Clause of the Fourteenth Amendment.</p><p>Governing Law</p><p>The Fourteenth Amendment prohibits a State from depriving a person of property without due process of law. Due process protects not only against an initial unjustified taking, but also against a State’s continued retention of money once the legal basis for taking it has been nullified.</p><p>A criminal defendant is presumed innocent unless the State proves guilt beyond a reasonable doubt. When a conviction is reversed or an accused is acquitted, the State may no longer impose the criminal judgment or its attendant financial penalties. Although a State may establish a distinct compensation program for persons claiming damages flowing from wrongful prosecution or imprisonment—and may condition that extraordinary compensation on proof of actual innocence—it may not treat the return of money exacted under an invalid conviction as though it were equivalent to such compensation.</p><p>The relevant question is not whether petitioners were afforded procedures to prove actual innocence under Colorado’s Exoneration Act. It is whether the State may retain money it collected solely by authority of criminal judgments that no longer stand unless the former defendants satisfy a new and demanding burden to establish innocence by clear and convincing evidence. Due process does not permit that result.</p><p>Application</p><p><mark class='tru' data-n='5'>The money at issue was collected from Nelson and Madden pursuant to criminal proceedings and judgments that, as to the relevant charges, were later invalidated.</mark> Once those judgments were set aside, Colorado could no longer enforce their custodial or monetary consequences. The State’s continued possession of the assessments therefore requires a constitutionally sufficient justification.</p><p>Colorado’s Exoneration Act does not provide one. Requiring petitioners to prove actual innocence by clear and convincing evidence improperly shifts to them a burden inconsistent with the presumption of innocence and with the State’s obligation to justify a criminal deprivation. A reversal, vacatur, or acquittal may not establish factual innocence in every metaphysical sense, but it does establish that the State lacks a valid criminal judgment authorizing it to keep the money collected under that judgment.</p><p>Colorado may require proof of actual innocence before awarding broader compensation for such matters as lost liberty, lost income, or other consequential injuries. But petitioners do not seek damages or a statutory gratuity. They seek the return of identifiable sums paid under convictions or charges that have been nullified. The State’s administrative interest in retaining those sums unless a former defendant proves actual innocence is slight, while the private property interest is direct and substantial.<mark class='tru' data-n='6'> The amounts paid and the disposition of the relevant charges are matters ascertainable from the criminal record; no extraordinary adjudication of innocence is necessary to determine whether the State must return money it may no longer retain.</mark></p><p><mark class='tru' data-n='7'>Accordingly, Colorado’s refusal to refund petitioners’ money unless they prove actual innocence by clear and convincing evidence violates procedural due process.</mark><mark class='tru' data-n='8'> Any refund must, of course, be limited to assessments attributable to the convictions or charges that were invalidated, rather than to any valid and remaining judgment.</mark></p><p>Disposition</p><p>The judgment of the Colorado Supreme Court is reversed, and the case is remanded for proceedings consistent with this ruling.</p><p>RULING: Petitioner</p>", "error": "The Colorado Court of Appeals affirmed the trial court's dispositions, leaving Nelson without a refund and Madden with only the trial court's limited refund.", "truth": "The Colorado Court of Appeals held that Colorado must refund Nelson and Madden the money associated with the sexual-assault charges that had been thrown out.", "nmarks": 8}, {"id": "C073", "text": "<p>Opinion of the Court</p><p>I. Procedural History</p><p>Respondents, customers of AT&amp;T Mobility LLC, filed a putative class action in the United States District Court for the Central District of California, alleging that AT&amp;T&#x27;s offer of a &quot;free&quot; phone was fraudulent insofar as AT&amp;T charged sales tax on the retail value of the &quot;free&quot; phones.<mark class='tru' data-n='1'> AT&amp;T moved to compel arbitration pursuant to the arbitration clause in its service contract.</mark><mark class='tru' data-n='2'> The district court denied the motion, relying on the California Supreme Court&#x27;s decision in *Discover Bank v.</mark> Superior Court*, 36 Cal. 4th 162 (2005), which held that class-action waivers in consumer arbitration agreements are unconscionable where the waiver is imposed in an adhesion contract, the disputes at issue are likely to involve small amounts of damages, and the party with superior bargaining power carries out a scheme to defraud small sums from a large number of consumers. The court concluded that the agreement&#x27;s class-arbitration waiver rendered the arbitration clause unconscionable and unenforceable under California law, and that the Federal Arbitration Act did not preempt that rule.</p><p>The United States Court of Appeals for the Ninth Circuit affirmed on two grounds: first, that the arbitration clause was unconscionable and unenforceable under California law as applied in *Discover Bank*; and second, that the FAA did not expressly or impliedly preempt California&#x27;s unconscionability doctrine because the rule applied equally to arbitration agreements and to contracts for judicial proceedings.<mark class='err' data-n='3'> AT&amp;T Mobility petitioned for a writ of certiorari, which this Court granted limited to the question whether the FAA preempts states from conditioning the enforcement of an arbitration agreement on the availability of class-wide arbitration procedures.</mark></p><p>II. Governing Law</p><p>The Federal Arbitration Act, 9 U.S.C. § 1 *et seq.*, embodies a liberal federal policy favoring arbitration. Section 2 provides that arbitration agreements &quot;shall be valid, irrevocable, and enforceable, save upon such grounds as exist at law or in equity for the revocation of any contract.&quot; This savings clause permits invalidation of arbitration agreements on &quot;generally applicable contract defenses, such as fraud, duress, or unconscionability,&quot; but not on legal rules that apply only to arbitration or that derive their meaning from the fact that an agreement to arbitrate is at issue.</p><p>Preemption under the Supremacy Clause may be express or implied, and implied preemption includes both conflict preemption and obstacle preemption. A state law that &quot;stands as an obstacle to the accomplishment and execution of the full purposes and objectives of Congress&quot; is without effect.</p><p>Two purposes of the FAA are relevant here. First, the Act was enacted in response to widespread judicial hostility to arbitration, exemplified by the common-law &quot;ouster&quot; doctrine, under which courts refused to enforce agreements to arbitrate on the ground that they deprived the courts of jurisdiction. Congress sought to place arbitration agreements on equal footing with other contracts and to make them enforceable according to their terms. Second, and of particular importance, the Act reflects a congressional decision that arbitration should proceed by individualized, party-controlled procedures. The informality and lack of class procedures are among the principal advantages of arbitration: it is cheaper, faster, and more informal than litigation. Requiring the availability of class-wide arbitration &quot;upon pain of litigation,&quot; as this Court noted in *Stolt-Nielsen S.A. v. AnimalFeeds Int&#x27;l Corp.*, 559 U.S. 662 (2010), interferes with fundamental attributes of arbitration and creates incentives to abandon arbitration, because class arbitration is slower, more costly, more likely to generate procedural morass, and it sacrifices the confidentiality and consensual character of the arbitral forum. Parties cannot be compelled to submit to class arbitration absent affirmative contractual authorization.</p><p>III. Application</p><p>A. The Discover Bank rule does not fall within the savings clause.</p><p>Respondents argue first that *Discover Bank* is nothing more than a routine application of California&#x27;s general unconscionability doctrine, and that the savings clause of § 2 therefore preserves it. We disagree.</p><p>Section 2&#x27;s reference to &quot;any contract&quot; requires that a rule invoked to invalidate an arbitration agreement be one that applies to contracts generally, across the entire range of contract law, rather than to a gerrymandered subset carved out precisely because it governs dispute-resolution clauses. A rule focused on arbitration and litigation clauses — because it turns on whether a class waiver appears in a dispute-resolution forum — is the category most likely to conceal discrimination against arbitration, and it cannot claim the shelter of the savings clause.</p><p>Moreover, the *Discover Bank* rule is not simply the general California unconscionability doctrine wearing a different label; it is a different legal rule with its own substantive content, distinguished in at least three critical respects:</p><p>First, *traditional unconscionability analysis asks whether the terms are fair to the party before the court at the time of contracting* — whether the fee is too high, the forum too distant, the remedy so one-sided as to shock the conscience. *Discover Bank* instead asks whether the class waiver operates with a deterrent effect equivalent to that of a judicial class action, and looks to the rights of absent third parties rather than to the adequacy of the individual claimant&#x27;s procedures.<mark class='err' data-n='4'> Under traditional doctrine, the district court here found the arbitration procedures — including AT&amp;T&#x27;s payment of arbitrator fees and the availability of premium recovery — more than adequate for individual claims.</mark></p><p>Second, unconscionability doctrine is concerned with exculpation of liability in agreements imbued with the public interest, in the sense of *Tunkl v. Regents*, 60 Cal. 2d 92 (1963) — contracts affecting the public provision of services — not with the aggregate effect of individually unlitigable claims on nonparties. A rule that polices the effect of a term on third parties is not a rule that renders contracts of that type unenforceable generally; it is a rule targeted at the procedural features of dispute-resolution clauses.</p><p>Third, the *Discover Bank* rule functions not to police contract formation or substantive fairness but to mandate a particular dispute-resolution procedure — the availability of class proceedings — whenever claims are too small to be pursued individually. That is a legal rule unique to the dispute-resolution context.</p><p>B. Respondents&#x27; equal-footing argument fails.</p><p>Respondents&#x27; principal defense is that because *Discover Bank* applies equally to arbitration agreements and to contracts providing for judicial class proceedings, it does not &quot;discriminate&quot; against arbitration and therefore cannot be preempted. But § 2&#x27;s savings clause is not limited to rules that facially discriminate against arbitration, and the equal-footing principle cannot bear the weight respondents place upon it. A rule may be nondiscriminatory on its face yet still stand as an obstacle to the purposes and objectives of Congress. If a State could condition the enforcement of an arbitration agreement on the availability of any procedure used in court, it could require arbitration to be a carbon copy of litigation — plenary discovery, formal rules of evidence, judicially mandated remedies — precisely what the FAA was enacted to prevent. Respondents concede as much, acknowledging that a State could not insist on full-scale court discovery in arbitration; but the limiting principle they offer — that only rules &quot;tantamount to a rule of non-enforceability&quot; are preempted, with everything else to be policed by open-ended &quot;obstacle preemption&quot; — is indeterminate and would make the enforceability of arbitration agreements turn on judicial assessments of legislative motive rather than on law.</p><p>C. Discover Bank stands as an obstacle to the purposes and objectives of the FAA.</p><p>The *Discover Bank* rule, by conditioning the enforceability of a class waiver on the availability of class proceedings, exactly inverts the purposes of the FAA. Class arbitration, to a far greater extent than individual arbitration, sacrifices the principal advantages of the arbitral forum: it is procedurally cumbersome, slow, and costly; it eliminates the confidentiality of the proceeding; it dramatically increases risks to defendants of bet-the-company awards; and it departs from the fundamental premise that arbitration is a matter of party consent. Because parties may not be forced to arbitrate on a class-wide basis without their agreement, a rule that invalidates class waivers whenever class treatment would be the only practical vehicle for recovery creates powerful incentives to abandon arbitration altogether — litigation becomes the only rational option — and thereby returns arbitration to the disfavored position from which the FAA was enacted to rescue it. To the extent respondents argue that consumers benefit ex ante from a regime preserving class procedures, that argument assumes what the FAA&#x27;s structure rejects: that the relative advantages and disadvantages of class proceedings versus individual arbitration are a judgment for the parties&#x27; contract, not for the State to impose through unconscionability doctrine.</p><p><mark class='err' data-n='5'>Because the *Discover Bank* rule is preempted by the FAA, the Ninth Circuit erred in affirming the denial of AT&amp;T&#x27;s motion to compel arbitration.</mark></p><p>IV. Disposition</p><p>The judgment of the United States Court of Appeals for the Ninth Circuit is reversed, and the case is remanded for further proceedings consistent with this opinion.</p><p>RULING: Petitioner</p>", "error": "The district court granted AT&T's motion to compel arbitration.", "truth": "The district court denied AT&T's motion to compel arbitration.", "nmarks": 5}, {"id": "C074", "text": "<p>IN THIS COURT</p><p>MURR ET AL. v. STATE OF WISCONSIN AND ST. CROIX COUNTY</p><p><mark class='err' data-n='1'>*On writ of certiorari to the Court of Appeals of Wisconsin*<br></mark><br>---</p><p>I. PROCEDURAL HISTORY</p><p>The material facts are undisputed. In 1960 the parents of Joseph P. Murr and his siblings purchased two adjacent lots, designated Lots E and F, in St. Croix County. Together the two lots comprise approximately .98 acres. In 1994 and 1995 the parents conveyed Lot F and Lot E, respectively, to their children, so that both lots came into common ownership in the hands of the Murrs. Upon that transfer the lots became subject to St. Croix County&#x27;s merger ordinance, which prohibits the individual development or sale of adjacent lots held in common ownership unless an individual lot is at least one acre in size, and which provides that where neither lot independently satisfies the one-acre minimum, the lots may be measured together to meet it. Seven years later the Murrs sought to sell Lot E separately while retaining Lot F, on which the family cabin stands. The St. Croix County Board of Adjustment denied the application.</p><p>The Murrs then sued the State and the County, alleging that the ordinance effected an uncompensated regulatory taking because it deprived them of &quot;all, or practically all, of the use of Lot E,&quot; which can be neither sold nor developed as a separate parcel.<mark class='tru' data-n='2'> The circuit court granted summary judgment to the State and the County.</mark><mark class='tru' data-n='3'> The Court of Appeals of Wisconsin affirmed, holding that the Murrs had not been deprived of the practical use of their property, and reasoning that the takings inquiry must be measured against Lots E and F considered as a single unit.</mark> The case comes to this Court on certiorari to resolve the antecedent question on which the outcome below turned.</p><p>Before proceeding, the Court notes a defect in the respondent&#x27;s submission. Counsel for the respondent states that &quot;[t]he Wisconsin Court of Appeals reversed the circuit court&#x27;s grant of summary judgment and remanded the case for trial.&quot; That is not what the record shows.<mark class='tru' data-n='4'> The Court of Appeals affirmed the grant of summary judgment to the State and County.</mark> Misstatements of the disposition below are not harmless stylistic lapses; they bear on the posture in which a question reaches this Court and on the weight a reviewing court may give to counsel&#x27;s other characterizations of the record. We proceed on the record as it exists.</p><p>II. THE QUESTION PRESENTED</p><p>Whether two legally distinct but commonly owned contiguous parcels should be combined for purposes of regulatory takings analysis.</p><p>III. GOVERNING LAW</p><p>The Takings Clause bars the government from forcing &quot;some people alone to bear public burdens which, in all fairness and justice, should be borne by the public as a whole.&quot; *Armstrong v. United States*, 364 U.S. 40, 49 (1960). Where, as here, the government has not physically appropriated or permanently occupied land, the claim is one of regulatory taking, governed by *Pennsylvania Coal Co. v. Mahon*, 260 U.S. 393 (1922), and its successors.</p><p>Two analytical frameworks are available. Under *Lucas v. South Carolina Coastal Council*, 505 U.S. 1003 (1992), a regulation that deprives land of *all* economically beneficial use is a per se taking. Short of that, the claim is governed by the flexible, ad hoc inquiry of *Penn Central Transportation Co. v. New York City*, 438 U.S. 104 (1978), which weighs (1) the economic impact of the regulation, (2) the extent to which it interferes with distinct investment-backed expectations, and (3) the character of the governmental action.</p><p>Both frameworks share a common premise: before one can ask how much has been taken, one must identify the thing against which the loss is measured. This is the &quot;denominator&quot; problem, and this Court&#x27;s cases have consistently resolved it against the formalism the respondent urges. *Penn Central* squarely rejected the proposition that a claimant may &quot;establish a &#x27;taking&#x27; simply by showing that they have been denied the ability to exploit a property interest that they heretofore had believed was available for development.&quot; 438 U.S. at 130. The Court declined to sever the air rights above Grand Central Terminal from the parcel as a whole, even though air rights are freely alienable under New York law. In *Keystone Bituminous Coal Ass&#x27;n v. DeBenedictis*, 480 U.S. 470 (1987), the Court refused to treat the coal required to be left in place as a separate parcel, and declined to treat the &quot;support estate&quot; as a discrete property interest, notwithstanding that Pennsylvania law recognized it as such and permitted its separate conveyance. In *Tahoe-Sierra Preservation Council v. Tahoe Regional Planning Agency*, 535 U.S. 302, 331 (2002), the Court reaffirmed that &quot;defining the property interest taken in terms of the very regulation being challenged is circular,&quot; and that the parcel must be evaluated &quot;as a whole,&quot; both spatially and temporally. And *Lucas* itself acknowledged, at 1016 n.7, that the denominator question admits of no mechanical answer and may turn on &quot;how the owner&#x27;s reasonable expectations have been shaped by the State&#x27;s law of property.&quot;</p><p>From these authorities the governing rule emerges. State law defines what a person owns; it does not, standing alone, define the unit against which a federal constitutional injury is measured. Were it otherwise, the scope of the Fifth Amendment would depend on the accident of a surveyor&#x27;s pen, and an owner could manufacture a compensable taking by the simple expedient of subdividing land on paper and then complaining that one of the resulting slivers had been rendered unbuildable. That is not a rule of law; it is a rule of conveyancing.</p><p>Accordingly, the proper inquiry is whether a reasonable owner would expect the holdings to be treated as one unit. Courts should consider, in a manner that is objective and not manipulable by either side: (1) the treatment of the land under state and local law, including how it is bounded and divided and the reasonable restrictions in place when the owner acquired it; (2) the physical characteristics of the land, including contiguity, topography, and the environmental setting; and (3) the prospective value of the regulated land, including the effect of the burdened portion on the value of the remainder. Contiguity alone is not sufficient — petitioner concedes as much — and common ownership alone is not sufficient. But where all three considerations converge, the parcels are properly evaluated as a single unit.</p><p>IV. APPLICATION</p><p>A. State and local law and reasonable expectations. The merger ordinance was on the books and applicable to this land before the Murrs acquired either lot in 1994 and 1995. From the moment of acquisition, the Murrs&#x27; holdings were subject to a rule that treated commonly owned substandard adjacent lots as a single buildable unit. A reasonable owner in their position would have understood that the two lots came as a package. The respondent&#x27;s invocation of *Palazzolo v. Rhode Island*, 533 U.S. 606 (2001), does not alter this. *Palazzolo* holds that a post-enactment acquirer is not automatically barred from challenging a pre-existing regulation; it does not hold that pre-existing regulation is irrelevant to expectations. Petitioner is correct that the only restriction imposed on the parents&#x27; ownership of Lot E was a conditional restriction on sale — they could sell to anyone except a purchaser who happened to own the adjacent substandard lot — and no independent challenge to that 1970s-era restriction has been pleaded or preserved here.</p><p>The respondent&#x27;s counterargument — that the merger rule cannot be a legitimate background principle &quot;because you can&#x27;t have a background principle that applies to one person, but not to another,&quot; since a stranger owning Lot E alone could develop it — proves too much. Every rule keyed to common ownership operates that way, and for good reason. The isolated owner of a single substandard lot faces total economic wipeout and is granted an exemption precisely for that reason. The owner of two adjacent substandard lots does not face that wipeout, and so receives no exemption. That is not arbitrary discrimination; it is a hardship-calibrated rule, and its calibration is directly relevant to the very hardship the Takings Clause measures.</p><p>B. Physical characteristics. Lots E and F are contiguous, are of comparable elevation and character, and sit together along the bend of the St. Croix River. Their physical relationship makes unified use natural rather than contrived. Petitioner rightly observes that a different case would be presented if the two lots were physically discontinuous or topographically unrelated — one above and one below a bluff, for instance — such that no realistic potential for integrated use existed. That is not this record.</p><p>C. Value. The undisputed valuation evidence, unchallenged below, is that the two lots valued together as a single building site are worth $698,000, while the two lots valued as separate buildable sites are worth $771,000. The diminution attributable to the merger requirement is therefore on the order of ten percent. That is a substantial figure in absolute terms, but it is nowhere near the deprivation of &quot;all economically beneficial use&quot; required by *Lucas*, and under *Penn Central* it does not approach the disproportionate, singled-out burden that *Armstrong* addresses. The explanation for the small differential is intuitive and was well captured at argument: contiguous land held together can generate value that neither piece possesses alone. Here the combined river frontage and the privacy afforded by the westward extension make the merged holding a premium riverfront property whose value nearly offsets the loss of a second building site.</p><p>The respondent&#x27;s proposed valuation methodology — asking only what an owner already possessing a house on Lot F would pay to annex Lot E — is not a neutral measure of the parcel; it assumes the answer to the denominator question and then measures the residue. That is precisely the circularity *Tahoe-Sierra* forbids. The respondent&#x27;s eminent domain analogy fares no better. In condemnation, the government physically takes an identified tract and must pay for it; the integrated-use inquiry there determines severance damages owed *in addition to* the tract taken. Nothing in that framework establishes a presumption, in the wholly different setting of regulation, that lot lines control the denominator.</p><p>D. The Murrs retain substantial use. They may build, and have built, a residence; they may improve and maintain it; they may use the entire .98 acres for recreation; and they may sell the merged holding at a price of roughly $698,000. This is not a case of a property owner left holding a worthless remnant.</p><p>V. LIMITS OF TODAY&#x27;S HOLDING</p><p>The Court is mindful of the respondent&#x27;s concern that the recorded-lot system underpins ordinary expectations about land. Nothing in this opinion authorizes the aggregation of separately held parcels, the aggregation of noncontiguous holdings, or the aggregation of physically or functionally unrelated tracts merely because one person owns them. Neither does it permit a government to define the relevant parcel by reference to the challenged regulation itself, or to gerrymander holdings together after the fact in order to dilute a genuine deprivation. Lot lines remain highly relevant evidence of the proper unit; they are simply not conclusive as a matter of federal constitutional law.</p><p>VI. DISPOSITION</p><p>Two legally distinct but commonly owned contiguous parcels may be, and where the three considerations set out above converge must be, evaluated as a single unit for purposes of regulatory takings analysis. Applying that standard, Lots E and F are properly treated as one parcel. So treated, the merger ordinance neither deprives the Murrs of all economically beneficial use under *Lucas* nor effects a taking under *Penn Central*.<mark class='tru' data-n='5'> The judgment of the Court of Appeals of Wisconsin is affirmed.</mark></p><p>It is so ordered.</p><p>RULING: Petitioner</p>", "error": "The Wisconsin Court of Appeals reversed the circuit court’s grant of summary judgment and remanded the case for trial.", "truth": "The Court of Appeals of Wisconsin affirmed the circuit court’s grant of summary judgment to the state and county.", "nmarks": 5}, {"id": "C075", "text": "<p>IN THE SUPREME COURT</p><p>PATCHAK LITIGATION — CHALLENGE TO SECTION 2(b) OF THE GUN LAKE ACT</p><p>---</p><p>PRELIMINARY NOTE ON PARTY DESIGNATIONS</p><p>Before proceeding, the Court notes an anomaly in the caption of the submissions. The excerpts filed under the designation &quot;petitioner&quot; are those of counsel *defending* the constitutionality of Section 2(b) of the Gun Lake Act; that counsel closes by asking &quot;that the Court affirm.&quot; The excerpts filed under the designation &quot;respondent&quot; are those of counsel *attacking* Section 2(b) as unconstitutional. The designations thus appear transposed relative to the litigating postures ordinarily associated with them.</p><p>The Court will not penalize either side for a clerical irregularity in labeling. The question presented is a question of law, and it is resolved on its merits. The Court then maps that resolution onto the designations as they appear in this record: the party designated Petitioner is the party urging that Section 2(b) is constitutional; the party designated Respondent is the party urging that it is not.</p><p>---</p><p>I. PROCEDURAL HISTORY</p><p>The Match-E-Be-Nash-She-Wish Band of Pottawatomi Indians (the Gun Lake Tribe) was federally recognized by the Department of the Interior in 1999. In 2001 the Tribe petitioned to have a parcel known as the Bradley Property taken into trust under the Indian Reorganization Act, 25 U.S.C. § 465. The Bureau of Indian Affairs granted the petition in 2005, the United States took title in 2009, and the Tribe thereafter constructed and opened the Gun Lake Casino on the property.</p><p>David Patchak, who resides near the Bradley Property, sued the Secretary of the Interior and others, contending that the Secretary lacked statutory authority to take the land into trust.<mark class='err' data-n='1'> The litigation proceeded to this Court on a threshold question, and in *Patchak I* the Court held that Patchak had standing to maintain his suit.</mark> The case returned to the lower courts for merits proceedings.</p><p>While the case was pending on remand, Congress enacted, and the President signed, the Gun Lake Act. Section 2(a) ratifies and confirms the Secretary&#x27;s 2005 trust action. Section 2(b) provides that any action relating to the Bradley Property &quot;shall not be filed or maintained in a Federal court and shall be promptly dismissed.&quot;</p><p>The courts below applied Section 2(b), rejected the separation-of-powers challenge to it, and dismissed the action. The Court of Appeals affirmed the dismissal, holding that Section 2(b) withdrew federal jurisdiction over the class of claims it describes and that Congress acted within its constitutional authority in doing so. This Court granted certiorari limited to the separation-of-powers question. As both sides acknowledge, certiorari was denied as to the due process claim pressed in the lower courts; that claim is therefore not before us, and nothing in today&#x27;s ruling passes upon it.</p><p>---</p><p>II. QUESTION PRESENTED</p><p>Whether a statute that directs the federal courts to promptly dismiss a pending lawsuit, but that does not amend the underlying substantive or procedural law, violates the separation of powers.</p><p>---</p><p>III. GOVERNING LAW</p><p>Three bodies of doctrine converge here.</p><p>A. Congress&#x27;s authority over federal jurisdiction. Article III, § 1 vests the judicial power in one Supreme Court &quot;and in such inferior Courts as the Congress may from time to time ordain and establish,&quot; and Article III, § 2 subjects this Court&#x27;s appellate jurisdiction to &quot;such Exceptions, and under such Regulations as the Congress shall make.&quot; The power to create the lower courts and to define their jurisdiction includes the power to withdraw it. *Kline v. Burke Constr. Co.* That power extends to cases already pending. *Ex parte McCardle*; *Assessors v. Osborn*; *Hallowell v. Commons*. When jurisdiction is withdrawn, &quot;the only function remaining to the court is that of announcing the fact and dismissing the cause.&quot; *McCardle*. McCardle also declined to inquire behind the face of the statute into congressional motive for withdrawing jurisdiction from a pending case.</p><p>B. The limits: Klein, Plaut, and Bank Markazi. Congressional power over jurisdiction is not unbounded.</p><p>- *United States v. Klein* holds that Congress may not &quot;prescribe a rule of decision&quot; in a pending case &quot;without amending the applicable law,&quot; and may not use the form of a jurisdictional limitation as &quot;a means to an end&quot; of dictating outcomes under existing law. Klein&#x27;s own opinion, however, expressly acknowledged Congress&#x27;s authority to deny jurisdiction; the vice there lay in a provision that made a specific evidentiary fact (a presidential pardon) conclusive of defeat on the merits, impairing the pardon power and the claimant&#x27;s established property right.<br>- *Plaut v. Spendthrift Farm* holds that Congress may not command the reopening of final judgments.<br>- *Bank Markazi v. Peterson* supplies the modern synthesis: Congress *may* change the law and make the change applicable to pending cases, and it may do so even where the change governs only a single pending proceeding, so long as it leaves to the courts the task of applying the new legal standard to the facts. *Robertson v. Seattle Audubon Soc&#x27;y* is to the same effect. *Bank Markazi* also confirms that other constitutional provisions — due process, bills of attainder, equal protection — remain available to police abuses, and that a separation-of-powers holding is not the vehicle for those distinct concerns.</p><p>C. Characterizing a statute as jurisdictional. *Arbaugh v. Y &amp; H Corp.* establishes an interpretive default: a statutory limitation is treated as jurisdictional only when Congress &quot;clearly states&quot; that it is. But *Arbaugh* is a clear-statement rule for distinguishing threshold adjudicative authority from the elements of a claim; it is not a magic-words requirement, and it has never demanded the literal word &quot;jurisdiction.&quot; The operative inquiry is whether the provision speaks to the *tribunal&#x27;s authority to entertain the suit*, or instead to the *rights and obligations of the parties*.</p><p>---</p><p>IV. APPLICATION</p><p>A. Section 2(b) is properly characterized as jurisdictional.</p><p>Respondent argues, invoking *Arbaugh*, that Section 2(b) is not jurisdictional because it nowhere uses the word &quot;jurisdiction,&quot; because its headings do not so label it, and because the phrase &quot;no claims&quot; is unfamiliar in jurisdictional drafting. This is the most lawyerly of Respondent&#x27;s arguments, and it deserves a direct answer.</p><p>It fails. Section 2(b) does not merely speak of &quot;claims&quot;; it provides that such actions &quot;shall not be filed or maintained in a Federal court and shall be promptly dismissed.&quot; That language is addressed to the forum. It does not redefine the elements of an IRA challenge, does not alter what the Secretary was or was not empowered to do, and does not declare who prevails. It says where — or rather, where not — a case may be heard. *Arbaugh*&#x27;s clear-statement rule is satisfied in substance: a provision that in terms forbids the filing or maintenance of an action in federal court, and commands dismissal, states with all the clarity the rule requires that it governs the courts&#x27; adjudicative authority. Respondent&#x27;s own concession that a differently worded statute &quot;certainly looks more like a jurisdiction-stripping statute&quot; underscores that the dispute is over drafting idiom, not function. Congress is not required to legislate in any particular dialect.</p><p>Respondent is nonetheless correct on a prior and more important point: the jurisdictional label does not end the inquiry. As Respondent puts it, &quot;the mere fact that Congress affixes the label &#x27;jurisdiction&#x27; to a statute doesn&#x27;t immunize it.&quot; That is precisely Klein&#x27;s teaching, and the Court accepts it. A statute cast in jurisdictional form remains subject to separation-of-powers scrutiny. The Court therefore proceeds to that scrutiny rather than resting on the label.</p><p>B. Section 2(b) changed the law; it did not decide a case.</p><p>The decisive question under *Klein* and *Bank Markazi* is whether Congress altered the governing legal standard and left its application to the courts, or instead reached into a pending case and directed a judgment under law left unchanged.</p><p>Section 2(b) changed the law. Before its enactment, federal courts possessed jurisdiction over Patchak&#x27;s suit, and the United States&#x27; sovereign immunity was waived by the APA as to it — both propositions confirmed by *Patchak I*. After enactment, neither was true as to the described class. That is a change in the legal rules governing the adjudication, not a command to apply old rules to reach a designated result. The point is reinforced by the sovereign-immunity dimension Petitioner presses through *Block v. North Dakota*: Congress&#x27;s waiver of immunity is Congress&#x27;s to condition and to withdraw, and a litigant may not evade the withdrawal by recasting the suit as an officer action. Section 2(a)&#x27;s ratification of the 2005 trust action is a further substantive enactment. Whatever else may be said, this statute did legislative work.</p><p>Critically, Section 2(b) directs no outcome on the merits for anyone. It does not say the Secretary acted lawfully; it does not say Patchak&#x27;s reading of the IRA is wrong; it does not command entry of judgment for the Tribe or the United States. It removes a category of disputes from the federal docket. That is the classic *McCardle* move, and it is the move Congress has made repeatedly for a century and a half.</p><p>Nor is the judicial function extinguished. Section 2(b) applies to actions &quot;relating to&quot; the Bradley Property. Determining the scope of that class — whether a given suit relates to that property — is a judicial task of statutory interpretation, and the courts below performed it. *Bank Markazi* requires no more.</p><p>C. Respondent&#x27;s remaining arguments.</p><p>1. The &quot;Smith wins&quot; hypothetical. Respondent&#x27;s strongest argument is that Congress could evade all limits by writing, &quot;We think Smith should win; therefore the courts shall lack jurisdiction,&quot; and that this case is &quot;substantially similar.&quot; The Court agrees with the premise and rejects the analogy.</p><p>The hypothetical statute is unconstitutional not because it uses the word jurisdiction but because it *identifies a winner under existing law and then conscripts or silences the courts to deliver that result*. The vice is the legislative adjudication, which the jurisdictional wrapper does not cure. Section 2(b) contains no such core. It designates no prevailing party, adjudicates no claim, and makes no finding on the lawfulness of the Secretary&#x27;s action. A dismissal for want of jurisdiction is not a merits adjudication; it carries no preclusive effect on the merits and lends no Article III imprimatur to any substantive position. The distinction is not, as Respondent suggests, mere word-play; it is the difference between Congress closing a forum to a class of disputes and Congress rendering judgment in a case.</p><p>2. CRST v. EEOC. Respondent argues from *CRST* that a dismissed plaintiff has &quot;lost,&quot; whatever the reason, and that Section 2(b) therefore decided the case. This is a resourceful argument but an inapposite one. *CRST* construed the term &quot;prevailing party&quot; in a fee-shifting statute, and it did so precisely because the *practical* rebuffing of a claim is what fee statutes care about. It did not hold — and could not have held — that a jurisdictional dismissal is a merits adjudication for Article III purposes. Respondent is right that Patchak experienced a defeat. Practical defeat is not the constitutional test; if it were, every valid jurisdictional statute and every statute of limitations applied to a pending case would be a legislative adjudication.</p><p>3. Targeting a single suit; the House amicus. Respondent emphasizes that Congress legislated after *Patchak I*, that his was the only affected suit, and that the House&#x27;s amicus brief described Section 2(b) as &quot;implementing&quot; Section 2(a) — i.e., Congress deciding what its own statute means and then ejecting the case before any court could say otherwise.</p><p>The narrowness point is genuinely uncomfortable, and the Court does not dismiss it as trivial. But it does not carry the day. *Bank Markazi* squarely holds that a law may apply to a single pending case without becoming a legislative judgment. Petitioner&#x27;s response is well taken: constitutionality cannot sensibly turn on the accident of how many plaintiffs happened to file. A statute lawful on Monday would become unlawful on Tuesday and lawful again on Wednesday as other suits were filed and dismissed. Congress wrote a class defined by subject matter, and *McCardle* teaches that courts do not look behind the face of such an enactment to hunt for illicit targeting. Moreover, the statute reflects an intelligible legislative purpose apparent on this record — settling the trust status of land on which a tribe had built and operated in reliance, after years of uncertainty.</p><p>As to the House&#x27;s characterization: an amicus brief&#x27;s gloss is not the enacted text, and this Court&#x27;s obligation runs to what Congress enacted. In any event, the observation that Section 2(b) implements Section 2(a) is not a confession of legislative adjudication. Congress ratified the trust acquisition substantively in 2(a) and closed the federal forum in 2(b). Legislating both a substantive rule and a jurisdictional one in the same statute is ordinary lawmaking.</p><p>4. Judicial independence. Respondent warns that affirmance will leave &quot;judges looking over their shoulders wondering if they&#x27;re going to be next.&quot; The Court records this as rhetoric rather than argument. It identifies no doctrinal limit and no record fact. Judicial independence is protected by tenure and salary guarantees, by the bar on reopening final judgments in *Plaut*, and by the prohibition on legislative rules of decision in *Klein* — all of which remain fully in force.</p><p>D. A note on Petitioner&#x27;s own reasoning.</p><p>Petitioner prevails, but not on every ground it advances. Petitioner urges the Court to adopt a bright line — drawn from an amicus brief supporting the opposing side and traced to Professor Hart — under which Congress may *wholly* exclude the federal courts from a category of adjudication without any separation-of-powers difficulty, while lesser interference with the manner of adjudication is suspect. Taken unqualified, that line proves too much. It would appear to validate Respondent&#x27;s &quot;Smith wins, and therefore no jurisdiction&quot; statute, since such a law also wholly excludes the courts. It would also give no account of cases where withdrawal of the federal forum leaves a litigant no forum anywhere.</p><p>The Court therefore does not adopt Petitioner&#x27;s proposed categorical rule. It holds more narrowly: a statute that withdraws federal jurisdiction over a class of claims defined by subject matter, that applies to pending as well as future cases, that directs no particular merits outcome and designates no prevailing party, that disturbs no final judgment, and that leaves to the courts the interpretation and application of its own terms, does not violate the separation of powers. Section 2(b) satisfies each of those conditions.</p><p>Petitioner&#x27;s more modest observation is the sound one: where Congress has removed a category of cases from the federal docket, &quot;the Court just has to determine whether this case falls within that category and then it should dismiss.&quot; That residual judicial task is real, and the courts below performed it.</p><p>Finally, the Court reiterates what today&#x27;s ruling does not decide. Whether Section 2(b) offends due process is not before us; certiorari was denied on that claim. Whether a jurisdictional withdrawal that leaves a litigant with no forum in any court, state or federal, would present a different question under other constitutional provisions is likewise reserved. *Bank Markazi* expressly contemplates that such limits exist and operate independently of separation-of-powers doctrine. Nothing here immunizes Section 2(b) from those inquiries in a case that properly presents them.</p><p>---</p><p>V. ORDERLY CONDUCT</p><p>The Court notes no personal attacks by counsel on either side. Respondent&#x27;s characterization of the House&#x27;s amicus position as &quot;an extraordinary assertion&quot; is argumentative but within the bounds of advocacy. Both sides confined themselves to the certified question after the due process claim was excluded from review, as they were obliged to do.</p><p>---</p><p>VI. DISPOSITION</p><p>The question presented is answered in the negative as to the statute before us. Section 2(b) of the Gun Lake Act is a valid exercise of Congress&#x27;s authority over the jurisdiction of the federal courts. It changed the law rather than adjudicating a case, and it left to the Judiciary the interpretation and application of the standard Congress enacted. The judgment of the Court of Appeals is AFFIRMED.</p><p>RULING: Petitioner</p>", "error": "The Supreme Court held that Patchak lacked Article III standing to sue.", "truth": "The Supreme Court held that Patchak had standing to sue.", "nmarks": 1}, {"id": "C076", "text": "<p>Opinion of the Court</p><p>This case concerns whether the Constitution requires a State to recognize insanity as an affirmative defense to a criminal charge.</p><p>I. Procedural History</p><p>Kraig Kahler was charged in Kansas with killing his wife, his two daughters, and his wife’s grandmother. At trial, the defense presented evidence that Kahler suffered from serious mental illness, including major depressive disorder, obsessive-compulsive disorder, and personality disorders. A defense expert testified that Kahler’s illness caused him temporarily to lose control and prevented him from making a rational choice to kill.</p><p>Kansas law does not recognize insanity as a freestanding defense based on a defendant’s inability to understand the nature or quality of his acts or to distinguish right from wrong. Instead, mental disease or defect is relevant only insofar as it negates the mental state required for the charged offense. Kahler was convicted and sentenced to death.<mark class='err' data-n='1'> The Kansas Supreme Court affirmed his convictions but vacated the death sentence.</mark> We granted review to decide whether Kansas’s approach violates the Eighth or Fourteenth Amendment.</p><p>II. Governing Law</p><p>The Due Process Clause does not permit a State to impose criminal punishment without proving the elements of the offense charged. But States possess substantial authority to define those elements, establish rules of criminal responsibility, and determine which defenses are available.</p><p>The Constitution sometimes protects longstanding principles of criminal justice even when they are not stated expressly in the constitutional text. But the relevant historical inquiry must identify a fundamental and deeply rooted requirement—not merely a particular formulation that has been adopted by many jurisdictions. The Court has previously declined to impose a single, rigid constitutional rule governing insanity. *Powell v. Texas*, 392 U.S. 514 (1968).</p><p>Nor does the Eighth Amendment independently require a State to adopt a particular insanity test. The prohibition against cruel and unusual punishment limits the punishments that may be imposed and protects certain fundamental principles of culpability, but it does not require every State to employ the traditional “right-wrong” test or any other specific test for mental responsibility.</p><p>A State may not punish a person who is incompetent to stand trial, and mental illness may bear on whether the prosecution has proved the mens rea required by the offense. But those safeguards do not establish a constitutional entitlement to an additional affirmative defense excusing a defendant who possessed the required mental state but was unable to appreciate the moral or legal wrongfulness of his conduct.</p><p>III. Application</p><p>Kansas has not made mental illness irrelevant to criminal responsibility. Its law permits a defendant to introduce mental-disease evidence to show that he lacked the mental state required for the charged offense. Thus, if mental illness prevents a defendant from intentionally, knowingly, or recklessly committing the acts defined as criminal, the prosecution cannot establish the offense merely by labeling the defendant mentally ill.</p><p>Kansas law also permits consideration of mental illness in other portions of the criminal process, including competency proceedings and sentencing. The State therefore has not adopted a rule that treats mental illness as categorically immaterial. It has instead chosen to locate the issue principally within the elements of the offense and the State’s burden to prove the defendant’s culpable mental state.</p><p>Kahler contends that the common-law tradition required an inquiry into whether a defendant could distinguish right from wrong or exercise moral judgment. But the historical record does not establish one uniform and deeply rooted constitutional rule. The Anglo-American tradition has included multiple approaches to mental responsibility, including tests focused on cognition, volition, the relationship between mental disease and the criminal act, and the defendant’s ability to form the required intent. The fact that the right-wrong test is widely used does not transform it into a constitutional mandate.</p><p>Nor does Kahler identify a constitutional distinction between a defendant who cannot understand that an act is wrong and one who lacks the mens rea required by the statute. The former may present a compelling case for an insanity defense as a matter of legislative policy. But the Constitution leaves the States room to make that policy choice, provided they do not dispense with proof of the offense’s required mental state or otherwise impose punishment in violation of established constitutional limits.</p><p>Kahler’s evidence that his illness caused him to lose control and impaired his rational decision-making could be considered insofar as it negated the charged mental state. Kansas was not constitutionally required to allow the jury to acquit on the separate ground that Kahler could not appreciate the wrongfulness of his conduct. Because Kansas’s scheme preserves a meaningful opportunity to contest mens rea and does not authorize punishment without proof of the elements of the offense, it does not violate the Fourteenth Amendment. And because the Eighth Amendment does not prescribe a particular insanity defense, it does not invalidate the Kansas rule.</p><p>IV. Disposition</p><p><mark class='err' data-n='2'>The judgment of the Kansas Supreme Court is affirmed insofar as it upheld Kahler’s convictions.</mark> Kansas may abolish the traditional insanity defense without violating the Eighth or Fourteenth Amendments, so long as its law continues to require proof of the charged offense and permits defendants to present mental-disease evidence relevant to whether they possessed the required mens rea.</p><p>RULING: Respondent</p>", "error": "The Kansas Supreme Court affirmed Kahler’s conviction but vacated his death sentence.", "truth": "The Kansas Supreme Court affirmed Kahler’s conviction and death sentence.", "nmarks": 2}, {"id": "C077", "text": "<p>Supreme Court of the United States</p><p>*North Carolina Department of Revenue, Petitioner, v. Kimberley Rice Kaestner 1992 Family Trust, Respondent.*</p><p>---</p><p>I. Procedural History</p><p>In 1992, Joseph Lee Rice III established an inter vivos trust in New York, with William B. Matteson as trustee and Rice&#x27;s descendants as primary beneficiaries. In 2002, the trust was divided into three separate trusts, one for each of Rice&#x27;s children.<mark class='tru' data-n='1'> One of these, the Kimberley Rice Kaestner 1992 Family Trust (&quot;the Trust&quot;), benefitted Rice&#x27;s daughter Kimberley Rice Kaestner, who at the time of the division was a resident and domiciliary of North Carolina.</mark> None of the beneficiaries resided in North Carolina at the trust&#x27;s creation. In 2005, Matteson resigned, and a successor trustee—a Connecticut resident—was appointed.<mark class='tru' data-n='2'> From 2005 through 2008, the Trust paid North Carolina income taxes on income accumulated during those years under a statute that taxes trust income in proportion to the interests of in-state beneficiaries.</mark> No funds were distributed to Kaestner during those years.</p><p>In 2009, the Trust&#x27;s representatives sought a refund from the North Carolina Department of Revenue, which the Department denied.<mark class='err' data-n='3'> The Trust then sued in state court, seeking a refund and a declaration that the enabling statute was unconstitutional as applied.</mark> The trial court granted the Department&#x27;s motion to dismiss the claim for injunctive relief but allowed the constitutional claims to proceed.<mark class='tru' data-n='4'> On cross-motions for summary judgment, the trial court found the statute unconstitutional as applied and granted judgment to the Trust.</mark><mark class='tru' data-n='5'> The Department appealed, and the state appellate court reversed, holding that the domicile of a non-contingent beneficiary alone supplied sufficient contacts to sustain the tax notwithstanding that the trustee, the trust administration, and the trust assets were all located outside North Carolina.</mark><mark class='tru' data-n='6'> The North Carolina Supreme Court affirmed that disposition.</mark><mark class='err' data-n='7'> This Court granted certiorari to resolve whether the Due Process Clause of the Fourteenth Amendment prohibits a State from taxing a trust based solely on the in-state residency of a trust beneficiary.</mark></p><p>II. Governing Law</p><p>The Due Process Clause requires &quot;minimum contacts&quot; between a State and the property it seeks to tax. *Quill Corp. v. North Dakota*, 504 U. S. 298, 306 (1992); *International Shoe Co. v. Washington*, 326 U. S. 310 (1945). The touchstone is notice: a State may tax only when the taxed party has a sufficient relationship to the State such that it is reasonable, in the constitutional sense, to subject it to the burden.</p><p>This Court&#x27;s precedents on state taxation of trust income have turned not on formal labels but on the taxpayer&#x27;s actual relationship to the property and to the State. Where the beneficiary holds a vested, present right to income, or actually receives it, the taxing State may rely on that relationship. *Brooke v. City of Norfolk*, 277 U. S. 27 (1928) (upholding tax where beneficiary had a present vested right to receive income); *Greenough v. Tax Assessors*, 331 U. S. 486 (1947) (upholding tax on income actually distributed to an in-state beneficiary); *Curry v. McCanless*, 307 U. S. 357 (1939) (upholding taxes on the beneficiary&#x27;s vested equitable interest). By contrast, in *Safe Deposit &amp; Trust Co. v. Virginia*, 280 U. S.<mark class='err' data-n='8'> 83 (1929), this Court held that Virginia could not tax undistributed trust income accruing to a beneficiary who resided in the State where she had no present right to receive any portion of it and no power to control its disposition.</mark> The constitutional inquiry is therefore concrete and practical: whether the beneficiary, during the tax years at issue, had a present right to receive, control, or enjoy the income taxed.</p><p>III. Application</p><p>A. The
